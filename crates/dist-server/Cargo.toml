[package]
name = "fandhe-frontend-dist-server"
version = "0.1.2"
edition = "2021"
description = "fandhe-frontend-dist-server: TASK-9.1b。fandhe-frontend-core / fandhe-frontend-app / fandhe-frontend-server を単一実行ファイルへ統合し、コンパイル時埋め込みの静的アセットと fandhe-frontend-app の SSR ページを配信する配布用サーバー。"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-frontend"
readme = "../../README.md"
keywords = ["frontend", "server", "ssr", "distribution"]
categories = ["web-programming"]

# REQ-3（依存グラフ上限 60 件/深さ 6, docs/spec/04-requirements.md）実測根拠:
#
# TASK-9.1 の課題名は「rust-embed ベース単一バイナリサーバー」だが、
# rust-embed は rust-embed -> rust-embed-impl -> rust-embed-utils -> sha2 -> digest
# -> block-buffer -> hybrid-array -> typenum の非オプショナルな連鎖により
# feature 削減不能な深さ 8 を要求し REQ-3 に構造的に違反する（実測: 66 件/深さ8）。
# よって埋め込みは外部依存ゼロの自前実装（build.rs + include_bytes!、assets.rs 参照）
# とする（docs/spec 側へのフィードバック事項として PR に記録）。
#
# HTTP サーバー層も同様の理由で axum を採用しない。axum の "tokio" feature（axum::serve
# 相当を有効化する唯一の経路）は無条件に "tokio/macros" を要求し
# tokio-macros -> syn -> quote -> proc-macro2 -> unicode-ident の連鎖で深さ 7〜9 に
# 達する（実測）。さらに axum-core が無条件に依存する async-trait も同じ
# syn/proc-macro2 連鎖を経由し、axum を経由する限り proc-macro 連鎖を避けられない。
# そのため axum 自体を採用せず、hyper（1.x, "http1"+"server"）+ hyper-util
# （0.1, "http1"+"server"+"tokio"。この "tokio" feature は tokio/rt・tokio/time のみを
# 要求し macros を要求しない）+ http-body-util + tokio
# （"rt-multi-thread"+"net"）の直接構成とする。ルーティングは fandhe-frontend-server::router
# （外部依存ゼロ）が担うため、axum::Router 相当の機能は不要。
#
# 実測（2026-07-17、cargo metadata 経由、xtask check-deps と同じ定義）:
#   packages: 21（上限 60）/ max depth: 5（上限 6）→ result: PASS
[dependencies]
fandhe-frontend-core = { path = "../core", version = "0.1.2" }
fandhe-frontend-app = { path = "../app", version = "0.1.0" }
fandhe-frontend-server = { path = "../server", version = "0.1.2" }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["http1", "server", "tokio"] }
http-body-util = { version = "0.1", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net"] }

[dev-dependencies]

# TASK-10.1a（イシュー #106）: 開発 / 本番モード切り替え用フラグ。
#
# `force-embed` はコード・依存を一切持たない空フィーチャーであり、`assets.rs` の
# `cfg(all(debug_assertions, not(feature = "force-embed")))` 判定にのみ関与する
# （有効化すると debug ビルドでも埋め込みモードへ固定し、release と同じ配信経路を
# CI で検証できるようにする。PoC-4 の `rust-embed` `debug-embed` フィーチャーに
# 相当する自前実装）。空フィーチャーのため REQ-3（依存グラフ上限）の実測値
# （21 件/深さ 5、上記コメント参照）に影響しない。
[features]
force-embed = []

[[bin]]
name = "dist-server"
path = "src/main.rs"

# TASK-10.4a（イシュー #119、REQ-10）: rebuild_latency ベンチマーク。
#
# criterion 等の外部 dev-dependency は追加しない（`[dev-dependencies]` は
# 引き続き空。REQ-3 の趣旨・`deps-check` ジョブの計測対象を増やさないため）。
# `harness = false` + `test = false` により、独自の `main()` を持つ std-only
# 実装とし、`cargo test` からは実行されない（判定ロジックのユニットテストは
# `src/bench_support.rs` 側に置く）。
[[bench]]
name = "rebuild_latency"
path = "benches/rebuild_latency.rs"
harness = false
test = false

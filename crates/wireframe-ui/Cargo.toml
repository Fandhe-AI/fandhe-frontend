# 確保したため main セッションが本 PR 用に一意採番した 0.35.0 を採用する。
# 0.35.0 → 0.36.0: 公開 API 新設（avatar 部品、イシュー #2651、Phase 7
# 「Data display」の最初の部品。content: Option<Node> が None のとき
# icon::user へフォールバックする §11.4 からの意図的な逸脱）。main 取り込み
# 時点で 0.35.0 まで進んでいたため main セッションが本 PR 用に一意採番した
# 0.36.0 を採用する。
# 0.36.0 → 0.37.0: 公開 API 新設（alert 部品、イシュー #2646、Phase 6
# 「Overlay・Feedback」の 3 番目の部品。重要度は部品ローカルの Severity
# による修飾 class で表し、アイコンは link/file_drop と同じ Option<Node>
# スロット）。main 取り込み時点で 0.36.0 まで進んでいたため main セッション
# が本 PR 用に一意採番した 0.37.0 を採用する。
# 0.37.0 → 0.38.0: 公開 API 新設（modal 部品、イシュー #2645、Phase 6
# 「Overlay・Feedback」の 6 番目の部品。blocks.pm に対応部品がない独自
# 追加部品）。main 側で 0.31.0 → 0.32.0 を cursor が、0.32.0 → 0.33.0 を

# calendar が先に確保したため main セッションが本 PR 用に一意採番した
# 0.25.0 を採用する。
# 0.25.0 → 0.26.0: 公開 API 新設（tabs 部品、イシュー #2638、Phase 5
# 「Navigation」。選択状態は項目ごとの Active ではなく
# active: Option<usize> 1 引数で表す）。main セッションが並行 PR
# （#2698 calendar 0.24.0、#2694 text 0.25.0）との衝突回避のため本 PR
# 用に一意採番した 0.26.0 を採用する（main マージ後の値より大きい値）。
# 0.26.0 → 0.27.0: 公開 API 新設（stepper 部品、イシュー #2634。blocks.pm
# 対応部品を持たない独自追加部品）。main セッションが並行 PR との衝突回避
# のため本 PR 用に一意採番した 0.27.0 を採用する（main マージ後の値より
# 大きい値）。
# 0.27.0 → 0.28.0: 公開 API 新設（nav_item 部品、イシュー #2636。
# Phase 5「Navigation」の部品。main セッションが並行 PR との衝突回避の
# ため本 PR 用に一意採番した 0.28.0 を採用する（main マージ後の値より
# 大きい値）。
# 0.28.0 → 0.29.0: 公開 API 新設（accordion 部品、イシュー #2641。
# blocks.pm に対応部品がない独自追加部品。展開状態は既存の
# props::Active を項目単位で再利用し、新規の Expanded 型は新設しない）。
# 0.29.0 → 0.30.0: 公開 API 新設（pagination 部品、イシュー #2640。
# Phase 5「Navigation」の 4 番目の部品。選択状態は既存の props::Active を
# 再利用し、先頭/前/次/末尾コントロールは prev_next/first_last の 2 bool
# へ畳む）。main 側で 0.28.0 → 0.29.0 を accordion が先に確保したため
# 衝突回避で +1。
# 0.30.0 → 0.31.0: 公開 API 新設（tooltip 部品、イシュー #2644、Phase 6
# 「Overlay・Feedback」の最初の部品）。main 側で 0.29.0 → 0.30.0 を
# pagination が先に確保したため衝突回避で +1。
# 0.31.0 → 0.32.0: 公開 API 新設（cursor 部品、イシュー #2642。
# Phase 5「Navigation」の部品。代わりに使える既存アイコンがないため
# icon::cursor_arrow/icon::cursor_hand を新規追加する）。main 側で
# 0.31.0 を tooltip が先に確保したため衝突回避で +1。
# 0.32.0 → 0.33.0: 公開 API 新設（toast 部品、イシュー #2647、Phase 6
# 「Overlay・Feedback」の 2 番目の部品。閉じる
# グリフは icon::x 固定で instance swap にせず、dismissible: bool の
# 1 引数だけで有無を切り替える）。
# 0.33.0 → 0.34.0: 公開 API 新設（progress 部品、イシュー #2648、
# Phase 6「Overlay・Feedback」の 4 番目の部品）。main 側で 0.33.0 を
# toast が先に確保したため衝突回避で +1。
# 0.34.0 → 0.35.0: 公開 API 新設（spinner 部品、イシュー #2649、Phase 6
# 「Overlay・Feedback」の 5 番目の部品。円弧だけを描く静的表示で

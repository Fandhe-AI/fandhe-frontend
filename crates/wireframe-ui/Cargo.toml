# ため衝突回避で +1。
# 0.23.0 → 0.24.0: 公開 API 新設（calendar 部品、イシュー #2632。選択日は
# props::Active を再利用し MAX_WEEKS で 6 週へ飽和させる）。main 側で
# 0.23.0 を file_drop が先に確保したため衝突回避で +1。
# 0.24.0 → 0.25.0: 公開 API 新設（text 部品、イシュー #2614。これで Phase 2

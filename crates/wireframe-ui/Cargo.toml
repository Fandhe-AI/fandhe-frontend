[package]
name = "fandhe-frontend-wireframe-ui"
# 0.1.0 → 0.2.0: 公開 API 新設（Size・共通型・トークン・wireframe_css、
# イシュー #2605）。
# 0.2.0 → 0.3.0: 公開 API 新設（SVG ラインアートアイコン基盤 icon モジュール、
# イシュー #2606）。coding-rust.md #638 条項に従い 0.x のマイナーバンプ
# とする（crates.io 未公開のため check-version-bump は NotPublished →
# PASS だが、運用規約に従いバンプする）。
# 0.3.0 → 0.4.0: 公開 API 新設（annotation 部品、イシュー #2617）。
# 0.4.0 → 0.5.0: 公開 API 新設（grid 部品、イシュー #2611）。
# 0.5.0 → 0.6.0: 公開 API 新設（divider 部品、イシュー #2612。
# props::Orientation の最初の実消費者）。
# 0.6.0 → 0.7.0: 公開 API 新設（stack 部品、イシュー #2610）。main 側で
# 0.5.0 を grid、0.6.0 を divider が先に確保したため衝突回避で +1。
# 0.7.0 → 0.8.0: 公開 API 新設（link 部品、イシュー #2618。
# Option<Node> アイコンスロット規約 §11.4 の実例、a[href] 非出力）。main 側で
# 0.7.0 を stack が先に確保したため衝突回避で +1。
# 0.8.0 → 0.9.0: 公開 API 新設（rich_text 部品、イシュー #2616）。main 側で
# 0.8.0 を link が先に確保したため衝突回避で +1。
# 0.9.0 → 0.10.0: 公開 API 新設（button 部品、イシュー #2621。
# props::Disabled の最初の実消費者）。main 側で 0.9.0 を rich_text が
# 先に確保したため衝突回避で +1。
# 0.10.0 → 0.11.0: 公開 API 新設（select 部品、イシュー #2624）。
# 0.11.0 → 0.12.0: 公開 API 新設（radio 部品、イシュー #2626。選択状態は
# 既存の props::Active を再利用し、新規の Selected/Checked 型は新設
# しない）。
# 0.12.0 → 0.13.0: 公開 API 新設（switch 部品、イシュー #2627）。main 側で
# 0.12.0 を radio が先に確保したため衝突回避で +1。
# 0.13.0 → 0.14.0: 公開 API 新設（checkbox 部品、イシュー #2625。
# `Active` を「チェック済み」状態として消費する Forms 部品）。main 側で
# 0.13.0 を switch が先に確保したため衝突回避で +1。
# 0.14.0 → 0.20.0: 公開 API 新設（input 部品、イシュー #2622）。main 側で
# 0.14.0〜0.19.0 が他 PR に確保されている可能性があるため main セッションが
# 一意に割り当てた版数を使用。
version = "0.20.0"
edition = "2021"
description = "fandhe-frontend-wireframe-ui: blocks.pm 参照のローファイ・モノクロワイヤーフレーム UI コンポーネント層（イシュー #2599/#2600/#2603）。SSR 専用・非インタラクティブ。外部依存は fandhe-frontend-core（path）のみ。"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-frontend"
readme = "../../README.md"
keywords = ["frontend", "wireframe", "ui", "components", "prototyping"]
categories = ["web-programming", "gui"]

# REQ-3 / coding-rust.md: fandhe-frontend-core への path 依存のみ。
# headless-ui/pre-styled-ui への依存は持たない（独立した第 3 の UI 層、
# docs/design/wireframe-ui-architecture.md §1）。
# 新規クレートを追加する場合は事前にユーザー承認を得ること。
[dependencies]
fandhe-frontend-core = { path = "../core", version = "0.4.3" }

[dev-dependencies]

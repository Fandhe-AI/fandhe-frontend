[package]
name = "fandhe-frontend-server"
# イシュー #1388: fandhe-frontend-core 0.4.3 依存追随（check-dep-versions --fix）に伴う patch バンプ。
version = "0.2.6"
edition = "2021"
description = "fandhe-frontend-server: パスマッチングルーティング（router.rs）+ SSR/SSG エントリ（ssr.rs/ssg.rs）。外部依存ゼロ。HTTP 配信は fandhe-frontend-dist-server へ委譲する。"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-frontend"
readme = "../../README.md"
keywords = ["frontend", "ssr", "ssg", "router"]
categories = ["web-programming"]
# `src/bin/ssg.rs`（SSG エントリ）と同居するため、`cargo run -p fandhe-frontend-server` の
# 既定バイナリを SSR エントリ（`src/main.rs`）に固定する。
default-run = "fandhe-frontend-server"

# REQ-3 / coding-rust.md: 依存クレート追加は事前承認が必要。
# TASK-6.1c で ssr.rs/ssg.rs が fandhe-frontend-app のページ関数を呼ぶため、fandhe-frontend-core/fandhe-frontend-app を
# 通常の path 依存へ昇格した（外部クレートの追加は行っていない）。本クレートは
# 引き続き外部クレートを一切追加しない自前実装のみで構成する。
[dependencies]
fandhe-frontend-core = { path = "../core", version = "0.4.3" }
fandhe-frontend-app = { path = "../app", version = "0.2.6" }

[dev-dependencies]

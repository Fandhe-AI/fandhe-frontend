[package]
name = "fandhe-frontend-headless-ui"
# イシュー #1388: fandhe-frontend-core 0.4.3 依存追随（check-dep-versions --fix）に伴う patch バンプ。
# イシュー #1741: `CheckboxGroup` へ `disabled` フィールド・
# `set_disabled`/`with_disabled`/`is_disabled`/`item_effective_disabled`/
# `item_hidden_input` の新規公開 API を追加（root disabled の
# item 系利便メソッドへの一貫伝播）。既存メソッドのシグネチャは不変（内部
# 計算のみ変更）のため非破壊的追加、patch バンプとして 0.28.6 から 0.28.7 とする。
# （PR #1760 codex-review P1 是正: 当初は `root` inherent メソッドも
# 追加していたが、`fandhe-frontend-pre-styled-ui` が同名型 `CheckboxGroup`
# を再エクスポートしているため、inherent メソッドが再エクスポート先の
# 拡張トレイトを不可視に隠し、styled `root` を取りこぼす経路になり得る
# 破壊的変更だった。この追加は撤回済み（`crates/headless-ui/src/checkbox_group.rs`
# 参照）で、残る追加分のみが非破壊的な patch バンプ対象である。）
# イシュー #1481（画像 image-cropper 2/2）: `image_cropper::image` の
# 既定 `draggable="false"` 付与に伴い patch バンプで独立に 0.28.7 へ
# 到達していた main とのマージにより、双方の実体変更を統合した結果として
# 0.28.8 へさらに patch バンプする（同一版数への偶発的衝突をそのまま
# 採用しない）。
# イシュー #1603（checkbox-group の参照突合）: `CheckboxGroupProps`
# （disabled/readonly/invalid）の導入に伴い `checkbox_group::{root, item,
# item_control, item_indicator, item_text}` が `disabled: bool` から
# `&CheckboxGroupProps` へシグネチャ変更（破壊的変更）したため 0.x の
# マイナーバンプとする（`.claude/rules/coding-rust.md` 破壊的変更規定）。
# イシュー #1614（password-input の参照突合）: `PasswordInputProps` への
# `readonly` フィールド追加・`indicator(visible, props, attrs, children)`
# シグネチャ変更（破壊的変更）に伴い 0.x のマイナーバンプとする。
# イシュー #1606（editable の参照突合）: `EditableInputFlags` へ `invalid`
# フィールドを追加し、`editable::{root, label, area, preview}` のシグネチャを
# `disabled: bool, readonly: bool` から `flags: EditableInputFlags` へ変更
# （破壊的変更）。`EditableActivationMode::{Click, None}`・
# `EditableSubmitMode::None` の variant 追加も含む。0.x のマイナーバンプ
# とする（`.claude/rules/coding-rust.md` 破壊的変更規定）。
# イシュー #1609（file-upload の参照突合）: `FileUploadProps`
# （disabled/readonly/invalid/required）・`ItemType`（accepted/rejected 固定
# 語彙）の新設に伴い `file_upload::{root, label, dropzone, trigger,
# item_group, item, item_name, item_size_text_node, item_delete_trigger,
# clear_trigger, hidden_input}` のシグネチャを変更（破壊的変更）。0.x の
# マイナーバンプとする（`.claude/rules/coding-rust.md` 破壊的変更規定）。
# イシュー #1615（pin-input の参照突合）: `PinInputProps`
# （disabled/readonly/invalid/required）の導入に伴い `pin_input::{root,
# label, input}` のシグネチャ変更（`root`/`label` は `PinInputProps` 引数を
# 新設、`input` は `disabled: bool` を `&PinInputProps` へ置換）に加え、
# `PinInputAction::{Delete, Prev, Next}` の新設・`Backspace` の挙動是正を
# 行ったため 0.x のマイナーバンプとする（`.claude/rules/coding-rust.md`
# 破壊的変更規定）。
# イシュー #1616（radio-group の参照突合）: `RadioGroupProps`
# （disabled/readonly/invalid/required）の導入に伴い
# `radio_group::{root, label, item, item_control, item_text,
# item_hidden_input}` と `RadioGroup` 利便メソッドのシグネチャ変更
# （破壊的変更）を行ったため 0.x のマイナーバンプとする
# （`.claude/rules/coding-rust.md` 破壊的変更規定）。
# base main 取り込み時のマージ注記: #1609 と #1615 が独立に 0.33.0 から
# 0.34.0 へ patch/minor バンプしていたため衝突を避け 0.35.0 とした main
# に対し、本ブランチ（#1616）も merge-base（0.34.0）から独立に 0.35.0 へ
# マイナーバンプしていたため、双方の実体変更（file-upload 追随・
# radio-group 破壊的変更）を統合した結果として 0.36.0 へさらにマイナー
# バンプする（同一版数への偶発的衝突をそのまま採用しない、上記
# イシュー #1481 の先例と同型の対応）。
# イシュー #1605（combobox の参照突合）: `ComboboxProps` へ `readonly`
# フィールドを追加し、`combobox::{root, control, input, trigger,
# clear_trigger}` のシグネチャを変更（破壊的変更）。マイナーバンプで
# 0.32.0 へ到達していたが、イシュー #1606（editable）が独立に同じ
# 0.32.0 へ到達していたブランチとのマージにより、双方の実体変更を
# 統合した結果として 0.33.0 へさらにマイナーバンプしていた。この後、
# main 側でイシュー #1614（password-input の参照突合、PR #1880）が
# 独立に別内容で同じ 0.33.0 へ到達していたため、本 PR（#1605 combobox）
# ブランチへの base 取り込みマージで再び同一版数への偶発的衝突が生じた。
# 双方の実体変更（combobox の readonly 対応・password-input の readonly/
# indicator 対応）を統合した結果として 0.34.0 へさらにマイナーバンプした
# （上記 #1481/#1605 の precedent と同じ扱い）。
# イシュー #1609（file-upload）〜 #1611（listbox）: main 側で独立に
# 0.34.0 から 0.37.0 まで複数のマイナーバンプが積み上がっていた
# （`FileUploadProps`/`PinInputProps`/`ImageCropperProps`/`ListboxProps`
# 各新設に伴う破壊的シグネチャ変更）。本 PR（#1605 combobox）ブランチへの
# 2 回目の base 取り込みマージにより、双方の実体変更（combobox の
# readonly 対応・file-upload/pin-input/image-cropper/listbox の各参照
# 突合）を統合した結果として main 現在値 0.37.0 からさらにマイナーバンプし
# 0.38.0 とする（同一版数への偶発的衝突をそのまま採用しない、
# `docs/ci/style-refresh-version-bump-operation.md` §5）。
# base main 取り込み時の再マージ注記: 上記 #1616（radio-group）は
# merge-base 0.34.0 から独立に 0.36.0 へマイナーバンプしていたが、
# main は #1605（combobox）〜 #1614（password-input）の統合を経て
# 0.38.0 まで複数マイナーバンプが積み上がっていた。本マージで双方の
# 実体変更（radio-group の破壊的シグネチャ変更・main 側の一連の参照
# 突合）を統合した結果として main 現在値 0.38.0 からさらにマイナー
# バンプし 0.39.0 とする（同一版数への偶発的衝突をそのまま採用しない、
# `docs/ci/style-refresh-version-bump-operation.md` §5）。
version = "0.39.0"
edition = "2021"
description = "fandhe-frontend-headless-ui: headless UI コンポーネント層（anatomy・data-* 属性・WAI-ARIA。イシュー #520/#522/#524）。外部依存は fandhe-frontend-core / fandhe-frontend-interactive（いずれも path）のみ。"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-frontend"
readme = "../../README.md"
keywords = ["frontend", "headless", "ui", "components", "aria"]
categories = ["web-programming", "gui"]

# 外部依存は fandhe-frontend-core / fandhe-frontend-interactive（いずれも path）
# のみを厳守する（イシュー #520 設計前提・.claude/rules/coding-rust.md）。
# fandhe-frontend-interactive はイシュー #524（開閉状態機械の共通化）で
# Component/Hydrate 抽象を再利用するために追加した（サードパーティ外部
# クレートではなく本 workspace 内部の path 依存。structure.toml の
# depends_on = ["core", "interactive"] と完全一致させること、fw gate が検証する）。
[dependencies]
fandhe-frontend-core = { path = "../core", version = "0.4.3" }
fandhe-frontend-interactive = { path = "../interactive", version = "0.2.7" }

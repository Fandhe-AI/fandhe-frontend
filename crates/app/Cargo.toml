[package]
name = "fandhe-frontend-app"
# イシュー #3818: Document builder 追加に伴う patch バンプ。
version = "0.2.7"
edition = "2021"
description = "fandhe-frontend-app: SSR/SSG/CSR 三モード共通のモード非依存コンポーネントライブラリ（fandhe-frontend-core のみに依存）。"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-frontend"
readme = "../../README.md"
keywords = ["frontend", "components", "ssr", "ssg", "csr"]
categories = ["web-programming"]

# REQ-3 / coding-rust.md: 依存クレート追加は事前承認が必要。
# fandhe-frontend-app は fandhe-frontend-core（path 依存）のみを持ち、外部クレートは追加しない。
[dependencies]
fandhe-frontend-core = { path = "../core", version = "0.4.3" }

[dev-dependencies]

# base 取り込み時点で main 側は #1448（button variant 網羅、公開 enum
# `ButtonVariant` への破壊的変更）でマイナーバンプ 0.55.0 へ到達済みだが、
# `calendar::stylesheet()` の CSS 出力を変更する本 PR 自体の実体変更に対して
# は §3.1（PR 毎 patch バンプ）に従い独立にパッチバンプが必要（並行 PR の

# の recipe を実体変更するため、0.55.4 → 0.55.5 へパッチバンプする
# （Rust API は不変、CSS 出力のみの意匠調整）。
# PR #1734 Cursor Bugbot 指摘是正（イシュー #1454）: checkbox.rs の
# hover_bg_solid_with_fallback() フォールバック連鎖を修正する実体変更の

# シグネチャ・既存 CSS 変数名・クラス名・セレクタの削除/改名なしのため
# patch とする。旧 `shared_tab_*`（`pub(crate)`、外部非公開）ヘルパの削除は
# クレート外部から到達不能なため公開 API 面には影響しない。base（main）が
# #1540/#1541 の衝突回避で 0.63.0 へ先着済みのため、本イシューはその上へ
# 0.63.0 → 0.63.1 へ patch バンプする（同一 patch バージョンの衝突回避）。
# イシュー #1544（toast のスタイル調整 1/2 — 枠・タイプ別配色）は
# `toast::root` slot の CSS 値のみの変更（公開関数シグネチャ・型・
# クラス名・data-* 属性は不変）のため独立に patch バンプ（0.63.0 →
# 0.63.1）へ到達していた。feat/1542-tabs-style と main のマージにより、
# 双方が同一バージョン 0.63.1 へ独立到達する偶発的衝突が生じたため、
# これをそのまま採用せず 0.63.2 へさらに patch バンプする（同型の衝突
# 回避は本ファイル内の既存記録〔#1539/#1541/#1679/#1681 等〕と同じ扱い）。
# イシュー #1545（toast のスタイル調整 2/2 — アクション・クローズ
# トリガー・スタック時の配置と遷移）は `close-trigger` の公開契約を
# フロー配置（`align-self: flex-end` のみ）から `root` 右上への
# `position: absolute` ゴーストアイコンボタン化（固定正方 +
# `overflow: hidden`）へ変更する。既存利用者がテキスト children を
# 渡していた場合の描画が変わる観測可能な破壊的変更のため
# `crate::dialog`（0.59.0）/`crate::drawer` と同型にマイナーバンプする
# （0.63.2 → 0.64.0、0.x の破壊的変更はマイナーバンプの規約）。base
# （main）側で feat/1542-tabs-style とのマージ衝突回避により 0.63.2 へ
# 先着済みのため、本イシューはその上へマイナーバンプする（起点を
# 0.63.1 から 0.63.2 へ読み替え）。
# イシュー #1546（toggle-tip のスタイルを参考サイト基準へ調整）は
# `recipe()` 宣言変更（`trigger` の ghost ボタン化・`data-state="open"`/
# `data-disabled`/hover/transition の新規状態規則・`positioner`/`content`
# のトークン化）のみで、公開 API シグネチャ・既存 CSS 変数名・クラス名・
# セレクタの削除/改名はないため patch とする（`version-bump-exempt` は
# CSS 出力変更のため使用不可）。0.64.0 → 0.64.1 へ patch バンプする。
# イシュー #1548（tooltip のスタイルを参考サイト基準へ調整）も同じ判断:
# `recipe()` 宣言変更（`trigger` の枠線付きボタン化・`data-disabled`/
# hover/focus-visible/transition の共通ビジュアル言語への載せ替え・
# `positioner`/`content` のトークン化・`content` への影新設）のみで、
# 公開 API シグネチャ・既存 CSS 変数名・クラス名・セレクタの削除/改名は
# ないため patch とする（`version-bump-exempt` は CSS 出力変更のため
# 使用不可）。0.64.1 → 0.64.2 へ patch バンプする。
# イシュー #1550（tour のスタイル調整 1/2 — スポットライト・バックドロップ・
# ポジショナ）も同じ判断: `recipe()` 宣言変更（`backdrop`/`spotlight`/
# `positioner` の z-index・暗幕色のトークン化、spotlight の palette 連動
# 縁取り・角丸の新設 CSS 変数）のみで、公開 API シグネチャ・既存 CSS
# 変数名・クラス名・セレクタの削除/改名はないため patch とする
# （`version-bump-exempt` は CSS 出力変更のため使用不可）。新設した
# `--fandhe-tour-spotlight-radius`/`-ring-width` は純追加であり既存変数の
# 削除・改名を伴わない。0.64.2 → 0.64.3 へ patch バンプする。
# イシュー #1551（tour のスタイル調整 2/2 — コンテンツ、親 #1549 の完了分）:
# `close-trigger` を「任意の children を受け付ける生ボタン」から「固定正方
# （`--fandhe-space-8`）+ `overflow: hidden` のアイコン専用ゴーストボタン」
# へ変更した。既存利用者がテキスト children を渡していた場合の描画が
# 変わる観測可能な破壊的変更であり、`crate::dialog`（#1693 → 0.59.0）/
# `crate::toast`（#1545 → 0.64.0）の同型変更が minor バンプだった先例に
# 揃え、0.64.3 → 0.65.0 へ minor バンプする（`version-bump-exempt` は
# CSS 出力変更のため使用不可）。`--fandhe-tour-content-padding`/
# `-content-max-width` の新設は純追加。
# イシュー #1547: toolbar の CSS 実体変更（hover/disabled/focus/transition
# の共通ヘルパ化・角丸トークン化・on 状態の配色変更）。Rust API・セレクタ・
# CSS 変数名の削除/改名なしのため patch バンプする。
# イシュー #1553: alert のスタイルを参考サイト基準へ調整。`alert::root` の
# シグネチャを `AlertStatus` 単独引数から `&AlertProps`（`status`/`variant`/
# `size` の 3 軸）へ変更する破壊的変更のため minor バンプする
# （0.65.1 → 0.66.0）。
# イシュー #1554: avatar の公開関数 `root` シグネチャを
# `root(size, shape, attrs, children)` から `root(&AvatarProps, attrs,
# children)` へ変更する破壊的変更（`AvatarVariant`/`ColorPalette` 軸の
# 追加に伴う Props 構造体化）のため minor バンプする（0.x の破壊的変更は
# マイナーバンプの規約）。
# イシュー #1555: `BadgeVariant` へ `Surface` variant を追加する公開 enum
# への variant 追加（利用者の網羅 `match` を壊す 0.x 破壊的変更）のため
# minor バンプする（#1448 の `ButtonVariant::Surface` 追加時と同型判断。
# 0.66.0 → 0.67.0）。
# イシュー #1553: alert のスタイルを参考サイト基準へ調整。`alert::root` の
# シグネチャを `AlertStatus` 単独引数から `&AlertProps`（`status`/`variant`/
# `size` の 3 軸）へ変更する破壊的変更のため minor バンプする
# （0.65.1 → 0.66.0）。base（main）側で #1554 が独立に 0.66.0 へ
# 到達済みだったため、本イシュー（#1553）の変更を統合した結果として
# 0.67.0 へさらにマイナーバンプした。上記 #1555（本ブランチ側）も
# merge base（0.66.0）から独立に 0.67.0 へ到達していたため、main
# （#1553 の 0.67.0）とのマージにより双方の実体変更を統合した結果として
# 0.68.0 へさらにマイナーバンプする（0.x の破壊的変更はマイナーバンプの
# 規約。同一版数への偶発的衝突をそのまま採用しない）。
# イシュー #1556: callout のスタイルを参考サイト基準（Radix Themes
# Callout）へ調整し、`text(size, attrs, children)` から `size` 引数を削除
# する破壊的変更（root の `--fandhe-callout-font-size` custom property から
# 継承する一本化）を加えたため minor バンプする（0.x の破壊的変更は
# マイナーバンプの規約。merge base（0.67.0）から独立に 0.68.0 へ到達）。
# 一方 main 側では #1826（badge のスタイルを参考サイト基準へ調整、#1555
# の 0.67.0 到達分を含む）が独立に merge base（0.67.0）から 0.68.0 へ
# 到達済みだったため、本イシュー（#1556）とのマージにより双方の実体変更を
# 統合した結果として 0.69.0 へさらにマイナーバンプする（0.x の破壊的変更は
# マイナーバンプの規約。同一版数への偶発的衝突をそのまま採用しない）。
version = "0.69.0"
edition = "2021"
description = "fandhe-frontend-pre-styled-ui: pre-styled UI コンポーネント層（headless-ui 上層のスタイル済み部品、イシュー #520/#546）。外部依存は fandhe-frontend-headless-ui のみ。"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-frontend"
readme = "../../README.md"
keywords = ["frontend", "styled", "ui", "components", "theme"]
categories = ["web-programming", "gui"]

# 外部依存は fandhe-frontend-headless-ui（path）のみを厳守する（イシュー #520 設計前提・
# .claude/rules/coding-rust.md）。fandhe-frontend-core への直接依存は宣言しない
# （headless-ui 経由で間接的に利用する。fw structure の depends_on 完全一致検証が
# あるため、未使用の先行宣言はしない）。
[dependencies]
fandhe-frontend-headless-ui = { path = "../headless-ui", version = "0.28.8" }

# core はスモークテストで既定エスケープ（REQ-1）を固定するための dev-dependency。
# interactive は styled ラッパー（Dialog 等）の SSR/hydration 往復テスト
# （`dispatch`/`render_for_hydration`、イシュー #551 受け入れ条件）を固定するための
# dev-dependency。いずれも depends_on 完全一致検証（crates/cli/src/metadata.rs）は
# 通常の [dependencies] のみを対象とするため、structure.toml の depends_on には
# 現れない（docs/design/structure-manifest.md §3）。
[dev-dependencies]
fandhe-frontend-core = { path = "../core", version = "0.4.3" }
fandhe-frontend-interactive = { path = "../interactive", version = "0.2.7" }

# と calendar.rs で異なる実体変更）。本マージで双方の実体変更を統合する
# ため同一版数への衝突をそのまま採用せず 0.55.2 へさらにパッチバンプする
# （0.x の破壊的変更ではない意匠調整の重複、
# `docs/ci/style-refresh-version-bump-operation.md` §3.1/§3.4a/§5）。
# イシュー #1454: checkbox のスタイル調整 (1/2) — root/control/indicator の
# 状態表現とフォーカスリング（focus_ring_declarations / disabled_declarations /
# transition_declarations / hover の canonical ヘルパ適用、`data-invalid` の
# 視覚反映）。Rust API シグネチャ不変・意匠調整のみのため patch バンプ
# （`docs/ci/style-refresh-version-bump-operation.md` §3.1/§3.3）。
# base 取り込み（イシュー #1454）: 本ブランチは checkbox のスタイル調整
# （#1454、root/control/indicator の状態表現とフォーカスリング）により
# 独立に 0.55.3 へパッチバンプ済みで、main 側も #1452（calendar のヘッダー・
# ビュー切り替え・週表示是正）により独立に 0.55.3 へパッチバンプ済みだった
# （偶発的な同一版数衝突。対象ファイルは checkbox.rs と calendar.rs で
# 異なる実体変更）。本マージで双方の実体変更を統合するため同一版数への
# 衝突をそのまま採用せず 0.55.4 へさらにパッチバンプする（0.x の破壊的
# 変更ではない意匠調整の重複、
# `docs/ci/style-refresh-version-bump-operation.md` §3.1/§3.4a/§5）。
# イシュー #1455（checkbox のスタイル調整 2/2: size バリアント・ラベル/
# 説明の型階層）で checkbox.rs の recipe を実体変更するため、0.55.3 →
# 0.55.4 へパッチバンプする。分割 1/2（イシュー #1454、PR #1734）も
# 同じ checkbox.rs を変更中で 0.55.3 を宣言しているが、マージ順に
# 関わらず base 現在値から独立にパッチを 1 つ進める同原則に従う（先に
# マージされた側の値が base の新しい現在値になり、後からマージされる

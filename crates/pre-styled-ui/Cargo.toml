# インラインレベルのボックス化してしまい、複数の短い item が縦積みされず
# 同じ行に横並びしてしまう不具合が残っていたため `display: flex`
# （block-level の flex コンテナ）へ変更した。あわせて子孫結合子のままだと
# Plain root 配下にネストした別リスト（Marker variant 等）の item にも
# 波及し `::marker` を消してしまう問題があったため、セレクタを子コンビ
# ネータ（`>`）へ限定した。Rust API シグネチャ・data-* 属性は不変で CSS
# 出力のみの是正のため 0.53.4 へパッチバンプする
# （`docs/ci/style-refresh-version-bump-operation.md` §3.4a）。

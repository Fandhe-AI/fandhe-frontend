[package]
name = "fandhe-frontend-pre-styled-ui"
# イシュー #1422: DEFAULT_COLORS へ 26 色トークンを追加し Theme::default() の
# 公開 CSS 契約を拡張した。利用者が同名（`accent-subtle` / `focus-ring` 等）で
# 独自に `push_color()` していた場合、今後 `ThemeError::DuplicateTokenName` を
# 返すようになる観測可能な破壊的変更のため、0.x の破壊的変更はマイナーバンプと
# する規約（.claude/rules/coding-rust.md「公開済みクレートの実体変更時は
# semver バンプ必須」）に従い minor バンプする（PR #1704 codex-review P1 指摘）。
# イシュー #1425: hover/disabled/transition の共通ビジュアル言語導入
# （`recipe::hover_surface_declarations` 等の公開 API 追加）に伴い、
# 独立に 0.42.0 へ到達していた main（#1704）とマージ後の実体変更を反映し
# 0.43.0 へマイナーバンプする（0.x の破壊的変更はマイナーバンプの規約）。
version = "0.43.0"
edition = "2021"
description = "fandhe-frontend-pre-styled-ui: pre-styled UI コンポーネント層（headless-ui 上層のスタイル済み部品、イシュー #520/#546）。外部依存は fandhe-frontend-headless-ui のみ。"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-frontend"
readme = "../../README.md"
keywords = ["frontend", "styled", "ui", "components", "theme"]
categories = ["web-programming", "gui"]

# 外部依存は fandhe-frontend-headless-ui（path）のみを厳守する（イシュー #520 設計前提・
# .claude/rules/coding-rust.md）。fandhe-frontend-core への直接依存は宣言しない
# （headless-ui 経由で間接的に利用する。fw structure の depends_on 完全一致検証が
# あるため、未使用の先行宣言はしない）。
[dependencies]
fandhe-frontend-headless-ui = { path = "../headless-ui", version = "0.28.6" }

# core はスモークテストで既定エスケープ（REQ-1）を固定するための dev-dependency。
# interactive は styled ラッパー（Dialog 等）の SSR/hydration 往復テスト
# （`dispatch`/`render_for_hydration`、イシュー #551 受け入れ条件）を固定するための
# dev-dependency。いずれも depends_on 完全一致検証（crates/cli/src/metadata.rs）は
# 通常の [dependencies] のみを対象とするため、structure.toml の depends_on には
# 現れない（docs/design/structure-manifest.md §3）。
[dev-dependencies]
fandhe-frontend-core = { path = "../core", version = "0.4.3" }
fandhe-frontend-interactive = { path = "../interactive", version = "0.2.7" }

[package]
name = "fandhe-frontend-animation"
# イシュー #2403/#2517: rAF Driver（raf_driver::RafDriver）・DOM Target
# （dom_target::DomTarget）を追加。新規公開 API 追加のため minor バンプ
# （.claude/rules/coding-rust.md #638 条項）。
#
# イシュー #2398: `animate` モジュール（WAAPI 薄いラッパ）を新設し、実質的な
# 公開 API 拡張を行った。minor バンプする。
#
# マージコミット注記: 本 PR（#2403/#2517）と main（#2398）が独立に 0.1.0 から
# 0.2.0 へ minor バンプしており同値衝突。#638 条項に従い origin/main の到達値
# から +1 して 0.3.0 とする。
#
# イシュー #2521: `scroll_driver` モジュール（新規公開 API:
# `compute_progress`/`SCROLL_PROGRESS_PROPERTY`/`Env`/
# `update_element_progress`/`ScrollDriver`）を新設。新規公開 API 追加の
# ため minor バンプ（`.claude/rules/coding-rust.md` #638 条項）。
#
# イシュー #2518: `flip`（layout FLIP アニメーション、`invert`/
# `to_transform_css`/`measure`/`play` 等の新規公開 API）を追加。新規公開
# API 追加のため minor バンプする。
#
# イシュー #2518 フォローアップ（レビュー指摘対応）: `flip::play` のシグネ
# チャに `original: OriginalStyle`（新規公開型 `flip::OriginalStyle`）を
# 追加し、利用者が指定していた inline `transform`/`transform-origin` を
# FLIP 補正へ合成・終了時に復元するようにした。既存 API の破壊的変更
# （引数追加）のため minor バンプする（#638 条項）。
#
# マージコミット注記（origin/main #2521 との統合）: origin/main が 0.3.0 →
# 0.4.0、本ブランチ（#2518）が 0.3.0 → 0.5.0 へ独立に minor バンプしており
# 値は異なる（衝突ではない）。より高い到達値である 0.5.0 を採用する。
#
# codex-review P1 是正（イシュー #2518 さらなるフォローアップ）: `flip::play`
# の戻り値型を `raf_driver::AnimationLoop` から新規公開型
# `flip::FlipAnimation`（`stop`/`is_done`/`current_delta`、収束前の停止・
# drop でも元のスタイルへ復元する契約）へ変更した破壊的変更・新規公開
# 関数 `flip::apply_delta_to_rect` の追加のため minor バンプする（#638
# 条項）。あわせて本 PR 到達後に main へ他 PR が複数マージされ、
# `fandhe-frontend-animation` は origin/main 上で 0.6.0 へ進んだ。本 PR の
# 再バンプ（0.5.0）は main の現行版数より古くなったため、`.claude/rules/
# coding-rust.md` #638 条項の「同一版数も衝突として +1」運用に準じ、main
# の現行値（0.6.0）からさらに +1 して 0.7.0 とする。
#
# イシュー #2535（origin/main、本マージで判明した並行衝突）: `drag`
# （`DragController`/`DragAxis`/`DragConstraint`/`apply_axis`/
# `clamp_to_constraint`/`estimate_velocity`/`DRAG_X_PROPERTY`/
# `DRAG_Y_PROPERTY`）・`reduced_motion`（`prefers_reduced_motion`）・
# `canvas_target`（`CanvasTarget`）・`confetti`（`fire`/`should_fire`）
# モジュールを新設。origin/main 側は #2533/#2534/#2535 を合流させて
# 0.7.0 へ独立に minor バンプしており、本 PR（flip、上記 0.7.0）と
# 同一版数へ衝突した。`.claude/rules/coding-rust.md` #638 条項の
# 「同一版数も衝突として +1」運用に従い、さらに +1 して 0.8.0 とする。
#
# イシュー #2519（origin/main、本マージで判明した並行衝突）: `svg_path`
# モジュール（SVG path drawing アニメーション、`total_length`/
# `apply_initial_style`/`draw`/`draw_path` 等）を新設。origin/main 側は
# #2534/#2519 を合流させて 0.8.0 へ独立に minor バンプしており、本 PR
# （codex-review 第 6 ラウンド是正、上記 0.8.0）と同一版数へ衝突した。
# #638 条項の「同一版数も衝突として +1」運用に従い、さらに +1 して
# 0.9.0 とする。
#
# 先行公開待ちの並行 PR 対応（コーディネーター指示、イシュー #2518）:
# PR #2572 が wasm-full 0.32.2 / `fandhe-frontend-animation` 0.10.0 で
# マージ待ちのため、本 PR はマージ順に関わらずこれより大きい値になる
# よう、0.9.0 からさらに 2 段（0.10.0 は #2572 と同値衝突になるため
# スキップ）先の 0.11.0 とする。
#
# マージコミット注記（PR #2572、本マージで判明した並行差分）:
# origin/main 側はイシュー #2534（`ProgressRange`/
# `compute_progress_for_range`/`update_element_progress_for_range`
# 新設）・#2533（`canvas_target`/`confetti` モジュール新設、main との
# 同一版数衝突で +1 して 0.6.0）・#2550（`magnetic` モジュール新設、
# 本ブランチの並行到達値との衝突で +1 して 0.8.0）・PR #2572 の Bugbot・
# codex-review 指摘是正（`magnetic::current_offset` 追加 → 削除・
# `magnetic::rendered_offset` 新設）を経て 0.10.0 へ到達していた。本
# ブランチの到達値 0.11.0 は origin/main の到達値 0.10.0 をすでに
# 上回っており同一版数の衝突には該当しないため、本ブランチの到達値
# 0.11.0 をそのまま維持する。
#
# イシュー #2532: `text_animation`（typewriter/scramble のフレーム計算・
# DOM 書き込み）を新設した。`magnetic`/`svg_path` と同型の新規公開 API
# 純追加のため minor バンプする。
#
# イシュー #2541: `carousel`（`snap_target`/`CarouselTrack`、ドラッグ +
# spring スナップの演算・rAF 実行）を新設した。既存モジュールと同型の
# 新規公開 API 純追加のため minor バンプする。
version = "0.13.0"
edition = "2021"
description = "fandhe-frontend-animation: fandhe-animation の演算結果を wasm-bindgen / web-sys / js-sys で DOM / Web Animations API へ適用する Web アダプタ層。"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-frontend"
readme = "../../README.md"
keywords = ["animation", "wasm", "dom", "frontend"]
categories = ["graphics", "web-programming", "wasm"]

# 依存方向: fandhe-animation ← fandhe-frontend-animation ← wasm-full(optional)。
# `fandhe-frontend-wasm-full`/`-wasm-client`/`-wasm-thin` への依存は持たない
# （docs/design/animation-core-architecture.md §2/§5）。演算は fandhe-animation の
# trait（Driver/Target/Interpolate 等）を本クレートが web-sys で実装する形で担い、
# `data-*` 属性のハイドレーション配線は wasm-full 側（optional 依存として本クレートを
# 取り込む）の責務とする。
#
# wasm-bindgen / js-sys / web-sys は既存 wasm-full/wasm-client が既に依存する
# パッケージ群であり、新規外部パッケージの追加はない（イシュー #2417 実測で
# 確認）。
#
# イシュー #2403/#2517: rAF Driver（raf_driver::RafDriver、performance.now()
# 差分計測 + requestAnimationFrame/cancelAnimationFrame ループ補助）・
# DOM Target（dom_target::DomTarget、CSSStyleDeclaration.setProperty 経由の
# style/CSS カスタムプロパティ書き込み）が使う web-sys feature を追加する。
# 新規外部パッケージの追加はない（既存 wasm-full/wasm-client が同一
# feature を既に有効化済み）。
#
# イシュー #2398: `web-sys` の `Element`（duck-typing extern バインディングの
# unchecked_into キャスト元型）を `animate` モジュールが要求するため追加した。
#
# `wasm-bindgen-futures` はイシュー #2398 の `animate::AnimationHandle::finished`
# （WAAPI `Animation.finished` Promise の待機）に必要。新規外部パッケージでは
# なく、ワークスペース内で既に `wasm-client`（通常依存）・`wasm-full`（dev 依存）
# が同一バージョン制約（"0.4"）で使用済み。本クレートの [dev-dependencies] も
# 従来 `wasm-bindgen-futures` を要求していたため（#2403/#2517 の browser テスト
# 用途）、[dependencies] へ昇格した本エントリと重複しないよう dev 側からは
# 削除した。
#
# イシュー #2518: layout FLIP アニメーション（`flip` モジュール）が
# `Element::get_bounding_client_rect()` の戻り値型 `DomRect`（`x`/`y`/
# `width`/`height` ゲッター）と、`Window::match_media` の戻り値型
# `MediaQueryList`（`matches()`、`prefers-reduced-motion: reduce` 判定用）を
# 使うため追加する。新規外部パッケージの追加はない（既存 wasm-full が
# 同一 feature を既に有効化済み）。
#
# 新規クレートを追加する場合は事前にユーザー承認を得ること。
[dependencies]
fandhe-animation = { path = "../animation", version = "0.2.0" }
wasm-bindgen = "0.2"
js-sys = "0.3"
# イシュー #2521: `scroll_driver` モジュールが使う 4 feature を追加する。
# `css`（`web_sys::css::supports_with_value`、`CSS.supports()` の機能検出）・
# `DomRect`/`DomRectReadOnly`（`Element::get_bounding_client_rect()` の
# 戻り値型・`top()`/`height()` アクセサ、`DomRect` は `DomRectReadOnly` を
# extends するため両方必要）・`MediaQueryList`（`window.matchMedia()` の
# 戻り値型、`prefers-reduced-motion` 判定）。新規外部パッケージの追加は
# ない（wasm-full が既に `DomRect`/`DomRectReadOnly`/`MediaQueryList` を
# 有効化済み、`css` feature のみ本クレートが最初の消費者）。
#
# イシュー #2535: `drag` モジュール（[`DragController`]）・`reduced_motion`
# モジュールを追加するが、新規 web-sys feature の追加は不要。
# `reduced_motion::prefers_reduced_motion` は `scroll_driver::Env::detect`
# と同じ `Window`/`MediaQueryList`（既存 feature）のみを使う。範囲制約
# コンテナの `getBoundingClientRect()` 実測は `wasm-full` 側の責務とし
# （`drag.rs` モジュール doc 参照）、本クレートは数値化済み
# `DragConstraint` を受け取るのみのため `DomRect`/`DomRectReadOnly`/
# `Element` を新規に要求しない（実装計画で検討した 2 案のうち、計測と
# 計算の責務分離を優先する案を採用した判断根拠）。
web-sys = { version = "0.3", features = [
  "Window",
  "Performance",
  "HtmlElement",
  "CssStyleDeclaration",
  "Element",
  "css",
  "DomRect",
  "DomRectReadOnly",
  "MediaQueryList",
  # PR #2557 codex-review P1 是正: ネストしたスクロールコンテナの検出
  # （`scroll_driver::find_scroll_container`）が使う `Document::document_element`
  # （"Document"）・`Node::parent_element`（"Node"）。新規外部パッケージの
  # 追加はない（wasm-full が両 feature を既に有効化済み）。
  "Document",
  "Node",
  # イシュー #2533: `canvas_target`/`confetti` モジュールが使う 2 feature を
  # 追加する。`HtmlCanvasElement`（`canvas.get_context("2d")`・
  # `width()`/`set_width()`/`height()`/`set_height()`）・
  # `CanvasRenderingContext2d`（`fill_rect`/`clear_rect`/`set_fill_style_str`/
  # `save`/`restore`/`translate`/`rotate`/`set_global_alpha`）。`wasm-full`
  # 側は canvas 系 API を一切追加しない方針（`crates/wasm-full/Cargo.toml`
  # の SignaturePad 由来コメント、headless-ui 側の「canvas を使わない」
  # 設計転換）を維持するため、本クレートが workspace 内で唯一この 2
  # feature を有効化する消費者になる（新規外部パッケージの追加はゼロ、
  # 既存 `web-sys` の feature 追加のみ）。
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  # イシュー #2519: `svg_path` モジュールが使う 3 feature を追加する。
  # `SvgGeometryElement`（`getTotalLength()`、`<path>`/`<circle>` 等の
  # 全長取得）・`SvgElement`（`.style()`、SVG 要素の `CssStyleDeclaration`
  # 取得。`HtmlElement::style()` とは別型のため独立に必要）・
  # `SvgAnimatedNumber`（`pathLength` 属性の `baseVal()` 読み取り。
  # codex-review P1 是正: `pathLength` 指定パスは `getTotalLength()` の
  # 実長ではなく `pathLength` の値を距離基準にする、`svg_path.rs`
  # モジュール doc 参照）。新規外部パッケージの追加はない（既存
  # `web-sys` の feature 追加のみ）。
  "SvgGeometryElement",
  "SvgElement",
  "SvgAnimatedNumber",
] }
wasm-bindgen-futures = "0.4"

# イシュー #2403/#2517: `tests/spring_via_raf_dom_browser.rs`（実ブラウザ
# 統合テスト）が `wasm-bindgen-test`（`wasm-pack test --headless --chrome`
# 実行基盤）を使う。`wasm-bindgen-futures`（`JsFuture` によるループ完了待ち）
# は上記マージコミットで [dependencies] へ昇格済みのため dev 側には重複
# 記載しない。`Document`/`Element`/`Node` はテストの DOM セットアップ
# （`div` 要素の生成・`document.body()` への追加）専用のため、本体側の
# feature 集合を汚さないよう `[dev-dependencies.web-sys]` 側にのみ追加する。
# イシュー #2518 さらなるフォローアップ（codex-review P1 是正の browser
# テスト追加）: `HtmlHeadElement` は `flip_browser.rs` が CSS クラス由来の
# `transform` を検証するための `<style>` 要素挿入
# （`Document::head()`、`crates/wasm-full/tests/position_browser.rs::
# ensure_fixed_floating_size_stylesheet` と同型）専用。
[dev-dependencies]
wasm-bindgen-test = "0.3"

# イシュー #2533: `tests/confetti_canvas_browser.rs` が `canvas` 要素の
# 生成（`HtmlCanvasElement`、本体側の feature を再利用）・描画結果検証
# （`CanvasRenderingContext2d::get_image_data` の戻り値型 `ImageData`）に
# 使う。`ImageData` はテスト専用のためここにのみ追加する。
[dev-dependencies.web-sys]
version = "0.3"
features = ["Document", "Element", "Node", "HtmlHeadElement", "ImageData"]

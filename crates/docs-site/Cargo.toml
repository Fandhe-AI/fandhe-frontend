[package]
name = "fandhe-frontend-docs-site"
version = "0.1.0"
edition = "2021"
description = "fandhe-frontend-docs-site: イシュー #465/#458。fandhe-frontend-core / fandhe-frontend-app / fandhe-frontend-server を用いて公式 docs サイトを自フレームワークの SSG で生成するジェネレータ（ドッグフーディング）。配布物には含めない開発者・CI 用ツール。"
license = "MIT OR Apache-2.0"
publish = false

# REQ-3（依存グラフ上限 60 件/深さ 6, docs/spec/04-requirements.md）非影響の根拠:
#
# `.github/workflows/deps-check.yml` の check-deps は `--package fandhe-frontend-core
# --package xtask --package fandhe-frontend-app --package fandhe-frontend-dist-server
# --package fandhe-frontend-server` の明示列挙であり、本クレート
# （fandhe-frontend-docs-site）は計測対象に含まれない。加えて依存は内部 path 依存
# （core/app/server/pre-styled-ui）のみで外部クレート・build.rs を
# 一切追加しないため、既存の計測値（dist-server 実測: 21 件/深さ 5）にも影響しない
# （イシュー #465 実装計画）。
#
# pre-styled-ui は UI コンポーネントショーケースページ（src/showcase.rs、
# site/nav.toml の /components/pre-styled-ui/）が styled 部品の実レンダリングと
# StyleSheet による CSS 生成に使う。ラッパー呼び出しに必要な headless 型
# （`OpenState` / `Orientation`）は pre-styled-ui のルート再エクスポート
# （イシュー #685）経由で得るため、headless-ui への直接依存は持たない
# （イシュー #693。型は path 依存で単一クレート実体に統一される）。
#
# 本クレートは publish = false のため、workspace 内 path 依存に version 併記は
# 不要（xtask check-dep-versions のルール 2 は publish 対象クレートのみが対象）。
[dependencies]
fandhe-frontend-core = { path = "../core" }
fandhe-frontend-app = { path = "../app" }
fandhe-frontend-server = { path = "../server" }
fandhe-frontend-pre-styled-ui = { path = "../pre-styled-ui" }

[dev-dependencies]

[lib]
name = "fandhe_frontend_docs_site"
path = "src/lib.rs"

[[bin]]
name = "docs-site"
path = "src/main.rs"

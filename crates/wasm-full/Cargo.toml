[package]
name = "fandhe-frontend-wasm-full"
version = "0.3.8"
edition = "2021"
description = "fandhe-frontend-wasm-full: WASM 完全方式のクライアントランタイム（イベント処理・DOM 更新を safe Rust に閉じ込める）。"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-frontend"
readme = "../../README.md"
keywords = ["wasm", "csr", "hydration", "frontend"]
categories = ["wasm", "web-programming"]

# TASK-11.2b（#75）でイベント処理（events モジュール）・wasm-bindgen/web-sys
# 依存を追加。TASK-11.2c（#76）は #75 マージ後の rebase により、DOM 非依存の
# 純粋関数 `render_component_html`（dom モジュール、fandhe-frontend-core::render 呼び出し）を
# 追加する。dom モジュールは lib.rs（本クレートの公開面）から呼ばれるため
# fandhe-frontend-core は通常の [dependencies] とする（fandhe-frontend-interactive 経由で既に依存グラフに
# 含まれており、REQ-3 依存上限には影響しない）。TASK-11.2d（#77）で
# `Runtime<C>`（lib.rs）・`dom::paint`・`entry` モジュールを追加したが、新規
# クレート追加は行っていない（既存 wasm-bindgen/web-sys のみで完結、
# `cargo metadata` 実測結果は PR 本文に記録する）。
#
# `docs/policy/unsafe-boundary.md` 第 2 節のポリシー: 自作コードは safe Rust のみとし、
# `unsafe` は wasm-bindgen / web-sys の FFI 境界（依存クレート内部・自動生成コード）
# に限定して許容する。
#
# 依存追加は事前承認必須（.claude/rules/coding-rust.md, security.md）。
# 本追加は Issue #73/#75 の計画（PoC-5 `wasm-full/Cargo.toml` と同一依存構成）を
# もって承認済みとし、影響確認結果を PR 本文に記録する。
#
# TASK-11.4b（#83）で `Attr`/`NamedNodeMap` を追加。`hydration::read_hydration_attrs`
# が `web_sys::Element::attributes()`（`NamedNodeMap`）を index 走査して各属性
# （`web_sys::Attr`）の名前・値を読み取るために必要（`docs/api/hydration-state-format.md`
# 第 5 節）。新規クレート追加ではなく既存 `web-sys` の feature 追加のみであり、
# `cargo metadata` 実測（パッケージ数・依存グラフ深さ）に変化がないことを確認済み
# （PR 本文に記録）。
# TASK-CSR-loader（#349）: `csr` モジュール（CSR 経路の loader 解決）が
# `fandhe_frontend_app::Loader` / `assemble_list_page` / `assemble_detail_page` を
# 型接続に使うため `fandhe-frontend-app` を追加。`fandhe-frontend-app` は外部依存ゼロの
# workspace path 依存（`core/Cargo.toml` と同じく `fandhe_frontend_core` のみに依存する
# コンポーネントロジック層）であり、新規クレート追加ではないため
# `cargo metadata` 実測（パッケージ数・依存グラフ深さ）に変化がないことを
# PR 本文に記録する（`.claude/rules/coding-rust.md` の事前承認要件は
# `docs/design/loader-trait-design.md` §3.1 が「CSR（wasm-full）が Loader を
# 参照する」ことを想定し `fandhe-frontend-app` 配置を選んでいる時点で承認整理済み）。
# イシュー #345（set_inner_html 全置換を束縛点更新 + keyed list へ置換）:
# `fandhe-frontend-wasm-client`（`BindingTable`/`keyed_diff`/`keyed_dom`、#343/#344）を
# rlib 経由で消費するため追加する。`wasm-client/src/binding_dom.rs` 冒頭 doc
# が「#345 が rlib 経由で消費できる公開 API として設計」と明記済みであり、
# 承認整理済みの方向（`docs/design/dom-binding-update-design.md` §3.2a）。
# workspace 内 path 依存であり新規外部パッケージの追加はゼロ
# （`cargo metadata` 実測結果を PR 本文に記録する）。
# イシュー #374（クライアント側ルーティング）: 新規外部クレート追加ゼロ。
# `[dependencies.web-sys]` の features 拡張のみ（History/Location/PopStateEvent
# 連携用の `History`/`Location`/`MouseEvent` を追加）。`cargo metadata` 実測
# （パッケージ数・依存グラフ深さ）に変化がないことを PR 本文に記録する。
# イシュー #406（クライアント遷移のスクロール位置復元制御）: 新規外部クレート
# 追加ゼロ。`PopStateEvent`（popstate クロージャで `state()` を読み取るため。
# 既存の `dev-dependencies.web-sys` には #374 時点でテスト専用として追加済み
# だったが、本イシューで製品面の配線層 `nav::wiring` が直接使うため
# `[dependencies.web-sys]` 側にも追加する）・`ScrollRestoration`（`history.
# set_scroll_restoration` の引数型）を追加する。`cargo metadata` 実測
# （パッケージ数・依存グラフ深さ）に変化がないことを PR 本文に記録する。
# イシュー #582（Tabs/Accordion のキーボード操作、親 #581）: 新規外部クレート
# 追加ゼロ。`[dependencies.web-sys]` の features 拡張のみ（`keynav` モジュールの
# 配線層が使う `KeyboardEvent`（`key()`/`ctrl_key()`/`alt_key()`/`meta_key()`）・
# `HtmlElement`（`focus()`）・`NodeList`（`query_selector_all` の戻り値、
# trigger/item-trigger 集合の走査）を追加する）。`cargo metadata` 実測
# （パッケージ数・依存グラフ深さ）に変化がないことを PR 本文に記録する。
# イシュー #585（オーバーレイ共通閉鎖制御）: `KeyboardEvent`（`overlay::wiring`
# の keydown リスナーが `key() == "Escape"` を判定するために必要）を追加する。
# 新規外部クレート追加ゼロ、既存 web-sys の feature 追加のみ。`cargo metadata`
# 実測（パッケージ数・依存グラフ深さ）に変化がないことを PR 本文に記録する。
# イシュー #590（位置計算モジュールと CSS 変数出力、親 #588）: `position`
# モジュール（純粋ロジック層 + wasm32 配線層）が
# `fandhe_frontend_headless_ui::positioning`（`compute_position`/
# `css_vars_style`/`Placement` 等）を呼ぶため `fandhe-frontend-headless-ui` を
# 製品依存（`[dependencies]`）へ追加する。同クレートは既に
# `[dev-dependencies]`（#585, `overlay_close_browser.rs` 用）に存在し、
# 外部依存が `fandhe-frontend-core`/`fandhe-frontend-interactive`（いずれも
# path）のみのクレート（`crates/headless-ui/Cargo.toml` 冒頭コメント参照）
# であるため、workspace 内 path 依存の追加であり新規外部パッケージの追加は
# ゼロ（`cargo metadata` 実測結果は PR 本文に記録する）。`structure.toml` の
# `[directories.wasm-full].depends_on`/`[directories.headless-ui].allowed_dependents`
# を対応して更新済み。`DomRect`（`Element::get_bounding_client_rect` の戻り値
# 型、anchor/floating 要素の実 DOM 計測に必要）を `[dependencies.web-sys]` へ
# 追加する。
# イシュー #591（Avatar load/error イベント検知グルー）: `HtmlImageElement`
# （`headless_avatar::wiring` が settle 検査で `complete()`/`natural_width()` を
# 読み取るために必要）を追加する。`NodeList` は既に本セクションへ追加済み
# （#582）のため流用する。新規外部クレート追加ゼロ、既存 web-sys の feature
# 追加のみ。`cargo metadata` 実測（パッケージ数・依存グラフ深さ）に変化が
# ないことを PR 本文に記録する。
# イシュー #731（Avatar src 差し替えの MutationObserver 検知）:
# `headless_avatar::wiring` が `root` へ `MutationObserver`（`attributes: true`
# + `attributeFilter: ["src"]` + `subtree: true`）を登録し、`img.src` の
# 差し替えを検知して `"reset"` を dispatch する。`MutationObserver`/
# `MutationObserverInit`（`observe_with_options` の引数）・`MutationRecord`
# （コールバック引数、`attribute_name()`/`type_()`/`target()` を読む）・
# `Node`（`observe_with_options` の `target: &Node` 引数。`Element` から
# 自動 deref される）を追加する。新規外部クレート追加ゼロ、既存 web-sys の
# feature 追加のみ。
# `cargo metadata` 実測（パッケージ数・依存グラフ深さ）に変化がないことを
# PR 本文に記録する。合わせて、コールバック引数（`js_sys::Array` の
# `MutationRecord` 列）を走査するため `js-sys` を `[dev-dependencies]` から
# `[dependencies]` へ昇格する。`js-sys` は既に `web-sys` の推移依存として
# Cargo.lock に存在するため、新規外部パッケージの追加はゼロ（`cargo metadata`
# 実測結果は PR 本文に記録する）。
# イシュー #840（FileUpload の File API 隔離配線、親 #520）:
# `headless_file_upload::wiring` が `input[type=file]`/dropzone からの実
# ファイル選択・ドラッグ&ドロップを検知して `File::name()`/`File::size()`/
# `File::type_()`（内容は一切読まない、`FileReader` は使わない）のみを
# メタデータへ変換するため `File`（個々のファイルハンドル）・`FileList`
# （`HtmlInputElement::files()`/`DataTransfer::files()` の戻り値）・
# `DragEvent`（`dragenter`/`dragover`/`dragleave`/`drop` の `data_transfer()`
# アクセス）・`DataTransfer`（drop されたファイル一覧の取得）を追加する。
# 新規外部クレート追加ゼロ、既存 web-sys の feature 追加のみ。`cargo metadata`
# 実測（パッケージ数・依存グラフ深さ）に変化がないことを PR 本文に記録する。
# イシュー #773（Clipboard の navigator.clipboard.writeText 実配線）:
# `headless_clipboard::wiring` が `Window::navigator()`（`Navigator` 型）
# 経由で `navigator.clipboard`/`writeText` を `js_sys::Reflect` で動的解決
# するため `Navigator`（`Window::navigator()` の戻り値型）・`Promise`
# （`writeText` の戻り値。`js-sys` 側で既に利用可能なため web-sys feature
# 追加は不要）を追加する。`web-sys` の `Clipboard` 型は Web API の実験的
# ステータスに依存する不安定な feature であるため意図的に使わない
# （`headless_clipboard.rs` 冒頭 doc「`navigator.clipboard` の動的解決」節
# 参照）。新規外部クレート追加ゼロ、既存 web-sys の feature 追加のみ。
# `cargo metadata` 実測（パッケージ数・依存グラフ深さ）に変化がないことを
# PR 本文に記録する。
# イシュー #843（SignaturePad、非採用の再導入・SVG path 決定的描画）:
# `headless_signature_pad::wiring` が `control`/`segment` 要素上の
# pointerdown/pointermove/pointerup/pointercancel を配線してストローク座標を
# 収集するため `PointerEvent`（`client_x()`/`client_y()`/`pointer_id()` を
# 読み取る）を追加する。canvas 系 API（`CanvasRenderingContext2d` 等）は
# 一切追加しない（headless-ui 側の設計転換「canvas を使わない」方針、
# `crates/headless-ui/src/signature_pad.rs` モジュール doc 参照）。新規外部
# クレート追加ゼロ、既存 web-sys の feature 追加のみ。`cargo metadata` 実測
# （パッケージ数・依存グラフ深さ）に変化がないことを PR 本文に記録する。
# イシュー #842（AngleSlider の座標 → 角度変換・DOM 配線、非採用の再導入）:
# `angle_slider::wiring` がポインタ座標を `getBoundingClientRect`（既存の
# `DomRect`/`Element` feature を流用）で計測し、`setPointerCapture`/
# `hasPointerCapture`（`PointerEvent::pointer_id()` を要求）で pointer 個別の
# ドラッグを固定する。`KeyboardEvent` は既に本セクションへ追加済み（#582）
# のため流用する。`PointerEvent` を追加する（本クレートでは既に SignaturePad
# 由来で追加済みのため重複追加はしない、上記参照）。新規外部クレート追加
# ゼロ、既存 web-sys の feature 追加のみ。`cargo metadata` 実測（パッケージ数・
# 依存グラフ深さ）に変化がないことを PR 本文に記録する。
[dependencies]
fandhe-frontend-app = { path = "../app", version = "0.1.0" }
fandhe-frontend-core = { path = "../core", version = "0.1.2" }
fandhe-frontend-headless-ui = { path = "../headless-ui", version = "0.26.0" }
fandhe-frontend-interactive = { path = "../interactive", version = "0.1.0" }
# `default-features = false`: 本クレート独自の `wasm_bindgen` エクスポート
# （`entry.rs` の `hydrate`/`mount`）と `fandhe-frontend-wasm-client` の REQ-6 デモ用
# エクスポート（`hydrate`/`mount_csr`）とのシンボル重複（wasm-bindgen の
# "describe" シンボルはクレート非依存の関数名ベース）を避けるため、
# `wasm-client` 側の `wasm-bindgen-exports` feature を無効化する
# （`wasm-client/Cargo.toml`・`wasm-client/src/lib.rs` の `wiring` doc 参照）。
fandhe-frontend-wasm-client = { path = "../wasm-client", version = "0.1.3", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Attr",
  "DataTransfer",
  "Document",
  "DomRect",
  "DragEvent",
  "DragEventInit",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "History",
  "HtmlElement",
  "HtmlImageElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "Location",
  "MouseEvent",
  "MutationObserver",
  "MutationObserverInit",
  "MutationRecord",
  "NamedNodeMap",
  "Navigator",
  "Node",
  "NodeList",
  "PointerEvent",
  "PopStateEvent",
  "ScrollRestoration",
  "Window",
  "console",
]

[lib]
crate-type = ["cdylib", "rlib"]

# TASK-11.5b（#87）: `wasm-full/tests/perf_browser.rs` のしきい値アサーション
# （`INITIAL_LOAD_BUDGET_MS`/`FRAME_BUDGET_MS`）を有効化するための feature。
# 依存クレートの追加は行わない（既定 off、コード分岐のみ）。CI の
# `perf-harness` ジョブは feature なしのまま実行し（スモークのみ・性能判定
# しない方針を維持）、正式計測は統制されたローカル環境で
# `--features perf-assert` を付けて実行する
# （`docs/ci/perf-browser-harness.md` 第 5 節）。
[features]
perf-assert = []

# TASK-11.5a（#86）: 実ブラウザ性能計測ハーネス（wasm-full/tests/perf_browser.rs）の
# 実行に必要な dev 依存。dev-dependency のため製品バイナリ・標準サーバー構成
# （REQ-3 の 60 件/深さ 6 の対象）には影響しない。
#
# 依存追加の承認整理（.claude/rules/coding-rust.md・security.md の事前承認要件）:
# `wasm-bindgen-test` は docs/spec/05-tasks.md TASK-11.5 が成果物として明示する
# `wasm-pack test --headless` の実行に必須であり、docs/guides/browser-testing.md 第 7 節が
# 実ブラウザテストの dev 依存として計画済み（#65 と同一の運用）。追加による影響
# （パッケージ数・依存グラフ深さ・build.rs 有無）は PR 本文に実測値を記録する。
#
# イシュー #404（View Transitions 連携）: `wasm-full/tests/nav_browser.rs` の
# 遷移テストが `document.startViewTransition` をスタブ（同期 shadow）・
# 非同期実行（マイクロタスク/rAF 相当）で検証するため `wasm-bindgen-futures`
# （`JsFuture` による Promise 待ち）・`js-sys`（`Reflect::set`/
# `Reflect::delete_property` によるスタブ設置・削除、`Function`/`Promise`
# 組み立て）を追加する。両クレートとも既に Cargo.lock に存在
# （`wasm-bindgen-test`/`web-sys` が既に依存グラフへ引き込んでいる）ため、
# **新規外部パッケージの追加はゼロ**（`cargo metadata` 実測: パッケージ数・
# 依存グラフ深さ不変。実測結果は PR 本文に記録する）。製品依存
# （`[dependencies]`）には一切追加しない（REQ-3 不変）。
# イシュー #580（headless-ui dispatch の DOM イベント配線基盤）: `headless.rs`
# の native テスト（マッピング表ドリフト検知・`action_for_part` → `dispatch`
# の橋渡し検証）が実際の headless-ui 出力・`state::SingleSelect` を使うため
# `fandhe-frontend-headless-ui` を dev-dependency として追加する。dev
# dependency のため製品バイナリ・標準サーバー構成（REQ-3 の 60 件/深さ 6 の
# 対象）には影響しない。workspace 内 path 依存であり新規外部パッケージの
# 追加はゼロ（`cargo metadata` 実測結果は PR 本文に記録する）。
#
# イシュー #585（オーバーレイ共通閉鎖制御）: `wasm-full/tests/overlay_close_browser.rs`
# が実際の Dialog/Popover マークアップ（`data-scope`/`data-part`/`data-state`）を
# `fandhe_frontend_core::render` 経由で生成するため導入した経緯がある
# （当時は dev-dependency のみ）。イシュー #590 で `fandhe-frontend-headless-ui`
# を製品依存（`[dependencies]`、本ファイル冒頭参照）へ格上げしたため、
# 同一クレートを重複して dev-dependencies にも宣言しない
# （`[dependencies]` はテストからも解決できるため冗長）。
#
# イシュー #731: `js-sys` は `headless_avatar::wiring`（MutationObserver
# コールバックの `MutationRecord` 列走査）が製品面で必要になったため
# `[dependencies]`（本ファイル冒頭参照）へ昇格した。`[dependencies]` は
# テストからも解決できるため、同一クレートを重複して dev-dependencies にも
# 宣言しない（上記 `fandhe-frontend-headless-ui` と同じ整理）。
[dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"

# Performance API（性能計測ハーネス専用）。製品面の [dependencies.web-sys] の
# features には触れず、テスト専用の feature 拡張に閉じる。
#
# TASK-1.3b（#92）: `EventInit` を追加。`wasm-full/tests/xss_escape_wasm.rs` が
# `wire_events`（events.rs）の委譲リスナーを合成 click イベントで発火させる際、
# `bubbles: true` を指定した `web_sys::Event` を組み立てるために必要
# （リスナーは root 要素へ登録されるため、子要素上の click がバブリングで
# root まで届く前提。events.rs 冒頭コメント参照）。新規クレート追加ではなく
# 既存 web-sys の feature 追加のみで、`cargo metadata` 実測（パッケージ数・
# 依存グラフ深さ）に変化がないことを確認済み（PR 本文に記録）。
# イシュー #345: `runtime_browser.rs` の keyed list ノード同一性テストが
# `Element::children()`（`HtmlCollection`）・`query_selector_all`
# （`NodeList`）を使うため追加。テスト専用の feature 拡張。
# イシュー #374: `wasm-full/tests/nav_browser.rs` が合成 `MouseEvent`
# （クリック遷移テスト）・合成 `PopStateEvent`（戻る/進む契約テスト）を
# 組み立てるために `MouseEventInit`/`PopStateEventInit` を追加する
# （テスト専用の feature 拡張。既存の `EventInit` 追加時の判断・PR #92
# と同じ承認整理）。
# イシュー #582: `wasm-full/tests/keynav_browser.rs` が合成 `KeyboardEvent`
# （Arrow/Home/End キー操作テスト）を組み立てるために `KeyboardEventInit` を
# 追加する（テスト専用の feature 拡張。既存の `EventInit`/`MouseEventInit`
# 追加時の判断・PR #92/#374 と同じ承認整理）。
# イシュー #585: `wasm-full/tests/overlay_close_browser.rs` が合成
# `KeyboardEvent`（Escape キー押下の回帰）を組み立てるために
# `KeyboardEventInit` を追加する（テスト専用の feature 拡張。`KeyboardEvent`
# 自体は製品面の `[dependencies.web-sys]` に追加済みのため、ここでは
# init 型のみを追加すれば足りる）。
# イシュー #645: `wasm-full/tests/position_browser.rs` が
# `Document::head()`（`<style>` 要素を 1 度だけ挿入し、headless-ui の
# positioner に `reposition_one` が上書きしない `class` 経由で固定
# `width`/`height` を与えるフィクスチャ用ヘルパー）を呼ぶために
# `HtmlHeadElement` を追加する（テスト専用の feature 拡張）。
# イシュー #843: `wasm-full/tests/headless_signature_pad_browser.rs` が
# 合成 `PointerEvent`（座標指定でストローク描画を再現する回帰テスト）を
# 組み立てるために `PointerEventInit` を追加する（テスト専用の feature
# 拡張。`PointerEvent` 自体は製品面の `[dependencies.web-sys]` に追加済みの
# ため、ここでは init 型のみを追加すれば足りる）。
# イシュー #840: `wasm-full/tests/headless_file_upload_browser.rs` が合成
# `File`（`FilePropertyBag` で mime type を指定）・`DataTransfer`
# （`DataTransferItemList::add_with_file` で `input.files` を合成する）を
# 組み立てるために `FilePropertyBag`/`DataTransferItemList` を追加する
# （テスト専用の feature 拡張。`File`/`DataTransfer` 自体は製品面の
# `[dependencies.web-sys]` に追加済み）。
[dev-dependencies.web-sys]
version = "0.3"
features = [
  "Performance",
  "NamedNodeMap",
  "Attr",
  "EventInit",
  "HtmlCollection",
  "NodeList",
  "MouseEventInit",
  "PopStateEvent",
  "PopStateEventInit",
  "KeyboardEventInit",
  "HtmlHeadElement",
  "PointerEventInit",
  "FilePropertyBag",
  "DataTransferItem",
  "DataTransferItemList",
]

[package]
name = "fandhe-frontend-wasm-full"
# イシュー #1381: `Runtime::commit_keyed_list_result` が
# `KeyedListApplyResult::ResyncRequired` の即時再同期 + クリア終端契約
# （設計書 §6.1/§6.2 段 3）に対応。公開 API は不変・内部実装のみの変更の
# ため patch バンプ（`.claude/rules/coding-rust.md` #638 条項）。
# イシュー #1388: fandhe-frontend-core 0.4.3 / fandhe-frontend-wasm-client
# 0.6.1 依存追随（check-dep-versions --fix）に伴う patch バンプ。
# イシュー #1385: 依存先 `fandhe-frontend-wasm-client` 0.6.0 → 0.6.1
# （連続 Insert 区間の行プロトタイプ clone 化）への `version = "..."`
# 追随バンプ（`cargo run -p xtask -- check-dep-versions --fix`）。本クレート
# 自身は公開 API を追加していないため内部変更のみの patch バンプ。
# イシュー #1741: `focus_visible::boundary_candidates_for`/
# `BoundaryCandidate` の新規公開 API 追加（checkbox-group hidden-input の
# フォーカスリング境界候補フォールバック）。既存 `boundary_part_for`/
# `HIDDEN_INPUT_SELECTOR` は変更なし（非破壊的追加）のため patch バンプ。
# イシュー #1603: headless-ui 依存の version 要求（`check-dep-versions
# --fix`）を 0.30.0 へ追随。本クレートの src/ は checkbox_group の関数を
# 参照しない（`focus_visible.rs` は文字列 "checkbox-group" のみ使用）ため
# 内部変更なしの patch バンプ（Cargo.toml 変更に伴う semver バンプ規約）。
# イシュー #1613: `fandhe-frontend-headless-ui` の number_input 参照突合
# （0.32.0）に追随。本クレートは number_input の keydown 配線を持たない
# （モジュール doc「スコープ外」節参照）ため src/ 変更を伴わない patch
# バンプ。
# イシュー #1614: headless-ui 依存の version 要求を 0.33.0 へ追随。本クレート
# の src/ は password_input の関数を参照しないため内部変更なしの patch
# バンプ。
# イシュー #1614（PR #1880 codex-review/Bugbot 指摘是正）: headless-ui 依存の
# version 要求を 0.33.0 へ追随した際に本クレート自身の version をバンプし
# 忘れていたため追加で patch バンプする。src/ 側の変更は引き続きなし。
# イシュー #1606: headless-ui 依存の version 要求（`check-dep-versions
# --fix`）を 0.32.0 へ追随。本クレートの src/ は editable の関数を参照
# しないため内部変更なしの patch バンプ（Cargo.toml 変更に伴う semver
# バンプ規約）。
# イシュー #1605: headless-ui 依存の version 要求（`check-dep-versions
# --fix`）を 0.33.0 へ追随。本クレートの src/ は combobox の関数を参照
# しないため内部変更なしの patch バンプ（Cargo.toml 変更に伴う semver
# バンプ規約）。headless-ui 0.32.0 が #1605/#1606 双方の独立バンプで
# 衝突し 0.33.0 へ統合されたことに伴う追随であり、実体変更なしの patch
# バンプで 0.7.16 から 0.7.17 へさらに進める（同一版数への偶発的衝突を
# そのまま採用しない）。
# イシュー #1605 codex-review P1 是正: `ComboboxProps::readonly` が
# `true` のとき `combobox` の `trigger`/`item`/`clear-trigger` クリック
# （`headless::PartRef::disabled` が `data-readonly` も fail-closed 対象に
# する拡張）・Arrow/Enter 等のキーボード操作（`keynav::wiring::handle_combobox_input_keydown`
# が `is_combobox_readonly` で `input` の `data-readonly` を確認する追加）
# が選択値を変更できてしまっていた抜け穴を塞いだ。`PartRef` の公開
# フィールド `disabled` は既存のまま（シグネチャ変更なし、意味の拡張の
# み）で新規公開 API も追加していないため非破壊的な patch バンプ。
# イシュー #1614（base 取り込みマージ）: main 側で password-input の参照
# 突合（PR #1880）が独立に headless-ui 依存の version 要求を 0.33.0 へ
# 追随して本クレートを 0.7.17 へ patch バンプしていた（本クレートの src/
# は password_input の関数も参照しないため内部変更なしの patch バンプ）。
# 本ブランチ側で独立に到達していた 0.7.18 との base 取り込みマージにより
# 同一ファイルの patch バンプが競合したため、双方を統合したうえで
# headless-ui 依存の version 要求を 0.34.0（#1605/#1614 統合バンプ）へ
# さらに追随させる patch バンプとして 0.7.19 へ進めていたが、PR #1879
# codex-review P1 指摘（イシュー #1605）を受けて是正: `headless.rs` の公開
# 構造体 `PartRef` へ必須フィールド `readonly` を追加したのは既存の構造体
# リテラルをコンパイル不能にする破壊的変更であり、「新規公開 API なし」の
# 上記記述は誤りだった。`.claude/rules/coding-rust.md` の semver バンプ
# 規律（0.x の破壊的変更はマイナーバンプ）に従い 0.8.0 へ minor バンプする。
# base main 再取り込み時のマージ注記（PR #1879）: main 側で独立に #1609
# （headless-ui 依存 0.34.0 追随・`wire_drag_and_drop` の `data-readonly`
# ガード追加）・#1615（headless-ui 依存 0.34.0 追随、実体変更なし）・#1611
# （headless-ui 依存 0.37.0 追随、doc 更新のみ）・#1610（headless-ui 依存
# 0.36.0 追随、実体変更なし）が積み上がり 0.7.19 → 0.7.21 まで patch
# バンプしていたが、いずれも 0.8.0 未満の patch バンプに留まる。本ブランチ
# は `PartRef` の破壊的変更により既に 0.8.0（minor バンプ）へ到達済みの
# ため、`.claude/rules/coding-rust.md` の semver 規律上 main の 0.7.21 を
# 上回っている 0.8.0 をそのまま維持する（main の 0.7.21 への patch 履歴を
# 上書きしない範囲で、依存する headless-ui の version 要求のみ 0.38.0 へ
# 追随させる）。加えて PR #1879 codex-review P1 再指摘（`action_from_parts`
# の readonly 判定が同 scope ネストを越境して伝播していた不具合）の是正
# （`instance_is_readonly` の新設）は `PartRef` の公開フィールドを変更せず
# 内部実装のみの修正であるため、この再取り込みマージにおいてもさらなる
# バンプは不要と判断した。

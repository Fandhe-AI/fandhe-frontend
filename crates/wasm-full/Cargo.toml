# 対応（内部実装のみ）。依存先 `fandhe-frontend-wasm-client` 0.5.4 →
# 0.6.0（`ResyncRequired` への `dom_mutated` フィールド追加、破壊的変更）に
# 伴う `dep-version-check`（`xtask check-dep-versions --fix`）の
# `version = "..."` 追随バンプ。
# 0.8.0 → 0.8.1（イシュー #1626）: 依存先 `fandhe-frontend-headless-ui`
# 0.38.0 → 0.39.0（date-input の `DateSegmentFlags` → `DateInputProps`
# 置換等の破壊的変更）に伴う `dep-version-check --fix` の `version = "..."`
# 追随バンプ（本クレート自身の実装変更は無いが、依存 version 要求の変更を
# 反映するため patch バンプ）。
[dependencies]
fandhe-frontend-app = { path = "../app", version = "0.2.6" }
fandhe-frontend-core = { path = "../core", version = "0.4.3" }
fandhe-frontend-headless-ui = { path = "../headless-ui", version = "0.48.1" }
fandhe-frontend-interactive = { path = "../interactive", version = "0.2.7" }
# `default-features = false`: 本クレート独自の `wasm_bindgen` エクスポート
# （`entry.rs` の `hydrate`/`mount`）と `fandhe-frontend-wasm-client` の REQ-6 デモ用
# エクスポート（`hydrate`/`mount_csr`）とのシンボル重複（wasm-bindgen の
# "describe" シンボルはクレート非依存の関数名ベース）を避けるため、
# `wasm-client` 側の `wasm-bindgen-exports` feature を無効化する
# （`wasm-client/Cargo.toml`・`wasm-client/src/lib.rs` の `wiring` doc 参照）。
# イシュー #1324（`KeyedOp::Update` の DOM 適用）: wasm-client 0.4.0 が
# 追加した `apply_keyed_list_with_previous`/`KeyedListApplyResult`/
# `collect_keyed_list_nodes` を `Runtime::apply_update_for_dirty`（内部
# 実装のみ、`Runtime` の公開シグネチャは不変）が消費するため dep req を
# 追随する（`cargo run -p xtask -- check-dep-versions --fix`）。本クレート
# 自身は公開 API を追加していないため 0.7.3 → 0.7.4（内部変更のみ）。
#
# push 後の再レビュー（Bugbot Medium、イシュー #1340）の追加是正:
# `Runtime::apply_update_for_dirty` の「保持キャッシュが無い field」経路
# （`keyed_list_cache` の `None` 分岐）が `apply_keyed_list`（wasm-client
# 0.4.0 で戻り値を `bool` へ変更）の戻り値を見ずに常時キャッシュへ確定
# させていたため、挿入スキップが発生した回の未達成状態が誤ってキャッシュ
# へ再シードされる不具合を修正した。`Runtime` の公開シグネチャは不変・
# 内部実装のみの変更のため、引き続き 0.7.4（本 PR で未公開のまま）へ
# 吸収させ、追加のバンプは行わない。
fandhe-frontend-wasm-client = { path = "../wasm-client", version = "0.6.1", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Attr",
  "DataTransfer",
  "Document",
  "DomRect",
  "DragEvent",
  "DragEventInit",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "History",
  "HtmlElement",
  "HtmlImageElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "Location",
  "MouseEvent",
  "MutationObserver",
  "MutationObserverInit",
  "MutationRecord",
  "NamedNodeMap",
  "Navigator",
  "Node",
  "NodeList",
  "PointerEvent",
  "PopStateEvent",
  "ScrollRestoration",
  "Window",
  "console",
]

[lib]
crate-type = ["cdylib", "rlib"]

# TASK-11.5b（#87）: `wasm-full/tests/perf_browser.rs` のしきい値アサーション
# （`INITIAL_LOAD_BUDGET_MS`/`FRAME_BUDGET_MS`）を有効化するための feature。
# 依存クレートの追加は行わない（既定 off、コード分岐のみ）。CI の
# `perf-harness` ジョブは feature なしのまま実行し（スモークのみ・性能判定
# しない方針を維持）、正式計測は統制されたローカル環境で
# `--features perf-assert` を付けて実行する
# （`docs/ci/perf-browser-harness.md` 第 5 節）。
#
# イシュー #1120: `wasm-bindgen-exports` feature を追加（既定 on）。`entry`
# モジュール（アプリ側 `#[wasm_bindgen] mount`/`hydrate`/`start_router` の
# デモ実装）を rlib 経由で依存に加えるだけで自アプリの `#[wasm_bindgen]`
# エクスポートと名前衝突・バンドル肥大が起きる懸念（イシュー #1120
# フィードバック 3）を解消するため、`wasm-client` の同名 feature
# （`wasm-client/Cargo.toml` 参照）と同型の設計でエクスポート面を切り離せる
# ようにする。既定 on のため既存利用者（`fw new --template app` の
# `wasm/Cargo.toml` 等）の挙動は変わらない。rlib 専用利用者は
# `default-features = false` で `entry` のエクスポートを除外できる
# （`lib.rs` の `pub mod entry` ゲート参照）。
[features]
default = ["wasm-bindgen-exports"]
wasm-bindgen-exports = []
perf-assert = []

# TASK-11.5a（#86）: 実ブラウザ性能計測ハーネス（wasm-full/tests/perf_browser.rs）の
# 実行に必要な dev 依存。dev-dependency のため製品バイナリ・標準サーバー構成
# （REQ-3 の 60 件/深さ 6 の対象）には影響しない。
#
# 依存追加の承認整理（.claude/rules/coding-rust.md・security.md の事前承認要件）:
# `wasm-bindgen-test` は docs/spec/05-tasks.md TASK-11.5 が成果物として明示する
# `wasm-pack test --headless` の実行に必須であり、docs/guides/browser-testing.md 第 7 節が
# 実ブラウザテストの dev 依存として計画済み（#65 と同一の運用）。追加による影響
# （パッケージ数・依存グラフ深さ・build.rs 有無）は PR 本文に実測値を記録する。
#
# イシュー #404（View Transitions 連携）: `wasm-full/tests/nav_browser.rs` の
# 遷移テストが `document.startViewTransition` をスタブ（同期 shadow）・
# 非同期実行（マイクロタスク/rAF 相当）で検証するため `wasm-bindgen-futures`
# （`JsFuture` による Promise 待ち）・`js-sys`（`Reflect::set`/
# `Reflect::delete_property` によるスタブ設置・削除、`Function`/`Promise`
# 組み立て）を追加する。両クレートとも既に Cargo.lock に存在
# （`wasm-bindgen-test`/`web-sys` が既に依存グラフへ引き込んでいる）ため、
# **新規外部パッケージの追加はゼロ**（`cargo metadata` 実測: パッケージ数・
# 依存グラフ深さ不変。実測結果は PR 本文に記録する）。製品依存
# （`[dependencies]`）には一切追加しない（REQ-3 不変）。
# イシュー #580（headless-ui dispatch の DOM イベント配線基盤）: `headless.rs`
# の native テスト（マッピング表ドリフト検知・`action_for_part` → `dispatch`
# の橋渡し検証）が実際の headless-ui 出力・`state::SingleSelect` を使うため
# `fandhe-frontend-headless-ui` を dev-dependency として追加する。dev
# dependency のため製品バイナリ・標準サーバー構成（REQ-3 の 60 件/深さ 6 の
# 対象）には影響しない。workspace 内 path 依存であり新規外部パッケージの
# 追加はゼロ（`cargo metadata` 実測結果は PR 本文に記録する）。
#
# イシュー #585（オーバーレイ共通閉鎖制御）: `wasm-full/tests/overlay_close_browser.rs`
# が実際の Dialog/Popover マークアップ（`data-scope`/`data-part`/`data-state`）を
# `fandhe_frontend_core::render` 経由で生成するため導入した経緯がある
# （当時は dev-dependency のみ）。イシュー #590 で `fandhe-frontend-headless-ui`
# を製品依存（`[dependencies]`、本ファイル冒頭参照）へ格上げしたため、
# 同一クレートを重複して dev-dependencies にも宣言しない
# （`[dependencies]` はテストからも解決できるため冗長）。
#
# イシュー #731: `js-sys` は `headless_avatar::wiring`（MutationObserver
# コールバックの `MutationRecord` 列走査）が製品面で必要になったため
# `[dependencies]`（本ファイル冒頭参照）へ昇格した。`[dependencies]` は
# テストからも解決できるため、同一クレートを重複して dev-dependencies にも
# 宣言しない（上記 `fandhe-frontend-headless-ui` と同じ整理）。
[dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"

# Performance API（性能計測ハーネス専用）。製品面の [dependencies.web-sys] の
# features には触れず、テスト専用の feature 拡張に閉じる。
#
# TASK-1.3b（#92）: `EventInit` を追加。`wasm-full/tests/xss_escape_wasm.rs` が
# `wire_events`（events.rs）の委譲リスナーを合成 click イベントで発火させる際、
# `bubbles: true` を指定した `web_sys::Event` を組み立てるために必要
# （リスナーは root 要素へ登録されるため、子要素上の click がバブリングで
# root まで届く前提。events.rs 冒頭コメント参照）。新規クレート追加ではなく
# 既存 web-sys の feature 追加のみで、`cargo metadata` 実測（パッケージ数・
# 依存グラフ深さ）に変化がないことを確認済み（PR 本文に記録）。
# イシュー #345: `runtime_browser.rs` の keyed list ノード同一性テストが
# `Element::children()`（`HtmlCollection`）・`query_selector_all`
# （`NodeList`）を使うため追加。テスト専用の feature 拡張。
# イシュー #374: `wasm-full/tests/nav_browser.rs` が合成 `MouseEvent`
# （クリック遷移テスト）・合成 `PopStateEvent`（戻る/進む契約テスト）を
# 組み立てるために `MouseEventInit`/`PopStateEventInit` を追加する
# （テスト専用の feature 拡張。既存の `EventInit` 追加時の判断・PR #92
# と同じ承認整理）。
# イシュー #582: `wasm-full/tests/keynav_browser.rs` が合成 `KeyboardEvent`
# （Arrow/Home/End キー操作テスト）を組み立てるために `KeyboardEventInit` を
# 追加する（テスト専用の feature 拡張。既存の `EventInit`/`MouseEventInit`
# 追加時の判断・PR #92/#374 と同じ承認整理）。
# イシュー #585: `wasm-full/tests/overlay_close_browser.rs` が合成
# `KeyboardEvent`（Escape キー押下の回帰）を組み立てるために
# `KeyboardEventInit` を追加する（テスト専用の feature 拡張。`KeyboardEvent`
# 自体は製品面の `[dependencies.web-sys]` に追加済みのため、ここでは
# init 型のみを追加すれば足りる）。
# イシュー #645: `wasm-full/tests/position_browser.rs` が
# `Document::head()`（`<style>` 要素を 1 度だけ挿入し、headless-ui の
# positioner に `reposition_one` が上書きしない `class` 経由で固定
# `width`/`height` を与えるフィクスチャ用ヘルパー）を呼ぶために
# `HtmlHeadElement` を追加する（テスト専用の feature 拡張）。
# イシュー #843: `wasm-full/tests/headless_signature_pad_browser.rs` が
# 合成 `PointerEvent`（座標指定でストローク描画を再現する回帰テスト）を
# 組み立てるために `PointerEventInit` を追加する（テスト専用の feature
# 拡張。`PointerEvent` 自体は製品面の `[dependencies.web-sys]` に追加済みの
# ため、ここでは init 型のみを追加すれば足りる）。
# イシュー #840: `wasm-full/tests/headless_file_upload_browser.rs` が合成
# `File`（`FilePropertyBag` で mime type を指定）・`DataTransfer`
# （`DataTransferItemList::add_with_file` で `input.files` を合成する）を
# 組み立てるために `FilePropertyBag`/`DataTransferItemList` を追加する
# （テスト専用の feature 拡張。`File`/`DataTransfer` 自体は製品面の
# `[dependencies.web-sys]` に追加済み）。
[dev-dependencies.web-sys]
version = "0.3"
features = [
  "Performance",
  "NamedNodeMap",
  "Attr",
  "EventInit",
  "HtmlCollection",
  "NodeList",
  "MouseEventInit",
  "PopStateEvent",
  "PopStateEventInit",
  "KeyboardEventInit",
  "HtmlHeadElement",
  "PointerEventInit",
  "FilePropertyBag",
  "DataTransferItem",
  "DataTransferItemList",
]

# `fw gate`（`crates/cli/src/gate.rs::run_gate`）が唯一の情報源として読む
# 構造マニフェスト（イシュー #351: 生成直後 `fw gate` PASS 保証と同じ方針を
# examples/wireframe-ui にも適用する。詳細は `docs/design/structure-manifest.md`
# §2.2 を参照）。
#
# ディレクトリ名 `root` について: 本サンプルのクレートはプロジェクトルート
# 直下（`src/`）に置かれる。`root` はスキーマ v1 の正式な予約名
# （`cli/src/structure.rs::ROOT_DIR_KEY`）であり、`templates/default` /
# `examples/ssg-blog` と同じ配置規約に従う。
#
# 本マニフェストの宣言単位は cargo パッケージ（クレート）であり、ターゲット
# （bin/lib）ではない（イシュー #1115/#1134/#1162、詳細は
# docs/design/structure-manifest.md §2.2.3）。したがって `src/sections.rs` の
# ようなモジュールを追加しても、本ファイルの更新は不要である。`fw gate` は
# 宣言クレートへ `-p <crate>` 指定で cargo check/clippy/test を実行するため
# （`crates/cli/src/gate.rs`）、モジュールも自動的に検証対象へ含まれて
# PASS する。

[manifest]
version = 1

[directories.root]
role = "distribution"
crate = "fandhe-frontend-example-wireframe-ui"
description = "fandhe-frontend-wireframe-ui 49 部品ショーケースの正本サンプル（イシュー #2667）"

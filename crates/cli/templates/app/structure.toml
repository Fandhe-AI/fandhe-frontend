# `fw new --template app`（イシュー #378）が展開する拡張プロジェクトの構造
# マニフェスト（REQ-13、`cli/src/structure.rs` のスキーマ v1）。
#
# `fw gate`（`cli/src/gate.rs::run_gate`）は本ファイルを唯一の情報源として
# 検証対象クレートを決定するため、`fw new --template app` 生成直後に
# `fw gate` を無編集で PASS させるにはこのファイルの同梱が必須
# （`templates/default/structure.toml` と同一方針、イシュー #351）。
# `[directories.root]` の `crate` の値は `fw new` が `Cargo.toml` /
# `Cargo.lock` と同様にプロジェクト名へ置換する対象に含める
# （`cli/src/new.rs` のテンプレート別 SUBSTITUTED_FILES）。
#
# fandhe-frontend-core / fandhe-frontend-app / fandhe-frontend-interactive /
# fandhe-frontend-wasm-client は crates.io バージョン依存（イシュー #412 で
# vendor 同梱から切替）であり、生成プロジェクト配下にソースを持たないため
# 本マニフェストへ宣言しない（`fw gate` の検証対象クレート決定は
# `[directories.*]` 宣言済みのディレクトリのみが対象）。
#
# `wasm/`（イシュー #411、独立ワークスペースの CSR wasm ビルド用 glue クレート
# `app-csr-wasm`）も同じ理由で本マニフェストへ宣言しない。`wasm/` は
# root（本ファイル `[directories.root]` が指すプロジェクトルートクレート）の
# `[workspace] members = ["."]` にも含まれないオプトイン経路であり、
# `fw gate` の検証対象クレート決定
# （本ファイルのみが情報源）にも影響しない。`tools/wasm/build.sh` は
# `structure.toml`/`fw gate` を経由せず、プロジェクトルートから直接
# `wasm/Cargo.toml` を `--manifest-path` 指定してビルドする独立経路。
#
# 本マニフェストの宣言単位は cargo パッケージ（クレート）であり、ターゲット
# （bin/lib）ではない（イシュー #1115、詳細は
# docs/design/structure-manifest.md §2.2.3）。したがって `src/lib.rs` を
# 追加して bin + lib 構成へ拡張しても、本ファイルの更新は不要である。
# `fw gate` は宣言クレートへ `-p <crate>` 指定で cargo check/clippy/test を
# 実行するため（`crates/cli/src/gate.rs`）、lib ターゲットも自動的に検証
# 対象へ含まれて PASS する。

[manifest]
version = 1

[directories.root]
role = "distribution"
crate = "fandhe-frontend-template-app"
description = "fw new --template app が生成する単一バイナリプロジェクトの骨格（クレートはプロジェクトルート直下に配置、fandhe-frontend-core/fandhe-frontend-app 依存）"

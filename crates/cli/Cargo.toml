[package]
name = "fandhe-frontend-cli"
# イシュー #2219: `embedded-examples/headless-pre-styled-ui` を正本の
# pre-styled-ui 0.185.0 / headless-ui 0.69.1 追随（`tabs::tabs()` の
# `TabsVariant` 引数追加への対応込み）に同期した。
# イシュー #2525: `embedded-examples/interactive-view-transitions` を正本の
# wasm-full 0.33.0 / headless-ui 0.69.2 追随（Phase 4 配線群 feature の実演
# 追加込み）に同期した。
# examples 5 件の fandhe クレート依存ピンを crates.io 最新公開版へ更新した
# のに合わせて `embedded-examples/` 全件を再同期した。
# `include_str!`（`new_template.rs`）で埋め込まれる `fw` バイナリの内容が
# 変わるため、公開 API 不変（内部データの更新のみ）だが patch バンプする。
# イシュー #2667: `examples/wireframe-ui`（`fandhe-frontend-wireframe-ui`
# 0.52.0 のショーケース正本サンプル）を `fw new --example wireframe-ui` へ
# 登録した（`EXAMPLES` 配列への新規エントリ追加 + `embedded-examples/wireframe-ui/`
# 新設）。公開 API（`new_template.rs::EXAMPLES` の要素追加は下位互換）は
# 破壊しないが、`include_str!` で埋め込まれる `fw` バイナリの内容が
# 変わるため patch バンプする。
version = "0.4.5"
edition = "2021"
description = "fandhe-frontend-cli: AI 自己保守フック向け `fw` コマンド（TASK-13.1、structure.toml のスキーマ・パース・生成）。外部依存ゼロ。"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-frontend"
readme = "../../README.md"
keywords = ["frontend", "cli", "scaffolding"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "fw"
path = "src/main.rs"

# REQ-3 / coding-rust.md: 依存クレートの追加は事前に cargo metadata で影響を確認し
# ユーザー承認を得ること。自動運転（承認取得不可）時は既定で「追加しない」側に倒す。
# structure.toml のパース（TASK-13.1b, #129）も toml/serde クレートを使わず
# TOML サブセットの手書きパーサとする前提でスキーマを設計しているため、
# 本クレートは xtask 同様に外部依存ゼロを維持する。
[dependencies]

[dev-dependencies]

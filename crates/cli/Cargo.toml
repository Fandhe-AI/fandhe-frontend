[package]
name = "fandhe-frontend-cli"
# イシュー #2330: `embedded-examples/interactive-view-transitions`
# （README.md・wasm/Cargo.toml.embed）・`embedded-examples/dist-server-docker`
# （README.md）を正本 `examples/` の更新に追随してバイト単位で同期した。
# `include_str!`（`new_template.rs`）で埋め込まれる `fw` バイナリの内容が
# 変わるため、公開 API 不変（内部データの更新のみ）だが patch バンプする。
version = "0.4.1"
edition = "2021"
description = "fandhe-frontend-cli: AI 自己保守フック向け `fw` コマンド（TASK-13.1、structure.toml のスキーマ・パース・生成）。外部依存ゼロ。"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-frontend"
readme = "../../README.md"
keywords = ["frontend", "cli", "scaffolding"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "fw"
path = "src/main.rs"

# REQ-3 / coding-rust.md: 依存クレートの追加は事前に cargo metadata で影響を確認し
# ユーザー承認を得ること。自動運転（承認取得不可）時は既定で「追加しない」側に倒す。
# structure.toml のパース（TASK-13.1b, #129）も toml/serde クレートを使わず
# TOML サブセットの手書きパーサとする前提でスキーマを設計しているため、
# 本クレートは xtask 同様に外部依存ゼロを維持する。
[dependencies]

[dev-dependencies]

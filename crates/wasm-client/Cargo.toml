[package]
name = "fandhe-frontend-wasm-client"
# イシュー #1381: `KeyedOp::Update` 適用の子ノード最小差分化（per-child
# diff エンジン、`keyed_apply.rs::diff_children`）に伴い
# `KeyedListApplyResult::ResyncRequired` へ公開フィールド `dom_mutated`
# を追加した（破壊的変更、`.claude/rules/coding-rust.md` #638 条項に
# 従い 0.x のマイナーバンプ）。加えて `KeyedListApplyResult` の定義を
# `keyed_dom`（`#[cfg(target_arch = "wasm32")]`）から DOM 非依存の新規
# モジュール `keyed_apply_result`（常時コンパイル）へ切り出し、
# host（native）の `cargo test` からも本型を構築できるようにした
# （公開パス・フィールドは不変、可用ターゲットの拡大のみ）。
# イシュー #1388: panic 整形機構（`expect`/`unwrap`/添字アクセス由来の
# `escape_debug_ext`・`Formatter::pad`・`panic_bounds_check` 等）を wasm
# payload から縮減するため、`expect`/添字アクセスを `get`/イテレータ・
# fail-closed 早期 return へ内部実装のみ置換した（公開 API 不変、patch
# バンプ）。
# イシュー #1385: 連続 Insert 区間を行プロトタイプ cloneNode + 束縛点
# 書き込みで一括生成する経路を追加した（`keyed_apply::KeyedListDom` へ
# `pub(crate)` トレイトメソッド `create_items_from_template` を追加、
# `crate::keyed_dom::WebSysKeyedDom` に実装）。公開 API（クレート外部から
# 見える型・関数シグネチャ）は不変で内部実装のみの変更だが、`.claude/
# rules/coding-rust.md` #638 条項に従い patch バンプする。
version = "0.6.1"
edition = "2021"
description = "fandhe-frontend-wasm-client: REQ-6 最小ハイドレーション方式のクライアントランタイム。サーバー出力済み DOM を再構築せず、イベントリスナーを後付けする hydrate() と、SSR/SSG と同一関数を呼ぶ CSR 用 mount_csr() を提供する。"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-frontend"
readme = "../../README.md"
keywords = ["wasm", "hydration", "frontend", "dom"]
categories = ["wasm", "web-programming"]

# TASK-6.2b（#48）で本クレートを新設。`docs/api/hydration-api.md`（TASK-6.2a・#47、
# 凍結済み設計書）第 2 節の凍結内容に従う。実装と本書に乖離が生じた場合は
# 本書を正とする。
#
# `docs/policy/unsafe-boundary.md` 第 2 節のポリシー: 自作コードは safe Rust のみとし、
# `unsafe` は wasm-bindgen / web-sys の FFI 境界（依存クレート内部・自動生成
# グルーコード）に限定して許容する（`wasm-full`/`wasm-thin` と同方針）。
#
# 依存追加の事前承認整理（.claude/rules/coding-rust.md・security.md）:
# wasm-bindgen / web-sys は `docs/api/hydration-api.md` 第 2 節・第 6 節（不変条件 6）
# で計画済みであり、`wasm-full`（#75）と同一のバージョン系列（"0.2" / "0.3"）を
# 指定する。Cargo.lock は既に wasm-bindgen 0.2.126 / web-sys 0.3.103 を解決済み
# のため、本クレート追加で新規外部パッケージは増えない
# （`cargo metadata` 実測: パッケージ総数 71 件のまま。PR 本文に記録）。
#
# fandhe-frontend-interactive（#343、束縛点ベースの最小更新の一般化）: DirtyTracked
# トレイト境界に必要。ワークスペース内 path 依存であり外部依存ゼロの
# クレートのため、新規外部パッケージの増加はゼロ（REQ-3 整理、PR 本文に
# `cargo metadata` 実測を記録）。
# イシュー #1120（wasm-full Runtime のフォーム中心マルチ画面 SPA 対応）:
# `BindingTable::has_field`（`binding_dom.rs`）を追加する公開 API 追加的変更。
# `fandhe-frontend-wasm-full` の構造フォールバック（束縛点・keyed list の
# いずれにも対応しない dirty field を検知して全再描画へ切り替える判定）が
# 消費する前提 API のため 0.1.2 → 0.1.3 へバンプする（新規外部クレート追加
# ゼロ、`.claude/rules/coding-rust.md` の semver バンプ必須条項）。
#
# イシュー #1318（keyed 適用の DOM 操作コストを固定する決定的テスト）:
# `keyed_dom.rs` の `apply_keyed_list` を非公開の `KeyedListDom` トレイト
# （`keyed_apply.rs` 新設、非公開モジュール）越しの構成へ等価リファクタし、
# native `cargo test` から到達可能な決定的コストテストを追加した。
# `keyed_apply` モジュールは非公開（`mod keyed_apply;`）、`KeyedListDom`
# トレイトも `pub(crate)` であり、`keyed_dom::apply_keyed_list`（唯一の
# 公開エントリポイント）のシグネチャ・`keyed_diff` の公開型もいずれも
# 変更していない（外部から観測可能な公開 API に影響しない内部実装のみの
# 変更）ため、`.claude/rules/coding-rust.md` の semver バンプ必須条項の
# 例外（PR 本文 `version-bump-exempt: fandhe-frontend-wasm-client` 宣言）を
# 適用し、0.3.0 を維持する。
#
# イシュー #1319（keyed 挿入位置解決の O(1) 化）: `KeyedListDom::child_at`
# を追加し、`apply_ops` の `Insert`/`Move` 参照ノード決定を旧
# `nth_element_child`（sibling 走査 O(index)）から置換した。当初
# `Element::children()`（`HtmlCollection`）+ `HtmlCollection::item(index)`
# で実装したが、codex-review 指摘（`HTMLCollection` は live collection で
# あり `item(index)` の計算量は WHATWG 仕様上保証されないため、ブラウザ側
# 実装次第で二乗コストへ退行しうる）を受け、`WebSysKeyedDom` 自身が
# 保持・追随更新する `(key, Element)` の `Vec` キャッシュへの添字アクセス
# へ設計変更した（`keyed_dom.rs` の `WebSysKeyedDom` doc 参照。この経緯
# により製品面では最終的に `Element::children()`/`HtmlCollection` を呼ば
# ない）。`pub(crate)` トレイトへのメソッド追加・`apply_keyed_list` の公開
# シグネチャ不変という点で #1318 と同種の内部実装のみの変更のため、
# in-repo version 0.3.1（本 PR 作成時点で crates.io 未公開）へこの変更を
# 吸収させ、追加のバンプは行わない（`docs/ci/version-bump-publish-order-gap.md`
# の「未公開ウィンドウ中の変更相乗り」に相当。0.3.0 → 0.3.1 の変更内容と
# して非破壊）。
#
# イシュー #1320（連続 Insert の DocumentFragment 集約）: `keyed_apply.rs`
# の `KeyedListDom::insert_before` を `insert_before_batch` へ置換し、
# `keyed_dom.rs` の `WebSysKeyedDom` に `DocumentFragment` 経由の一括挿入を
# 実装した。`pub(crate)` トレイトの内部変更のみで `apply_keyed_list` の
# 公開シグネチャ・`keyed_diff` の公開型は不変のため、実装時点
# （2026-08-12 時点、crates.io 公開済み最新は 0.3.0）で in-repo version
# 0.3.2 が既に未公開ウィンドウ中だった事実を確認したうえで、#1318/#1319 と
# 同じ「未公開ウィンドウ中の変更相乗り」（`docs/ci/version-bump-publish-order-gap.md`）
# として 0.3.2 へ本変更を吸収させ、追加のバンプは行わない。
#
# イシュー #1324（`KeyedOp::Update` の DOM 適用、`docs/design/keyed-update-op-design.md`
# 確定設計の実装）: `keyed_diff` を `fandhe_frontend_core::keyed`（`KeyedOp`/
# `diff_keys`/`diff_keyed_items`、イシュー #1323）の re-export へ置換し、
# `KeyedListDom` トレイトへ `sync_attrs`/`replace_item_children` を追加、
# 新規公開 API `apply_keyed_list_with_previous`・公開型
# `KeyedListApplyResult`・`collect_keyed_list_nodes` を追加した。`KeyedOp`
# は `fandhe_frontend_core::keyed::KeyedOp` の re-export へ切り替わり
# variant（`Update`）が増える破壊的変更（設計書 §4.4 の明記どおり）のため
# マイナーバンプ（0.3.2 → 0.4.0）とする。
#
# PR #1340 codex-review P1 対応（イシュー #1324 のフォローアップ、上記
# 0.4.0 バンプがまだ crates.io へ未公開のウィンドウ中）: `apply_ops`/
# `apply_ops_with_items`（`keyed_apply.rs`、いずれも非公開）へ「未達成
# スロットの index 補正」（`index_offset`）と `ApplyOutcome::resync_required`
# を追加し、`Insert` の構築失敗（`RawHtml` 混入等）後に後続 `Move`/`Insert`
# が誤った位置へ適用される不具合と、その誤った適用結果を「達成 Node」として
# キャッシュへ確定させてしまう不具合を修正した。`pub(crate)` 内部変更のみ、
# および `KeyedListApplyResult::ResyncRequired`（既存 public variant）の
# doc 更新のみで公開シグネチャ・公開型に変更はないため、#1318/#1319/#1320 と
# 同じ「未公開ウィンドウ中の変更相乗り」として 0.4.0 へ本変更を吸収させ、
# 追加のバンプは行わない。
#
# 同 PR #1340 への push 後再レビュー（codex P1 + Bugbot Medium x2、イシュー
# #1340）の追加是正: (1) `apply_ops_with_items`（`keyed_apply.rs`）の
# `KeyedOp::Update` 処理順序を `sync_attrs` → `replace_item_children` から
# `replace_item_children` → `sync_attrs`（成功時のみ）へ入れ替え、子ノード
# 構築失敗時に属性だけ新しい値へ変更済みという不整合状態が実 DOM に残る
# 不具合を修正した。(2) `apply_ops`（`diff_keys` 経由、実際には `Update` を
# 発行し得ない）の `KeyedOp::Update` no-op 分岐が `i` を進めておらず、型
# レベルで構築可能な `Update` 混入 ops を直接注入すると無限ループする
# 欠陥を修正した。(3) 公開 API `apply_keyed_list`（`keyed_dom.rs`）の戻り値を
# `()` から `bool`（目標状態への完全到達可否）へ変更し、`apply_ops` にも
# 同じ戻り値を追加した。`fandhe-frontend-wasm-full` の
# `Runtime::apply_update_for_dirty` が「保持キャッシュが無い field」経路
# （`None` 分岐）でこの戻り値を見ずに常時キャッシュへ確定させていたことで、
# 挿入スキップが発生した回の未達成状態が誤ってキャッシュへ再シードされ、
# 上記 (1) 系の「未達成状態をキャッシュしない」ガードが 1 tick 後に無効化
# される不具合（Bugbot 指摘）の是正に必要な変更。戻り値の追加は既存呼び
# 出し元（本クレート内テスト含む）の互換性を壊さない（非 `#[must_use]` の
# ため戻り値を無視しても警告にならない）。以上 3 件は `pub(crate)` 内部
# 変更 + 公開関数 1 件の戻り値追加のみで公開型・既存公開シグネチャの引数は
# 不変のため、引き続き同じ「未公開ウィンドウ中の変更相乗り」として 0.4.0
# へ吸収させ、追加のバンプは行わない。
#
# 同 PR #1340 push 後の再レビュー（codex P1 x2、イシュー #1340）の追加
# 是正: (1) `WebSysKeyedDom::replace_item_children`（`keyed_dom.rs`）が
# `remove_child`/`append_child` の `Result` を検査せず、部分適用（子ノード
# の一部だけ削除・追加された DOM）を `true`（達成）として返していた不具合
# を修正した。走査本体を DOM 非依存の [`crate::keyed_apply::ChildExchangeDom`]
# トレイト + `exchange_children`（いずれも `pub(crate)`）へ切り出し、
# `docs/design/keyed-update-op-design.md` §6 不変条件 6「子ノード交換」が
# 規定する構造的原子性（取り外し/取り付けフェーズの部分失敗時、元の構造へ
# ロールバックしてから未達成として `false` を返す）を実装し、native
# テストで n 回目の呼び出し失敗を決定的に注入できるようにした。
# (2) `apply_ops_with_items`（`keyed_apply.rs`）の `KeyedOp::Update` が
# ルート要素のタグ変更を無視し、既存要素の属性・子ノードのみを書き換えて
# いたため、同一キーでタグが変わる更新（例: `li` → `div`）が実 DOM に一切
# 反映されないまま新しい view が Achieved としてキャッシュされ、以後同じ
# view を再適用しても収束しない不具合を修正した。`diff_keyed_items`
# （core、§3.1）は新旧 `Node` の `PartialEq` 不一致（タグ差分を含む）のみで
# `Update` を発行する仕様のまま変更していない（§3.2 c 案の適用側がタグ
# 変更ケースを扱っていなかった実装ギャップと判断したため）。タグ不一致を
# 検出した場合は新規 `KeyedListDom::replace_root`（`pub(crate)`）で
# `Insert` 相当の構築 + 旧ルート要素の差し替え（アイテム全置換）を行う。
# いずれも `pub(crate)` 内部変更のみで公開型・公開シグネチャに変更はない
# ため、引き続き同じ「未公開ウィンドウ中の変更相乗り」として 0.4.0 へ
# 吸収させ、追加のバンプは行わない。
#
# 同 PR #1340、codex 再レビュー（P1 x2、イシュー #1340・3 巡目）の追加
# 是正: (1) `WebSysKeyedDom::replace_root`（`keyed_dom.rs`）が
# `insert_before`/`remove_child` の `Result` を検査せず部分適用を「達成」
# として返していた不具合を修正した。走査本体を DOM 非依存の
# [`crate::keyed_apply::RootReplaceDom`] トレイト + `replace_root_node`
# （いずれも `pub(crate)`）へ切り出し、`replace_item_children`/
# `exchange_children` と同じ「挿入成功後の削除失敗はロールバック、完全
# 成功時のみキャッシュ更新」契約を実装した。(2)
# `apply_keyed_list_with_previous`（`keyed_dom.rs`）が `new_list_node`/
# `previous_list_node` の形状検証より先に旧アイテムの Remove を実 DOM へ
# 適用してしまい、非 `Node::Element` を渡すと契約外のノードを
# `Achieved` として返していた不具合を修正した。DOM 操作前に両ノードの
# 形状を検証し、`Node::Element` でなければ DOM に一切触れず
# `KeyedListApplyResult::ResyncRequired` を返す fail-closed 化を追加した。
# あわせて全走査（`let _ =`/`.ok()` による Result 破棄の総点検）により
# 同型の見落としだった `KeyedListDom::insert_before_batch`/`move_before`/
# `remove_child`（`keyed_apply.rs`/`keyed_dom.rs`、いずれも `pub(crate)`）
# の戻り値を `()` から `bool` へ変更し、実 DOM 操作失敗時は
# `apply_ops`/`apply_ops_with_items` 側の `fully_achieved`/
# `resync_required` へ伝播し内部キャッシュ（`children`）を更新しないよう
# 是正した。`build_dom_node_with_namespace`（`keyed_dom.rs`、detached
# ノード構築フェーズ）の `set_attribute`/`append_child` 失敗も同様に
# `None`（構築失敗）として呼び出し元へ伝播するよう是正した（`element` が
# まだ本関数外へ共有されていない detached ノードのため実 DOM への副作用は
# 残らない）。`sync_attrs` の属性単位の Result 破棄は本モジュール doc
# 「Update op の DOM 適用」既定の設計判断（ロールバック省略）の踏襲である
# ことを `keyed_dom.rs` 側にも明記し、正当化を強化した。いずれも
# `pub(crate)` 内部変更のみで公開型・公開シグネチャに変更はないため、
# 引き続き同じ「未公開ウィンドウ中の変更相乗り」として 0.4.0 へ吸収させ、
# 追加のバンプは行わない。
#
# イシュー #1373（keyed list 全キー削除の一括 clear 経路化）: 全キー削除
# （保持キー 0 件）の検出時、`diff_keyed_items`（core）を経由した
# `Remove` N 件の逐次適用の代わりに `KeyedListDom::clear_children`（新設、
# 既定実装なし・全実装で実装必須。テキストノード残存を防ぐため既定実装は
# 意図的に設けない〔codex-review P2 是正〕。`keyed_apply.rs`）を 1 回だけ
# 呼ぶ経路を `apply_ops_with_items` へ追加した。`web-sys` 実装
# （`keyed_dom.rs::WebSysKeyedDom::clear_children`）は
# `Node::set_text_content(None)` 1 回で実装し、N 回の `remove_child` 境界
# 呼び出しを 1 回へ集約する（親トラッキング #1371 が実測した O(N) の是正）。
# `pub(crate)` トレイトへのメソッド追加・内部適用アルゴリズムの変更のみで
# 公開型・公開シグネチャに変更はないため、引き続き同じ「未公開ウィンドウ
# 中の変更相乗り」として吸収させ、追加のバンプは行わない（実装時点で
# sparse index を再確認し 0.4.0 が未公開のままであることを確認済み）。
# なお本イシューの実装ブランチが origin/main（イシュー #1375、core の
# keyed diff FxStrMap/FxStrSet 化に伴う 0.4.0 → 0.5.0 バンプ）を取り込んだ
# ことで、実際の吸収先は 0.5.0（本 Cargo.toml の `version` フィールド）へ
# 前進している。0.5.0 も同じく sparse index で未公開を確認済みであり、
# 「未公開ウィンドウ中の変更相乗り」の判断自体は変わらない。
#
# 0.5.0 → 0.5.1（イシュー #1374、PR #1392）: find_child_by_key の sibling
# 走査をキー→Element ハンドルキャッシュ（`keyed_children_cache.rs` 新設、
# tombstone + 遅延一括 compaction）へ統合する src/ 実体変更のため、公開
# クレートの semver バンプ必須条項（`.claude/rules/coding-rust.md`、
# PR #1392 codex-review P1 指摘）に従い patch バンプした。公開 API の
# シグネチャ追加・変更はなく内部実装のみのため patch とする（0.5.1 も
# crates.io 未公開ウィンドウ内）。
#
# 0.5.2 → 0.5.3（イシュー #1382）: `WebSysKeyedDom::sync_attrs`
# （`keyed_dom.rs`）へ属性同値スキップを追加した src/ 実体変更のため、
# 公開クレートの semver バンプ必須条項（`.claude/rules/coding-rust.md`）に
# 従い patch バンプした。公開 API のシグネチャ追加・変更はなく内部実装の
# みのため patch とする（0.5.2 も crates.io 未公開ウィンドウ内）。
#
# 0.5.3 → 0.5.4（イシュー #1384、PR #1398 codex-review P1 指摘）: 依存先
# `fandhe-frontend-core` 0.4.2 バンプ（keyed list アイテムの構造同型判定・
# 束縛点パス導出、本 Cargo.toml 直下の依存 version 要求更新）への追随のみで
# 本クレート自体の src/ に変更はないが、`.claude/rules/coding-rust.md` の
# semver バンプ必須条項は Cargo.toml 変更を伴う PR での本クレート自身の
# version バンプも要求するため patch バンプした（0.5.3 も crates.io
# 未公開ウィンドウ内）。
[dependencies]
fandhe-frontend-core = { path = "../core", version = "0.4.3" }
fandhe-frontend-app = { path = "../app", version = "0.2.6" }
fandhe-frontend-interactive = { path = "../interactive", version = "0.2.7" }
wasm-bindgen = "0.2"

# イシュー #345（束縛点更新 + keyed list への置換）で以下 3 feature を追加。
# 新規外部クレート追加ではなく既存 web-sys の feature 追加のみであり、
# `cargo metadata` の総パッケージ数・依存グラフ深さに変化がないことを実測
# 確認済み（PR 本文に記録）。
# - "Text": keyed list 挿入時、`document.create_text_node` の戻り値型
#   （`build_element`、`keyed_dom.rs`）。
# - "HtmlInputElement": `data-bind-attr="value:..."` の value プロパティ同期
#   （`apply_one`、`binding_dom.rs`）。`wasm-full` と同一 feature。
#
# イシュー #1319: `WebSysKeyedDom::child_at`（`keyed_dom.rs`）は
# `first_element_child`/`next_element_sibling`（いずれも下記既存 feature の
# 範囲内）のみで独自の `(key, Element)` `Vec` キャッシュを構築・維持する
# 設計（codex-review 指摘対応、`keyed_dom.rs` の `WebSysKeyedDom` doc
# 参照）であり、`Element::children()`/`HtmlCollection` を製品面では
# 呼ばない。このため `HtmlCollection` feature を製品面へ追加する必要は
# なく（dev-dependencies.web-sys 側は既存のブラウザテスト用途のまま）、
# 新規外部クレート追加・feature 追加のいずれも発生していない。
#
# イシュー #1320（連続 Insert 区間の DocumentFragment 集約）: 新規構築
# ノードが 2 件以上連続する `Insert` 区間を `Document::create_document_fragment()`
# で構築した `DocumentFragment` へまとめてから 1 回の `insert_before` で
# 実 DOM へ適用する（`keyed_dom.rs` の `WebSysKeyedDom::insert_before_batch`
# 参照）。既存 web-sys への feature 追加のみであり新規外部クレート追加
# ではない。`cargo metadata` 実測: パッケージ総数・依存グラフ深さとも
# feature 追加前後で不変（PR 本文に記録）。
#
# イシュー #1324: `KeyedOp::Update`（内容だけが変わった保持アイテム）の
# 属性同期（`WebSysKeyedDom::sync_attrs`、`keyed_dom.rs`）が、新しい属性
# 集合に無くなった既存属性を検出するために `Element::attributes()`
# （`NamedNodeMap`・各エントリ `Attr`）を読む。新規外部クレート追加では
# なく既存 web-sys の feature 追加のみ（`cargo metadata` の総パッケージ数・
# 依存グラフ深さに変化がないことを実測確認、PR 本文に記録）。
#
# イシュー #1381: `KeyedOp::Update` 適用の子ノード最小差分化（per-child
# diff エンジン、`keyed_apply.rs::diff_children`）が、Text ノードの
# `CharacterData.data` を直接代入・読み取りするために `CharacterData`
# feature を追加する（`WebSysKeyedDom` の `ChildNodeDom` 実装、
# `keyed_dom.rs`）。新規外部クレート追加ではなく既存 web-sys の feature
# 追加のみ。
[dependencies.web-sys]
version = "0.3"
features = [
  "CharacterData",
  "Document",
  "DocumentFragment",
  "Element",
  "Event",
  "EventTarget",
  "HtmlInputElement",
  "Node",
  "NodeList",
  "Text",
  "Window",
  "DomTokenList",
  "console",
  "NamedNodeMap",
  "Attr",
]

[lib]
crate-type = ["cdylib", "rlib"]

# イシュー #345: `wasm-full`（`entry.rs`）が独自に `#[wasm_bindgen] pub fn
# hydrate`/`mount` をエクスポートするため、本クレートの REQ-6 デモ用
# エクスポート（`hydrate`/`mount_csr`）と同一 wasm バイナリへリンクすると
# `wasm-bindgen` の "describe" シンボル（クレート非依存の関数名ベース）が
# 重複してリンクエラーになる。`wasm-full` は `default-features = false` で
# 依存し、本クレート単体利用者（既定）には影響を与えない
# （`wasm-client/src/lib.rs` の `wiring` モジュール doc 参照）。
[features]
default = ["wasm-bindgen-exports"]
wasm-bindgen-exports = []

# TASK-6.2c（#49）: CI の browser-test ジョブ（.github/workflows/ci.yml）が
# 本クレート新設と同時に `wasm-pack test --headless --chrome crates/wasm-client` を
# 自動実行するため（存在ガード解除）、最小スモークテスト
# （tests/hydrate_smoke.rs）に必要な dev 依存。`wasm-full`（#65 と同一運用）と
# 同一バージョンを指定する。
[dev-dependencies]
wasm-bindgen-test = "0.3"

# `tests/timer_browser.rs`（イシュー #1121）の `sleep` ヘルパーが
# `setTimeout` の解決を非同期に待つために使う。`wasm-full/Cargo.toml`
# （headless_timer_browser.rs 系）と同一バージョンを指定する。`js-sys` は
# 既に `wasm-bindgen`/`web-sys` の推移依存として `Cargo.lock` に解決済み
# のため、本クレートの直接 dev-dependency 化で新規パッケージのダウンロード
# は発生しない（`wasm-bindgen-futures` はワークスペース内で `wasm-full` が
# 既に使用しているバージョンと同一を指定する）。dev-dependency のみの追加
# であり、標準サーバー構成の依存グラフ上限（REQ-3・60 件/深さ 6）には
# 算入されない。
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

# 三モード（SSR/SSG/CSR）整合テスト（wasm-client/tests/three_mode_integration.rs、
# イシュー #375）専用の dev-dependency。ワークスペース内 path 依存かつ
# fandhe-frontend-server 自体は外部依存ゼロ（server/Cargo.toml 参照）のため、新規外部
# パッケージの追加はゼロ（REQ-3、`cargo metadata` 実測を PR 本文に記録）。
# native (host) ターゲットのみのテストで使うため target.'cfg(not(target_arch = "wasm32"))'
# の記法は使わず、通常の dev-dependencies に置く（wasm32 ビルドでは
# integration test バイナリ自体を wasm-pack が実行しないため実害はない）。
fandhe-frontend-server = { path = "../server" }

# 合成 DOM 構築（テスト専用）に必要な追加 feature。製品面の
# [dependencies.web-sys] の features には触れず、テスト専用の feature 拡張に
# 閉じる（`wasm-full/Cargo.toml` の dev-dependencies.web-sys と同じ方針）。
# `HtmlElement` は `Document::body()` の戻り値型、`EventInit` は合成 click
# イベント（`bubbles: true`）の組み立てに必要。`HtmlCollection` は #343 の
# ブラウザテスト（`binding_browser.rs`）が `Element::children()` で
# 「要素子が生成されていないこと」（受け入れ条件 2、innerHTML 不使用の
# 回帰固定）を検証するために必要。
#
# イシュー #1382（`sync_attrs` への属性同値スキップ追加）: `keyed_dom.rs`
# の `mod tests` が `MutationObserver`（`attributes: true` + 同期
# `takeRecords()`）で「不変属性へ `set_attribute` が呼ばれないこと」
# （受け入れ条件 1）を直接証明するために必要。`crates/wasm-full` の
# `headless_avatar_browser.rs` で同型の同値 `setAttribute` でも mutation
# record が発火する仕様の利用実績あり。既存 web-sys への feature 追加の
# みで新規外部パッケージの増加はゼロ（`cargo metadata` 実測をコミットで
# 記録）。
[dev-dependencies.web-sys]
version = "0.3"
features = [
  "HtmlElement",
  "EventInit",
  "HtmlCollection",
  "MutationObserver",
  "MutationObserverInit",
  "MutationRecord",
]

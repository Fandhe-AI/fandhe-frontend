# 旧 URL 互換のリダイレクト宣言（イシュー #1016）。
#
# `crates/docs-site/src/redirect.rs` がパース・`site/nav.toml` との突合
# 検証（`to` の実在確認・`from` の衝突検証）を行い、`meta refresh` +
# `rel=canonical` の案内ページを `from` の URL へ生成する。
#
# スキーマ（`[[redirect]]` の array-of-tables、1 件につき 2 キー）:
#   from = "/旧パス/"  # `/` 始まり・`/` 終わり、空セグメント禁止、
#                      # セグメントは英数字・`-`・`_` のみ
#   to   = "/移転先パス/"  # 同上の形式。`site/nav.toml` に実在する
#                          # `page.path` を指すこと（実在しない場合は
#                          # ビルド失敗、`RedirectError::UnknownTarget`）
#
# `from` は `site/nav.toml` の既存ページ path と衝突してはならない
# （衝突する場合はビルド失敗、`RedirectError::CollidesWithPage`）。
#
# 実宣言は現在 112 件（予防的移転案内 1 + 索引ページ移設 1 +
# 部品ページ移行 110（#1017 の 107 + #1683 で追加した collapsible 1 +
# #1685 で追加した field 1 + #1687 で追加した fieldset 1））。
# #1018 で索引ページを `/components/pre-styled-ui/` から `/themes/` へ
# 移設し、旧索引 URL 自体のリダイレクトを追加した（残り 1 件のスコープを
# 完了）。`/components/collapsible/`・`/components/field/`・
# `/components/fieldset/` は #1017 の一括移行時点では存在しなかった URL
# だが、`/components/`（索引ページ）と同じ「未提供 URL への予防的移転案内」
# として #1683/#1685/#1687 で Themes ページ新設に合わせ追加した。

[[redirect]]
# `/components/` は現時点で `site/nav.toml` に該当 `path` が無く 404 になる
# URL であり、`/themes/`（Themes セクション索引）への移転案内として有用。
# #1018 で索引ページの実体パスが `/components/pre-styled-ui/` から
# `/themes/` へ変わったため `to` を追随させた。
from = "/components/"
to = "/themes/"

[[redirect]]
# #1018 で索引ページ本体を /components/pre-styled-ui/ から /themes/ へ
# 移設したことに伴う旧 URL 互換リダイレクト（索引ページ自体の移転案内）。
from = "/components/pre-styled-ui/"
to = "/themes/"

# 以下 110 件はイシュー #1017（既存 107 部品ページを /components/ から
# /themes/ へ移行）の実宣言 + #1683 で追加した collapsible 1 件 + #1685 で
# 追加した field 1 件 + #1687 で追加した fieldset 1 件。生成コマンドは
# nav.toml 更新後そのまま実行すれば 110 件を出力する（決定的・レビュー可能）:
#
#   git show HEAD:site/nav.toml | grep -o 'source = "site/themes/[^"]*"' \
#     | sed 's|.*site/themes/||; s|\.md"||' | sort \
#     | awk '{printf "\n[[redirect]]\nfrom = \"/components/%s/\"\nto = \"/themes/%s/\"\n", $1, $1}'
#
# 対応関係の取り違え（ずれ）は `crates/docs-site/tests/redirects.rs` の
# 双方向テストが fail-closed に検知する（`source` をキーに突合）。


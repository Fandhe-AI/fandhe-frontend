# Blocks セクション（イシュー #2088 / 設計 docs/design/docs-site-blocks-section.md）。
# shadcn/ui Blocks 相当の「既存部品を合成した実例」を掲載するセクション。
# Primitives（粒度: 最小部品）→ Themes（粒度: スタイル済み部品）→ Blocks
# （粒度: 合成例）という読み手の導線を優先し、Themes の直後・API Reference の
# 直前へ配置する（crates/docs-site/tests/primitives_nav.rs が固定する
# 「Primitives は index 3・直後が Themes」を変えないための配置判断でもある）。
# サイドバーのカテゴリ見出し導入（イシュー #2735）に伴い、
# `[[section.group]]`（カテゴリ見出し）+ `[[section.group.page]]`（各 block）
# の構成へ変更した。索引ページ（`/blocks/`）本体のみ `[[section.page]]` の
# ままとする（カテゴリに属さないため）。旧来の「`[[section.group]]` は
# 使わずフラット構成」という設計文書 §6 の判断（1 block = 1 ページのみで
# 階層化する動機がない）は、カテゴリ数の増加に伴いサイドバーの可読性向上
# のため本イシューで見直された。
[[section]]
title = "Blocks"
index_path = "/blocks/"

[[section.page]]
title = "Blocks 一覧"
source = "site/blocks.md"
path = "/blocks/"

# サイドバーのカテゴリ見出し（イシュー #2735）。
# `crates/docs-site/src/blocks/category.rs::BlockCategory` を分類元とし、
# `BlockCategory::ALL` の宣言順のうち 1 件以上 block を持つカテゴリのみを
# グループとして列挙する（グループ順序は `BlockCategory::ALL` 順）。
# グループ内のページ順序は宣言順ではなく `path` 昇順とする（並列 PR による
# `crate::blocks::BLOCKS` への追記順は安定しないため。索引ページ本文
# 〔`index_generated_sections`、イシュー #2733〕と同じ判断）。
# ドリフト検知は `crates/docs-site/tests/blocks_nav.rs` の
# `blocks_section_groups_match_registry_category_order` /
# `blocks_group_pages_match_registry_category_assignments` が担う。


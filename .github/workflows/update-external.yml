name: Update external sources

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 09:00 JST
  workflow_dispatch:
    inputs:
      target:
        description: '更新対象 (手動実行時のみ有効。schedule は常に all)'
        type: choice
        required: false
        default: all
        options:
          - all
          - submodule
          - skill

permissions:
  contents: read

concurrency:
  group: update-external
  cancel-in-progress: false

jobs:
  # --------------------------------------------------
  # submodule 参照の更新 (Fandhe-AI/actions/submodule-update)
  # --------------------------------------------------
  submodule:
    name: Update submodule references
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all", "submodule"]'), inputs.target) }}
    # イシュー #1235（トラッキング #1220）で ubuntu-latest へ移行（in-place、
    # 並走期間なし）。設計判断の正は docs/ci/hosted-runner-migration.md。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        # PAT 未設定時は GITHUB_TOKEN にフォールバック（auto-merge 後の CI 未発火に注意）。
        # persist-credentials を false にしない（意図的差分、#1229 パターンの適用除外）:
        # 本ジョブは Fandhe-AI/actions/submodule-update が git push・PR 作成まで行う
        # 書き込みジョブであり、checkout が構成した認証情報に後続ステップが依存し得る。
        # false にすると push が壊れるため既定（true）を維持する。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # base-branch: main と整合させる。workflow_dispatch で main 以外の
          # ブランチから手動実行されても、更新 PR には main のツリーのみを焼き込む。
          ref: main
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SUBMODULE_PAT || secrets.GITHUB_TOKEN }}

      - name: Update submodules and open PR
        # Fandhe-AI/actions はタグ未作成のため最新コミット SHA に固定する。
        uses: Fandhe-AI/actions/submodule-update@fed9c07d98367f77e5e2b63bca38843f46feee96 # main
        with:
          token: ${{ secrets.SUBMODULE_PAT || secrets.GITHUB_TOKEN }}
          base-branch: main
          branch-prefix: chore/submodule-update
          commit-message: 'chore: submodule を最新に更新'
          pr-title: 'chore: submodule を最新に更新'
          pr-labels: 'dependencies,automated'
          # auto-merge の ON/OFF。未設定 (null/空) を有効と解釈する非対称設計のため、
          # 未設定時は明示的に 'false' へフォールバックしオプトイン運用とする。
          auto-merge: ${{ vars.SUBMODULE_AUTO_MERGE || 'false' }}
          auto-merge-allowlist: ${{ vars.SUBMODULE_AUTO_MERGE_ALLOWLIST }}
          auto-merge-strategy: squash

  # --------------------------------------------------
  # Skills の更新 (Fandhe-AI/actions/skills-update)
  # --------------------------------------------------
  skills:
    name: Update agent skills
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["all", "skill"]'), inputs.target) }}
    # イシュー #1235（トラッキング #1220）で ubuntu-latest へ移行（in-place、
    # 並走期間なし）。設計判断の正は docs/ci/hosted-runner-migration.md。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        # PAT 未設定時は GITHUB_TOKEN にフォールバック（auto-merge 後の CI 未発火に注意）。
        # persist-credentials を false にしない（意図的差分、#1229 パターンの適用除外）:
        # 本ジョブは Fandhe-AI/actions/skills-update が git push・PR 作成まで行う
        # 書き込みジョブであり、checkout が構成した認証情報に後続ステップが依存し得る。
        # false にすると push が壊れるため既定（true）を維持する。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # base-branch: main と整合させる。workflow_dispatch で main 以外の
          # ブランチから手動実行されても、更新 PR には main のツリーのみを焼き込む。
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SUBMODULE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        # actions/setup-node v7.0.0。skills-update が使う npx skills のため node を固定する。
        # ubuntu-latest にも node はプリインストール済みだが、バージョン固定のため
        # 明示セットアップを維持する（docs/ci/hosted-runner-migration.md §4.2）。
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Update skills and open PR
        # Fandhe-AI/actions はタグ未作成のため最新コミット SHA に固定する。
        uses: Fandhe-AI/actions/skills-update@fed9c07d98367f77e5e2b63bca38843f46feee96 # main
        with:
          token: ${{ secrets.SUBMODULE_PAT || secrets.GITHUB_TOKEN }}
          base-branch: main
          branch-prefix: chore/skills-update
          commit-message: 'chore: エージェントスキルを最新に更新'
          pr-title: 'chore: エージェントスキルを最新に更新'
          pr-labels: 'dependencies,automated'
          # auto-merge の ON/OFF。未設定 (null/空) を有効と解釈する非対称設計のため、
          # 未設定時は明示的に 'false' へフォールバックしオプトイン運用とする。
          auto-merge: ${{ vars.SKILLS_AUTO_MERGE || 'false' }}
          auto-merge-allowlist: ${{ vars.SKILLS_AUTO_MERGE_ALLOWLIST }}
          auto-merge-strategy: squash

# 外部ソース（submodule 参照・エージェントスキル）の自動追従ワークフロー。
#
# 実装本体は Fandhe-AI/actions の reusable workflow `.github/workflows/update-external.yml`
# （Fandhe-AI/agent-cli-skills イシュー #259 で reusable 化）。本ファイルはリポジトリ固有の
# 設定だけを持つ薄い wrapper であり、fail-closed ガード・`persist-credentials`・
# `source-token`・外部 action の pin・Node / skills CLI の版数は共通側で集中管理される。
#
# 移行前は本リポジトリでテンプレートを手管理していた。`.github/workflows/**` は
# skills-update の配布対象外で上流の強化が届かないため、乖離が固定化していた
# （Fandhe-AI/agent-cli-skills イシュー #261）。
#
# 参照の検証記録（2026-10-06 実測）:
# - 参照方式: 可変タグ `latest` で参照する。`latest` は上流 main への push のたびに
#   `move-latest-tag.yml` が付け替える。組織方針（2026-08-18 のオーナー判断で SHA 固定から
#   移行）であり、`ci.yml` の `Fandhe-AI/actions/*@latest` と同じ扱い。Dependabot の追従対象外で、
#   上流 main の変更が即座に反映されるため、入力契約が変わったときは本記録を手で更新する
# - 到達性・コミット: 実測時点の `latest` は `5f74f86`（上流 main の tip）。
#   `submodule-force-checkout`（Fandhe-AI/actions #153/#154、PR #155/#156）を含む
# - 入力契約: `@latest` の `.github/workflows/update-external.yml` を contents API で取得し
#   `on.workflow_call` を確認。inputs 13 件（target / runner-json / base-branch /
#   enable-submodule / submodule-force-checkout / enable-skills /
#   submodule-auto-merge{,-allowlist} / skills-auto-merge{,-allowlist} /
#   submodule-close-superseded / skills-close-superseded / skills）・secrets 2 件
#   （SUBMODULE_PAT / SKILLS_PAT）で、いずれも required: false。本ファイルの with / secrets が
#   この契約の範囲内であることを照合した。未知の入力名は警告だけで素通りするため、綴りは
#   上流ファイルと突き合わせて確認する
# - 権限: 呼び出し先ジョブの permissions は validate-inputs `{}`・submodule / skills が
#   `contents: read`。reusable workflow の権限は呼び出し側以下である必要があり、本ファイルの
#   `permissions: contents: read` で充足する
# - 実行時間上限: 呼び出し先ジョブは validate-inputs 5 分・submodule 10 分・skills 15 分の
#   `timeout-minutes` を持つ。reusable workflow を呼ぶジョブ自身には
#   `timeout-minutes` を設定できないため、上限は上流のこの契約で担保される
#
# runner 選択の根拠（移行前ファイルから引き継ぎ）:
# 「イシュー #1235（トラッキング #1220）で ubuntu-latest へ移行（in-place、並走期間なし）。設計判断の正は
# docs/ci/hosted-runner-migration.md。」— 両ジョブの runs-on 直上に記載
# setup-node ステップの「ubuntu-latest にも node
# はプリインストール済みだが、バージョン固定のため明示セットアップを維持する（docs/ci/hosted-runner-migration.md §4.2）。」

name: Update external sources

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 09:00 JST
  workflow_dispatch:
    inputs:
      target:
        description: '更新対象（手動実行時のみ有効。schedule は常に all）'
        type: choice
        required: false
        default: all
        options:
          - all
          - submodule
          - skill

permissions:
  contents: read

# reusable workflow のトップレベル concurrency は機能しないため呼び出し側で設定する
concurrency:
  group: update-external
  cancel-in-progress: false

jobs:
  update-external:
    # 自組織の reusable workflow は可変タグ latest（上流 main へ自動追従）で参照する
    uses: Fandhe-AI/actions/.github/workflows/update-external.yml@latest
    permissions:
      contents: read
    with:
      # schedule 起動では inputs が null になるため all へフォールバックする
      target: ${{ inputs.target || 'all' }}
      # runs-on へ渡す JSON リテラル（素の self-hosted は fromJSON が失敗する）
      runner-json: '"ubuntu-latest"'
      # `.gitmodules` の `update = none`（#3718、匿名 cargo install --git のため）を上書きし、
      # checkout で docs/spec の pin を更新する opt-in 入力（上流 Fandhe-AI/actions #153/#154）。
      # 無いと submodule ジョブは成功のまま何も更新しない no-op になる（#3738）。
      # 上流の仕様で `update = none` を持つ全 submodule が対象になる（現状は docs/spec のみ。
      # pin 固定目的で update = none の submodule を足すときは本設定を見直すこと）。
      # boolean 入力のためクォートしない。
      submodule-force-checkout: true
      # auto-merge はマージ可否を左右する設定のため、組織変数を呼び出し側で解決して渡す。
      # 未設定（null/空）を有効と解釈する composite action の非対称設計に合わせ、
      # 明示的に 'false' へフォールバックしオプトイン運用とする。
      submodule-auto-merge: ${{ vars.SUBMODULE_AUTO_MERGE || 'false' }}
      submodule-auto-merge-allowlist: ${{ vars.SUBMODULE_AUTO_MERGE_ALLOWLIST }}
      skills-auto-merge: ${{ vars.SKILLS_AUTO_MERGE || 'false' }}
      skills-auto-merge-allowlist: ${{ vars.SKILLS_AUTO_MERGE_ALLOWLIST }}
    secrets:
      # 未登録の secret は空文字となり、共通側のガードが checkout 前に fail-closed で止める。
      # SKILLS_PAT 未登録時は共通側が SUBMODULE_PAT へフォールバックする。
      SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
      SKILLS_PAT: ${{ secrets.SKILLS_PAT }}

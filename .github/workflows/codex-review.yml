# Fandhe-AI/actions の codex-review reusable workflow を呼び出す薄い wrapper。
# 導入経緯: イシュー #1275（親トラッキング #1272）。Fandhe-AI/actions#31（README 整備）・
# #32（ホステッドランナー既定リポジトリへの適用方針整理）は完了済みであり、同リポジトリの
# 公開 public テンプレート（codex-review/templates/codex-review.public.yml）をそのまま導入する。
# 導入手順・runner 要件は Fandhe-AI/actions の codex-review/README.md「セットアップ」を参照。
name: Codex PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# reusable workflow のトップレベル concurrency は機能しないため呼び出し側で設定する
concurrency:
  group: codex-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codex-review:
    # SHA はコミットハッシュで固定する（@main 不可、サプライチェーン対策）。
    # 固定 SHA 時点の reusable workflow 本体は導入時にレビュー済み（fork PR 拒否・
    # sudo 不在の fail-closed 検証・base コミット参照・資格情報スキャン・2 ジョブ分離）
    uses: Fandhe-AI/actions/.github/workflows/codex-review.yml@latest
    permissions:
      contents: read
      pull-requests: write
    # codex ジョブは runner-label（既定値 codex）のまま、self-hosted な codex 専用 runner を
    # 使う。本リポジトリの CI 方針（.claude/rules/ci.md、GitHub ホステッドランナー既定）に
    # おいて認められた唯一の例外である（ユーザー承認済み 2026-08-07）。fork PR では
    # reusable workflow 側の if 条件が fail-closed で実行を拒否するため、untrusted コードが
    # self-hosted runner 上で実行されることはない。本ファイルの非コメント行に
    # `self-hosted` の文字列は現れない（runner-label は既定値経由で参照するのみ）ため、
    # `crates/xtask/tests/workflow_runner_policy.rs` の機械強制と両立する。この例外の
    # 規約側への反映（.claude/rules/ci.md への追記）はイシュー #1276 で行う。ここでは指定しない。
    with:
      # update-external.yml が生成する日次同期 PR は上流の取り込みそのもので、
      # codex の指摘があってもこの PR では直せない（修正先は取り込み元の上流リポジトリ）。
      # 判定はブランチ名の接頭辞のみで行うため、push できる主体は該当接頭辞の
      # ブランチで gate を回避できる（受容済み残留リスク。第三者の write
      # コラボレーターがいる場合は指定しないこと）。接頭辞は自動生成 PR 専用の
      # 十分に限定的な値にする（区切り文字の "-" まで含める）。
      skip-branch-prefixes: chore/skills-update-,chore/submodule-update-
      # post-feedback-runner-label の既定値は self-hosted であり、public リポジトリの
      # ホステッドランナー既定方針に反する。コメント投稿ジョブは資格情報に触れないため
      # 必ず ubuntu-latest（GitHub ホステッド）を明示する。
      # 詳細は Fandhe-AI/actions の docs/runner-policy.md「3. 例外: codex-review」を参照。
      post-feedback-runner-label: ubuntu-latest

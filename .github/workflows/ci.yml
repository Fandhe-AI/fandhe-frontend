name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# wasm ツール（wasm-bindgen-cli / wasm-pack）の pin の正（単一宣言点、イシュー #1274）。
# 各ジョブの導入ステップは Fandhe-AI/actions/wasm-tool-install（full commit SHA 固定）を
# 呼び出し、ここで宣言した値を with: 経由でのみ注入する（with: へのリテラル直書きは
# pin の二重管理を再発させるため禁止。crates/xtask/tests/wasm_bindgen_version_sync.rs が
# env コンテキスト参照のみであることを fail-closed に検証する）。
# wasm-bindgen-cli は crates/dist-server/build.rs の expected_wasm_bindgen_version が
# Cargo.lock 解決済み wasm-bindgen クレートとの完全一致を要求するため、バンプ時は
# Cargo.lock と本ブロック（VERSION / SHA256 の両方）を合わせて更新すること。
# ドリフトは同テストが fail-closed に検知する。
env:
  WASM_BINDGEN_VERSION: "0.2.126"
  WASM_BINDGEN_SHA256: "064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d"
  WASM_PACK_VERSION: "0.13.1"
  WASM_PACK_SHA256: "c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539"

jobs:
  # TASK-2.1 (REQ-2): コアクレートの unsafe 不使用を機械的に強制するジョブ。
  # 一次防御 = #![forbid(unsafe_code)] 属性（ビルド時 lint、削除は下記テストが検知）
  # 二次防御 = crates/core/tests/unsafe_boundary.rs（属性の実在・unsafe トークン不在・core 外部依存ゼロ）
  # 三次防御 = 本ジョブの RUSTFLAGS='-F unsafe_code' による cargo check（属性とテストが
  # 同時に外された場合でも、コマンドラインからの forbid はソース側の allow で上書きできない）
  #
  # #155 (REQ-11 受け入れ基準 2): 上記の safe 域（crates/core/interactive 等、forbid 採用）に加え、
  # `wasm-full`（deny 採用。#[wasm_bindgen] 展開コードの内部 unsafe と衝突するため forbid 不採用）
  # のアプリロジック層（自作コード）にも forbid 相当の CI 強制を適用する。実体は下記
  # `cargo test -p fandhe-frontend-core --test unsafe_boundary` に含まれる `ffi_deny_crates_*` テスト
  # （crates/core/tests/unsafe_boundary.rs の DENY_UNSAFE_FFI_MEMBERS）であり、本ジョブ自体に
  # 追加のステップは不要（deny 域は `RUSTFLAGS='-F unsafe_code'` 適用外のまま、
  # wasm-bindgen 展開コードの unsafe との衝突を避ける）。
  # UNSAFE_ALLOWED_MEMBERS（crates/wasm-client/wasm-thin）は引き続きスコープ外（#155 参照）。
  #
  # ファイル名は汎用の ci.yml とし、ジョブ名を目的特化の forbid-unsafe とする。
  # 後続の CI 系タスク（fmt/clippy・依存グラフ計測等）は同一ファイルへ
  # ジョブを追加していく前提の拡張可能な構成とする。
  forbid-unsafe:
    name: Forbid unsafe in core crates (+ wasm-full deny boundary)
    # ホステッドランナー移行（トラッキング #1220、実装 #1228）: public リポジトリの
    # 標準ホステッドランナーは無料・分数消費なしのため既定とする（.claude/rules/ci.md）。
    runs-on: ubuntu-latest
    # ジョブごとに使い捨てのクリーン VM となり共有 CARGO_TARGET_DIR のキャッシュが
    # 消失するため、フルクリーンビルド（`cargo check --workspace` + cli e2e を含む
    # `cargo test --workspace`）の余裕を見込む（test ジョブと同値、実測後に調整）。
    timeout-minutes: 60
    # TASK-10.2b（#110）: crates/dist-server/build.rs は既定で WASM ビルドステージ
    # （ネスト cargo build + wasm-bindgen）を実行するが、本ジョブは
    # (a) ホステッドランナーのクリーン VM には wasm32 target・wasm-bindgen-cli を
    #     導入していないため、(b) 下記 `RUSTFLAGS='-F unsafe_code'` を
    #     ネストビルドへ伝播させたくない（wasm-bindgen/web-sys の FFI 境界が
    #     正当に使う unsafe と衝突する）ため、本ジョブに限り明示オプトアウトする。
    # 統合ビルドの実証は `test` ジョブが担う。
    env:
      FANDHE_FRONTEND_WASM_BUILD: "0"
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（update-external.yml と同一 SHA に固定）
        # docs/spec サブモジュールはテストに不要のため取得しない（既定で submodules: false）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定: ホステッドランナーはジョブごとに
        # 初期化されたクリーン VM のため、Checkout 直後に毎回 toolchain を導入する
        # （test ジョブと同型、イシュー #1228）。
        uses: Fandhe-AI/actions/rust-toolchain-setup@5982e2f502a19effc36a7b161660b5a4ea17b886

      - name: Show toolchain
        run: rustup show && cargo --version

      - name: "guard: 共有 CARGO_TARGET_DIR の無ハッシュ cdylib rlib を除去（イシュー #1192）"
        # cdylib+rlib クレート（wasm-thin/wasm-full/wasm-client）の rlib は
        # メタデータハッシュサフィックスなしの固定ファイル名で出力される
        # （cdylib の動的ライブラリ名を安定させる cargo の仕様）。共有
        # CARGO_TARGET_DIR（旧 self-hosted runner 既定の /cargo-target）上では
        # release.yml の `cargo publish --dry-run`/`cargo publish`（packaged
        # コピーを registry 版依存でビルドする）がこの無ハッシュ rlib を
        # registry 依存内容で上書きし得る。後続のワークスペースビルドが
        # fingerprint fresh 判定で汚染済み rlib をそのままリンクすると
        # 「multiple different versions of crate `fandhe_frontend_interactive`」
        # （E0277/E0599）の flaky を引き起こす（PR #1164/#1180/#1186/#1187 で
        # 観測、根本原因はイシュー #1192 コメント参照）。固定ファイル名のみを
        # 削除すれば cargo が当該ユニットを再ビルドし常に正しい内容へ
        # 自己修復する（glob・再帰削除は行わない）。ホステッドランナーでは
        # CARGO_TARGET_DIR が未設定のため下記条件分岐により no-op となるが、
        # ローカル開発・将来の actions/cache 等によるキャッシュ再利用時の
        # 多層防御として残置する（#1192 契約テスト
        # workflow_shared_target_contract.rs が本ステップの存在を fail-closed
        # に要求する。test ジョブの同名ステップと同型、イシュー #1228）。
        run: |
          set -euo pipefail
          if [ -n "${CARGO_TARGET_DIR:-}" ] && [ -d "${CARGO_TARGET_DIR}/debug/deps" ]; then
            rm -f \
              "${CARGO_TARGET_DIR}/debug/deps/libfandhe_frontend_wasm_thin.rlib" \
              "${CARGO_TARGET_DIR}/debug/deps/libfandhe_frontend_wasm_thin.so" \
              "${CARGO_TARGET_DIR}/debug/deps/fandhe_frontend_wasm_thin.d" \
              "${CARGO_TARGET_DIR}/debug/deps/libfandhe_frontend_wasm_full.rlib" \
              "${CARGO_TARGET_DIR}/debug/deps/libfandhe_frontend_wasm_full.so" \
              "${CARGO_TARGET_DIR}/debug/deps/fandhe_frontend_wasm_full.d" \
              "${CARGO_TARGET_DIR}/debug/deps/libfandhe_frontend_wasm_client.rlib" \
              "${CARGO_TARGET_DIR}/debug/deps/libfandhe_frontend_wasm_client.so" \
              "${CARGO_TARGET_DIR}/debug/deps/fandhe_frontend_wasm_client.d"
          fi

      - name: Install cargo-deny / clippy component (ensure-gate-tools.sh)
        # 本ジョブ末尾の `cargo test --workspace` は negative_cases.rs（fw gate
        # の lint / policy チェック）を含むため、test ジョブと同様に clippy
        # component / cargo-deny のブートストラップが必要（イシュー #292 の
        # 標準ブートストラップ、ci.md 参照）。前置がないと runner の導入状態
        # 次第で baseline_fixture_passes_core_checks が間欠的に BLOCKED → FAIL
        # になる（PR #332 の CI で実際に発生）。
        run: tools/ci/ensure-gate-tools.sh

      - name: "unsafe 境界の回帰テスト（safe 域: forbid 属性・unsafe トークン・core 依存ゼロ／wasm-full deny 域: deny 属性・unsafe トークン・allow 上書き不在、#155）"
        run: cargo test -p fandhe-frontend-core --test unsafe_boundary --locked

      # NOTE: -F (forbid) はソース側の #[allow(unsafe_code)] で上書きできないため、
      # 属性が誤って削除された場合の独立した防御線になる。
      # crates/wasm-client/wasm-full/wasm-thin は #![deny(unsafe_code)] 採用クレートだが、
      # native（このステップのデフォルトターゲット）ビルドでは各クレートの
      # #[cfg(target_arch = "wasm32")] ゲート配下（wasm-full の entry/Runtime/
      # dom::paint 等、#[wasm_bindgen] 展開を含む箇所）がコンパイル対象から
      # 外れるため、`-F unsafe_code` を付けた `cargo check --workspace` は
      # 実測どおり workspace 全体（wasm 系クレートを含む）で成功する
      # （wasm32 ターゲット向けに同様のチェックを行うと wasm_bindgen 展開の
      # unsafe と衝突して失敗するため、このステップは意図的に native のみ）。
      # wasm32 ゲート配下の自作コードに対する forbid 相当の強制は、native の
      # 本ステップではなく上記のソーステキスト走査テスト（DENY_UNSAFE_FFI_MEMBERS）
      # が担う。クレート追加時は crates/core/tests/unsafe_boundary.rs の
      # UNSAFE_ALLOWED_MEMBERS / DENY_UNSAFE_FFI_MEMBERS と同期して更新すること。
      - name: ビルド時 lint による強制（属性とテストの双方が同時に外された場合の三重防御）
        run: RUSTFLAGS='-F unsafe_code' cargo check --workspace --locked

      - name: workspace 全テスト（XSS 回帰・エスケープ仕様テストを含む）
        run: cargo test --workspace --locked

  # TASK-1.2b（#10）: XSS 回帰テスト（REQ-1）を含む Rust テスト CI。
  # ユーザー指示（2026-07-18）により self-hosted へ移行。forbid-unsafe ジョブ
  # （deps-check.yml の "Setup Rust toolchain" と同一 SHA 固定・同一目的）と
  # 同じく、workspace テストを実行してクロスプラットフォームの回帰を検知する。
  test:
    name: Rust workspace tests
    # ホステッドランナー移行（トラッキング #1220、実装 #1229）: public リポジトリの
    # 標準ホステッドランナーは無料・分数消費なしのため既定とする（.claude/rules/ci.md）。
    runs-on: ubuntu-latest
    # ジョブごとに使い捨てのクリーン VM となり共有 CARGO_TARGET_DIR のキャッシュが
    # 消失するため、フルクリーンビルド + cli e2e（生成プロジェクトの cargo ビルド込み）+
    # dist-server ネスト WASM ビルド分の余裕を見込む（実測後に調整）。
    timeout-minutes: 60
    steps:
      - name: Checkout
        # actions/checkout v7.0.1。docs/spec/ サブモジュールはテストに不要なため
        # submodules: false でチェックアウト面を最小化する（サプライチェーン対策）。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定: ホステッドランナーはジョブごとに
        # 初期化されたクリーン VM のため、Checkout 直後に毎回 toolchain を導入する。
        uses: Fandhe-AI/actions/rust-toolchain-setup@5982e2f502a19effc36a7b161660b5a4ea17b886

      - name: "guard: 共有 CARGO_TARGET_DIR の無ハッシュ cdylib rlib を除去（イシュー #1192）"
        # forbid-unsafe ジョブの同名ステップと同一（cdylib+rlib クレートの
        # 無ハッシュ rlib が release.yml の検証ビルドで汚染され得ることへの
        # 多層防御。詳細は forbid-unsafe ジョブのステップコメント参照）。
        # ホステッドランナーでは CARGO_TARGET_DIR が未設定のため下記条件分岐により
        # no-op となるが、ローカル開発・将来の actions/cache 等によるキャッシュ再利用
        # 時の多層防御として残置する（#1192 契約テスト workflow_shared_target_contract.rs
        # が本ステップの存在を fail-closed に要求する）。
        # 本ジョブは wasm-thin flaky（PR #1164/#1180/#1186/#1187）の直接の
        # 発生元であり、本ガードが最優先で保護すべきジョブである。
        run: |
          set -euo pipefail
          if [ -n "${CARGO_TARGET_DIR:-}" ] && [ -d "${CARGO_TARGET_DIR}/debug/deps" ]; then
            rm -f \
              "${CARGO_TARGET_DIR}/debug/deps/libfandhe_frontend_wasm_thin.rlib" \
              "${CARGO_TARGET_DIR}/debug/deps/libfandhe_frontend_wasm_thin.so" \
              "${CARGO_TARGET_DIR}/debug/deps/fandhe_frontend_wasm_thin.d" \
              "${CARGO_TARGET_DIR}/debug/deps/libfandhe_frontend_wasm_full.rlib" \
              "${CARGO_TARGET_DIR}/debug/deps/libfandhe_frontend_wasm_full.so" \
              "${CARGO_TARGET_DIR}/debug/deps/fandhe_frontend_wasm_full.d" \
              "${CARGO_TARGET_DIR}/debug/deps/libfandhe_frontend_wasm_client.rlib" \
              "${CARGO_TARGET_DIR}/debug/deps/libfandhe_frontend_wasm_client.so" \
              "${CARGO_TARGET_DIR}/debug/deps/fandhe_frontend_wasm_client.d"
          fi

      - name: XSS regression tests (REQ-1)
        # REQ-1（既定エスケープ）の受け入れ基準を担保するゲート。
        # SSR/SSG/CSR 経路の XSS 回帰テストを独立ステップとして可視化する。
        # headless-ui / pre-styled-ui（イシュー #553）も REQ-1 ゲートとして
        # 独立ステップで可視化する（`cargo test --workspace` の暗黙包含に依存しない）。
        # pre-styled-ui は styled 部品公開 API 経由の回帰（イシュー #607、
        # xss_escape_styled.rs）も独立ファイルとして追加し、両ファイルを実行する。
        run: |
          cargo test -p fandhe-frontend-core --test xss_escape --locked
          cargo test -p fandhe-frontend-headless-ui --test xss_escape --locked
          cargo test -p fandhe-frontend-pre-styled-ui --test xss_escape --test xss_escape_styled --locked

      # TASK-13.3c（#141）: `fw gate`（crates/cli/src/gate.rs）の `policy` チェックは
      # `cargo deny check bans licenses sources` を実際に起動する。cargo-deny
      # 本体が未導入だと `crates/cli/tests/negative_cases.rs` はフォールバック分岐
      # （cargo-deny 起動失敗 → fail-closed で policy failed）しか検証できず、
      # TASK-4.1 の deny.toml と `policy` チェックが実際に接続されている
      # ことを常時実証できない。ここでバージョン固定 + SHA256 チェックサム
      # 検証付きプリビルトバイナリを導入し、以降の `cargo test --workspace`
      # 実行下で strict 分岐（ベースライン PASS・banned 依存検出の具体的な
      # ブロック理由）が実行されるようにする（下記 wasm-bindgen-cli の
      # 導入ステップと同一のサプライチェーン対策パターン、security.md A06）。
      - name: Install cargo-deny / clippy component (ensure-gate-tools.sh)
        # イシュー #292: self-hosted runner プールは clippy component /
        # cargo-deny の導入状態がインスタンスごとに異なり、`fw gate` の
        # `lint` / `policy` チェックが間欠的に BLOCKED になっていた。バージョン
        # 固定 + SHA256 チェックサム検証 + atomic install（旧: 本ステップ直下、
        # PR #291 Bugbot 指摘 BUGBOT_BUG_ID: 1c88c06e / コミット 64ecb28 対応）の
        # ロジックは `tools/ci/ensure-gate-tools.sh` へ一元化し、`fw gate` を
        # ローカル・自己保守フックから直接呼ぶ経路とバージョン pin を共有する
        # （ci.yml 側と二重管理してドリフトさせない）。
        run: tools/ci/ensure-gate-tools.sh

      # TASK-13.3c（#141）: 「連携」の回帰固定そのものを可視化する独立ステップ。
      # 上記で cargo-deny を導入済みの本ジョブでは negative_cases.rs が strict
      # 分岐（cargo-deny 実行・banned 依存の具体的検出）まで実行され、
      # TASK-4.1 deny.toml ↔ `policy` チェックの連携が実証される
      # （cargo-deny 未導入環境向けの fail-closed 分岐は同ファイル側の環境
      # 判定 `cargo_deny_available()` が担保するため、CI では本ステップが
      # strict 側を実行することを以て「常時検証」とする）。あわせて
      # `xss_regression_link.rs` により、`test` チェックが XSS 回帰テスト
      # （TASK-1.2）の合否をそのまま反映し `default_escape_check` とは
      # 独立にゲートを BLOCK することを検証する。
      - name: "Gate linkage tests (TASK-13.3c: cargo-deny / XSS regression)"
        run: cargo test -p fandhe-frontend-cli --test negative_cases --test xss_regression_link --locked

      # イシュー #159（REQ-1、親 #157）の受け入れ条件「偽装回避不能テストが通過し
      # CI でブロックされる」の直接証跡。`raw_html_lint_e2e.rs` は実際に
      # `cargo clippy` を起動し、直接呼び出し・コメント偽装・リネーム import の
      # いずれも `clippy::disallowed_methods` で拒否され、`#[expect(...,
      # reason = "ESCAPE-REVIEWED: ...")]` を付与した呼び出しのみ受理される
      # ことを実証する（詳細は docs/design/raw-html-lint-design.md）。上記ステップの
      # `cargo test --workspace` 実行に暗黙包含されるだけでは受け入れ条件の
      # 充足が CI 上で可視化されないため、本ステップとして独立させる。
      - name: "REQ-1 raw_html() 偽装回避不能テスト (issue #159)"
        run: cargo test -p fandhe-frontend-cli --test raw_html_lint_e2e --locked

      # イシュー #351（親 #338）の受け入れ条件「`fw new` 生成直後に `fw gate`
      # が PASS する構成保証」の直接証跡。`fw new` が展開する
      # `templates/default/` と `fw gate` の前提（`structure.toml` の宣言
      # クレート・`clippy.toml` の disallowed-methods・`deny.toml`）が
      # ドリフトすると生成直後のプロジェクトが無編集で BLOCKED になり得る
      # ため、上記ステップで導入済みの cargo-deny を用いて strict 分岐
      # （7 チェック全 PASS。イシュー #1174 で `lint_wasm32` が追加されたが
      # `templates/default/` は role = "client-entrypoint" を宣言しないため
      # not-applicable PASS で通過する）を本ジョブで常時実証する
      # （`crates/cli/tests/new_gate_e2e.rs` 冒頭コメント参照）。
      #
      # イシュー #895 により本ステップは 3 分割になった（`--skip example_
      # --skip fw_new_app_template` / `fw_new_app_template` / `example_` の
      # 3 フィルタは相補的で `new_gate_e2e.rs` 全件を重複・漏れなく網羅する。
      # `cargo test ... -- --list` で確認済み）。app テンプレート分（#895）と
      # examples 分（#505/#609）を専用ステップへ切り出す理由は各ステップの
      # コメント参照。
      - name: "fw new 生成直後の fw gate PASS 構成保証 (issue #351、examples・app テンプレート除く)"
        run: cargo test -p fandhe-frontend-cli --test new_gate_e2e --locked -- --skip example_ --skip fw_new_app_template

      # イシュー #895: `fw_new_app_template_*` の 2 件（app テンプレート、
      # crates.io バージョン依存で完結する `fw gate` 検証）は、
      # version-bump-guard・`template_vendor_drift`・本ステップの三すくみ
      # （`docs/ci/version-bump-publish-order-gap.md` 参照）により、バンプ先
      # バージョンが crates.io へ未公開の間は必ず fail する構造的デッドロック
      # を抱える（`template-app-wasm-smoke` ジョブ（イシュー #885）と同型）。
      # テスト側（`new_gate_e2e.rs::apply_patch_template_smoke`）が同ジョブと
      # 同じ `xtask patch-template-smoke` を再利用して未公開依存のみへ
      # `[patch.crates-io]` フォールバックを適用するため、本ステップは
      # その発動を「`resolution=path-override` を含む行があれば `::warning::`
      # + Step Summary へ転記」して可視化する（サイレントな弱体化にしない）。
      # 全依存公開済みの通常時はフォールバックが発動せず（ログに
      # `resolution=path-override` が現れない）、crates.io 実解決の検証能力は
      # 不変。
      #
      # `if PIPELINE; then ... fi` の形（`set -euo pipefail` のまま `-e` を
      # 維持）は version-bump-guard ジョブと同型のパターン（`.claude/rules/
      # ci.md` 参照）。テスト自体の失敗（fail-closed の environment error 含む）
      # は `cargo test` の非ゼロ終了として素直に伝播させる。
      - name: "app テンプレート gate e2e (issue #895、patch-template-smoke フォールバック明示)"
        run: |
          set -euo pipefail
          if cargo test -p fandhe-frontend-cli --test new_gate_e2e --locked -- fw_new_app_template --nocapture 2>&1 | tee app-template-gate-e2e.log; then
            if grep -qF 'resolution=path-override' app-template-gate-e2e.log; then
              echo "::warning::app テンプレート gate e2e: 1 件以上の fandhe-frontend-* 依存が crates.io で未解決のため [patch.crates-io] フォールバックが発動した（'resolution=path-override' 行参照）。対応する crates.io 公開（release.yml, mode: publish）が完了するまでの想定内事象である。"
              {
                echo '## app テンプレート gate e2e: patch-template-smoke フォールバック (issue #895)'
                echo '```'
                grep '^template-app-wasm-smoke:' app-template-gate-e2e.log || true
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          if grep -q 'environment error: ' app-template-gate-e2e.log; then
            echo "::error::app テンプレート gate e2e failed: environment error (runner/network 起因、コード起因ではない)。crates.io（https://index.crates.io）への到達性を確認すること。"
          else
            echo "::error::app テンプレート gate e2e failed: コード起因（テンプレート・fw gate 前提のドリフト、または patch-template-smoke 自体の想定外失敗）の可能性が高い。ログを参照すること。"
          fi
          exit 1

      # イシュー #505/#609: examples e2e 5 件（`fw_new_example_*_output_passes_fw_gate`、
      # crates.io 依存の cargo ビルドを伴う `fw gate` 検証）の所要時間を
      # ステップ単位で常時計測可視化する。上の 2 ステップと合わせて
      # `new_gate_e2e.rs` 全件を実行する（3 フィルタが相補的で重複・漏れが
      # ないことは確認済み）。
      #
      # 前提: runner が crates.io（https://index.crates.io・
      # https://static.crates.io）へ到達可能であること（`.claude/rules/ci.md`
      # #412/#493 と同一前提。到達不可は環境エラーとして扱い、テストの
      # 弱体化で対処しない）。
      #
      # 実測（#505 時点、main push run 29824015053）: 4 件合計で数秒
      # （ステップ全体で約 8 秒）であり、ジョブ分離判断基準（+10 分超）に
      # 遠く及ばないため `examples-gate-e2e` ジョブへの分離は行っていない
      # （#609 で 5 件目を追加後も同一判断基準を適用する）。本ステップの
      # 所要時間が恒常的に 10 分超となった場合、`test` ジョブ側は
      # `--skip example_ --skip fw_new_app_template` のみ残し、本ステップの
      # 内容を専用の `examples-gate-e2e` ジョブ（同構成の checkout /
      # rust-toolchain / ensure-gate-tools.sh を前置、runs-on: ubuntu-latest）
      # へ分離することを再検討する。
      - name: "examples gate e2e 5 件の実行と時間計測 (issue #505/#609)"
        run: cargo test -p fandhe-frontend-cli --test new_gate_e2e --locked -- example_

      # TASK-10.2b（#110、REQ-10 条件 3）: crates/dist-server/build.rs が既定で実行する
      # WASM ビルドステージ（ネスト `cargo build --target wasm32-unknown-unknown`
      # + `wasm-bindgen`）に必要なツールチェーンを導入する。本ジョブに限り
      # オプトアウトせず統合ビルドをそのまま実行することで、単一 `cargo build`
      # からネイティブ + WASM 双方の成果物が生成されることを CI で実証する。
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # wasm-bindgen-cli は crates/dist-server/build.rs が Cargo.lock 解決済み
      # wasm-bindgen クレートとのバージョン完全一致を要求する（バージョン
      # 不一致の CLI で生成した JS グルーコードが壊れる既知の制約への対策、
      # `crates/dist-server/build.rs` の expected_wasm_bindgen_version 参照）。
      # ここで固定するバージョンは Cargo.lock の wasm-bindgen と一致させ、
      # バージョンアップ時は両方を合わせて更新すること。
      # バージョン固定 + SHA256 チェックサム検証付きプリビルトバイナリの導入
      # （browser-test/perf-harness ジョブの wasm-pack 導入と同一パターン、
      # サプライチェーン対策）。
      # バージョン固定 + SHA256 検証 + atomic install の実装は
      # Fandhe-AI/actions/wasm-tool-install へ共通化した（イシュー #1274。
      # 旧実装の atomic install 経緯: 複数ジョブが共有 $HOME の同一固定パスへ
      # 並列 install すると部分 install が生じ得る問題への対策、Cursor Bugbot
      # 指摘 BUGBOT_BUG_ID: 1c88c06e、PR #291 / コミット 64ecb28）。pin の正は
      # ワークフロー冒頭の env ブロック。
      - name: Install wasm-bindgen-cli (pinned + checksum-verified, atomic install)
        # Fandhe-AI/actions はタグ未作成のため最新コミット SHA に固定する。
        uses: Fandhe-AI/actions/wasm-tool-install@5982e2f502a19effc36a7b161660b5a4ea17b886 # main
        with:
          tool: wasm-bindgen
          version: ${{ env.WASM_BINDGEN_VERSION }}
          sha256: ${{ env.WASM_BINDGEN_SHA256 }}

      - name: Workspace tests
        run: cargo test --workspace --locked

  # TASK-10.1a（#106）: fandhe-frontend-dist-server の開発 / 本番モード切り替え
  # （`crates/dist-server/src/assets.rs` の `AssetMode`）を CI で両モードとも検証する。
  #
  # 上記 `test` ジョブの `cargo test --workspace` はデフォルトの debug ビルド
  # （= DevFilesystem モード、`static/` からのファイルシステム読み込み経路）
  # のみをカバーする。本ジョブは `--features force-embed` を付与し、debug
  # ビルドのまま Embedded モード（本番相当の埋め込みテーブル検索経路）を
  # 強制して検証する（PoC-4 検証方法 5 の CI 化。`Cargo.toml` の
  # `force-embed` フィーチャーコメント参照）。
  dist-server-embedded-mode:
    name: fandhe-frontend-dist-server embedded mode (force-embed)
    # ホステッドランナー移行（トラッキング #1220、実装 #1231）: public リポジトリの
    # 標準ホステッドランナーは無料・分数消費なしのため既定とする（.claude/rules/ci.md）。
    runs-on: ubuntu-latest
    # クリーン VM でのフルコールドビルド（force-embed フィーチャー込み）を織り込み拡大
    # （実測後に調整、旧 15 分）。
    timeout-minutes: 30
    # TASK-10.2b（#110）: 本ジョブの目的は force-embed フィーチャーによる
    # AssetMode 切り替え検証（static/ 埋め込みテーブル経路）であり、WASM
    # ビルドステージの統合検証は `test` ジョブが専任する。本ジョブは wasm32
    # target・wasm-bindgen-cli を導入しないため、責務分離のためオプトアウトする。
    env:
      FANDHE_FRONTEND_WASM_BUILD: "0"
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（他ジョブと同一 SHA 固定）。
        # docs/spec サブモジュールはテストに不要のため取得しない。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定: ホステッドランナーはジョブごとに
        # 初期化されたクリーン VM のため、Checkout 直後に毎回 toolchain を導入する。
        uses: Fandhe-AI/actions/rust-toolchain-setup@5982e2f502a19effc36a7b161660b5a4ea17b886

      - name: Isolated run acceptance test (REQ-9)
        # TASK-9.2（#98/#99）: REQ-9（単一バイナリ配布）の受け入れ基準
        # 「外部ファイル・Node ランタイム・依存インストールなしで自己完結
        # して動作すること」を固定する `tests/isolated_run.rs` を独立ステップ
        # として可視化する（`docs/reports/isolated-run-acceptance-report.md` 第 3 節
        # 「CI 統合」）。同ファイルは
        # `#![cfg(any(not(debug_assertions), feature = "force-embed"))]` で
        # ゲートされており、本ジョブの `--features force-embed` 下でのみ
        # コンパイル・実行される（下段の全体テストにも含まれるが、受け入れ
        # 基準ゲートであることを CI 上で明示するため独立ステップとして
        # 先に実行する）。
        run: cargo test -p fandhe-frontend-dist-server --test isolated_run --features force-embed --locked

      - name: fandhe-frontend-dist-server tests (force-embed, Embedded mode)
        run: cargo test -p fandhe-frontend-dist-server --features force-embed --locked

  # TASK-6.3a（#65）: 実ブラウザ（headless Chromium）でのハイドレーション検証環境。
  # docs/spec/05-tasks.md TASK-6.3 が指名する wasm-pack test --headless --chrome を
  # ubuntu-latest（Chrome/chromedriver プリインストール済み）で実行するジョブ。
  #
  # crates/wasm-client/（fandhe-frontend-wasm-client）は TASK-6.2b（#48）でクレート新設予定だが本コミット時点
  # では未作成（#48/#49 は open）。本イシューはクレート新設をスコープに含めない
  # （docs/api/hydration-api.md 第 5 節の引き継ぎ表・#48 との責務混線回避のため）。
  # そのため各ステップは check-wasm-client の存在判定結果でガードし、
  # crates/wasm-client/ が存在しない間は環境整備のみ・実行はスキップする。
  # #48/#49 マージ後、後続タスク（TASK-6.3b #66 の hydration_browser.rs 等）が
  # 追加された時点で本ジョブは自動的に有効化される。
  #
  # TASK-11.2d（#77）: 上記と同じ存在ガードパターンで `crates/wasm-full/`
  # （`Runtime::mount`/`hydrate` の実ブラウザ統合テスト、
  # `crates/wasm-full/tests/runtime_browser.rs`）も本ジョブへ同居させる
  # （`docs/design/wasm-full-architecture.md` 第 5 節の引き継ぎ）。xss-wasm-test・
  # perf-harness ジョブ（同じ wasm-full クレートだが対象テストファイルが
  # 異なる）はそのまま独立ジョブとして維持し、変更しない。
  browser-test:
    name: Browser tests (wasm-pack --headless --chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（test ジョブと同一 SHA 固定）。
        # docs/spec サブモジュールはテストに不要のため取得しない。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定。ubuntu-latest（ホステッド
        # ランナー）は stable toolchain を同梱するが、他ジョブとの一貫性・
        # バージョン明示のため引き続き明示セットアップする。
        uses: Fandhe-AI/actions/rust-toolchain-setup@5982e2f502a19effc36a7b161660b5a4ea17b886

      # 前提（ホステッドランナー移行、ユーザー指示 2026-08-07。歴史的経緯:
      # PR #291 以前は本ジョブも ubuntu-latest + ランナー内蔵 chromedriver
      # 明示指定で稼働しており、self-hosted 移行時（PR #291/#305）に
      # Chrome for Testing の個別導入・共有ライブラリの apt-get 自動導入が
      # 追加された。ubuntu-latest は Google Chrome（Stable）と対応バージョン
      # の chromedriver をプリインストール済みで、chromedriver の格納先
      # ディレクトリは `CHROMEWEBDRIVER` 環境変数で公開される
      # （https://github.com/actions/runner-images のツールセット仕様）。
      # ランナーイメージは GitHub が管理する既知のサプライチェーンのため、
      # 未検証バイナリの追加取得は不要になる。バージョン整合だけは
      # イメージ更新の過渡期に崩れ得るため、以下のステップで fail-closed に
      # 検証する（wasm-pack/wasm-bindgen-cli のバージョン固定 + SHA256
      # 検証済みプリビルト導入パターンは本ジョブでも維持する）。
      - name: Verify preinstalled Chrome / chromedriver (version alignment, fail-closed)
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "::error::google-chrome not found on runner image. ubuntu-latest is expected to preinstall Google Chrome (Stable)." >&2
            exit 1
          fi
          if [ -z "${CHROMEWEBDRIVER:-}" ] || [ ! -x "${CHROMEWEBDRIVER}/chromedriver" ]; then
            echo "::error::chromedriver not found at \${CHROMEWEBDRIVER}/chromedriver. ubuntu-latest is expected to preinstall chromedriver and expose CHROMEWEBDRIVER." >&2
            exit 1
          fi

          chrome_version="$(google-chrome --version)"
          chromedriver_version="$("${CHROMEWEBDRIVER}/chromedriver" --version)"
          {
            echo '## browser-test: preinstalled Chrome / chromedriver'
            echo "- google-chrome --version: ${chrome_version}"
            echo "- chromedriver --version: ${chromedriver_version}"
          } >> "$GITHUB_STEP_SUMMARY"

          # メジャーバージョンの数字のみ抽出して突合する（プロトコル不一致に
          # よるセッション確立失敗の予防）。
          chrome_major="$(echo "${chrome_version}" | grep -oE '[0-9]+' | head -1)"
          chromedriver_major="$(echo "${chromedriver_version}" | grep -oE '[0-9]+' | head -1)"
          if [ -z "${chrome_major}" ] || [ -z "${chromedriver_major}" ] || [ "${chrome_major}" != "${chromedriver_major}" ]; then
            echo "::error::Chrome/chromedriver major version mismatch (chrome=${chrome_major:-unknown}, chromedriver=${chromedriver_major:-unknown})." >&2
            exit 1
          fi

          if ! google-chrome --headless --no-sandbox --disable-gpu --dump-dom about:blank >/tmp/chrome-smoke.log 2>&1; then
            echo "::error::google-chrome failed to launch in headless mode." >&2
            cat /tmp/chrome-smoke.log >&2
            exit 1
          fi

      # crates/wasm-client/ ディレクトリ存在ガード（TASK-6.2b #48 完了までの直列化措置）。
      # 未作成の間は後続ステップをすべてスキップし、ジョブは空実行で成功扱いとする。
      - name: Check wasm-client crate existence
        id: check
        run: |
          if [ -f "crates/wasm-client/Cargo.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::crates/wasm-client/ crate not found yet (blocked on TASK-6.2b #48). Skipping browser tests."
          fi

      # crates/wasm-full/ ディレクトリ存在ガード（TASK-11.2d・#77）。wasm-client と
      # 同じ「存在ガードのみで直列化措置とし、未作成時はスキップして空実行で
      # 成功扱いとする」パターンを踏襲する。本コミット時点では
      # crates/wasm-full/tests/runtime_browser.rs（`Runtime::mount`/`hydrate` の実
      # ブラウザ統合テスト）が同一 PR で追加されるため通常は true になるが、
      # 並列進行中の他イシューによる巻き戻り等、想定外の理由でファイルが
      # 存在しない場合でもジョブを失敗させない（`docs/design/wasm-full-architecture.md`
      # 第 5 節が引き継ぐ「browser-test ジョブへの wasm-full 存在ガード追加」）。
      - name: Check wasm-full crate existence
        id: check-wasm-full
        run: |
          if [ -f "crates/wasm-full/Cargo.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::crates/wasm-full/ crate not found. Skipping wasm-full Runtime browser tests."
          fi

      - name: Add wasm32 target
        if: steps.check.outputs.exists == 'true' || steps.check-wasm-full.outputs.exists == 'true'
        run: rustup target add wasm32-unknown-unknown

      # wasm-pack はバージョン固定 + SHA256 チェックサム検証付きで導入する
      # （実行時の chromedriver 自動ダウンロードと同様、未検証バイナリ取得を避けるサプライ
      # チェーン対策）。実装は Fandhe-AI/actions/wasm-tool-install へ
      # 共通化した（イシュー #1274）。pin の正はワークフロー冒頭の env ブロック。
      - name: Install wasm-pack (pinned + checksum-verified)
        if: steps.check.outputs.exists == 'true' || steps.check-wasm-full.outputs.exists == 'true'
        uses: Fandhe-AI/actions/wasm-tool-install@5982e2f502a19effc36a7b161660b5a4ea17b886 # main
        with:
          tool: wasm-pack
          version: ${{ env.WASM_PACK_VERSION }}
          sha256: ${{ env.WASM_PACK_SHA256 }}

      # PR #291 実 CI 実行で判明: `wasm-pack test` は内部で
      # `install::download_prebuilt_or_cargo_install(Tool::WasmBindgen, ...)`
      # を呼び、まず `which("wasm-bindgen")` で PATH 上の実体を探し、見つかれば
      # その「同じディレクトリ」に `wasm-bindgen-test-runner` があるものとして
      # 扱う（wasm-pack `src/install/mod.rs`）。self-hosted はワークスペース /
      # $HOME が job 間で永続するため、`test`/`rebuild-latency`/`bundle-size`
      # ジョブが $HOME/.local/bin へインストールした `wasm-bindgen`（本体のみ）
      # が残っていると、本ジョブはそれを「発見」してしまい、実際には存在しない
      # 隣の `wasm-bindgen-test-runner` を起動しようとして
      # `Error: .../wasm-bindgen-test-runner binary does not exist` で失敗する
      # （ubuntu-latest の使い捨て runner では発生し得なかった、self-hosted の
      # 永続ワークスペース特有の不整合）。ここで `wasm-bindgen` /
      # `wasm-bindgen-test-runner` の両方をこのジョブ内で明示的に上書き導入し、
      # 常に完全な組を揃える（test ジョブと同一バージョン・同一チェックサム）。
      # なお現在はインストール先自体をバージョン付き不変パス
      # （$HOME/.local/share/wasm-bindgen/<version>/）へ変更し、atomic
      # install（Cursor Bugbot 指摘 BUGBOT_BUG_ID: 1c88c06e、PR #291）で並列
      # 実行時の破損も防いでいる（詳細は下記ステップのコメント参照）。
      - name: Install wasm-bindgen-cli (pinned + checksum-verified, provides wasm-bindgen-test-runner)
        if: steps.check.outputs.exists == 'true' || steps.check-wasm-full.outputs.exists == 'true'
        # atomic install（Cursor Bugbot 指摘 BUGBOT_BUG_ID: 1c88c06e、PR #291）:
        # バージョン付き不変パスへ、$HOME と同一ファイルシステム上の一時
        # ディレクトリで検証・展開してから `mv -T`（mv の終了コードには
        # 依存しない。coreutils 9.2 以降の `mv -n` 非ゼロ終了対策、Cursor
        # Bugbot 指摘 High/Medium、コミット 64ecb28 対応）で配置する。詳細は
        # test ジョブの同名ステップのコメント参照。導入実装は
        # Fandhe-AI/actions/wasm-tool-install へ共通化した（イシュー #1274）。
        uses: Fandhe-AI/actions/wasm-tool-install@5982e2f502a19effc36a7b161660b5a4ea17b886 # main
        with:
          tool: wasm-bindgen
          version: ${{ env.WASM_BINDGEN_VERSION }}
          sha256: ${{ env.WASM_BINDGEN_SHA256 }}

      # chromedriver のパスはランナー内蔵品（`CHROMEWEBDRIVER` 環境変数、
      # ubuntu-latest がプリインストール）を使う。wasm-bindgen-test-runner
      # （wasm-pack test の実体）は CHROMEDRIVER 環境変数を読み、指定された
      # バイナリを直接起動する（crates/cli/src/wasm_bindgen_test_runner/
      # headless.rs の Driver::find）。
      - name: Run browser tests (headless Chrome)
        if: steps.check.outputs.exists == 'true'
        run: CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver" wasm-pack test --headless --chrome crates/wasm-client

      # `Runtime::mount`/`Runtime::hydrate` の実ブラウザ統合テスト（TASK-11.2d・
      # #77）。xss-wasm-test/perf-harness ジョブ（同じ wasm-full クレート）とは
      # 対象テストファイルが異なる独立ステップとして本ジョブに同居させる
      # （実装計画 §4-5: browser-test ジョブへの wasm-full 存在ガード追加は
      # 本タスクのスコープと明記されているため、既存の xss-wasm-test/
      # perf-harness ジョブ自体は変更しない）。
      - name: Run wasm-full Runtime browser tests (headless Chrome)
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver" wasm-pack test --headless --chrome crates/wasm-full --test runtime_browser

      # TASK-11.4c（#84、親 #81）: read_hydration_attrs（実 DOM からの
      # data-hydrate-* 属性列挙）の実ブラウザ統合テスト（crates/wasm-full/tests/
      # hydration_browser.rs）。runtime_browser ステップと同じ
      # check-wasm-full 存在ガードを再利用し、新規ガードは追加しない
      # （`docs/api/hydration-state-format.md` 第 6 節が引き継ぐ実ブラウザ検証）。
      - name: Run wasm-full hydration browser tests (headless Chrome)
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver" wasm-pack test --headless --chrome crates/wasm-full --test hydration_browser

      # TASK-CSR-loader（#349、親 #337）: CSR 経路の loader 解決
      # （crates/wasm-full/src/csr.rs）の三モード（SSR/SSG/CSR）表示整合・
      # 固定エラービューの実ブラウザ統合テスト（crates/wasm-full/tests/
      # three_mode_browser.rs）。runtime_browser/hydration_browser ステップと
      # 同じ check-wasm-full 存在ガードを再利用し、新規ガードは追加しない。
      - name: Run wasm-full three-mode browser tests (headless Chrome)
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver" wasm-pack test --headless --chrome crates/wasm-full --test three_mode_browser

      # イシュー #374: クライアント側ルーティング（history API 連携・
      # URL 同期・遷移時 loader 配線）の実ブラウザ統合テスト（crates/wasm-full/tests/
      # nav_browser.rs）。runtime_browser/hydration_browser/three_mode_browser
      # ステップと同じ check-wasm-full 存在ガードを再利用し、新規ガードは
      # 追加しない。
      - name: Run wasm-full nav browser tests (headless Chrome)
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver" wasm-pack test --headless --chrome crates/wasm-full --test nav_browser

      # イシュー #580: headless-ui（fandhe-frontend-headless-ui）dispatch の
      # DOM イベント配線基盤（crates/wasm-full/src/headless.rs）の実ブラウザ
      # 回帰テスト（crates/wasm-full/tests/headless_wiring_browser.rs）。
      # runtime_browser/hydration_browser/three_mode_browser/nav_browser
      # ステップと同じ check-wasm-full 存在ガードを再利用し、新規ガードは
      # 追加しない。
      - name: Run wasm-full headless-ui wiring browser tests (headless Chrome)
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver" wasm-pack test --headless --chrome crates/wasm-full --test headless_wiring_browser

      # イシュー #582（Tabs/Accordion のキーボード操作、親 #581）: `keynav`
      # モジュール（crates/wasm-full/src/keynav.rs）配線層の実ブラウザ統合
      # テスト（crates/wasm-full/tests/keynav_browser.rs）。runtime_browser/
      # hydration_browser/three_mode_browser/nav_browser ステップと同じ
      # check-wasm-full 存在ガードを再利用し、新規ガードは追加しない。
      - name: Run wasm-full keynav browser tests (headless Chrome)
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver" wasm-pack test --headless --chrome crates/wasm-full --test keynav_browser

      # イシュー #585（親 #584）: オーバーレイ共通の閉鎖制御（Escape キー・
      # 外側インタラクション、crates/wasm-full/src/overlay.rs）の実ブラウザ
      # 統合テスト（crates/wasm-full/tests/overlay_close_browser.rs）。
      # runtime_browser/hydration_browser/three_mode_browser/nav_browser
      # ステップと同じ check-wasm-full 存在ガードを再利用し、新規ガードは
      # 追加しない。
      - name: Run wasm-full overlay close browser tests (headless Chrome)
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver" wasm-pack test --headless --chrome crates/wasm-full --test overlay_close_browser

      # イシュー #587（親 #584）: Tooltip の openDelay/closeDelay/interactive
      # （crates/wasm-full/src/tooltip.rs）の実ブラウザ統合テスト
      # （crates/wasm-full/tests/tooltip_delay_browser.rs）。
      # runtime_browser/hydration_browser/three_mode_browser/nav_browser/
      # keynav_browser/overlay_close_browser ステップと同じ check-wasm-full
      # 存在ガードを再利用し、新規ガードは追加しない。
      - name: Run wasm-full tooltip delay browser tests (headless Chrome)
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver" wasm-pack test --headless --chrome crates/wasm-full --test tooltip_delay_browser

      # イシュー #591（親 #520/#542/#543）: Avatar（`fandhe-frontend-headless-ui`
      # `avatar` モジュール）の `load`/`error` イベント検知グルー
      # （crates/wasm-full/src/headless_avatar.rs）の実ブラウザ統合テスト
      # （crates/wasm-full/tests/headless_avatar_browser.rs）。runtime_browser/
      # hydration_browser/three_mode_browser/nav_browser/keynav_browser/
      # overlay_close_browser ステップと同じ check-wasm-full 存在ガードを
      # 再利用し、新規ガードは追加しない。
      - name: Run wasm-full headless avatar browser tests (headless Chrome)
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver" wasm-pack test --headless --chrome crates/wasm-full --test headless_avatar_browser

      # イシュー #586（親 #584）: Dialog のフォーカストラップ・トリガー復帰
      # （crates/wasm-full/src/focus_trap.rs）の実ブラウザ統合テスト
      # （crates/wasm-full/tests/focus_trap_browser.rs）。runtime_browser/
      # hydration_browser/three_mode_browser/nav_browser/keynav_browser/
      # overlay_close_browser ステップと同じ check-wasm-full 存在ガードを
      # 再利用し、新規ガードは追加しない。
      - name: Run wasm-full focus trap browser tests (headless Chrome)
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver" wasm-pack test --headless --chrome crates/wasm-full --test focus_trap_browser

      # イシュー #645（親 #588 残課題）: anchor positioning 配線
      # （crates/wasm-full/src/position.rs）の実ブラウザ統合テスト
      # （crates/wasm-full/tests/position_browser.rs、Popover に加え
      # Menu/Select/Tooltip を対象）。PR #622 でテストファイルは追加済み
      # だったが browser-test ジョブに未登録だったため、本イシューで
      # ステップを新設する。実行時間の増分は date +%s の差分で計測し
      # ::notice でログへ可視化する（#645 受け入れ条件）。他の wasm-full
      # ステップと同じ check-wasm-full 存在ガードを再利用し、新規ガードは
      # 追加しない。
      - name: "Run wasm-full position browser tests (headless Chrome, issue #645)"
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: |
          start_epoch="$(date +%s)"
          CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver" wasm-pack test --headless --chrome crates/wasm-full --test position_browser
          end_epoch="$(date +%s)"
          echo "::notice::position_browser (Popover + Menu/Select/Tooltip, issue #645) took $((end_epoch - start_epoch))s"

  # TASK-8.2b（イシュー #62, REQ-8 受け入れ基準）: 同一文書内更新向け
  # ラッパー関数（`static/view-transitions.js` の `withViewTransition`、
  # TASK-8.2a／イシュー #61）の実効 LOC（コメント・空行を除く）が
  # 10 行以内であることを機械的に強制するジョブ。
  #
  # しきい値運用の原則は deps-check ジョブと同一: しきい値・対象ファイルの正は
  # crates/xtask/src/check_loc.rs の MAX_EFFECTIVE_LOC（10）/ LOC_CHECK_TARGETS 定数のみ。
  # このジョブには緩和用の input・環境変数・continue-on-error を一切設けない
  # （迂回経路を作らない設計。しきい値変更はコード定数の変更 = レビュー必須の PR のみ）。
  #
  # fail-closed: 対象ファイル（static/view-transitions.js）の不在・読み取り失敗も
  # しきい値超過と同様に終了コード 1 として扱う（crates/xtask/src/check_loc.rs 参照）。
  # そのため TASK-8.2a（イシュー #61）のマージ前にこのジョブが実行されると
  # 意図的に FAIL する。
  # TASK-11.5a（#86）: 実ブラウザ性能計測ハーネス（crates/wasm-full/tests/perf_browser.rs）を
  # 実行するジョブ（当初はハーネス自己検証のみのスモーク実行だったが、イシュー
  # #451（採用案 B、2026-07-20 決定）により `--features perf-assert` 付きの
  # しきい値アサーション実行へ移行済み）。TASK-6.3a（#65）の browser-test
  # ジョブと同じ環境構築
  # パターン（wasm32 target・wasm-pack バージョン固定＋チェックサム検証・ランナー
  # 内蔵 chromedriver 明示指定）を踏襲するが、対象クレート（wasm-client と
  # wasm-full）が異なり、browser-test ジョブは TASK-11.2d（#77）が担当する
  # wasm-full 存在ガード追加のスコープであるため、コンフリクトを避けて独立
  # ジョブとして追加する（`docs/ci/perf-browser-harness.md` 引き継ぎ表参照）。
  #
  # 本ジョブは REQ-11 の性能予算（300ms/16ms・16ms 超過率 5% 以下）を
  # `--features perf-assert` 付きで常時アサートする（イシュー #451、採用案 B、
  # 2026-07-20 決定）。実測（`docs/reports/perf-browser-report.md`、2026-07-17）は
  # initial_load mean 0.034〜0.343ms・dom_update p95 0.090〜0.105ms と
  # しきい値に対し約 1000 倍の余裕があり、共有 self-hosted runner の負荷変動を
  # 考慮してもフレークリスクは低いと判断し、PR CI での常時判定を採用した。
  # 統制されたローカル環境での正式計測・`docs/reports/perf-browser-report.md`
  # 更新を伴う計測の位置づけは変更しない（`docs/ci/perf-browser-harness.md`
  # 第 4・6 節参照）。
  #
  # ジョブ `name:` はブランチ保護の required checks に登録されている可能性が
  # あるため、実態変更後も据え置く（`.claude/rules/ci.md` 参照。CI 常時実行の
  # 実態変更はステップ名・コメント・Step Summary 見出しで表す）。
  perf-harness:
    name: Perf browser harness smoke (wasm-pack --headless --chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（他ジョブと同一 SHA 固定）。
        # docs/spec サブモジュールはテストに不要のため取得しない。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定。ubuntu-latest（ホステッド
        # ランナー）は stable toolchain を同梱するが、他ジョブとの一貫性・
        # バージョン明示のため引き続き明示セットアップする。
        uses: Fandhe-AI/actions/rust-toolchain-setup@5982e2f502a19effc36a7b161660b5a4ea17b886

      # 前提（ホステッドランナー移行、ユーザー指示 2026-08-07。browser-test
      # ジョブと同一の理由・同一パターン。歴史的経緯・判断根拠は browser-test
      # ジョブの同名ステップのコメント参照）。ubuntu-latest はプリインストール
      # 済みの Chrome（Stable）・chromedriver をそのまま使い、バージョン
      # 整合のみを fail-closed に検証する。本ジョブが実行するしきい値
      # アサーション（perf-assert、300ms/16ms）は実測約 1000 倍の余裕が
      # あり、ホステッドランナー（2 vCPU 標準スペック）へ移行してもフレーク
      # リスクは低い（`.claude/rules/ci.md` 参照）。
      - name: Verify preinstalled Chrome / chromedriver (version alignment, fail-closed)
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "::error::google-chrome not found on runner image. ubuntu-latest is expected to preinstall Google Chrome (Stable)." >&2
            exit 1
          fi
          if [ -z "${CHROMEWEBDRIVER:-}" ] || [ ! -x "${CHROMEWEBDRIVER}/chromedriver" ]; then
            echo "::error::chromedriver not found at \${CHROMEWEBDRIVER}/chromedriver. ubuntu-latest is expected to preinstall chromedriver and expose CHROMEWEBDRIVER." >&2
            exit 1
          fi

          chrome_version="$(google-chrome --version)"
          chromedriver_version="$("${CHROMEWEBDRIVER}/chromedriver" --version)"
          {
            echo '## perf-harness: preinstalled Chrome / chromedriver'
            echo "- google-chrome --version: ${chrome_version}"
            echo "- chromedriver --version: ${chromedriver_version}"
          } >> "$GITHUB_STEP_SUMMARY"

          chrome_major="$(echo "${chrome_version}" | grep -oE '[0-9]+' | head -1)"
          chromedriver_major="$(echo "${chromedriver_version}" | grep -oE '[0-9]+' | head -1)"
          if [ -z "${chrome_major}" ] || [ -z "${chromedriver_major}" ] || [ "${chrome_major}" != "${chromedriver_major}" ]; then
            echo "::error::Chrome/chromedriver major version mismatch (chrome=${chrome_major:-unknown}, chromedriver=${chromedriver_major:-unknown})." >&2
            exit 1
          fi

          if ! google-chrome --headless --no-sandbox --disable-gpu --dump-dom about:blank >/tmp/chrome-smoke.log 2>&1; then
            echo "::error::google-chrome failed to launch in headless mode." >&2
            cat /tmp/chrome-smoke.log >&2
            exit 1
          fi

      # crates/wasm-full/tests/perf_browser.rs 存在ガード（TASK-6.3a #65 のガード
      # パターン踏襲）。並列実行中の他イシューによる巻き戻り等、想定外の理由で
      # ファイルが存在しない場合でもジョブを失敗させず空実行で成功扱いとする。
      - name: Check perf_browser.rs harness existence
        id: check
        run: |
          if [ -f "crates/wasm-full/tests/perf_browser.rs" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::crates/wasm-full/tests/perf_browser.rs not found. Skipping perf harness smoke run."
          fi

      - name: Add wasm32 target
        if: steps.check.outputs.exists == 'true'
        run: rustup target add wasm32-unknown-unknown

      # wasm-pack はバージョン固定 + SHA256 チェックサム検証付きで導入する
      # （browser-test ジョブと同一バージョン・同一チェックサム。実行時の
      # chromedriver 自動ダウンロードと同様、未検証バイナリ取得を避ける
      # サプライチェーン対策）。実装は Fandhe-AI/actions/wasm-tool-install へ
      # 共通化した（イシュー #1274）。pin の正はワークフロー冒頭の env ブロック。
      - name: Install wasm-pack (pinned + checksum-verified)
        if: steps.check.outputs.exists == 'true'
        uses: Fandhe-AI/actions/wasm-tool-install@5982e2f502a19effc36a7b161660b5a4ea17b886 # main
        with:
          tool: wasm-pack
          version: ${{ env.WASM_PACK_VERSION }}
          sha256: ${{ env.WASM_PACK_SHA256 }}

      # browser-test ジョブと同一の理由（PR #291 実 CI 実行で判明: self-hosted の
      # 永続 $HOME に他ジョブが残した不完全な wasm-bindgen 導入を誤検出する
      # 問題への対策。詳細は browser-test ジョブの同名ステップのコメント参照）。
      # 導入実装は Fandhe-AI/actions/wasm-tool-install へ共通化した（イシュー #1274）。
      - name: Install wasm-bindgen-cli (pinned + checksum-verified, provides wasm-bindgen-test-runner)
        if: steps.check.outputs.exists == 'true'
        uses: Fandhe-AI/actions/wasm-tool-install@5982e2f502a19effc36a7b161660b5a4ea17b886 # main
        with:
          tool: wasm-bindgen
          version: ${{ env.WASM_BINDGEN_VERSION }}
          sha256: ${{ env.WASM_BINDGEN_SHA256 }}

      # chromedriver のパスはランナー内蔵品（`CHROMEWEBDRIVER` 環境変数）を
      # 使う（browser-test ジョブと同一の理由）。
      # `-- --nocapture` を付与しないと、テストが成功した場合に libtest が
      # console 出力（`perf-browser:` サマリ行）を握りつぶすため、次ステップの
      # 転記が常に「no summary line found」になる（出力契約が成立しない）。
      - name: "Run perf harness with perf-assert thresholds (headless Chrome, issue #451)"
        if: steps.check.outputs.exists == 'true'
        run: |
          set -o pipefail
          CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver" wasm-pack test --headless --chrome crates/wasm-full --test perf_browser --features perf-assert -- --nocapture 2>&1 | tee perf-harness.log

      - name: Publish perf-harness summary
        if: always() && steps.check.outputs.exists == 'true'
        # perf_browser.rs の 1 行サマリ契約
        # 「perf-browser: metric=<name> samples=<n> mean_ms=<x> p95_ms=<x> max_ms=<x>」を
        # Step Summary に転記する（loc-check ジョブのパターン踏襲）。この契約は
        # perf_browser.rs 内の format_summary_line テストで固定される。
        # `--features perf-assert` により、この summary 転記の前段でしきい値
        # （300ms/16ms・超過率 5%）を満たさない場合は本ステップに到達する前に
        # 実行コマンドが非ゼロ終了しジョブが FAIL する（イシュー #451）。
        run: |
          {
            echo '## perf-harness with perf-assert thresholds (issue #451, formerly TASK-11.5a/issue #86)'
            echo '```'
            grep '^perf-browser:' perf-harness.log || echo 'perf-browser: no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # TASK-1.3b（#92、親 #90、REQ-1）: WASM 経路（イベント処理・DOM 更新）の
  # XSS 回帰テスト（crates/wasm-full/tests/xss_escape_wasm.rs）を実ブラウザ
  # （headless Chromium）で実行するジョブ。browser-test/perf-harness ジョブと
  # 同じ環境構築パターン（wasm32 target・wasm-pack バージョン固定＋チェックサム
  # 検証・ランナー内蔵 chromedriver 明示指定）を踏襲するが、対象クレート
  # （wasm-full）・対象テスト（xss_escape_wasm）が異なるため独立ジョブとする。
  #
  # browser-test ジョブ（wasm-client 対象）への統合や wasm-full 存在ガードの
  # 追加は TASK-11.2d（#77）のスコープと明記されており、並列進行中の #77 との
  # コンフリクト・責務混線を避けるため本ジョブは独立させる（実装計画 §5）。
  #
  # ファイル自体が本 PR で新規追加されるため、他ジョブのような存在ガードは
  # 設けない（追加と同一コミットで即時有効化される）。
  xss-wasm-test:
    name: WASM XSS escape regression (wasm-pack --headless --chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（他ジョブと同一 SHA 固定）。
        # docs/spec サブモジュールはテストに不要のため取得しない。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定。ubuntu-latest（ホステッド
        # ランナー）は stable toolchain を同梱するが、他ジョブとの一貫性・
        # バージョン明示のため引き続き明示セットアップする。
        uses: Fandhe-AI/actions/rust-toolchain-setup@5982e2f502a19effc36a7b161660b5a4ea17b886

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # wasm-pack はバージョン固定 + SHA256 チェックサム検証付きで導入する
      # （browser-test/perf-harness ジョブと同一バージョン・同一チェックサム。
      # 実行時の chromedriver 自動ダウンロードと同様、未検証バイナリ取得を
      # 避けるサプライチェーン対策）。実装は Fandhe-AI/actions/wasm-tool-install
      # へ共通化した（イシュー #1274）。pin の正はワークフロー冒頭の env ブロック。
      - name: Install wasm-pack (pinned + checksum-verified)
        uses: Fandhe-AI/actions/wasm-tool-install@5982e2f502a19effc36a7b161660b5a4ea17b886 # main
        with:
          tool: wasm-pack
          version: ${{ env.WASM_PACK_VERSION }}
          sha256: ${{ env.WASM_PACK_SHA256 }}

      # browser-test ジョブと同一の理由（PR #291 実 CI 実行で判明: self-hosted の
      # 永続 $HOME に他ジョブが残した不完全な wasm-bindgen 導入を誤検出する
      # 問題への対策。詳細は browser-test ジョブの同名ステップのコメント参照）。
      # 導入実装は Fandhe-AI/actions/wasm-tool-install へ共通化した（イシュー #1274）。
      - name: Install wasm-bindgen-cli (pinned + checksum-verified, provides wasm-bindgen-test-runner)
        uses: Fandhe-AI/actions/wasm-tool-install@5982e2f502a19effc36a7b161660b5a4ea17b886 # main
        with:
          tool: wasm-bindgen
          version: ${{ env.WASM_BINDGEN_VERSION }}
          sha256: ${{ env.WASM_BINDGEN_SHA256 }}

      # 前提（ホステッドランナー移行、ユーザー指示 2026-08-07。browser-test/
      # perf-harness ジョブと同一パターン。歴史的経緯・判断根拠は browser-test
      # ジョブの同名ステップのコメント参照）。ubuntu-latest はプリインストール
      # 済みの Chrome（Stable）・chromedriver をそのまま使い、バージョン
      # 整合のみを fail-closed に検証する。REQ-1 の XSS 回帰テスト実行内容は
      # 環境変更の影響を受けない。
      - name: Verify preinstalled Chrome / chromedriver (version alignment, fail-closed)
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "::error::google-chrome not found on runner image. ubuntu-latest is expected to preinstall Google Chrome (Stable)." >&2
            exit 1
          fi
          if [ -z "${CHROMEWEBDRIVER:-}" ] || [ ! -x "${CHROMEWEBDRIVER}/chromedriver" ]; then
            echo "::error::chromedriver not found at \${CHROMEWEBDRIVER}/chromedriver. ubuntu-latest is expected to preinstall chromedriver and expose CHROMEWEBDRIVER." >&2
            exit 1
          fi

          chrome_version="$(google-chrome --version)"
          chromedriver_version="$("${CHROMEWEBDRIVER}/chromedriver" --version)"
          {
            echo '## xss-wasm-test: preinstalled Chrome / chromedriver'
            echo "- google-chrome --version: ${chrome_version}"
            echo "- chromedriver --version: ${chromedriver_version}"
          } >> "$GITHUB_STEP_SUMMARY"

          chrome_major="$(echo "${chrome_version}" | grep -oE '[0-9]+' | head -1)"
          chromedriver_major="$(echo "${chromedriver_version}" | grep -oE '[0-9]+' | head -1)"
          if [ -z "${chrome_major}" ] || [ -z "${chromedriver_major}" ] || [ "${chrome_major}" != "${chromedriver_major}" ]; then
            echo "::error::Chrome/chromedriver major version mismatch (chrome=${chrome_major:-unknown}, chromedriver=${chromedriver_major:-unknown})." >&2
            exit 1
          fi

          if ! google-chrome --headless --no-sandbox --disable-gpu --dump-dom about:blank >/tmp/chrome-smoke.log 2>&1; then
            echo "::error::google-chrome failed to launch in headless mode." >&2
            cat /tmp/chrome-smoke.log >&2
            exit 1
          fi

      - name: Run WASM XSS escape regression (headless Chrome)
        run: CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver" wasm-pack test --headless --chrome crates/wasm-full --test xss_escape_wasm

  # イシュー #297（TASK-10.2 残課題、出典 PR #220 §10 スコープ外節）:
  # docs/design/wasm-build-integration.md §6.4 が文書化していた nodejs ターゲット
  # 開発フロー（`web-sys` 非依存な fandhe-frontend-wasm-thin のロジック高速確認経路）を
  # `cargo xtask wasm-node-smoke` として CI ゲート化する。上記 `test` ジョブと
  # 同一の wasm32 target 追加・wasm-bindgen-cli 導入パターンを踏襲する
  # （同一バージョン固定値。ドリフト検出は crates/xtask/tests/wasm_bindgen_version_sync.rs
  # が行ベース抽出で拾う対象に本ジョブの宣言も自動的に含まれる）。
  #
  # 正式なブラウザ実証（上記 browser-test/xss-wasm-test ジョブ）の代替ではなく、
  # 開発者手元での高速確認経路を CI でも回帰検証する位置づけ（§6.4 不変条件）。
  # 緩和用 input・continue-on-error は設けない（既存ジョブの迂回経路禁止原則）。
  wasm-node-smoke:
    name: "nodejs target smoke test (fandhe-frontend-wasm-thin, issue #297)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # 他ジョブと同一 SHA 固定。docs/spec サブモジュールは本ジョブに不要。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml / test ジョブと同一の理由・同一 SHA 固定。
        uses: Fandhe-AI/actions/rust-toolchain-setup@5982e2f502a19effc36a7b161660b5a4ea17b886

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # wasm-bindgen-cli の導入パターンは `test` ジョブと同一（バージョン固定 +
      # SHA256 チェックサム検証 + atomic install。実装は
      # Fandhe-AI/actions/wasm-tool-install へ共通化した、イシュー #1274）。
      # `xtask wasm-node-smoke` 自身が実行時に Cargo.lock 解決済みバージョンとの
      # 完全一致を再検証するため（`wasm_node_smoke::verify_wasm_bindgen_version`）、
      # 二重の fail-closed ゲートになる。
      - name: Install wasm-bindgen-cli (pinned + checksum-verified, atomic install)
        uses: Fandhe-AI/actions/wasm-tool-install@5982e2f502a19effc36a7b161660b5a4ea17b886 # main
        with:
          tool: wasm-bindgen
          version: ${{ env.WASM_BINDGEN_VERSION }}
          sha256: ${{ env.WASM_BINDGEN_SHA256 }}

      - name: Setup Node.js
        # npm-asset-build ジョブと同一 SHA 固定。ubuntu-latest（ホステッド
        # ランナー、ジョブごとにクリーンな使い捨て VM）にも node の常設は
        # 保証されないため明示セットアップする（.claude/rules/ci.md
        # 「ツール前提の明示」）。
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Run xtask wasm-node-smoke
        # xtask の終了コードをそのまま CI の成否に伝播させる（fail-closed）。
        # --locked はこの外側の cargo run が Cargo.lock を書き換えないことを保証する。
        run: |
          set -o pipefail
          cargo run --locked -p xtask -- wasm-node-smoke | tee wasm-node-smoke.log

      - name: Publish wasm-node-smoke summary
        if: always()
        # wasm_node_smoke::format_report の 1 行サマリ契約
        # 「wasm-node-smoke: package=<pkg> target=nodejs mode=<mode> result=<PASS|FAIL>」を
        # Step Summary に転記する。契約は crates/xtask/tests/cli_wasm_node_smoke.rs で固定。
        run: |
          {
            echo '## wasm-node-smoke (issue #297)'
            echo '```'
            grep '^wasm-node-smoke:' wasm-node-smoke.log || echo 'wasm-node-smoke: no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # イシュー #411: `fw new --template app` が生成する CSR wasm ビルド込み
  # 完全実体（vendor/fandhe-frontend-wasm-client + wasm/ 独立ワークスペース +
  # tools/wasm/build.sh）が実際にビルド可能であることを CI で回帰検証する。
  # wasm-bindgen-cli の導入パターンは `wasm-node-smoke` ジョブと同一
  # （バージョン固定 + SHA256 チェックサム検証）。ドリフト検出は
  # `crates/cli/tests/template_vendor_drift.rs::wasm_lockfile_wasm_bindgen_version_matches_repo_root_lockfile`
  # が `templates/app/wasm/Cargo.lock` とリポジトリ本体 `Cargo.lock` の
  # バージョン一致を機械的に検証する（`test` ジョブの `cargo test` で実行済み）。
  template-app-wasm-smoke:
    name: "fw new --template app: wasm ビルド込み CSR 完全実体の e2e 検証（issue #411）"
    # ホステッドランナー移行（トラッキング #1220、実装 #1231）: public リポジトリの
    # 標準ホステッドランナーは無料・分数消費なしのため既定とする（.claude/rules/ci.md）。
    runs-on: ubuntu-latest
    # クリーン VM での fw cli + xtask ビルド + 生成プロジェクトの wasm ビルド
    # （crates.io フェッチ込み）を織り込み拡大（実測後に調整、旧 15 分）。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # ホステッドランナーはジョブごとに初期化されたクリーン VM のため、
        # Checkout 直後に毎回 toolchain を導入する。
        uses: Fandhe-AI/actions/rust-toolchain-setup@5982e2f502a19effc36a7b161660b5a4ea17b886

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # `wasm-node-smoke` ジョブと同一パターン（バージョン固定 + SHA256
      # チェックサム検証 + atomic install。実装は Fandhe-AI/actions/wasm-tool-install
      # へ共通化した、イシュー #1274）。バージョン・SHA256 の pin 値は
      # 同ジョブと同一（リポジトリ本体 Cargo.lock 解決値、wasm-bindgen 0.2.126）。
      - name: Install wasm-bindgen-cli (pinned + checksum-verified, atomic install)
        uses: Fandhe-AI/actions/wasm-tool-install@5982e2f502a19effc36a7b161660b5a4ea17b886 # main
        with:
          tool: wasm-bindgen
          version: ${{ env.WASM_BINDGEN_VERSION }}
          sha256: ${{ env.WASM_BINDGEN_SHA256 }}

      - name: fw new --template app（フィクスチャ専用 CARGO_TARGET_DIR）
        # フィクスチャ専用パスは `/tmp` 固定ではなく `RUNNER_TEMP`
        # （`${{ runner.temp }}`）配下に置く。build.sh が期待するパス
        # （`wasm/target/...`）との整合を保つためであり、runner がジョブ
        # 前後で自動清掃するため `/tmp` 固定パスのようにジョブ間で残置が
        # 恒久蓄積しない点は不変（イシュー #659。PR #648／イシュー #637 で
        # 是正したテストコード側 `env!("CARGO_TARGET_TMPDIR")` 方針と対をなす。
        # `docs-site.yml` の RUNNER_TEMP 運用と同一パターン。ホステッド
        # ランナーでもこの配置原則は不変、`.claude/rules/ci.md` 参照）。
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fandhe-frontend-template-app-wasm-smoke-target
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/fandhe-frontend-template-app-wasm-smoke"
          cargo run --locked -p fandhe-frontend-cli --bin fw -- new template-app-wasm-smoke \
            --template app --dir "${RUNNER_TEMP}/fandhe-frontend-template-app-wasm-smoke"

      - name: "未公開バージョン判定と [patch.crates-io] フォールバック（イシュー #885、docs/ci/version-bump-publish-order-gap.md）"
        # version-bump-guard・template_vendor_drift・本ジョブの三すくみ（設計文書
        # 参照）により、templates/app が crates.io バージョン依存する公開済み
        # クレート（core/app/wasm-client）をバンプした PR では、バンプ先
        # バージョンが crates.io へ未公開の間このジョブが必ず fail する構造的
        # デッドロックが生じる。本ステップは生成プロジェクトの直接依存
        # バージョンを sparse index へ照会し（`xtask patch-template-smoke`、
        # `check_version_bump::query_index` の fail-closed 契約を再利用）、
        # 未公開バージョンのみに限って `[patch.crates-io]`（このジョブがテスト
        # 対象とする checkout 済みコードそのものへの path 参照）を注入する。
        # release.yml の承認境界（workflow_dispatch + mode: publish 明示選択）
        # は一切変更しない（あくまで CI 内部の依存解決経路の調整）。
        # 緩和用の環境変数・workflow_dispatch input は設けない（迂回禁止原則）。
        #
        # フィクスチャ専用 CARGO_TARGET_DIR を fw new ステップと共有し
        # （`.claude/rules/ci.md` Self-hosted 環境の前提）、xtask 自体（repo
        # workspace のメンバー）の再ビルドを避ける。
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fandhe-frontend-template-app-wasm-smoke-target
        run: |
          set -euo pipefail
          # `if PIPELINE; then` の条件式内であれば、GitHub Actions 既定の
          # `bash -e` が有効なままでもパイプライン失敗で即座に中断されない
          # （version-bump-guard ジョブと同型のパターン、ci.md 参照）。
          if cargo run --locked -p xtask -- patch-template-smoke \
              --project-dir "${RUNNER_TEMP}/fandhe-frontend-template-app-wasm-smoke/template-app-wasm-smoke" \
              --repo-root "${GITHUB_WORKSPACE}" 2>&1 | tee patch-template-smoke.log; then
            if grep -qF 'resolution=path-override' patch-template-smoke.log; then
              echo "::warning::template-app-wasm-smoke: one or more fandhe-frontend-* dependencies are not yet resolvable on crates.io; a [patch.crates-io] path-override fallback was engaged (see 'resolution=path-override' lines below). This is expected only until the corresponding crates.io publish (release.yml, mode: publish) completes."
              {
                echo '## template-app-wasm-smoke: patch-template-smoke fallback (issue #885)'
                echo '```'
                grep '^template-app-wasm-smoke:' patch-template-smoke.log || true
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          # "environment error: " プレフィックス有無で「runner/ネットワーク
          # 起因」と「コード起因」を区別する（version-bump-guard と同型）。
          if grep -q 'environment error: ' patch-template-smoke.log; then
            echo "::error::patch-template-smoke failed: environment error (runner/network issue, not code). See 'environment error:' lines above; verify this runner can reach https://index.crates.io."
          else
            echo "::error::patch-template-smoke failed for a reason other than reaching the crates.io sparse index (e.g. an unsupported dependency form, a pre-existing [patch.crates-io] section, or a repo-root crate mismatch). See the log above for details."
          fi
          exit 1

      - name: tools/wasm/build.sh の実行
        # 直前ステップと同じくフィクスチャ専用 CARGO_TARGET_DIR を明示指定する
        # （`.claude/rules/ci.md` 「Runner 環境と一時領域の前提」）。未指定だと
        # build.sh が期待する `wasm/target/...` とパスが一致しなくなる
        # （イシュー #411 CI 失敗の原因。ホステッドランナーはジョブごとに
        # クリーンな VM だが、この整合要件自体は runner 種別に依存しない）。
        # 配置先を `RUNNER_TEMP` 配下にする理由は直前ステップのコメント
        # （イシュー #659）を参照。
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fandhe-frontend-template-app-wasm-smoke-target/wasm-build
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/fandhe-frontend-template-app-wasm-smoke/template-app-wasm-smoke"
          ./tools/wasm/build.sh

      - name: 生成物の存在・mount_csr/hydrate エクスポートの検証
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/fandhe-frontend-template-app-wasm-smoke/template-app-wasm-smoke"
          js="${project}/static/wasm/fandhe_frontend_wasm_client.js"
          wasm="${project}/static/wasm/fandhe_frontend_wasm_client_bg.wasm"
          if [ ! -f "${js}" ]; then
            echo "::error::missing ${js}" >&2
            exit 1
          fi
          if [ ! -f "${wasm}" ]; then
            echo "::error::missing ${wasm}" >&2
            exit 1
          fi
          if ! grep -q "export function mount_csr" "${js}"; then
            echo "::error::mount_csr export not found in ${js}" >&2
            exit 1
          fi
          if ! grep -q "export function hydrate" "${js}"; then
            echo "::error::hydrate export not found in ${js}" >&2
            exit 1
          fi
          echo "template-app-wasm-smoke: mount_csr/hydrate exports verified"

  # TASK-12.2c（#124、REQ-12 受け入れ基準 2）: install.sh の --ignore-scripts
  # 強制（前段、TASK-12.1a・#38・マージ済み）と check_static_only.py の
  # 静的アセット判定（後段ゲート、TASK-12.2b・#123・マージ済み）の多層防御を
  # CI で回帰確認する。本ジョブは緩和用 input・環境変数・continue-on-error を
  # 一切設けない（loc-check ジョブと同一の迂回経路禁止原則）。
  #
  # test_install.sh（TASK-12.1a の成果物）・check_static_only.py（TASK-12.2b
  # の成果物）はいずれも必須成果物であり、無条件（fail-closed）に実行する。
  # 存在ガード（未作成時に該当ステップをスキップする措置）は TASK-12.2b
  # マージ完了に伴い撤去済み（TASK-12.2・#121）。ファイル不在・失敗はいずれも
  # 即 CI 失敗として扱う。
  npm-asset-build:
    name: NPM static asset gate (REQ-12)
    # ホステッドランナー移行（トラッキング #1220、実装 #1231）: public リポジトリの
    # 標準ホステッドランナーは無料・分数消費なしのため既定とする（.claude/rules/ci.md）。
    runs-on: ubuntu-latest
    # cargo を使わず node/npm/python3 のみのジョブのため timeout 拡大は不要
    # （旧 15 分のまま）。
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（他ジョブと同一 SHA 固定）。
        # docs/spec サブモジュールは本ジョブに不要のため取得しない。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Node.js
        # update-external.yml と同一 SHA 固定。ubuntu-latest には node/npm が
        # プリインストールされているが、決定性のため明示セットアップを維持する
        # （下段の test_pipeline_e2e.sh は node/npm 不在時に自己スキップする
        # 作りだが、実 npm でのパイプライン検証を常に行うために導入する）。
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      # ubuntu-latest には python3 がプリインストール済みだが、決定性のため
      # fail-closed 検出を維持する（他ジョブと異なりインストールは行わない。
      # python3 は OS 標準構成の一部として runner 側で常設されることを
      # 期待するため）。
      - name: Check python3 availability
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::error::python3 not found. This job requires python3 pre-installed." >&2
            exit 1
          fi

      - name: install.sh offline regression tests (fail-closed)
        run: bash tools/npm-asset-build/tests/test_install.sh

      - name: check_static_only.py fixture regression tests (fail-closed)
        # check_static_only.py（TASK-12.2b・#123 でマージ済み）本体を対象とした
        # fixture 回帰テスト。スクリプト・テストファイルいずれかの不在や
        # 失敗はここで即座にジョブ失敗となる（存在ガードによる skip は
        # TASK-12.2b マージ完了に伴い撤去済み、TASK-12.2・#121）。
        run: python3 tools/npm-asset-build/tests/test_check_static_only.py -v

      - name: install.sh + check_static_only.py pipeline e2e tests (fail-closed)
        # TASK-12.1b（イシュー #39）: install.sh → check_static_only.py の
        # パイプライン全体を実 npm で end-to-end 検証する。ubuntu-latest には
        # node/npm がプリインストールされているため、CI 上では常に実行される
        # （緩和用 input・continue-on-error は設けない。既存ジョブの迂回経路
        # 禁止原則を踏襲）。ケース G（イシュー #316）が apply_exempt.py の
        # 半自動追記往復も併せて検証する。
        run: bash tools/npm-asset-build/tests/test_pipeline_e2e.sh

      - name: apply_exempt.py fixture regression tests (fail-closed)
        # イシュー #316: allowlist 半自動追記コマンド apply_exempt.py 本体の
        # ユニット/フィクスチャ回帰（検証・エスケープ・アトミック書き込み・
        # 終了コード契約）。check_static_only.py と同じく存在ガードなし
        # （不在・失敗は即座にジョブ失敗）。
        run: python3 tools/npm-asset-build/tests/test_apply_exempt.py -v

      - name: templates/default npm-asset-build sync check (fail-closed)
        # イシュー #316: templates/default/tools/npm-asset-build/ へ同梱した
        # コピーが正本（tools/npm-asset-build/）とドリフトしていないことを
        # 機械的に検証する。テンプレート側だけが改変・弱体化される事態を防ぐ。
        run: bash tools/npm-asset-build/tests/test_template_sync.sh

  # TASK-10.4a（イシュー #119、REQ-10）: 本番ビルドのアセット変更反映
  # （差分ビルド）が 5 秒以内であることを継続計測するジョブ。
  # `crates/dist-server/benches/rebuild_latency.rs`（judge/format_summary_line は
  # `crates/dist-server/src/bench_support.rs` に分離しユニットテストで書式契約を
  # 固定）を実行し、PoC-4 実測（0.571〜0.597 秒）を基準とした回帰を検知する。
  #
  # `test` ジョブと同じ環境構築パターン（wasm32 target・wasm-bindgen-cli
  # バージョン固定 + SHA256 チェックサム検証）を踏襲する。本ベンチが起動する
  # ネスト `cargo build -p fandhe-frontend-dist-server` は `crates/dist-server/build.rs` の
  # WASM ビルドステージ（既定有効）を経由するため、本ジョブは
  # オプトアウトせず統合ビルドをそのまま計測に含める。
  #
  # しきい値運用の原則は deps-check/loc-check ジョブと同一: しきい値の正は
  # `crates/dist-server/src/bench_support.rs` の LIMIT_SECONDS（5.0）定数のみ。
  # 緩和用の input・環境変数・continue-on-error は設けない。
  #
  # イシュー #294: 共有 self-hosted runner（6 並列）上の CPU 競合による
  # 間欠フレーク対策として導入した判定（N=3 サンプルの中央値、median-of-N、
  # `bench_support::judge`）は、ホステッド 4 vCPU 専有 VM（トラッキング #1220、
  # 実装 #1231）へ移行後も仮想化ノイズ吸収の安全網として維持する。少数派
  # （N=3 なら 1 サンプル）のみのノイズは吸収しつつ、過半数のサンプルが
  # 超過する恒常的なリグレッションは引き続き検出する。min-of-N（1 サンプル
  # でも以内なら PASS）は間欠的な多数決リグレッションを見逃すため不採用
  # （詳細は `bench_support` モジュールドキュメント参照）。サマリには
  # 全サンプル値・min_s・max_s も出力し、分布を目視追跡できるようにする。
  rebuild-latency:
    name: REQ-10 rebuild latency (5s limit)
    # ホステッドランナー移行（トラッキング #1220、実装 #1231）: public リポジトリの
    # 標準ホステッドランナーは無料・分数消費なしのため既定とする（.claude/rules/ci.md）。
    runs-on: ubuntu-latest
    # クリーン VM でのネスト WASM ビルド込み初回フルビルド + bench × N=3
    # サンプルを織り込み拡大（実測後に調整、旧 20 分）。
    timeout-minutes: 45
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（test ジョブと同一 SHA 固定）。
        # docs/spec サブモジュールは本ジョブの計測に不要のため取得しない。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定: ホステッドランナーはジョブごとに
        # 初期化されたクリーン VM のため、Checkout 直後に毎回 toolchain を導入する。
        uses: Fandhe-AI/actions/rust-toolchain-setup@5982e2f502a19effc36a7b161660b5a4ea17b886

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # wasm-bindgen-cli はバージョン固定 + SHA256 チェックサム検証付きで
      # 導入する（`test` ジョブと同一バージョン・同一チェックサム。
      # `crates/dist-server/build.rs` の expected_wasm_bindgen_version が Cargo.lock
      # 解決済みバージョンとの完全一致を要求するため、更新時は両方を
      # 合わせて更新すること）。実装は Fandhe-AI/actions/wasm-tool-install へ
      # 共通化した（イシュー #1274。atomic install の経緯は Cursor Bugbot 指摘
      # BUGBOT_BUG_ID: 1c88c06e、PR #291）。ホステッドランナーはジョブごとに
      # クリーンな VM のため毎回導入する。
      - name: Install wasm-bindgen-cli (pinned + checksum-verified)
        uses: Fandhe-AI/actions/wasm-tool-install@5982e2f502a19effc36a7b161660b5a4ea17b886 # main
        with:
          tool: wasm-bindgen
          version: ${{ env.WASM_BINDGEN_VERSION }}
          sha256: ${{ env.WASM_BINDGEN_SHA256 }}

      - name: Run rebuild_latency bench
        # xtask 系ジョブと同一の理由（子プロセス終了コード伝播・Cargo.lock
        # drift 防止）で pipefail・tee・--locked を用いる。
        run: |
          set -o pipefail
          cargo bench --locked -p fandhe-frontend-dist-server --bench rebuild_latency | tee rebuild-latency.log

      - name: Publish rebuild-latency summary
        if: always()
        # format_summary_line（crates/dist-server/src/bench_support.rs）の 1 行
        # サマリ契約「rebuild-latency: samples=<n> s1=<x> ... median_s=<x>
        # min_s=<x> max_s=<x> limit_s=<x> result=<PASS|FAIL>」を Step Summary
        # に転記する（deps-check/loc-check ジョブと同一パターン。median_s は
        # イシュー #294 で判定基準に採用、min_s・max_s は観測性のため
        # 引き続き出力）。
        run: |
          {
            echo '## rebuild-latency (REQ-10, issue #119)'
            echo '```'
            grep '^rebuild-latency:' rebuild-latency.log || echo 'rebuild-latency: no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # TASK-11.6（イシュー #89、REQ-11 受け入れ基準 1）: 最小インタラクティブ
  # コンポーネント（fandhe-frontend-wasm-full）の WASM バンドルサイズ（gzip 後）が
  # 200KB 以内であることを継続計測するジョブ。
  #
  # `crates/wasm-full/tests/bundle_size.rs` が `crates/dist-server/build.rs` と同一の
  # コマンド列（cargo build --target wasm32-unknown-unknown --release →
  # wasm-bindgen --target web --no-typescript）を自己完結で再現するため、
  # `test`/`rebuild-latency` ジョブと同じ wasm ツールチェーン導入パターン
  # （wasm32 target・wasm-bindgen-cli バージョン固定 + SHA256 チェックサム
  # 検証）を踏襲する。
  #
  # しきい値運用の原則は deps-check/loc-check ジョブと同一: しきい値の正は
  # `crates/wasm-full/tests/bundle_size.rs` の REQ11_BUNDLE_SIZE_LIMIT_BYTES
  # （200_000）定数のみ。緩和用の input・環境変数・continue-on-error は
  # 設けない（迂回経路を作らない設計）。
  #
  # `test` ジョブの `cargo test --workspace` でも本テストは実行されるため、
  # 本ジョブは主に「REQ-11 の 1 行サマリを Step Summary へ可視化する」役割を
  # 兼ねる（二重防御）。
  bundle-size:
    name: REQ-11 fandhe-frontend-wasm-full bundle gzip size (200KB limit)
    # ホステッドランナー移行（トラッキング #1220、実装 #1231）: public リポジトリの
    # 標準ホステッドランナーは無料・分数消費なしのため既定とする（.claude/rules/ci.md）。
    runs-on: ubuntu-latest
    # クリーン VM での wasm32 release ビルド + wasm-bindgen 後処理を織り込み拡大
    # （実測後に調整、旧 20 分）。
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（test/loc-check ジョブと同一 SHA 固定）。
        # docs/spec サブモジュールは本ジョブの計測に不要のため取得しない。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定: ホステッドランナーはジョブごとに
        # 初期化されたクリーン VM のため、Checkout 直後に毎回 toolchain を導入する。
        uses: Fandhe-AI/actions/rust-toolchain-setup@5982e2f502a19effc36a7b161660b5a4ea17b886

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # wasm-bindgen-cli はバージョン固定 + SHA256 チェックサム検証付きで
      # 導入する（`test`/`rebuild-latency` ジョブと同一バージョン・同一
      # チェックサム。バージョンアップ時は Cargo.lock 解決済み wasm-bindgen
      # と合わせて更新すること）。実装は Fandhe-AI/actions/wasm-tool-install へ
      # 共通化した（イシュー #1274。atomic install の経緯は Cursor Bugbot 指摘
      # BUGBOT_BUG_ID: 1c88c06e、PR #291）。ホステッドランナーはジョブごとに
      # クリーンな VM のため毎回導入する。
      - name: Install wasm-bindgen-cli (pinned + checksum-verified)
        uses: Fandhe-AI/actions/wasm-tool-install@5982e2f502a19effc36a7b161660b5a4ea17b886 # main
        with:
          tool: wasm-bindgen
          version: ${{ env.WASM_BINDGEN_VERSION }}
          sha256: ${{ env.WASM_BINDGEN_SHA256 }}

      - name: Run bundle_size test
        # xtask 系ジョブと同一の理由（子プロセス終了コード伝播・Cargo.lock
        # drift 防止）で pipefail・tee・--locked を用いる。
        run: |
          set -o pipefail
          cargo test -p fandhe-frontend-wasm-full --test bundle_size --locked -- --nocapture | tee bundle-size.log

      - name: Publish bundle-size summary
        if: always()
        # format_report（crates/wasm-full/tests/bundle_size.rs）の 1 行サマリ契約
        # 「bundle-size: total_gzip_bytes=<n>/<limit> files=<k>
        # result=<PASS|FAIL>」を Step Summary に転記する（loc-check ジョブと
        # 同一パターン）。
        run: |
          {
            echo '## bundle-size (REQ-11, issue #89)'
            echo '```'
            grep '^bundle-size:' bundle-size.log || echo 'bundle-size: no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  loc-check:
    name: REQ-8/REQ-11 glue JS effective LOC limit (10 lines, issues #62/#156)
    # ホステッドランナー移行（トラッキング #1220、実装 #1231）: public リポジトリの
    # 標準ホステッドランナーは無料・分数消費なしのため既定とする（.claude/rules/ci.md）。
    runs-on: ubuntu-latest
    # クリーン VM での xtask debug ビルドを織り込み拡大（実測後に調整、旧 10 分）。
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（同一ファイル内の test ジョブと同一 SHA に固定）。
        # docs/spec submodule は本ジョブの計測に不要なため取得しない。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定: ホステッドランナーはジョブごとに
        # 初期化されたクリーン VM のため、Checkout 直後に毎回 toolchain を導入する。
        uses: Fandhe-AI/actions/rust-toolchain-setup@5982e2f502a19effc36a7b161660b5a4ea17b886

      - name: Run xtask check-loc
        # xtask check-loc の終了コードをそのまま CI の成否に伝播させる（fail-closed）。
        # set -o pipefail を明示し、tee 経由でも cargo run の終了コードが失われないようにする。
        # --locked はこの外側の cargo run が Cargo.lock を書き換えないことを保証する
        # （deps-check ジョブと同一の理由）。
        run: |
          set -o pipefail
          cargo run --locked -p xtask -- check-loc | tee loc-check.log

      - name: Publish loc-check summary
        if: always()
        # format_loc_report（crates/xtask/src/check_loc.rs）の 1 行サマリ契約
        # 「loc-check: file=<path> effective_loc=<n>/<limit> result=<PASS|FAIL>」を
        # Step Summary に転記する。この契約はテストで固定される
        # （crates/xtask/tests/cli_check_loc.rs）。
        run: |
          {
            echo '## loc-check (REQ-8 issue #62 / REQ-11 issue #156)'
            echo '```'
            grep '^loc-check:' loc-check.log || echo 'loc-check: no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # TASK-4.4（イシュー #28、REQ-4 受け入れ基準 3）: 標準プロジェクトテンプレート
  # （templates/default）に対する「型的に不正な AI 生成コードが cargo check の
  # 段階で機械的に弾かれること」の回帰テストを実行するジョブ。
  # templates/default は root workspace の members に含まれない独立した
  # cargo プロジェクトのため、manifest-path を明示して単独実行する。
  template-negative-type-error:
    name: TASK-4.4 templates/default 型不正コード機械的検出の受け入れ基準検証
    # ホステッドランナー移行（トラッキング #1220、実装 #1231）: public リポジトリの
    # 標準ホステッドランナーは無料・分数消費なしのため既定とする（.claude/rules/ci.md）。
    runs-on: ubuntu-latest
    # クリーン VM でのフルコールドビルドを織り込み拡大（実測後に調整、旧 15 分）。
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（test/loc-check ジョブと同一 SHA に固定）。
        # docs/spec サブモジュールは本ジョブの検証に不要なため取得しない。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定: ホステッドランナーはジョブごとに
        # 初期化されたクリーン VM のため、Checkout 直後に毎回 toolchain を導入する。
        uses: Fandhe-AI/actions/rust-toolchain-setup@5982e2f502a19effc36a7b161660b5a4ea17b886

      - name: templates/default 単体テスト（正例 + 負例 E0277/E0308）
        # --offline で子プロセス cargo check を実行するテスト（依存ゼロの
        # ため事前フェッチ不要）。--locked はコミット済み Cargo.lock からの
        # drift を検知する（deps-check 等の既存ジョブと同一の理由）。
        run: cargo test --manifest-path templates/default/Cargo.toml --locked

      - name: xtask 多層防御テスト（成果物の実在・必須要素の静的検証）
        # templates/default は root workspace 外のため、cargo test --workspace
        # だけでは成果物テストの削除・実行漏れを検知できない。xtask 側
        # （workspace メンバー）からの静的検証で安全網を張る
        # （TASK-4.1 の template_deny_config.rs と同一パターン）。
        run: cargo test -p xtask --test template_negative_type_error --locked

  # イシュー #1227（トラッキング #1220）: rustfmt チェックの CI 強制。従来は
  # `Makefile` の `lint` ターゲット（`cargo fmt --all --check`）とローカル
  # lefthook のみが担い、ci.yml 側の強制がなかった（fmt 用ジョブは新設で
  # あり、self-hosted 側に削除対象の同名ジョブは存在しない）。ホステッド
  # ランナー移行（#1225）のパイロットとして、コンパイル不要・キャッシュ
  # 不要の最軽量ジョブを ubuntu-latest 上に新設する
  # （docs/ci/hosted-runner-migration.md 参照）。
  fmt:
    name: "rustfmt check (cargo fmt --check, issue #1227)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # 既存ジョブ（clippy 等）と同一 SHA ピン。docs/spec サブモジュールは
        # 本ジョブの検証に不要なため取得しない。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # 既存ジョブと同一 SHA ピン。フォーマットチェックのみのため
        # components に rustfmt を追加する（clippy component は不要）。
        uses: Fandhe-AI/actions/rust-toolchain-setup@5982e2f502a19effc36a7b161660b5a4ea17b886
        with:
          components: rustfmt

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  # イシュー #157（#158/#159、REQ-1）: `raw_html()` 検出の主防御である
  # `clippy::disallowed_methods`（workspace ルート `clippy.toml` が宣言）を
  # CI でも強制するジョブ。イシュー #299 で `--all-targets` へ拡張し、
  # テストターゲット（`#[cfg(test)]` / `tests/` 配下）内の `raw_html()` 呼び
  # 出しも検出対象に含める。テストコード内の呼び出しにも呼び出し単位の
  # `#[expect(clippy::disallowed_methods, reason = "ESCAPE-REVIEWED: ...")]`
  # を必須とする（`docs/policy/raw-html-review-gate.md` 準拠）。`crates/cli/src/gate.rs` の
  # `lint` チェックもイシュー #315 で `--all-targets` 化済みのため、ローカル
  # ゲート・AI 自己保守フックと本 CI ジョブの検出範囲は一致する（旧記述
  # 「本 CI ジョブが superset」は解消済み）。本ジョブは `--workspace` による
  # 全クレート横断を担う最終防衛線として維持する。未レビューの `raw_html()`
  # 呼び出しが本体コード・テストコードいずれへ入っても本ジョブが
  # `-D warnings` により失敗し、マージをブロックする
  # （方式選定・脅威モデルは docs/design/raw-html-lint-design.md 参照）。
  #
  # イシュー #1227（トラッキング #1220）で ubuntu-latest へ移行（in-place。
  # self-hosted との並走期間は残さない）。`actions/cache` によるキャッシュは
  # 本ジョブが初適用（docs/ci/hosted-runner-migration.md §3 の確定方針）。
  # job family prefix `clippy-` で `release.yml` の検証ビルド（専用
  # CARGO_TARGET_DIR で隔離済み・actions/cache 不使用）とキャッシュを分離し、
  # イシュー #1192 型の rlib 汚染がキャッシュ経由で流入する経路を作らない。
  clippy:
    name: REQ-1 raw_html() 検出（clippy disallowed_methods, issue #157）
    runs-on: ubuntu-latest
    # クリーンな使い捨て VM でのフルコールドビルド（cargo clippy --workspace
    # --all-targets）の上振れ余地を見込み、self-hosted 時代の 20 分から
    # 引き上げる（実測は docs/ci/hosted-runner-migration.md §5.4 参照）。
    timeout-minutes: 40
    # forbid-unsafe ジョブと同じ理由で dist-server の WASM ネストビルドを
    # オプトアウトする: `cargo clippy --workspace` は crates/dist-server/build.rs 経由で
    # ネストした cargo build + wasm-bindgen 起動を伴うが、本ジョブでは wasm32
    # ターゲット・wasm-bindgen-cli を導入しておらず、build.rs 側の panic
    # （wasm-bindgen-cli 不在）で本ジョブ本来の目的（raw_html() 検出）と
    # 無関係に失敗する。統合ビルドの実証は別ジョブ（test 等）が担う。
    env:
      FANDHE_FRONTEND_WASM_BUILD: "0"
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（test/loc-check ジョブと同一 SHA に固定）。
        # docs/spec サブモジュールは本ジョブの検証に不要なため取得しない。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # 既存ジョブと同一 SHA 固定。ubuntu-latest にも Rust は入っているが
        # バージョン決定性のため明示 pin を維持する（他ジョブと同一方針、
        # docs/ci/hosted-runner-migration.md §4.2）。加えて本ジョブは
        # clippy component を必須とするため components: clippy を明示する
        # （既に導入済みのツールチェーンでは何もしない。未導入時の新規セット
        # アップでも clippy が確実に含まれるようにする安全策）。
        uses: Fandhe-AI/actions/rust-toolchain-setup@5982e2f502a19effc36a7b161660b5a4ea17b886
        with:
          components: clippy

      - name: Compute toolchain cache key
        # dtolnay/rust-toolchain の outputs.cachekey の代替（イシュー #1273。
        # 置換先の Fandhe-AI/actions/rust-toolchain-setup は cachekey 相当の
        # output を持たないため、rustc のコミットハッシュ先頭 12 桁を
        # toolchain 世代キーとして自前算出する。stable バンプ時にキャッシュ
        # キーが自然にロールオーバーする性質を維持する。空値はキャッシュキーの
        # 世代分離を失わせるため fail-closed で停止する）。
        id: toolchain
        run: |
          set -euo pipefail
          cachekey="$(rustc -vV | sed -n 's/^commit-hash: \(.\{12\}\).*/\1/p')"
          if [ -z "${cachekey}" ]; then
            echo "::error::rustc commit-hash を取得できませんでした"
            exit 1
          fi
          echo "cachekey=${cachekey}" >> "${GITHUB_OUTPUT}"

      - name: "cache: cargo registry + target（イシュー #1227、docs/ci/hosted-runner-migration.md §3.3/§3.4）"
        # actions/cache v6.1.0（GitHub 公式・フル SHA ピン、他ジョブと同一の
        # 外部 action 採否パターン）。job family prefix `clippy-` で
        # release.yml の検証ビルド（専用 CARGO_TARGET_DIR 隔離・cache 不使用）
        # と分離し、イシュー #1192 型の rlib 汚染がキャッシュ経由で流入する
        # 経路を作らない。miss 時はフルビルドへ自然にフォールバックする
        # fail-open 設計であり、正当性の前提にしない（restore/save いずれの
        # 失敗もジョブを失敗させない）。ツールバイナリ（clippy component 等）
        # はキャッシュ対象に含めず、SHA256 検証付き導入の経路を維持する
        # （§3.4）。
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: clippy-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            clippy-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      - name: Show toolchain
        run: rustup show && cargo --version

      - name: "guard: 共有 CARGO_TARGET_DIR の無ハッシュ cdylib rlib を除去（イシュー #1192）"
        # 本ジョブは上記 actions/cache ステップで workspace `target` を復元する
        # （イシュー #1227）。cdylib+rlib クレート（wasm-thin/wasm-full/
        # wasm-client）の rlib はメタデータハッシュサフィックスなしの固定
        # ファイル名で出力される cargo の仕様上、release.yml の検証ビルドが
        # 汚染した無ハッシュ rlib がキャッシュへ保存され、本ジョブの復元時に
        # 同型の flaky（「multiple different versions of crate」E0277/E0599）を
        # 再発させ得る（詳細は forbid-unsafe/test/gate-self-apply ジョブの
        # 同名ステップコメント、docs/ci/hosted-runner-migration.md §3.3 参照）。
        # 本ジョブは CARGO_TARGET_DIR を明示設定せず actions/cache の
        # `path: target`（リポジトリルートからの相対、既定の cargo target dir）
        # をそのまま復元するため、他ジョブと異なり環境変数を経由せず
        # リテラルパス `target/` を直接削除対象にする（キャッシュされている
        # ディレクトリと同一の参照を削除する契約、イシュー #1226 finding 1）。
        # 固定ファイル名のみを `rm -f` で個別削除し、glob や再帰削除は
        # 用いない（A01 パストラバーサル・広域削除の防止、security.md 参照）。
        run: |
          set -euo pipefail
          if [ -d "target/debug/deps" ]; then
            rm -f \
              "target/debug/deps/libfandhe_frontend_wasm_thin.rlib" \
              "target/debug/deps/libfandhe_frontend_wasm_thin.so" \
              "target/debug/deps/fandhe_frontend_wasm_thin.d" \
              "target/debug/deps/libfandhe_frontend_wasm_full.rlib" \
              "target/debug/deps/libfandhe_frontend_wasm_full.so" \
              "target/debug/deps/fandhe_frontend_wasm_full.d" \
              "target/debug/deps/libfandhe_frontend_wasm_client.rlib" \
              "target/debug/deps/libfandhe_frontend_wasm_client.so" \
              "target/debug/deps/fandhe_frontend_wasm_client.d"
          fi

      - name: cargo clippy --workspace --all-targets -- -D warnings
        # workspace ルートの clippy.toml（disallowed-methods）が効き、
        # 未レビュー raw_html() 呼び出しがあれば本ステップが失敗する。
        # --all-targets によりテストターゲット（#[cfg(test)] / tests/ 配下）
        # もコンパイル・lint 対象に含む（イシュー #299）。
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # イシュー #1160（出典: PR #1147 out-of-scope）: 上記 clippy ジョブは host
  # target のみを対象とするため、`#[cfg(target_arch = "wasm32")]` ゲート配下
  # （crates/wasm-client・crates/wasm-full・crates/wasm-thin の配線層、browser
  # テスト等）は本体がコンパイルされず clippy 警告が構造的にすり抜ける
  # （イシュー #1140 で crates/wasm-full/tests/keynav_browser.rs の警告 11 件が
  # すり抜けた実例）。本ジョブは wasm32-unknown-unknown target で当該 3 クレート
  # のみを clippy し、host target のジョブでは検知できないギャップを
  # fail-closed（-D warnings）に閉じる。workspace ルート clippy.toml の
  # disallowed-methods（REQ-1 raw_html() 検出、issue #157）もこの wasm32 ゲート
  # 配下へ適用されるようになる副次効果がある。clippy は check のみで
  # wasm-bindgen 後処理を起動しないため wasm-bindgen-cli は不要。対象 3 クレート
  # の依存閉包に crates/dist-server（build.rs のネスト WASM ビルド）は含まれない
  # ため、上記 clippy / gate-self-apply ジョブが行う
  # FANDHE_FRONTEND_WASM_BUILD="0" のオプトアウトも不要（実測で確認済み）。
  clippy-wasm32:
    name: "wasm32 target clippy (-D warnings, issue #1160)"
    # ホステッドランナー移行（トラッキング #1220、実装 #1228）: public リポジトリの
    # 標準ホステッドランナーは無料・分数消費なしのため既定とする（.claude/rules/ci.md）。
    runs-on: ubuntu-latest
    # クリーンな使い捨て VM でのフルコールドビルド（3 wasm クレートの
    # wasm32-unknown-unknown ターゲット clippy --all-targets）の上振れ余地を
    # 見込み、self-hosted 時代の 20 分から引き上げる（clippy ジョブと同値、
    # 実測は docs/ci/hosted-runner-migration.md §5.7 参照）。
    timeout-minutes: 40
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（clippy ジョブと同一 SHA に固定）。
        # docs/spec サブモジュールは本ジョブの検証に不要なため取得しない。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # clippy ジョブと同一 SHA 固定。components: clippy を明示する。
        uses: Fandhe-AI/actions/rust-toolchain-setup@5982e2f502a19effc36a7b161660b5a4ea17b886
        with:
          components: clippy

      - name: Compute toolchain cache key
        # clippy ジョブと同型（dtolnay/rust-toolchain の outputs.cachekey の代替、
        # イシュー #1273）。id: toolchain は下記 actions/cache のキャッシュキー
        # （steps.toolchain.outputs.cachekey）が参照する。
        id: toolchain
        run: |
          set -euo pipefail
          cachekey="$(rustc -vV | sed -n 's/^commit-hash: \(.\{12\}\).*/\1/p')"
          if [ -z "${cachekey}" ]; then
            echo "::error::rustc commit-hash を取得できませんでした"
            exit 1
          fi
          echo "cachekey=${cachekey}" >> "${GITHUB_OUTPUT}"

      - name: Add wasm32 target
        # test ジョブ等と同一パターン（rustup 経由・冪等）。
        run: rustup target add wasm32-unknown-unknown

      - name: "cache: cargo registry + target（イシュー #1228、docs/ci/hosted-runner-migration.md §3.3/§3.4）"
        # actions/cache v6.1.0（clippy ジョブと同一・GitHub 公式のフル SHA ピン）。
        # job family prefix `clippy-wasm32-` で `clippy-`（host target clippy）・
        # release.yml の検証ビルド（専用 CARGO_TARGET_DIR 隔離・cache 不使用）と
        # 分離し、イシュー #1192 型の rlib 汚染がキャッシュ経由で流入する経路を
        # 作らない（`clippy-` の restore-keys は `clippy-${os}-...` 形のため
        # `clippy-wasm32-` キーとプレフィックス衝突しない）。miss 時はフル
        # ビルドへ自然にフォールバックする fail-open 設計であり、正当性の前提に
        # しない（restore/save いずれの失敗もジョブを失敗させない）。ツール
        # バイナリ（clippy component 等）はキャッシュ対象に含めず、SHA256
        # 検証付き導入の経路を維持する（§3.4）。
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: clippy-wasm32-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            clippy-wasm32-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      - name: Show toolchain
        run: rustup show && cargo --version

      - name: "guard: 共有 CARGO_TARGET_DIR の無ハッシュ cdylib rlib を除去（イシュー #1192）"
        # 本ジョブは上記 actions/cache ステップで workspace `target` を復元する
        # （イシュー #1228、clippy ジョブと同型）。cdylib+rlib クレート
        # （wasm-thin/wasm-full/wasm-client）の rlib はメタデータハッシュ
        # サフィックスなしの固定ファイル名で出力される cargo の仕様上、
        # release.yml の検証ビルドが汚染した無ハッシュ rlib がキャッシュへ
        # 保存され、本ジョブの復元時に同型の flaky（「multiple different
        # versions of crate」E0277/E0599）を再発させ得る（詳細は clippy /
        # forbid-unsafe / test / gate-self-apply ジョブの同名ステップコメント、
        # docs/ci/hosted-runner-migration.md §3.3 参照）。本ジョブは
        # CARGO_TARGET_DIR を明示設定せず actions/cache の `path: target`
        # （リポジトリルートからの相対、既定の cargo target dir）をそのまま
        # 復元するため、他ジョブと異なり環境変数を経由せずリテラルパス
        # `target/` を直接削除対象にする（キャッシュされているディレクトリと
        # 同一の参照を削除する契約、イシュー #1226 finding 1）。固定ファイル名
        # のみを `rm -f` で個別削除し、glob や再帰削除は用いない（A01
        # パストラバーサル・広域削除の防止、security.md 参照）。
        run: |
          set -euo pipefail
          if [ -d "target/debug/deps" ]; then
            rm -f \
              "target/debug/deps/libfandhe_frontend_wasm_thin.rlib" \
              "target/debug/deps/libfandhe_frontend_wasm_thin.so" \
              "target/debug/deps/fandhe_frontend_wasm_thin.d" \
              "target/debug/deps/libfandhe_frontend_wasm_full.rlib" \
              "target/debug/deps/libfandhe_frontend_wasm_full.so" \
              "target/debug/deps/fandhe_frontend_wasm_full.d" \
              "target/debug/deps/libfandhe_frontend_wasm_client.rlib" \
              "target/debug/deps/libfandhe_frontend_wasm_client.so" \
              "target/debug/deps/fandhe_frontend_wasm_client.d"
          fi

      - name: cargo clippy (wasm32-unknown-unknown) -- -D warnings
        # --all-targets によりテストターゲット（browser テスト含む）も
        # コンパイル・lint 対象に含む。3 クレートを明示するのは、host target の
        # ワークスペース全体 clippy と異なり `-p` を絞らないと
        # wasm-client/wasm-thin の tests/ がコンパイルされずギャップが残るため。
        run: cargo clippy -p fandhe-frontend-wasm-full -p fandhe-frontend-wasm-client -p fandhe-frontend-wasm-thin --target wasm32-unknown-unknown --all-targets --locked -- -D warnings

  # イシュー #400（親 #394、出典: PR #382 out-of-scope）: `fw gate --project .`
  # の自己適用（#372 で PASS 化、PR #382）を CI で常時実行し、自己適用 PASS の
  # リグレッション（自己参照誤検知の再発・deny.toml 弱体化・structure.toml と
  # 実構成のドリフト等）を検出する。`fw gate` 本体（crates/cli/src/gate.rs）は
  # type_check/lint/lint_wasm32/test/policy/default_escape_check/
  # url_validation_check の 7 チェックを直列実行しリポジトリ直下
  # structure.toml の宣言クレートを対象とする（イシュー #1174 で
  # `lint_wasm32` を追加。本リポジトリは role = "client-entrypoint" を
  # 宣言する wasm-full/wasm-client/wasm-thin を持つため実走する）。
  gate-self-apply:
    name: "fw gate --project . self-apply (issue #400)"
    # ホステッドランナー移行（トラッキング #1220、実装 #1229）。test ジョブと同じ
    # 理由でクリーン VM 前提へ移行する。
    runs-on: ubuntu-latest
    # gate は check + clippy + clippy(wasm32) + test + deny を直列実行する
    # ため test ジョブより長めに確保する（イシュー #1174 で `lint_wasm32` を
    # 追加、wasm32 target 向け再コンパイルの分だけ余裕を拡大）。ホステッド
    # ランナー移行によるクリーンビルド化（キャッシュ消失）を見込み延長する
    # （イシュー #1229。実測後に調整）。
    timeout-minutes: 60
    # forbid-unsafe / clippy ジョブと同じ理由: gate の type_check / test は
    # -p fandhe-frontend-dist-server を含み、crates/dist-server/build.rs の WASM ネストビルド
    # （wasm32 target・wasm-bindgen-cli 起動）は本ジョブの runner に常設保証が
    # ないため明示オプトアウトする。統合 WASM ビルドの実証は test ジョブが
    # 専任する。
    env:
      FANDHE_FRONTEND_WASM_BUILD: "0"
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（test/clippy ジョブと同一 SHA に固定）。
        # docs/spec サブモジュールは gate の検証対象外のため取得しない。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # 他ジョブと同一 SHA 固定。gate の lint チェックが clippy を要求する
        # ため components: clippy を明示する。
        uses: Fandhe-AI/actions/rust-toolchain-setup@5982e2f502a19effc36a7b161660b5a4ea17b886
        with:
          components: clippy

      - name: "guard: 共有 CARGO_TARGET_DIR の無ハッシュ cdylib rlib を除去（イシュー #1192）"
        # forbid-unsafe / test ジョブの同名ステップと同一（詳細は forbid-unsafe
        # ジョブのステップコメント参照）。`fw gate --project .` は
        # `-p fandhe-frontend-dist-server` を含む type_check/test を実行し
        # cdylib+rlib クレートをビルドするため本ジョブにも前置する。
        run: |
          set -euo pipefail
          if [ -n "${CARGO_TARGET_DIR:-}" ] && [ -d "${CARGO_TARGET_DIR}/debug/deps" ]; then
            rm -f \
              "${CARGO_TARGET_DIR}/debug/deps/libfandhe_frontend_wasm_thin.rlib" \
              "${CARGO_TARGET_DIR}/debug/deps/libfandhe_frontend_wasm_thin.so" \
              "${CARGO_TARGET_DIR}/debug/deps/fandhe_frontend_wasm_thin.d" \
              "${CARGO_TARGET_DIR}/debug/deps/libfandhe_frontend_wasm_full.rlib" \
              "${CARGO_TARGET_DIR}/debug/deps/libfandhe_frontend_wasm_full.so" \
              "${CARGO_TARGET_DIR}/debug/deps/fandhe_frontend_wasm_full.d" \
              "${CARGO_TARGET_DIR}/debug/deps/libfandhe_frontend_wasm_client.rlib" \
              "${CARGO_TARGET_DIR}/debug/deps/libfandhe_frontend_wasm_client.so" \
              "${CARGO_TARGET_DIR}/debug/deps/fandhe_frontend_wasm_client.d"
          fi

      - name: Install cargo-deny / clippy component (ensure-gate-tools.sh)
        # `fw gate` の policy チェック（cargo deny）・lint チェック（clippy
        # component）が要求するツールを、バージョン固定 + SHA256 検証済み
        # プリビルトバイナリで用意する（イシュー #292/#314、ci.md 規約）。
        run: tools/ci/ensure-gate-tools.sh

      - name: "fw gate --project . 自己適用（PASS 常時保証, issue #400）"
        run: |
          set -euo pipefail
          # gate は JSON レポートを stdout へ出力し、gate_result に応じた
          # 終了コード（PASS=0 / BLOCKED=1 / usage=2 / ERROR=3。イシュー #1116
          # で ERROR 種別・終了コード 3 を追加）を返す（fail-closed、緩和経路
          # なし）。`gate_result: "ERROR"` は「実行環境にツールが無いだけ」
          # （clippy component / cargo-deny 未導入等）を構造的に表し、コード
          # 起因の BLOCKED とは区別して GitHub Actions アノテーションを
          # 出し分ける。区別は JSON 本文の `"gate_result":"ERROR"` を grep
          # するだけで判定できる（version-bump-guard と同じ「終了コードは
          # 0/非 0 のみを見て、種別判定は出力本文の grep に任せる」設計。
          # 終了コードから種別を読み分ける PIPESTATUS 方式は複雑化を避けて
          # 採らない）。
          #
          # `if PIPELINE; then` の条件式内であれば、GitHub Actions 既定の
          # `bash -e`（errexit）が有効なままでも pipefail によるパイプライン
          # 失敗で即座にスクリプトが中断されることはない
          # （version-bump-guard ジョブと同型のパターン、ci.md 規約）。
          if cargo run -p fandhe-frontend-cli --locked -- gate --project . | tee gate-report.json; then
            exit 0
          fi
          if grep -q '"gate_result":"ERROR"' gate-report.json; then
            echo "::error::fw gate ERROR: environment error (runner setup issue, not code). See 'environment error:' entries in the JSON report above; ensure tools/ci/ensure-gate-tools.sh ran successfully (see .claude/rules/ci.md)."
          else
            echo "::error::fw gate BLOCKED: code-caused check failure. See failing checks in the JSON report above."
          fi
          exit 1

  # イシュー #638: 公開済みクレート（crates.io）の実体（src/ Cargo.toml
  # build.rs）が変更されているのに Cargo.toml の version が既公開バージョンの
  # ままの PR を検知するゲート。headless-ui 0.1.0 公開直後、バージョンバンプ
  # なしの破壊的変更（radio_group::item への引数追加, PR #611）がマージされ、
  # crates.io バージョン依存の examples e2e が main を赤にした事故
  # （復旧: PR #634 + 0.2.0 再公開）が直接の動機。
  #
  # base ブランチと PR 本文が必要なため PR コンテキストでのみ実行する
  # （main push では対応する PR 情報がなく判定できないためスキップ）。
  version-bump-guard:
    name: "check-version-bump: published crate source changes require a version bump (issue #638)"
    if: ${{ github.event_name == 'pull_request' }}
    # ホステッドランナー移行（トラッキング #1220、実装 #1229）。
    runs-on: ubuntu-latest
    # cargo metadata・git diff・crates.io sparse index 照会のみの軽量ジョブ
    # だが、curl 呼び出しに `--connect-timeout`/`--max-time` を付けていても
    # ジョブ全体（チェックアウト・ビルド込み）が無期限に runner を
    # 占有しないよう保険として timeout-minutes を明示する
    # （イシュー #638 PR #647 レビュー指摘、他ジョブと同様の安全網）。
    # ホステッドランナーではジョブごとに xtask を毎回コールドビルドする分の
    # 余裕を見込み延長する（イシュー #1229）。
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout（他ジョブと同一 SHA 固定）。docs/spec サブモジュールは
        # 本チェックに不要なため取得しない。git diff の merge-base 算出に
        # 履歴全体が必要なため fetch-depth: 0 を明示する。fetch-depth: 0 は
        # `+refs/heads/*:refs/remotes/origin/*`（全ブランチ）を checkout 内部で
        # フェッチするため、xtask が参照する `origin/${{ github.base_ref }}`
        # はこの時点で既に存在する（別途 `git fetch origin <base>` は不要。
        # 過去に別ステップで実行し `persist-credentials: false` により認証情報が
        # 残らず失敗した実績があるため追加しないこと、イシュー #638 PR #647）。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust toolchain
        # 他ジョブと同一 SHA 固定。
        uses: Fandhe-AI/actions/rust-toolchain-setup@5982e2f502a19effc36a7b161660b5a4ea17b886

      - name: "prepare: write PR body to file"
        # PR 本文はユーザー制御の信頼しない入力であり、シェルへ直接展開せず
        # env 経由で受け取ってファイル化してから xtask へ渡す
        # （script injection 対策、security.md A03）。免除宣言
        # （version-bump-exempt: <crate-name>）の判定にのみ使う。
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "${PR_BODY}" > pr-body.txt

      - name: "check-version-bump: 公開済みクレートのバージョンバンプ漏れ検知"
        # crates.io（https://index.crates.io）への到達性を前提とする
        # （到達不可の場合は "environment error: " プレフィックス付きの
        # fail-closed な失敗として扱い、テストの弱体化で対処しない。
        # ci.md の他の crates.io バージョン依存ワークフローと同じ方針）。
        # PR 本文・base_ref は env 経由でのみ受け渡す（上記ステップ参照）。
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # `if PIPELINE; then` の条件式内であれば、GitHub Actions 既定の
          # `bash -e`（errexit）が有効なままでも pipefail によるパイプライン
          # 失敗で即座にスクリプトが中断されることはない（gate-self-apply
          # ジョブと同型のパターン）。旧実装は `set -uo pipefail`（-e を
          # 明示的に含めない）としていたが、`set` は列挙しなかったオプションを
          # 解除しない仕様のため、GitHub Actions のデフォルト起動オプション
          # （`bash --noprofile --norc -eo pipefail {0}`）由来の -e が働いた
          # ままとなり、パイプライン失敗時に `PIPESTATUS` 判定・"environment
          # error: " grep 判定へ到達する前にジョブが中断していた
          # （イシュー #638 PR #647 レビュー指摘）。
          #
          # stdout/stderr をまとめて 1 ファイルへ tee する（プロセス置換
          # `2> >(...)` は書き込み完了を待たずに後続コマンドへ進むレースが
          # あるため使わない。標準出力の 1 行サマリ・標準エラーの
          # "environment error: " 判定のいずれもこのログファイルから行う）。
          if cargo run -p xtask --locked -- check-version-bump \
              --base-ref "origin/${BASE_REF}" \
              --pr-body-file pr-body.txt 2>&1 | tee check-version-bump.log; then
            exit 0
          fi
          # "environment error: " プレフィックス有無で「runner/ネットワーク
          # 起因」と「コード起因（バンプ漏れ）」を区別する（gate-self-apply と同型、
          # ci.md 規約）。さらに、バンプ漏れの断定は 1 行サマリの
          # `result=FAIL` 行の有無で確認する: `cargo metadata`/`git diff` の
          # 呼び出し自体が失敗した場合（例: `origin/${BASE_REF}` が fetch
          # されていない）は `CommandFailed` として "environment error: "
          # プレフィックスなしで報告されるが、バンプ漏れの断定ではないため
          # 「バンプせよ」という誤った注釈を出さない
          # （イシュー #638 PR #647 レビュー指摘）。
          if grep -q 'environment error: ' check-version-bump.log; then
            echo "::error::check-version-bump failed: environment error (runner/network issue, not code). See 'environment error:' lines above; verify this runner can reach https://index.crates.io."
          elif grep -q '^version-bump-check:.*result=FAIL' check-version-bump.log; then
            echo "::error::check-version-bump failed: a published crate's sources changed but its version is unchanged from an already-published crates.io version (see 'version-bump-check:'/'result=FAIL' lines above). Either bump the version, or declare 'version-bump-exempt: <crate-name>' (with rationale) in the PR body if the change is not public-API-breaking."
          else
            echo "::error::check-version-bump failed for a reason other than a detected missing version bump (e.g. a 'cargo'/'git' command failure such as an unfetched base ref) or an already-classified environment error. See the log above for details; this is likely a runner/checkout issue rather than a version-bump omission."
          fi
          exit 1

  # イシュー #657: workspace 内メンバー間の `path + version` 併記依存につい
  # て、依存元の `version = "..."` 要求が依存先の現行 version へ追随してい
  # るかを検知するジョブ（`check_dep_versions` モジュール）。headless-ui
  # 0.1.0 → 0.2.0 バンプ時、依存元（pre-styled-ui / wasm-full / xtask）の
  # `version = "..."` 追随が sed による手動一括変更を要した実績
  # （check-version-bump の是正メッセージによる注意喚起のみでは機械検知
  # 手段がなかった、PR #647 out-of-scope）が動機。`cargo metadata --no-deps`
  # のみで完結しネットワーク照会を一切行わないため、version-bump-guard と
  # 異なり push・PR 双方（ワークフロー全体のトリガーに従う）で常時実行する。
  dep-version-check:
    name: "check-dep-versions: workspace 内 path+version 併記依存の version 追随検知（issue #657）"
    # ホステッドランナー移行（トラッキング #1220、実装 #1229）。
    runs-on: ubuntu-latest
    # ホステッドランナーではジョブごとに xtask を毎回コールドビルドする分の
    # 余裕を見込み延長する（イシュー #1229。ネットワーク照会なしの設計は不変）。
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（他ジョブと同一 SHA 固定）。docs/spec サブ
        # モジュール・全ブランチ履歴は本チェックに不要なため取得しない
        # （cargo metadata --no-deps のみで完結し git diff は使わない）。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # 他ジョブと同一 SHA 固定。
        uses: Fandhe-AI/actions/rust-toolchain-setup@5982e2f502a19effc36a7b161660b5a4ea17b886

      - name: Run xtask check-dep-versions
        # xtask check-dep-versions の終了コードをそのまま CI の成否に伝播
        # させる（fail-closed）。set -o pipefail を明示し、tee 経由でも
        # cargo run の終了コードが失われないようにする。`--locked` はこの
        # 外側の cargo run が Cargo.lock を書き換えないことを保証する
        # （deps-check/loc-check ジョブと同一の理由）。既定（--fix なし）は
        # 検知のみで、書き換えはローカル用途に限定する。
        run: |
          set -o pipefail
          cargo run --locked -p xtask -- check-dep-versions | tee dep-version-check.log

      - name: Publish dep-version-check summary
        if: always()
        # format_report（crates/xtask/src/check_dep_versions.rs）の 1 行
        # サマリ契約「dep-version-check: crate=<name> dep=<name>
        # kind=<normal|dev|build> req=<req> actual=<v> result=<PASS|FAIL>」を
        # Step Summary に転記する。この契約はテストで固定される
        # （crates/xtask/tests/cli_check_dep_versions.rs）。
        run: |
          {
            echo '## dep-version-check (issue #657)'
            echo '```'
            grep '^dep-version-check:' dep-version-check.log || echo 'dep-version-check: no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TASK-2.1 (REQ-2): コアクレートの unsafe 不使用を機械的に強制するジョブ。
  # 一次防御 = #![forbid(unsafe_code)] 属性（ビルド時 lint、削除は下記テストが検知）
  # 二次防御 = crates/core/tests/unsafe_boundary.rs（属性の実在・unsafe トークン不在・core 外部依存ゼロ）
  # 三次防御 = 本ジョブの RUSTFLAGS='-F unsafe_code' による cargo check（属性とテストが
  # 同時に外された場合でも、コマンドラインからの forbid はソース側の allow で上書きできない）
  #
  # #155 (REQ-11 受け入れ基準 2): 上記の safe 域（crates/core/interactive 等、forbid 採用）に加え、
  # `wasm-full`（deny 採用。#[wasm_bindgen] 展開コードの内部 unsafe と衝突するため forbid 不採用）
  # のアプリロジック層（自作コード）にも forbid 相当の CI 強制を適用する。実体は下記
  # `cargo test -p fandhe-frontend-core --test unsafe_boundary` に含まれる `ffi_deny_crates_*` テスト
  # （crates/core/tests/unsafe_boundary.rs の DENY_UNSAFE_FFI_MEMBERS）であり、本ジョブ自体に
  # 追加のステップは不要（deny 域は `RUSTFLAGS='-F unsafe_code'` 適用外のまま、
  # wasm-bindgen 展開コードの unsafe との衝突を避ける）。
  # UNSAFE_ALLOWED_MEMBERS（crates/wasm-client/wasm-thin）は引き続きスコープ外（#155 参照）。
  #
  # ファイル名は汎用の ci.yml とし、ジョブ名を目的特化の forbid-unsafe とする。
  # 後続の CI 系タスク（fmt/clippy・依存グラフ計測等）は同一ファイルへ
  # ジョブを追加していく前提の拡張可能な構成とする。
  forbid-unsafe:
    name: Forbid unsafe in core crates (+ wasm-full deny boundary)
    runs-on: self-hosted
    # TASK-10.2b（#110）: crates/dist-server/build.rs は既定で WASM ビルドステージ
    # （ネスト cargo build + wasm-bindgen）を実行するが、本ジョブは
    # (a) self-hosted のためツールチェーン（wasm32 target・wasm-bindgen-cli）が
    #     常設されている保証がなく、(b) 下記 `RUSTFLAGS='-F unsafe_code'` を
    #     ネストビルドへ伝播させたくない（wasm-bindgen/web-sys の FFI 境界が
    #     正当に使う unsafe と衝突する）ため、本ジョブに限り明示オプトアウトする。
    # 統合ビルドの実証は `test` ジョブが担う。
    env:
      FANDHE_FRONTEND_WASM_BUILD: "0"
    steps:
      - name: Checkout
        # actions/checkout v6.0.3（update-external.yml と同一 SHA に固定）
        # docs/spec サブモジュールはテストに不要のため取得しない（既定で submodules: false）
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定: self-hosted runner プールには
        # cargo が PATH 上に存在しないインスタンスが混在し得るため、Checkout 直後に
        # 導入する（既に導入済みなら何もしない）。PR #291 で他の cargo 系ジョブへ
        # 適用済みの保険を本ジョブにも揃える（イシュー #313）。
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Show toolchain
        run: rustup show && cargo --version

      - name: Install cargo-deny / clippy component (ensure-gate-tools.sh)
        # 本ジョブ末尾の `cargo test --workspace` は negative_cases.rs（fw gate
        # の lint / policy チェック）を含むため、test ジョブと同様に clippy
        # component / cargo-deny のブートストラップが必要（イシュー #292 の
        # 標準ブートストラップ、ci.md 参照）。前置がないと runner の導入状態
        # 次第で baseline_fixture_passes_core_checks が間欠的に BLOCKED → FAIL
        # になる（PR #332 の CI で実際に発生）。
        run: tools/ci/ensure-gate-tools.sh

      - name: "unsafe 境界の回帰テスト（safe 域: forbid 属性・unsafe トークン・core 依存ゼロ／wasm-full deny 域: deny 属性・unsafe トークン・allow 上書き不在、#155）"
        run: cargo test -p fandhe-frontend-core --test unsafe_boundary --locked

      # NOTE: -F (forbid) はソース側の #[allow(unsafe_code)] で上書きできないため、
      # 属性が誤って削除された場合の独立した防御線になる。
      # crates/wasm-client/wasm-full/wasm-thin は #![deny(unsafe_code)] 採用クレートだが、
      # native（このステップのデフォルトターゲット）ビルドでは各クレートの
      # #[cfg(target_arch = "wasm32")] ゲート配下（wasm-full の entry/Runtime/
      # dom::paint 等、#[wasm_bindgen] 展開を含む箇所）がコンパイル対象から
      # 外れるため、`-F unsafe_code` を付けた `cargo check --workspace` は
      # 実測どおり workspace 全体（wasm 系クレートを含む）で成功する
      # （wasm32 ターゲット向けに同様のチェックを行うと wasm_bindgen 展開の
      # unsafe と衝突して失敗するため、このステップは意図的に native のみ）。
      # wasm32 ゲート配下の自作コードに対する forbid 相当の強制は、native の
      # 本ステップではなく上記のソーステキスト走査テスト（DENY_UNSAFE_FFI_MEMBERS）
      # が担う。クレート追加時は crates/core/tests/unsafe_boundary.rs の
      # UNSAFE_ALLOWED_MEMBERS / DENY_UNSAFE_FFI_MEMBERS と同期して更新すること。
      - name: ビルド時 lint による強制（属性とテストの双方が同時に外された場合の三重防御）
        run: RUSTFLAGS='-F unsafe_code' cargo check --workspace --locked

      - name: workspace 全テスト（XSS 回帰・エスケープ仕様テストを含む）
        run: cargo test --workspace --locked

  # TASK-1.2b（#10）: XSS 回帰テスト（REQ-1）を含む Rust テスト CI。
  # ユーザー指示（2026-07-18）により self-hosted へ移行。forbid-unsafe ジョブ
  # （deps-check.yml の "Setup Rust toolchain" と同一 SHA 固定・同一目的）と
  # 同じく、workspace テストを実行してクロスプラットフォームの回帰を検知する。
  test:
    name: Rust workspace tests
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v4.2.2。docs/spec/ サブモジュールはテストに不要なため
        # submodules: false でチェックアウト面を最小化する（サプライチェーン対策）。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定: self-hosted runner プールには
        # cargo が PATH 上に存在しないインスタンスが混在し得るため、Checkout 直後に
        # 導入する（既に導入済みなら何もしない）。
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: XSS regression tests (REQ-1)
        # REQ-1（既定エスケープ）の受け入れ基準を担保するゲート。
        # SSR/SSG/CSR 経路の XSS 回帰テストを独立ステップとして可視化する。
        # headless-ui / pre-styled-ui（イシュー #553）も REQ-1 ゲートとして
        # 独立ステップで可視化する（`cargo test --workspace` の暗黙包含に依存しない）。
        run: |
          cargo test -p fandhe-frontend-core --test xss_escape --locked
          cargo test -p fandhe-frontend-headless-ui --test xss_escape --locked
          cargo test -p fandhe-frontend-pre-styled-ui --test xss_escape --locked

      # TASK-13.3c（#141）: `fw gate`（crates/cli/src/gate.rs）の `policy` チェックは
      # `cargo deny check bans licenses sources` を実際に起動する。cargo-deny
      # 本体が未導入だと `crates/cli/tests/negative_cases.rs` はフォールバック分岐
      # （cargo-deny 起動失敗 → fail-closed で policy failed）しか検証できず、
      # TASK-4.1 の deny.toml と `policy` チェックが実際に接続されている
      # ことを常時実証できない。ここでバージョン固定 + SHA256 チェックサム
      # 検証付きプリビルトバイナリを導入し、以降の `cargo test --workspace`
      # 実行下で strict 分岐（ベースライン PASS・banned 依存検出の具体的な
      # ブロック理由）が実行されるようにする（下記 wasm-bindgen-cli の
      # 導入ステップと同一のサプライチェーン対策パターン、security.md A06）。
      - name: Install cargo-deny / clippy component (ensure-gate-tools.sh)
        # イシュー #292: self-hosted runner プールは clippy component /
        # cargo-deny の導入状態がインスタンスごとに異なり、`fw gate` の
        # `lint` / `policy` チェックが間欠的に BLOCKED になっていた。バージョン
        # 固定 + SHA256 チェックサム検証 + atomic install（旧: 本ステップ直下、
        # PR #291 Bugbot 指摘 BUGBOT_BUG_ID: 1c88c06e / コミット 64ecb28 対応）の
        # ロジックは `tools/ci/ensure-gate-tools.sh` へ一元化し、`fw gate` を
        # ローカル・自己保守フックから直接呼ぶ経路とバージョン pin を共有する
        # （ci.yml 側と二重管理してドリフトさせない）。
        run: tools/ci/ensure-gate-tools.sh

      # TASK-13.3c（#141）: 「連携」の回帰固定そのものを可視化する独立ステップ。
      # 上記で cargo-deny を導入済みの本ジョブでは negative_cases.rs が strict
      # 分岐（cargo-deny 実行・banned 依存の具体的検出）まで実行され、
      # TASK-4.1 deny.toml ↔ `policy` チェックの連携が実証される
      # （cargo-deny 未導入環境向けの fail-closed 分岐は同ファイル側の環境
      # 判定 `cargo_deny_available()` が担保するため、CI では本ステップが
      # strict 側を実行することを以て「常時検証」とする）。あわせて
      # `xss_regression_link.rs` により、`test` チェックが XSS 回帰テスト
      # （TASK-1.2）の合否をそのまま反映し `default_escape_check` とは
      # 独立にゲートを BLOCK することを検証する。
      - name: "Gate linkage tests (TASK-13.3c: cargo-deny / XSS regression)"
        run: cargo test -p fandhe-frontend-cli --test negative_cases --test xss_regression_link --locked

      # イシュー #159（REQ-1、親 #157）の受け入れ条件「偽装回避不能テストが通過し
      # CI でブロックされる」の直接証跡。`raw_html_lint_e2e.rs` は実際に
      # `cargo clippy` を起動し、直接呼び出し・コメント偽装・リネーム import の
      # いずれも `clippy::disallowed_methods` で拒否され、`#[expect(...,
      # reason = "ESCAPE-REVIEWED: ...")]` を付与した呼び出しのみ受理される
      # ことを実証する（詳細は docs/design/raw-html-lint-design.md）。上記ステップの
      # `cargo test --workspace` 実行に暗黙包含されるだけでは受け入れ条件の
      # 充足が CI 上で可視化されないため、本ステップとして独立させる。
      - name: "REQ-1 raw_html() 偽装回避不能テスト (issue #159)"
        run: cargo test -p fandhe-frontend-cli --test raw_html_lint_e2e --locked

      # イシュー #351（親 #338）の受け入れ条件「`fw new` 生成直後に `fw gate`
      # が PASS する構成保証」の直接証跡。`fw new` が展開する
      # `templates/default/` と `fw gate` の前提（`structure.toml` の宣言
      # クレート・`clippy.toml` の disallowed-methods・`deny.toml`）が
      # ドリフトすると生成直後のプロジェクトが無編集で BLOCKED になり得る
      # ため、上記ステップで導入済みの cargo-deny を用いて strict 分岐
      # （6 チェック全 PASS）を本ジョブで常時実証する
      # （`crates/cli/tests/new_gate_e2e.rs` 冒頭コメント参照）。
      - name: "fw new 生成直後の fw gate PASS 構成保証 (issue #351、examples 除く)"
        run: cargo test -p fandhe-frontend-cli --test new_gate_e2e --locked -- --skip example_

      # イシュー #505: examples e2e 4 件（`fw_new_example_*_output_passes_fw_gate`、
      # crates.io 依存の cargo ビルドを伴う `fw gate` 検証）の所要時間を
      # ステップ単位で常時計測可視化する。上のステップと合わせて
      # `new_gate_e2e.rs` 全件を実行する（`--skip example_` と `example_` の
      # フィルタは相補的で重複・漏れがないことを確認済み）。
      #
      # 前提: self-hosted runner が crates.io（https://index.crates.io・
      # https://static.crates.io）へ到達可能であること（`.claude/rules/ci.md`
      # #412/#493 と同一前提。到達不可は環境エラーとして扱い、テストの
      # 弱体化で対処しない）。
      #
      # 実測（#505 時点、main push run 29824015053）: 4 件合計で数秒
      # （ステップ全体で約 8 秒）であり、ジョブ分離判断基準（+10 分超）に
      # 遠く及ばないため `examples-gate-e2e` ジョブへの分離は行っていない。
      # 本ステップの所要時間が恒常的に 10 分超となった場合、`test` ジョブ側は
      # `--skip example_` のみ残し、本ステップの内容を専用の
      # `examples-gate-e2e` ジョブ（同構成の checkout / rust-toolchain /
      # ensure-gate-tools.sh を前置、runs-on: self-hosted）へ分離することを
      # 再検討する。
      - name: "examples gate e2e 4 件の実行と時間計測 (issue #505)"
        run: cargo test -p fandhe-frontend-cli --test new_gate_e2e --locked -- example_

      # TASK-10.2b（#110、REQ-10 条件 3）: crates/dist-server/build.rs が既定で実行する
      # WASM ビルドステージ（ネスト `cargo build --target wasm32-unknown-unknown`
      # + `wasm-bindgen`）に必要なツールチェーンを導入する。本ジョブに限り
      # オプトアウトせず統合ビルドをそのまま実行することで、単一 `cargo build`
      # からネイティブ + WASM 双方の成果物が生成されることを CI で実証する。
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # wasm-bindgen-cli は crates/dist-server/build.rs が Cargo.lock 解決済み
      # wasm-bindgen クレートとのバージョン完全一致を要求する（バージョン
      # 不一致の CLI で生成した JS グルーコードが壊れる既知の制約への対策、
      # `crates/dist-server/build.rs` の expected_wasm_bindgen_version 参照）。
      # ここで固定するバージョンは Cargo.lock の wasm-bindgen と一致させ、
      # バージョンアップ時は両方を合わせて更新すること。
      # バージョン固定 + SHA256 チェックサム検証付きプリビルトバイナリの導入
      # （browser-test/perf-harness ジョブの wasm-pack 導入と同一パターン、
      # サプライチェーン対策）。
      - name: Install wasm-bindgen-cli (pinned + checksum-verified, atomic install)
        # self-hosted 移行に伴い、インストール先を /usr/local/bin から
        # $HOME/.local/share/wasm-bindgen/<version>/ へ変更する（cargo-deny と
        # 同じ理由）。
        #
        # Cursor Bugbot 指摘（BUGBOT_BUG_ID: 1c88c06e、PR #291、"Shared HOME
        # Chrome install races" の一般形）: 複数ジョブが並列実行される
        # self-hosted では、共有 $HOME 配下の同一固定パスへ複数ジョブが同時に
        # download/展開/install すると互いのツリーやバイナリを破損し得る
        # （実際に「wasm-bindgen 本体のみ存在し wasm-bindgen-test-runner が
        # 無い不完全な組」が観測された、PR #291 実 CI 実行）。対策として
        # バージョン文字列をパスに含めた不変パスへインストールし、一時
        # ディレクトリ（$HOME と同一ファイルシステム上）でダウンロード・
        # チェックサム検証・展開を完了させたうえで `mv -T`（同一ファイル
        # システム内なら atomic rename）で最終配置する。mv の終了コードには
        # 依存せず、失敗時は宛先に完全な成果物が既にあるかで成否を判定する
        # （coreutils 9.2 以降は `mv -n` が宛先既存時に非ゼロ終了するように
        # なったため `-n` は使わない。Cursor Bugbot 指摘 High/Medium、
        # コミット 64ecb28 対応）。`wasm-bindgen` と
        # `wasm-bindgen-test-runner` は同一の展開ディレクトリを丸ごと
        # 配置することで常に組として揃う（個別コピーによる部分installを
        # 排除）。並列実行時に後勝ちの mv はサイレントに no-op となる
        # （同一バージョンの内容は決定的に同一であるため安全）。
        run: |
          set -euo pipefail
          WASM_BINDGEN_VERSION="0.2.126"
          WASM_BINDGEN_SHA256="064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d"
          SHARE_DIR="${HOME}/.local/share/wasm-bindgen"
          INSTALL_DIR="${SHARE_DIR}/${WASM_BINDGEN_VERSION}"
          mkdir -p "${SHARE_DIR}"
          if [ ! -x "${INSTALL_DIR}/wasm-bindgen" ] || [ ! -x "${INSTALL_DIR}/wasm-bindgen-test-runner" ]; then
            tmp_root="$(mktemp -d "${SHARE_DIR}/.tmp-XXXXXX")"
            trap 'rm -rf "${tmp_root}"' EXIT
            ARCHIVE="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            URL="https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${ARCHIVE}"
            curl -sSfL -o "${tmp_root}/${ARCHIVE}" "${URL}"
            echo "${WASM_BINDGEN_SHA256}  ${tmp_root}/${ARCHIVE}" | sha256sum -c -
            tar xzf "${tmp_root}/${ARCHIVE}" -C "${tmp_root}"
            # mv の終了コードには依存しない（coreutils 9.2 以降は `mv -n` が
            # 宛先既存時に非ゼロ終了するため。Cursor Bugbot 指摘 High/Medium、
            # コミット 64ecb28 対応。詳細は cargo-deny インストールステップの
            # コメント参照）。
            if ! mv -T "${tmp_root}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl" "${INSTALL_DIR}" 2>/dev/null; then
              if [ ! -x "${INSTALL_DIR}/wasm-bindgen" ] || [ ! -x "${INSTALL_DIR}/wasm-bindgen-test-runner" ]; then
                echo "::error::failed to install wasm-bindgen-cli to ${INSTALL_DIR}" >&2
                exit 1
              fi
            fi
          fi
          echo "${INSTALL_DIR}" >> "$GITHUB_PATH"

      - name: Workspace tests
        run: cargo test --workspace --locked

  # TASK-10.1a（#106）: fandhe-frontend-dist-server の開発 / 本番モード切り替え
  # （`crates/dist-server/src/assets.rs` の `AssetMode`）を CI で両モードとも検証する。
  #
  # 上記 `test` ジョブの `cargo test --workspace` はデフォルトの debug ビルド
  # （= DevFilesystem モード、`static/` からのファイルシステム読み込み経路）
  # のみをカバーする。本ジョブは `--features force-embed` を付与し、debug
  # ビルドのまま Embedded モード（本番相当の埋め込みテーブル検索経路）を
  # 強制して検証する（PoC-4 検証方法 5 の CI 化。`Cargo.toml` の
  # `force-embed` フィーチャーコメント参照）。
  dist-server-embedded-mode:
    name: fandhe-frontend-dist-server embedded mode (force-embed)
    runs-on: self-hosted
    timeout-minutes: 15
    # TASK-10.2b（#110）: 本ジョブの目的は force-embed フィーチャーによる
    # AssetMode 切り替え検証（static/ 埋め込みテーブル経路）であり、WASM
    # ビルドステージの統合検証は `test` ジョブが専任する。責務を分離し
    # 本ジョブの実行時間・依存ツールチェーンを増やさないためオプトアウトする。
    env:
      FANDHE_FRONTEND_WASM_BUILD: "0"
    steps:
      - name: Checkout
        # actions/checkout v4.2.2（他ジョブと同一 SHA 固定）。
        # docs/spec サブモジュールはテストに不要のため取得しない。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定（self-hosted runner プールに
        # cargo 未導入インスタンスが混在し得るための保険。導入済みなら何もしない）。
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Isolated run acceptance test (REQ-9)
        # TASK-9.2（#98/#99）: REQ-9（単一バイナリ配布）の受け入れ基準
        # 「外部ファイル・Node ランタイム・依存インストールなしで自己完結
        # して動作すること」を固定する `tests/isolated_run.rs` を独立ステップ
        # として可視化する（`docs/reports/isolated-run-acceptance-report.md` 第 3 節
        # 「CI 統合」）。同ファイルは
        # `#![cfg(any(not(debug_assertions), feature = "force-embed"))]` で
        # ゲートされており、本ジョブの `--features force-embed` 下でのみ
        # コンパイル・実行される（下段の全体テストにも含まれるが、受け入れ
        # 基準ゲートであることを CI 上で明示するため独立ステップとして
        # 先に実行する）。
        run: cargo test -p fandhe-frontend-dist-server --test isolated_run --features force-embed --locked

      - name: fandhe-frontend-dist-server tests (force-embed, Embedded mode)
        run: cargo test -p fandhe-frontend-dist-server --features force-embed --locked

  # TASK-6.3a（#65）: 実ブラウザ（headless Chromium）でのハイドレーション検証環境。
  # docs/spec/05-tasks.md TASK-6.3 が指名する wasm-pack test --headless --chrome を
  # ubuntu-latest（Chrome/chromedriver プリインストール済み）で実行するジョブ。
  #
  # crates/wasm-client/（fandhe-frontend-wasm-client）は TASK-6.2b（#48）でクレート新設予定だが本コミット時点
  # では未作成（#48/#49 は open）。本イシューはクレート新設をスコープに含めない
  # （docs/api/hydration-api.md 第 5 節の引き継ぎ表・#48 との責務混線回避のため）。
  # そのため各ステップは check-wasm-client の存在判定結果でガードし、
  # crates/wasm-client/ が存在しない間は環境整備のみ・実行はスキップする。
  # #48/#49 マージ後、後続タスク（TASK-6.3b #66 の hydration_browser.rs 等）が
  # 追加された時点で本ジョブは自動的に有効化される。
  #
  # TASK-11.2d（#77）: 上記と同じ存在ガードパターンで `crates/wasm-full/`
  # （`Runtime::mount`/`hydrate` の実ブラウザ統合テスト、
  # `crates/wasm-full/tests/runtime_browser.rs`）も本ジョブへ同居させる
  # （`docs/design/wasm-full-architecture.md` 第 5 節の引き継ぎ）。xss-wasm-test・
  # perf-harness ジョブ（同じ wasm-full クレートだが対象テストファイルが
  # 異なる）はそのまま独立ジョブとして維持し、変更しない。
  browser-test:
    name: Browser tests (wasm-pack --headless --chrome)
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v4.2.2（test ジョブと同一 SHA 固定）。
        # docs/spec サブモジュールはテストに不要のため取得しない。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定（self-hosted runner プールに
        # cargo 未導入インスタンスが混在し得るための保険。導入済みなら何もしない）。
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      # 前提（self-hosted 移行、ユーザー指示 2026-07-18。PR #291 実 CI 実行で
      # self-hosted runner（コンテナ型、root 実行）には Chrome も
      # chromedriver も存在せず fail-closed で失敗することを確認）: GitHub-hosted
      # ubuntu-latest は Chrome/chromedriver をプリインストール済みだが、
      # self-hosted にはその保証がないため、Chrome for Testing（Google 公式の
      # テスト専用ビルド）と対応バージョンの chromedriver をこのジョブ内で
      # バージョン固定 + SHA256 チェックサム検証付きで導入する（他ジョブの
      # cargo-deny/wasm-bindgen-cli/wasm-pack と同一のサプライチェーン対策
      # パターン）。ダウンロード元は Chrome for Testing の公式配布元
      # （storage.googleapis.com/chrome-for-testing-public）。
      - name: Ensure unzip is available (self-hosted minimal image)
        # Chrome for Testing は .zip 配布のため unzip が必要。他の pinned
        # ツール（wasm-pack 等）は .tar.gz のため今まで unzip 不要だった。
        # 存在チェック付きインストール（root 実行のため sudo 不要）。
        run: |
          set -euo pipefail
          if ! command -v unzip >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y --no-install-recommends unzip
            else
              echo "::error::unzip not found and apt-get unavailable. self-hosted runner image requires unzip pre-installed." >&2
              exit 1
            fi
          fi

      - name: Install Chrome for Testing + chromedriver (Stable channel, pinned + checksum-verified)
        id: install_chrome
        # バージョン・SHA256 は https://googlechromelabs.github.io/chrome-for-testing/ の
        # last-known-good-versions-with-downloads.json（Stable チャンネル）から取得し、
        # ダウンロード物を実際に sha256sum で検証した値を固定する。chrome と
        # chromedriver は必ず同一バージョンを使う（プロトコル不一致による
        # セッション確立失敗を避けるため）。
        # chromedriver は Linux 上で Chrome バイナリを PATH から名前 "chrome"
        # （chromium/chromium の chrome_finder.cc GetChromeProgramNames 参照）で
        # 探索するため、Chrome の実行ファイルは同梱リソース（*.pak/icudtl.dat/
        # 共有ライブラリ）と同一ディレクトリに置いたまま、そのディレクトリ自体を
        # PATH に追加する（バイナリ単体だけを移動すると壊れる）。
        # atomic install（Cursor Bugbot 指摘 BUGBOT_BUG_ID: 1c88c06e、PR #291、
        # "Shared HOME Chrome install races"）: 複数ジョブが並列実行される
        # self-hosted では、共有 $HOME 配下の同一固定パスへ複数ジョブが同時に
        # download/unzip/install すると互いのツリーやバイナリを破損し得る。
        # 対策として CFT_VERSION をパスに含めた不変パス
        # （$HOME/.local/share/chrome-for-testing/<version>/）へインストールし、
        # $HOME と同一ファイルシステム上の一時ディレクトリでダウンロード・
        # チェックサム検証・展開を完了させたうえで、chrome-linux64 /
        # chromedriver-linux64 の各ディレクトリ丸ごとを `mv -T`（atomic
        # rename）で最終配置する。最終パスが既に存在すれば（＝バージョン
        # 一致で完全にインストール済み）ダウンロードをスキップする。
        # chrome/chromedriver 2 本の mv は互いに独立させ、かつ mv の終了
        # コードには依存しない（coreutils 9.2 以降は `mv -n` が宛先既存時に
        # 非ゼロ終了するため `-n` は使わず、失敗時は宛先の実体で成否を判定
        # する）。並列実行時に後勝ちの mv は宛先の実体確認により成功扱いと
        # なる（同一バージョンの内容は決定的に同一であるため安全。Cursor
        # Bugbot 指摘 High: 「chrome の mv 失敗で chromedriver が永久に
        # 未導入」/ Medium: 「並列後勝ちで mv 失敗しジョブが落ちる」、
        # コミット 64ecb28 対応）。
        run: |
          set -euo pipefail
          CFT_VERSION="151.0.7922.34"
          CHROME_SHA256="ae8736ac28bc69278551500f219fc749575648263c43ec5990749eff43b9fcf8"
          CHROMEDRIVER_SHA256="3c2b6780156f44f3a26db5bee4a3b193d608eda55644de5287e6edf4aef2f4ac"
          SHARE_DIR="${HOME}/.local/share/chrome-for-testing"
          INSTALL_ROOT="${SHARE_DIR}/${CFT_VERSION}"
          CHROME_DIR="${INSTALL_ROOT}/chrome-linux64"
          CHROMEDRIVER_DIR="${INSTALL_ROOT}/chromedriver-linux64"
          mkdir -p "${SHARE_DIR}" "${INSTALL_ROOT}"
          if [ ! -x "${CHROME_DIR}/chrome" ] || [ ! -x "${CHROMEDRIVER_DIR}/chromedriver" ]; then
            tmp_root="$(mktemp -d "${SHARE_DIR}/.tmp-XXXXXX")"
            trap 'rm -rf "${tmp_root}"' EXIT

            curl -sSfL -o "${tmp_root}/chrome-linux64.zip" "https://storage.googleapis.com/chrome-for-testing-public/${CFT_VERSION}/linux64/chrome-linux64.zip"
            echo "${CHROME_SHA256}  ${tmp_root}/chrome-linux64.zip" | sha256sum -c -
            unzip -q -o "${tmp_root}/chrome-linux64.zip" -d "${tmp_root}"

            curl -sSfL -o "${tmp_root}/chromedriver-linux64.zip" "https://storage.googleapis.com/chrome-for-testing-public/${CFT_VERSION}/linux64/chromedriver-linux64.zip"
            echo "${CHROMEDRIVER_SHA256}  ${tmp_root}/chromedriver-linux64.zip" | sha256sum -c -
            unzip -q -o "${tmp_root}/chromedriver-linux64.zip" -d "${tmp_root}"

            # chrome ツリー・chromedriver ツリーの配置は互いに独立させる
            # （どちらかが「宛先既存」で失敗しても、もう片方のインストールは
            # 必ず進む）。また mv の終了コードには依存しない（coreutils 9.2
            # 以降は `mv -n` が宛先既存時に非ゼロ終了するため、`-n` は使わず
            # 失敗時に宛先の実体で成否を判定する。Cursor Bugbot 指摘
            # High: 「chrome の mv 失敗で chromedriver が永久に未導入のまま
            # 壊れる」/ Medium: 「並列ジョブの後勝ち mv が宛先既存で失敗し
            # ジョブが落ちる」、コミット 64ecb28 対応）。
            if ! mv -T "${tmp_root}/chrome-linux64" "${CHROME_DIR}" 2>/dev/null; then
              [ -x "${CHROME_DIR}/chrome" ] || { echo "::error::failed to install Chrome for Testing to ${CHROME_DIR}" >&2; exit 1; }
            fi
            if ! mv -T "${tmp_root}/chromedriver-linux64" "${CHROMEDRIVER_DIR}" 2>/dev/null; then
              [ -x "${CHROMEDRIVER_DIR}/chromedriver" ] || { echo "::error::failed to install chromedriver to ${CHROMEDRIVER_DIR}" >&2; exit 1; }
            fi
          fi

          echo "${CHROME_DIR}" >> "$GITHUB_PATH"
          echo "chromedriver_path=${CHROMEDRIVER_DIR}/chromedriver" >> "$GITHUB_OUTPUT"

      - name: Verify headless Chrome launches (self-hosted shared-library check)
        # Chrome for Testing の実行に必要な共有ライブラリ（libnss3 / libgbm1 /
        # libasound2 等）が self-hosted のコンテナイメージに無い場合、バイナリは
        # 存在してもここで失敗する。fail-closed のまま、不足ライブラリを ldd で
        # 特定してエラーに含める（runner イメージ側の常設要件を明示するため）。
        run: |
          set -euo pipefail
          check_chrome() {
            chrome --headless --no-sandbox --disable-gpu --dump-dom about:blank >/tmp/chrome-smoke.log 2>&1
          }
          if ! check_chrome; then
            # PR #291 実 CI 実行で判明: 本 self-hosted runner イメージには
            # libnspr4/libnss3（libnssutil3・libsmime3 を含む）が不足しており
            # Chrome が起動できない（`chrome: error while loading shared
            # libraries: libnspr4.so: cannot open shared object file`）。
            # PR #305 実 CI 実行（イシュー #292）で追加判明: libnss3/libnspr4
            # のみの自動導入では不足で、libatk-1.0.so.0 等 Chromium 実行に
            # 必要な共有ライブラリ群（ATK / D-Bus / X11 / Cairo・Pango /
            # ALSA / GBM / AT-SPI 系）が広く不足していた。runner イメージの
            # ベースにはデスクトップ GUI 系パッケージが入っていない前提のため、
            # Chrome for Testing（Chromium 系）が要求する共有ライブラリを
            # 提供する Debian/Ubuntu パッケージ一式をまとめて自動導入する。
            # root 実行のため sudo なしで apt-get install できることを利用し、
            # 既知の不足パッケージを自動導入して 1 回だけ再試行する。
            echo "::notice::Chrome headless launch failed; attempting to install Chromium shared-library dependencies and retry once." >&2
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq
              # libasound2 は新しめの Ubuntu（本 runner 含む）では実体を持たない
              # 仮想パッケージ（提供元は libasound2t64）になっており、
              # そのまま指定すると `has no installation candidate` で
              # apt-get install が失敗する（イシュー #292 実 CI 実行で判明）。
              # apt-cache の候補有無で実体パッケージ名を解決してから渡す。
              asound_pkg=libasound2t64
              apt-cache show "${asound_pkg}" >/dev/null 2>&1 || asound_pkg=libasound2
              # libcups2 も libasound2 と同様、Noble 系 Ubuntu では実体を持たない
              # 仮想パッケージ（提供元は libcups2t64）に置き換わっており、
              # そのまま指定すると `has no installation candidate` で
              # apt-get install が失敗しうる（Bugbot 指摘 #305 review 4728367863）。
              # apt-cache の候補有無で実体パッケージ名を解決してから渡す。
              cups_pkg=libcups2t64
              apt-cache show "${cups_pkg}" >/dev/null 2>&1 || cups_pkg=libcups2
              apt-get install -y --no-install-recommends \
                libnss3 libnspr4 \
                libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
                "${cups_pkg}" libdbus-1-3 \
                libx11-6 libxext6 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxkbcommon0 \
                libcairo2 libpango-1.0-0 \
                libgbm1 "${asound_pkg}"
            fi
            if ! check_chrome; then
              echo "::error::Chrome for Testing failed to launch in headless mode even after installing the known Chromium shared-library dependencies. self-hosted runner image may be missing other shared libraries." >&2
              cat /tmp/chrome-smoke.log >&2
              echo "::error::ldd missing libraries (if any):" >&2
              ldd "$(command -v chrome)" 2>&1 | grep "not found" >&2 || echo "(ldd did not report missing libraries; failure cause is something else — see log above)" >&2
              exit 1
            fi
          fi

      # crates/wasm-client/ ディレクトリ存在ガード（TASK-6.2b #48 完了までの直列化措置）。
      # 未作成の間は後続ステップをすべてスキップし、ジョブは空実行で成功扱いとする。
      - name: Check wasm-client crate existence
        id: check
        run: |
          if [ -f "crates/wasm-client/Cargo.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::crates/wasm-client/ crate not found yet (blocked on TASK-6.2b #48). Skipping browser tests."
          fi

      # crates/wasm-full/ ディレクトリ存在ガード（TASK-11.2d・#77）。wasm-client と
      # 同じ「存在ガードのみで直列化措置とし、未作成時はスキップして空実行で
      # 成功扱いとする」パターンを踏襲する。本コミット時点では
      # crates/wasm-full/tests/runtime_browser.rs（`Runtime::mount`/`hydrate` の実
      # ブラウザ統合テスト）が同一 PR で追加されるため通常は true になるが、
      # 並列進行中の他イシューによる巻き戻り等、想定外の理由でファイルが
      # 存在しない場合でもジョブを失敗させない（`docs/design/wasm-full-architecture.md`
      # 第 5 節が引き継ぐ「browser-test ジョブへの wasm-full 存在ガード追加」）。
      - name: Check wasm-full crate existence
        id: check-wasm-full
        run: |
          if [ -f "crates/wasm-full/Cargo.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::crates/wasm-full/ crate not found. Skipping wasm-full Runtime browser tests."
          fi

      - name: Add wasm32 target
        if: steps.check.outputs.exists == 'true' || steps.check-wasm-full.outputs.exists == 'true'
        run: rustup target add wasm32-unknown-unknown

      # wasm-pack はバージョン固定 + SHA256 チェックサム検証付きで導入する
      # （実行時の chromedriver 自動ダウンロードと同様、未検証バイナリ取得を避けるサプライ
      # チェーン対策）。バージョンアップ時はチェックサムも合わせて更新すること。
      - name: Install wasm-pack (pinned + checksum-verified)
        if: steps.check.outputs.exists == 'true' || steps.check-wasm-full.outputs.exists == 'true'
        # self-hosted 移行に伴い、インストール先を /usr/local/bin から
        # $HOME/.local/share/wasm-pack/<version>/ へ変更する（sudo 不要、かつ
        # atomic install によるレース対策。詳細は次のコメント）。
        # atomic install（Cursor Bugbot 指摘 BUGBOT_BUG_ID: 1c88c06e、PR #291、
        # "Shared HOME Chrome install races" の一般形）: バージョン付き不変
        # パスへ、$HOME と同一ファイルシステム上の一時ディレクトリで検証・
        # 展開してから `mv -T`（atomic rename）で配置する。mv の終了コードには
        # 依存せず、失敗時は宛先の実体で成否を判定する（coreutils 9.2 以降の
        # `mv -n` 非ゼロ終了対策、Cursor Bugbot 指摘 High/Medium、コミット
        # 64ecb28 対応）。並列実行時の破損・後勝ちレースを避ける（詳細は
        # wasm-bindgen-cli インストールステップのコメント参照）。
        run: |
          set -euo pipefail
          WASM_PACK_VERSION="0.13.1"
          WASM_PACK_SHA256="c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539"
          SHARE_DIR="${HOME}/.local/share/wasm-pack"
          INSTALL_DIR="${SHARE_DIR}/${WASM_PACK_VERSION}"
          mkdir -p "${SHARE_DIR}"
          if [ ! -x "${INSTALL_DIR}/wasm-pack" ]; then
            tmp_root="$(mktemp -d "${SHARE_DIR}/.tmp-XXXXXX")"
            trap 'rm -rf "${tmp_root}"' EXIT
            ARCHIVE="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            URL="https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${ARCHIVE}"
            curl -sSfL -o "${tmp_root}/${ARCHIVE}" "${URL}"
            echo "${WASM_PACK_SHA256}  ${tmp_root}/${ARCHIVE}" | sha256sum -c -
            tar xzf "${tmp_root}/${ARCHIVE}" -C "${tmp_root}"
            # mv の終了コードには依存しない（coreutils 9.2 以降は `mv -n` が
            # 宛先既存時に非ゼロ終了するため。Cursor Bugbot 指摘 High/Medium、
            # コミット 64ecb28 対応。詳細は cargo-deny インストールステップの
            # コメント参照）。
            if ! mv -T "${tmp_root}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl" "${INSTALL_DIR}" 2>/dev/null; then
              [ -x "${INSTALL_DIR}/wasm-pack" ] || { echo "::error::failed to install wasm-pack to ${INSTALL_DIR}" >&2; exit 1; }
            fi
          fi
          echo "${INSTALL_DIR}" >> "$GITHUB_PATH"

      # PR #291 実 CI 実行で判明: `wasm-pack test` は内部で
      # `install::download_prebuilt_or_cargo_install(Tool::WasmBindgen, ...)`
      # を呼び、まず `which("wasm-bindgen")` で PATH 上の実体を探し、見つかれば
      # その「同じディレクトリ」に `wasm-bindgen-test-runner` があるものとして
      # 扱う（wasm-pack `src/install/mod.rs`）。self-hosted はワークスペース /
      # $HOME が job 間で永続するため、`test`/`rebuild-latency`/`bundle-size`
      # ジョブが $HOME/.local/bin へインストールした `wasm-bindgen`（本体のみ）
      # が残っていると、本ジョブはそれを「発見」してしまい、実際には存在しない
      # 隣の `wasm-bindgen-test-runner` を起動しようとして
      # `Error: .../wasm-bindgen-test-runner binary does not exist` で失敗する
      # （ubuntu-latest の使い捨て runner では発生し得なかった、self-hosted の
      # 永続ワークスペース特有の不整合）。ここで `wasm-bindgen` /
      # `wasm-bindgen-test-runner` の両方をこのジョブ内で明示的に上書き導入し、
      # 常に完全な組を揃える（test ジョブと同一バージョン・同一チェックサム）。
      # なお現在はインストール先自体をバージョン付き不変パス
      # （$HOME/.local/share/wasm-bindgen/<version>/）へ変更し、atomic
      # install（Cursor Bugbot 指摘 BUGBOT_BUG_ID: 1c88c06e、PR #291）で並列
      # 実行時の破損も防いでいる（詳細は下記ステップのコメント参照）。
      - name: Install wasm-bindgen-cli (pinned + checksum-verified, provides wasm-bindgen-test-runner)
        if: steps.check.outputs.exists == 'true' || steps.check-wasm-full.outputs.exists == 'true'
        # atomic install（Cursor Bugbot 指摘 BUGBOT_BUG_ID: 1c88c06e、PR #291）:
        # バージョン付き不変パスへ、$HOME と同一ファイルシステム上の一時
        # ディレクトリで検証・展開してから `mv -T`（mv の終了コードには
        # 依存しない。coreutils 9.2 以降の `mv -n` 非ゼロ終了対策、Cursor
        # Bugbot 指摘 High/Medium、コミット 64ecb28 対応）で配置する。詳細は
        # test ジョブの同名ステップのコメント参照。
        run: |
          set -euo pipefail
          WASM_BINDGEN_VERSION="0.2.126"
          WASM_BINDGEN_SHA256="064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d"
          SHARE_DIR="${HOME}/.local/share/wasm-bindgen"
          INSTALL_DIR="${SHARE_DIR}/${WASM_BINDGEN_VERSION}"
          mkdir -p "${SHARE_DIR}"
          if [ ! -x "${INSTALL_DIR}/wasm-bindgen" ] || [ ! -x "${INSTALL_DIR}/wasm-bindgen-test-runner" ]; then
            tmp_root="$(mktemp -d "${SHARE_DIR}/.tmp-XXXXXX")"
            trap 'rm -rf "${tmp_root}"' EXIT
            ARCHIVE="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            URL="https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${ARCHIVE}"
            curl -sSfL -o "${tmp_root}/${ARCHIVE}" "${URL}"
            echo "${WASM_BINDGEN_SHA256}  ${tmp_root}/${ARCHIVE}" | sha256sum -c -
            tar xzf "${tmp_root}/${ARCHIVE}" -C "${tmp_root}"
            # mv の終了コードには依存しない（coreutils 9.2 以降は `mv -n` が
            # 宛先既存時に非ゼロ終了するため。Cursor Bugbot 指摘 High/Medium、
            # コミット 64ecb28 対応。詳細は cargo-deny インストールステップの
            # コメント参照）。
            if ! mv -T "${tmp_root}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl" "${INSTALL_DIR}" 2>/dev/null; then
              if [ ! -x "${INSTALL_DIR}/wasm-bindgen" ] || [ ! -x "${INSTALL_DIR}/wasm-bindgen-test-runner" ]; then
                echo "::error::failed to install wasm-bindgen-cli to ${INSTALL_DIR}" >&2
                exit 1
              fi
            fi
          fi
          echo "${INSTALL_DIR}" >> "$GITHUB_PATH"

      # chromedriver のパスは上記 "Install Chrome for Testing + chromedriver" の
      # 出力を使う。wasm-bindgen-test-runner（wasm-pack test の実体）は
      # CHROMEDRIVER 環境変数を読み、指定されたバイナリを直接起動する
      # （crates/cli/src/wasm_bindgen_test_runner/headless.rs の Driver::find）。
      - name: Run browser tests (headless Chrome)
        if: steps.check.outputs.exists == 'true'
        run: CHROMEDRIVER="${{ steps.install_chrome.outputs.chromedriver_path }}" wasm-pack test --headless --chrome crates/wasm-client

      # `Runtime::mount`/`Runtime::hydrate` の実ブラウザ統合テスト（TASK-11.2d・
      # #77）。xss-wasm-test/perf-harness ジョブ（同じ wasm-full クレート）とは
      # 対象テストファイルが異なる独立ステップとして本ジョブに同居させる
      # （実装計画 §4-5: browser-test ジョブへの wasm-full 存在ガード追加は
      # 本タスクのスコープと明記されているため、既存の xss-wasm-test/
      # perf-harness ジョブ自体は変更しない）。
      - name: Run wasm-full Runtime browser tests (headless Chrome)
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: CHROMEDRIVER="${{ steps.install_chrome.outputs.chromedriver_path }}" wasm-pack test --headless --chrome crates/wasm-full --test runtime_browser

      # TASK-11.4c（#84、親 #81）: read_hydration_attrs（実 DOM からの
      # data-hydrate-* 属性列挙）の実ブラウザ統合テスト（crates/wasm-full/tests/
      # hydration_browser.rs）。runtime_browser ステップと同じ
      # check-wasm-full 存在ガードを再利用し、新規ガードは追加しない
      # （`docs/api/hydration-state-format.md` 第 6 節が引き継ぐ実ブラウザ検証）。
      - name: Run wasm-full hydration browser tests (headless Chrome)
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: CHROMEDRIVER="${{ steps.install_chrome.outputs.chromedriver_path }}" wasm-pack test --headless --chrome crates/wasm-full --test hydration_browser

      # TASK-CSR-loader（#349、親 #337）: CSR 経路の loader 解決
      # （crates/wasm-full/src/csr.rs）の三モード（SSR/SSG/CSR）表示整合・
      # 固定エラービューの実ブラウザ統合テスト（crates/wasm-full/tests/
      # three_mode_browser.rs）。runtime_browser/hydration_browser ステップと
      # 同じ check-wasm-full 存在ガードを再利用し、新規ガードは追加しない。
      - name: Run wasm-full three-mode browser tests (headless Chrome)
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: CHROMEDRIVER="${{ steps.install_chrome.outputs.chromedriver_path }}" wasm-pack test --headless --chrome crates/wasm-full --test three_mode_browser

      # イシュー #374: クライアント側ルーティング（history API 連携・
      # URL 同期・遷移時 loader 配線）の実ブラウザ統合テスト（crates/wasm-full/tests/
      # nav_browser.rs）。runtime_browser/hydration_browser/three_mode_browser
      # ステップと同じ check-wasm-full 存在ガードを再利用し、新規ガードは
      # 追加しない。
      - name: Run wasm-full nav browser tests (headless Chrome)
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: CHROMEDRIVER="${{ steps.install_chrome.outputs.chromedriver_path }}" wasm-pack test --headless --chrome crates/wasm-full --test nav_browser

      # イシュー #582（Tabs/Accordion のキーボード操作、親 #581）: `keynav`
      # モジュール（crates/wasm-full/src/keynav.rs）配線層の実ブラウザ統合
      # テスト（crates/wasm-full/tests/keynav_browser.rs）。runtime_browser/
      # hydration_browser/three_mode_browser/nav_browser ステップと同じ
      # check-wasm-full 存在ガードを再利用し、新規ガードは追加しない。
      - name: Run wasm-full keynav browser tests (headless Chrome)
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: CHROMEDRIVER="${{ steps.install_chrome.outputs.chromedriver_path }}" wasm-pack test --headless --chrome crates/wasm-full --test keynav_browser

      # イシュー #585（親 #584）: オーバーレイ共通の閉鎖制御（Escape キー・
      # 外側インタラクション、crates/wasm-full/src/overlay.rs）の実ブラウザ
      # 統合テスト（crates/wasm-full/tests/overlay_close_browser.rs）。
      # runtime_browser/hydration_browser/three_mode_browser/nav_browser
      # ステップと同じ check-wasm-full 存在ガードを再利用し、新規ガードは
      # 追加しない。
      - name: Run wasm-full overlay close browser tests (headless Chrome)
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: CHROMEDRIVER="${{ steps.install_chrome.outputs.chromedriver_path }}" wasm-pack test --headless --chrome crates/wasm-full --test overlay_close_browser

      # イシュー #591（親 #520/#542/#543）: Avatar（`fandhe-frontend-headless-ui`
      # `avatar` モジュール）の `load`/`error` イベント検知グルー
      # （crates/wasm-full/src/headless_avatar.rs）の実ブラウザ統合テスト
      # （crates/wasm-full/tests/headless_avatar_browser.rs）。runtime_browser/
      # hydration_browser/three_mode_browser/nav_browser/keynav_browser/
      # overlay_close_browser ステップと同じ check-wasm-full 存在ガードを
      # 再利用し、新規ガードは追加しない。
      - name: Run wasm-full headless avatar browser tests (headless Chrome)
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: CHROMEDRIVER="${{ steps.install_chrome.outputs.chromedriver_path }}" wasm-pack test --headless --chrome crates/wasm-full --test headless_avatar_browser

      # イシュー #586（親 #584）: Dialog のフォーカストラップ・トリガー復帰
      # （crates/wasm-full/src/focus_trap.rs）の実ブラウザ統合テスト
      # （crates/wasm-full/tests/focus_trap_browser.rs）。runtime_browser/
      # hydration_browser/three_mode_browser/nav_browser/keynav_browser/
      # overlay_close_browser ステップと同じ check-wasm-full 存在ガードを
      # 再利用し、新規ガードは追加しない。
      - name: Run wasm-full focus trap browser tests (headless Chrome)
        if: steps.check-wasm-full.outputs.exists == 'true'
        run: CHROMEDRIVER="${{ steps.install_chrome.outputs.chromedriver_path }}" wasm-pack test --headless --chrome crates/wasm-full --test focus_trap_browser

  # TASK-8.2b（イシュー #62, REQ-8 受け入れ基準）: 同一文書内更新向け
  # ラッパー関数（`static/view-transitions.js` の `withViewTransition`、
  # TASK-8.2a／イシュー #61）の実効 LOC（コメント・空行を除く）が
  # 10 行以内であることを機械的に強制するジョブ。
  #
  # しきい値運用の原則は deps-check ジョブと同一: しきい値・対象ファイルの正は
  # crates/xtask/src/check_loc.rs の MAX_EFFECTIVE_LOC（10）/ LOC_CHECK_TARGETS 定数のみ。
  # このジョブには緩和用の input・環境変数・continue-on-error を一切設けない
  # （迂回経路を作らない設計。しきい値変更はコード定数の変更 = レビュー必須の PR のみ）。
  #
  # fail-closed: 対象ファイル（static/view-transitions.js）の不在・読み取り失敗も
  # しきい値超過と同様に終了コード 1 として扱う（crates/xtask/src/check_loc.rs 参照）。
  # そのため TASK-8.2a（イシュー #61）のマージ前にこのジョブが実行されると
  # 意図的に FAIL する。
  # TASK-11.5a（#86）: 実ブラウザ性能計測ハーネス（crates/wasm-full/tests/perf_browser.rs）を
  # 実行するジョブ（当初はハーネス自己検証のみのスモーク実行だったが、イシュー
  # #451（採用案 B、2026-07-20 決定）により `--features perf-assert` 付きの
  # しきい値アサーション実行へ移行済み）。TASK-6.3a（#65）の browser-test
  # ジョブと同じ環境構築
  # パターン（wasm32 target・wasm-pack バージョン固定＋チェックサム検証・ランナー
  # 内蔵 chromedriver 明示指定）を踏襲するが、対象クレート（wasm-client と
  # wasm-full）が異なり、browser-test ジョブは TASK-11.2d（#77）が担当する
  # wasm-full 存在ガード追加のスコープであるため、コンフリクトを避けて独立
  # ジョブとして追加する（`docs/ci/perf-browser-harness.md` 引き継ぎ表参照）。
  #
  # 本ジョブは REQ-11 の性能予算（300ms/16ms・16ms 超過率 5% 以下）を
  # `--features perf-assert` 付きで常時アサートする（イシュー #451、採用案 B、
  # 2026-07-20 決定）。実測（`docs/reports/perf-browser-report.md`、2026-07-17）は
  # initial_load mean 0.034〜0.343ms・dom_update p95 0.090〜0.105ms と
  # しきい値に対し約 1000 倍の余裕があり、共有 self-hosted runner の負荷変動を
  # 考慮してもフレークリスクは低いと判断し、PR CI での常時判定を採用した。
  # 統制されたローカル環境での正式計測・`docs/reports/perf-browser-report.md`
  # 更新を伴う計測の位置づけは変更しない（`docs/ci/perf-browser-harness.md`
  # 第 4・6 節参照）。
  #
  # ジョブ `name:` はブランチ保護の required checks に登録されている可能性が
  # あるため、実態変更後も据え置く（`.claude/rules/ci.md` 参照。CI 常時実行の
  # 実態変更はステップ名・コメント・Step Summary 見出しで表す）。
  perf-harness:
    name: Perf browser harness smoke (wasm-pack --headless --chrome)
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v4.2.2（他ジョブと同一 SHA 固定）。
        # docs/spec サブモジュールはテストに不要のため取得しない。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定（self-hosted runner プールに
        # cargo 未導入インスタンスが混在し得るための保険。導入済みなら何もしない）。
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      # 前提（self-hosted 移行、ユーザー指示 2026-07-18。PR #291 実 CI 実行で
      # Chrome/chromedriver 不在の fail-closed を確認）: browser-test ジョブと
      # 同一の理由・同一パターンで Chrome for Testing + chromedriver を
      # バージョン固定 + SHA256 チェックサム検証付きで導入する。
      - name: Ensure unzip is available (self-hosted minimal image)
        run: |
          set -euo pipefail
          if ! command -v unzip >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y --no-install-recommends unzip
            else
              echo "::error::unzip not found and apt-get unavailable. self-hosted runner image requires unzip pre-installed." >&2
              exit 1
            fi
          fi

      - name: Install Chrome for Testing + chromedriver (Stable channel, pinned + checksum-verified)
        id: install_chrome
        # browser-test ジョブと同一バージョン・同一チェックサム（chrome/
        # chromedriver は同一バージョンで揃える必要がある）。
        # atomic install（Cursor Bugbot 指摘 BUGBOT_BUG_ID: 1c88c06e、PR #291、
        # "Shared HOME Chrome install races"）: 複数ジョブが並列実行される
        # self-hosted では、共有 $HOME 配下の同一固定パスへ複数ジョブが同時に
        # download/unzip/install すると互いのツリーやバイナリを破損し得る。
        # 対策として CFT_VERSION をパスに含めた不変パス
        # （$HOME/.local/share/chrome-for-testing/<version>/）へインストールし、
        # $HOME と同一ファイルシステム上の一時ディレクトリでダウンロード・
        # チェックサム検証・展開を完了させたうえで、chrome-linux64 /
        # chromedriver-linux64 の各ディレクトリ丸ごとを `mv -T`（atomic
        # rename）で最終配置する。最終パスが既に存在すれば（＝バージョン
        # 一致で完全にインストール済み）ダウンロードをスキップする。
        # chrome/chromedriver 2 本の mv は互いに独立させ、かつ mv の終了
        # コードには依存しない（coreutils 9.2 以降は `mv -n` が宛先既存時に
        # 非ゼロ終了するため `-n` は使わず、失敗時は宛先の実体で成否を判定
        # する）。並列実行時に後勝ちの mv は宛先の実体確認により成功扱いと
        # なる（同一バージョンの内容は決定的に同一であるため安全。Cursor
        # Bugbot 指摘 High: 「chrome の mv 失敗で chromedriver が永久に
        # 未導入」/ Medium: 「並列後勝ちで mv 失敗しジョブが落ちる」、
        # コミット 64ecb28 対応）。
        run: |
          set -euo pipefail
          CFT_VERSION="151.0.7922.34"
          CHROME_SHA256="ae8736ac28bc69278551500f219fc749575648263c43ec5990749eff43b9fcf8"
          CHROMEDRIVER_SHA256="3c2b6780156f44f3a26db5bee4a3b193d608eda55644de5287e6edf4aef2f4ac"
          SHARE_DIR="${HOME}/.local/share/chrome-for-testing"
          INSTALL_ROOT="${SHARE_DIR}/${CFT_VERSION}"
          CHROME_DIR="${INSTALL_ROOT}/chrome-linux64"
          CHROMEDRIVER_DIR="${INSTALL_ROOT}/chromedriver-linux64"
          mkdir -p "${SHARE_DIR}" "${INSTALL_ROOT}"
          if [ ! -x "${CHROME_DIR}/chrome" ] || [ ! -x "${CHROMEDRIVER_DIR}/chromedriver" ]; then
            tmp_root="$(mktemp -d "${SHARE_DIR}/.tmp-XXXXXX")"
            trap 'rm -rf "${tmp_root}"' EXIT

            curl -sSfL -o "${tmp_root}/chrome-linux64.zip" "https://storage.googleapis.com/chrome-for-testing-public/${CFT_VERSION}/linux64/chrome-linux64.zip"
            echo "${CHROME_SHA256}  ${tmp_root}/chrome-linux64.zip" | sha256sum -c -
            unzip -q -o "${tmp_root}/chrome-linux64.zip" -d "${tmp_root}"

            curl -sSfL -o "${tmp_root}/chromedriver-linux64.zip" "https://storage.googleapis.com/chrome-for-testing-public/${CFT_VERSION}/linux64/chromedriver-linux64.zip"
            echo "${CHROMEDRIVER_SHA256}  ${tmp_root}/chromedriver-linux64.zip" | sha256sum -c -
            unzip -q -o "${tmp_root}/chromedriver-linux64.zip" -d "${tmp_root}"

            # chrome ツリー・chromedriver ツリーの配置は互いに独立させる
            # （どちらかが「宛先既存」で失敗しても、もう片方のインストールは
            # 必ず進む）。また mv の終了コードには依存しない（coreutils 9.2
            # 以降は `mv -n` が宛先既存時に非ゼロ終了するため、`-n` は使わず
            # 失敗時に宛先の実体で成否を判定する。Cursor Bugbot 指摘
            # High: 「chrome の mv 失敗で chromedriver が永久に未導入のまま
            # 壊れる」/ Medium: 「並列ジョブの後勝ち mv が宛先既存で失敗し
            # ジョブが落ちる」、コミット 64ecb28 対応）。
            if ! mv -T "${tmp_root}/chrome-linux64" "${CHROME_DIR}" 2>/dev/null; then
              [ -x "${CHROME_DIR}/chrome" ] || { echo "::error::failed to install Chrome for Testing to ${CHROME_DIR}" >&2; exit 1; }
            fi
            if ! mv -T "${tmp_root}/chromedriver-linux64" "${CHROMEDRIVER_DIR}" 2>/dev/null; then
              [ -x "${CHROMEDRIVER_DIR}/chromedriver" ] || { echo "::error::failed to install chromedriver to ${CHROMEDRIVER_DIR}" >&2; exit 1; }
            fi
          fi

          echo "${CHROME_DIR}" >> "$GITHUB_PATH"
          echo "chromedriver_path=${CHROMEDRIVER_DIR}/chromedriver" >> "$GITHUB_OUTPUT"

      - name: Verify headless Chrome launches (self-hosted shared-library check)
        # browser-test ジョブと同一ロジック（ldd で不足共有ライブラリを特定して
        # fail-closed で報告する）。
        run: |
          set -euo pipefail
          check_chrome() {
            chrome --headless --no-sandbox --disable-gpu --dump-dom about:blank >/tmp/chrome-smoke.log 2>&1
          }
          if ! check_chrome; then
            # PR #291 実 CI 実行で判明: 本 self-hosted runner イメージには
            # libnspr4/libnss3（libnssutil3・libsmime3 を含む）が不足しており
            # Chrome が起動できない（`chrome: error while loading shared
            # libraries: libnspr4.so: cannot open shared object file`）。
            # PR #305 実 CI 実行（イシュー #292）で追加判明: libnss3/libnspr4
            # のみの自動導入では不足で、libatk-1.0.so.0 等 Chromium 実行に
            # 必要な共有ライブラリ群（ATK / D-Bus / X11 / Cairo・Pango /
            # ALSA / GBM / AT-SPI 系）が広く不足していた。runner イメージの
            # ベースにはデスクトップ GUI 系パッケージが入っていない前提のため、
            # Chrome for Testing（Chromium 系）が要求する共有ライブラリを
            # 提供する Debian/Ubuntu パッケージ一式をまとめて自動導入する。
            # root 実行のため sudo なしで apt-get install できることを利用し、
            # 既知の不足パッケージを自動導入して 1 回だけ再試行する。
            echo "::notice::Chrome headless launch failed; attempting to install Chromium shared-library dependencies and retry once." >&2
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq
              # libasound2 は新しめの Ubuntu（本 runner 含む）では実体を持たない
              # 仮想パッケージ（提供元は libasound2t64）になっており、
              # そのまま指定すると `has no installation candidate` で
              # apt-get install が失敗する（イシュー #292 実 CI 実行で判明）。
              # apt-cache の候補有無で実体パッケージ名を解決してから渡す。
              asound_pkg=libasound2t64
              apt-cache show "${asound_pkg}" >/dev/null 2>&1 || asound_pkg=libasound2
              # libcups2 も libasound2 と同様、Noble 系 Ubuntu では実体を持たない
              # 仮想パッケージ（提供元は libcups2t64）に置き換わっており、
              # そのまま指定すると `has no installation candidate` で
              # apt-get install が失敗しうる（Bugbot 指摘 #305 review 4728367863）。
              # apt-cache の候補有無で実体パッケージ名を解決してから渡す。
              cups_pkg=libcups2t64
              apt-cache show "${cups_pkg}" >/dev/null 2>&1 || cups_pkg=libcups2
              apt-get install -y --no-install-recommends \
                libnss3 libnspr4 \
                libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
                "${cups_pkg}" libdbus-1-3 \
                libx11-6 libxext6 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxkbcommon0 \
                libcairo2 libpango-1.0-0 \
                libgbm1 "${asound_pkg}"
            fi
            if ! check_chrome; then
              echo "::error::Chrome for Testing failed to launch in headless mode even after installing the known Chromium shared-library dependencies. self-hosted runner image may be missing other shared libraries." >&2
              cat /tmp/chrome-smoke.log >&2
              echo "::error::ldd missing libraries (if any):" >&2
              ldd "$(command -v chrome)" 2>&1 | grep "not found" >&2 || echo "(ldd did not report missing libraries; failure cause is something else — see log above)" >&2
              exit 1
            fi
          fi

      # crates/wasm-full/tests/perf_browser.rs 存在ガード（TASK-6.3a #65 のガード
      # パターン踏襲）。並列実行中の他イシューによる巻き戻り等、想定外の理由で
      # ファイルが存在しない場合でもジョブを失敗させず空実行で成功扱いとする。
      - name: Check perf_browser.rs harness existence
        id: check
        run: |
          if [ -f "crates/wasm-full/tests/perf_browser.rs" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::crates/wasm-full/tests/perf_browser.rs not found. Skipping perf harness smoke run."
          fi

      - name: Add wasm32 target
        if: steps.check.outputs.exists == 'true'
        run: rustup target add wasm32-unknown-unknown

      # wasm-pack はバージョン固定 + SHA256 チェックサム検証付きで導入する
      # （browser-test ジョブと同一バージョン・同一チェックサム。実行時の
      # chromedriver 自動ダウンロードと同様、未検証バイナリ取得を避ける
      # サプライチェーン対策）。
      - name: Install wasm-pack (pinned + checksum-verified)
        if: steps.check.outputs.exists == 'true'
        # self-hosted 移行に伴い、インストール先を browser-test ジョブと同様に
        # $HOME/.local/share/wasm-pack/<version>/ へ変更する。
        # atomic install（Cursor Bugbot 指摘 BUGBOT_BUG_ID: 1c88c06e、PR #291、
        # "Shared HOME Chrome install races" の一般形）: バージョン付き不変
        # パスへ、$HOME と同一ファイルシステム上の一時ディレクトリで検証・
        # 展開してから `mv -T`（atomic rename）で配置する。mv の終了コードには
        # 依存せず、失敗時は宛先の実体で成否を判定する（coreutils 9.2 以降の
        # `mv -n` 非ゼロ終了対策、Cursor Bugbot 指摘 High/Medium、コミット
        # 64ecb28 対応）。並列実行時の破損・後勝ちレースを避ける（詳細は
        # wasm-bindgen-cli インストールステップのコメント参照）。
        run: |
          set -euo pipefail
          WASM_PACK_VERSION="0.13.1"
          WASM_PACK_SHA256="c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539"
          SHARE_DIR="${HOME}/.local/share/wasm-pack"
          INSTALL_DIR="${SHARE_DIR}/${WASM_PACK_VERSION}"
          mkdir -p "${SHARE_DIR}"
          if [ ! -x "${INSTALL_DIR}/wasm-pack" ]; then
            tmp_root="$(mktemp -d "${SHARE_DIR}/.tmp-XXXXXX")"
            trap 'rm -rf "${tmp_root}"' EXIT
            ARCHIVE="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            URL="https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${ARCHIVE}"
            curl -sSfL -o "${tmp_root}/${ARCHIVE}" "${URL}"
            echo "${WASM_PACK_SHA256}  ${tmp_root}/${ARCHIVE}" | sha256sum -c -
            tar xzf "${tmp_root}/${ARCHIVE}" -C "${tmp_root}"
            # mv の終了コードには依存しない（coreutils 9.2 以降は `mv -n` が
            # 宛先既存時に非ゼロ終了するため。Cursor Bugbot 指摘 High/Medium、
            # コミット 64ecb28 対応。詳細は cargo-deny インストールステップの
            # コメント参照）。
            if ! mv -T "${tmp_root}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl" "${INSTALL_DIR}" 2>/dev/null; then
              [ -x "${INSTALL_DIR}/wasm-pack" ] || { echo "::error::failed to install wasm-pack to ${INSTALL_DIR}" >&2; exit 1; }
            fi
          fi
          echo "${INSTALL_DIR}" >> "$GITHUB_PATH"

      # browser-test ジョブと同一の理由（PR #291 実 CI 実行で判明: self-hosted の
      # 永続 $HOME に他ジョブが残した不完全な wasm-bindgen 導入を誤検出する
      # 問題への対策。詳細は browser-test ジョブの同名ステップのコメント参照）。
      - name: Install wasm-bindgen-cli (pinned + checksum-verified, provides wasm-bindgen-test-runner)
        if: steps.check.outputs.exists == 'true'
        # atomic install（Cursor Bugbot 指摘 BUGBOT_BUG_ID: 1c88c06e、PR #291）:
        # バージョン付き不変パスへ、$HOME と同一ファイルシステム上の一時
        # ディレクトリで検証・展開してから `mv -T`（mv の終了コードには
        # 依存しない。coreutils 9.2 以降の `mv -n` 非ゼロ終了対策、Cursor
        # Bugbot 指摘 High/Medium、コミット 64ecb28 対応）で配置する。詳細は
        # test ジョブの同名ステップのコメント参照。
        run: |
          set -euo pipefail
          WASM_BINDGEN_VERSION="0.2.126"
          WASM_BINDGEN_SHA256="064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d"
          SHARE_DIR="${HOME}/.local/share/wasm-bindgen"
          INSTALL_DIR="${SHARE_DIR}/${WASM_BINDGEN_VERSION}"
          mkdir -p "${SHARE_DIR}"
          if [ ! -x "${INSTALL_DIR}/wasm-bindgen" ] || [ ! -x "${INSTALL_DIR}/wasm-bindgen-test-runner" ]; then
            tmp_root="$(mktemp -d "${SHARE_DIR}/.tmp-XXXXXX")"
            trap 'rm -rf "${tmp_root}"' EXIT
            ARCHIVE="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            URL="https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${ARCHIVE}"
            curl -sSfL -o "${tmp_root}/${ARCHIVE}" "${URL}"
            echo "${WASM_BINDGEN_SHA256}  ${tmp_root}/${ARCHIVE}" | sha256sum -c -
            tar xzf "${tmp_root}/${ARCHIVE}" -C "${tmp_root}"
            # mv の終了コードには依存しない（coreutils 9.2 以降は `mv -n` が
            # 宛先既存時に非ゼロ終了するため。Cursor Bugbot 指摘 High/Medium、
            # コミット 64ecb28 対応。詳細は cargo-deny インストールステップの
            # コメント参照）。
            if ! mv -T "${tmp_root}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl" "${INSTALL_DIR}" 2>/dev/null; then
              if [ ! -x "${INSTALL_DIR}/wasm-bindgen" ] || [ ! -x "${INSTALL_DIR}/wasm-bindgen-test-runner" ]; then
                echo "::error::failed to install wasm-bindgen-cli to ${INSTALL_DIR}" >&2
                exit 1
              fi
            fi
          fi
          echo "${INSTALL_DIR}" >> "$GITHUB_PATH"

      # chromedriver のパスは上記 "Resolve chromedriver path" ステップの出力を使う
      # （browser-test ジョブと同一の理由）。
      # `-- --nocapture` を付与しないと、テストが成功した場合に libtest が
      # console 出力（`perf-browser:` サマリ行）を握りつぶすため、次ステップの
      # 転記が常に「no summary line found」になる（出力契約が成立しない）。
      - name: "Run perf harness with perf-assert thresholds (headless Chrome, issue #451)"
        if: steps.check.outputs.exists == 'true'
        run: |
          set -o pipefail
          CHROMEDRIVER="${{ steps.install_chrome.outputs.chromedriver_path }}" wasm-pack test --headless --chrome crates/wasm-full --test perf_browser --features perf-assert -- --nocapture 2>&1 | tee perf-harness.log

      - name: Publish perf-harness summary
        if: always() && steps.check.outputs.exists == 'true'
        # perf_browser.rs の 1 行サマリ契約
        # 「perf-browser: metric=<name> samples=<n> mean_ms=<x> p95_ms=<x> max_ms=<x>」を
        # Step Summary に転記する（loc-check ジョブのパターン踏襲）。この契約は
        # perf_browser.rs 内の format_summary_line テストで固定される。
        # `--features perf-assert` により、この summary 転記の前段でしきい値
        # （300ms/16ms・超過率 5%）を満たさない場合は本ステップに到達する前に
        # 実行コマンドが非ゼロ終了しジョブが FAIL する（イシュー #451）。
        run: |
          {
            echo '## perf-harness with perf-assert thresholds (issue #451, formerly TASK-11.5a/issue #86)'
            echo '```'
            grep '^perf-browser:' perf-harness.log || echo 'perf-browser: no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # TASK-1.3b（#92、親 #90、REQ-1）: WASM 経路（イベント処理・DOM 更新）の
  # XSS 回帰テスト（crates/wasm-full/tests/xss_escape_wasm.rs）を実ブラウザ
  # （headless Chromium）で実行するジョブ。browser-test/perf-harness ジョブと
  # 同じ環境構築パターン（wasm32 target・wasm-pack バージョン固定＋チェックサム
  # 検証・ランナー内蔵 chromedriver 明示指定）を踏襲するが、対象クレート
  # （wasm-full）・対象テスト（xss_escape_wasm）が異なるため独立ジョブとする。
  #
  # browser-test ジョブ（wasm-client 対象）への統合や wasm-full 存在ガードの
  # 追加は TASK-11.2d（#77）のスコープと明記されており、並列進行中の #77 との
  # コンフリクト・責務混線を避けるため本ジョブは独立させる（実装計画 §5）。
  #
  # ファイル自体が本 PR で新規追加されるため、他ジョブのような存在ガードは
  # 設けない（追加と同一コミットで即時有効化される）。
  xss-wasm-test:
    name: WASM XSS escape regression (wasm-pack --headless --chrome)
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v4.2.2（他ジョブと同一 SHA 固定）。
        # docs/spec サブモジュールはテストに不要のため取得しない。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定（self-hosted runner プールに
        # cargo 未導入インスタンスが混在し得るための保険。導入済みなら何もしない）。
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # wasm-pack はバージョン固定 + SHA256 チェックサム検証付きで導入する
      # （browser-test/perf-harness ジョブと同一バージョン・同一チェックサム。
      # 実行時の chromedriver 自動ダウンロードと同様、未検証バイナリ取得を
      # 避けるサプライチェーン対策）。self-hosted 移行に伴い、インストール先を
      # /usr/local/bin から $HOME/.local/share/wasm-pack/<version>/ へ変更する
      # （他ジョブと同一の理由）。
      - name: Install wasm-pack (pinned + checksum-verified)
        # atomic install（Cursor Bugbot 指摘 BUGBOT_BUG_ID: 1c88c06e、PR #291、
        # "Shared HOME Chrome install races" の一般形）: バージョン付き不変
        # パスへ、$HOME と同一ファイルシステム上の一時ディレクトリで検証・
        # 展開してから `mv -T`（atomic rename）で配置する。mv の終了コードには
        # 依存せず、失敗時は宛先の実体で成否を判定する（coreutils 9.2 以降の
        # `mv -n` 非ゼロ終了対策、Cursor Bugbot 指摘 High/Medium、コミット
        # 64ecb28 対応）。並列実行時の破損・後勝ちレースを避ける（詳細は
        # wasm-bindgen-cli インストールステップのコメント参照）。
        run: |
          set -euo pipefail
          WASM_PACK_VERSION="0.13.1"
          WASM_PACK_SHA256="c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539"
          SHARE_DIR="${HOME}/.local/share/wasm-pack"
          INSTALL_DIR="${SHARE_DIR}/${WASM_PACK_VERSION}"
          mkdir -p "${SHARE_DIR}"
          if [ ! -x "${INSTALL_DIR}/wasm-pack" ]; then
            tmp_root="$(mktemp -d "${SHARE_DIR}/.tmp-XXXXXX")"
            trap 'rm -rf "${tmp_root}"' EXIT
            ARCHIVE="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            URL="https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${ARCHIVE}"
            curl -sSfL -o "${tmp_root}/${ARCHIVE}" "${URL}"
            echo "${WASM_PACK_SHA256}  ${tmp_root}/${ARCHIVE}" | sha256sum -c -
            tar xzf "${tmp_root}/${ARCHIVE}" -C "${tmp_root}"
            # mv の終了コードには依存しない（coreutils 9.2 以降は `mv -n` が
            # 宛先既存時に非ゼロ終了するため。Cursor Bugbot 指摘 High/Medium、
            # コミット 64ecb28 対応。詳細は cargo-deny インストールステップの
            # コメント参照）。
            if ! mv -T "${tmp_root}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl" "${INSTALL_DIR}" 2>/dev/null; then
              [ -x "${INSTALL_DIR}/wasm-pack" ] || { echo "::error::failed to install wasm-pack to ${INSTALL_DIR}" >&2; exit 1; }
            fi
          fi
          echo "${INSTALL_DIR}" >> "$GITHUB_PATH"

      # browser-test ジョブと同一の理由（PR #291 実 CI 実行で判明: self-hosted の
      # 永続 $HOME に他ジョブが残した不完全な wasm-bindgen 導入を誤検出する
      # 問題への対策。詳細は browser-test ジョブの同名ステップのコメント参照）。
      - name: Install wasm-bindgen-cli (pinned + checksum-verified, provides wasm-bindgen-test-runner)
        # atomic install（Cursor Bugbot 指摘 BUGBOT_BUG_ID: 1c88c06e、PR #291）:
        # バージョン付き不変パスへ、$HOME と同一ファイルシステム上の一時
        # ディレクトリで検証・展開してから `mv -T`（mv の終了コードには
        # 依存しない。coreutils 9.2 以降の `mv -n` 非ゼロ終了対策、Cursor
        # Bugbot 指摘 High/Medium、コミット 64ecb28 対応）で配置する。詳細は
        # test ジョブの同名ステップのコメント参照。
        run: |
          set -euo pipefail
          WASM_BINDGEN_VERSION="0.2.126"
          WASM_BINDGEN_SHA256="064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d"
          SHARE_DIR="${HOME}/.local/share/wasm-bindgen"
          INSTALL_DIR="${SHARE_DIR}/${WASM_BINDGEN_VERSION}"
          mkdir -p "${SHARE_DIR}"
          if [ ! -x "${INSTALL_DIR}/wasm-bindgen" ] || [ ! -x "${INSTALL_DIR}/wasm-bindgen-test-runner" ]; then
            tmp_root="$(mktemp -d "${SHARE_DIR}/.tmp-XXXXXX")"
            trap 'rm -rf "${tmp_root}"' EXIT
            ARCHIVE="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            URL="https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${ARCHIVE}"
            curl -sSfL -o "${tmp_root}/${ARCHIVE}" "${URL}"
            echo "${WASM_BINDGEN_SHA256}  ${tmp_root}/${ARCHIVE}" | sha256sum -c -
            tar xzf "${tmp_root}/${ARCHIVE}" -C "${tmp_root}"
            # mv の終了コードには依存しない（coreutils 9.2 以降は `mv -n` が
            # 宛先既存時に非ゼロ終了するため。Cursor Bugbot 指摘 High/Medium、
            # コミット 64ecb28 対応。詳細は cargo-deny インストールステップの
            # コメント参照）。
            if ! mv -T "${tmp_root}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl" "${INSTALL_DIR}" 2>/dev/null; then
              if [ ! -x "${INSTALL_DIR}/wasm-bindgen" ] || [ ! -x "${INSTALL_DIR}/wasm-bindgen-test-runner" ]; then
                echo "::error::failed to install wasm-bindgen-cli to ${INSTALL_DIR}" >&2
                exit 1
              fi
            fi
          fi
          echo "${INSTALL_DIR}" >> "$GITHUB_PATH"

      # 前提（self-hosted 移行、ユーザー指示 2026-07-18。PR #291 実 CI 実行で
      # Chrome/chromedriver 不在の fail-closed を確認）: browser-test/
      # perf-harness ジョブと同一パターンで Chrome for Testing + chromedriver を
      # バージョン固定 + SHA256 チェックサム検証付きで導入する。
      - name: Ensure unzip is available (self-hosted minimal image)
        run: |
          set -euo pipefail
          if ! command -v unzip >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y --no-install-recommends unzip
            else
              echo "::error::unzip not found and apt-get unavailable. self-hosted runner image requires unzip pre-installed." >&2
              exit 1
            fi
          fi

      - name: Install Chrome for Testing + chromedriver (Stable channel, pinned + checksum-verified)
        id: install_chrome
        # browser-test/perf-harness ジョブと同一バージョン・同一チェックサム。
        # atomic install（Cursor Bugbot 指摘 BUGBOT_BUG_ID: 1c88c06e、PR #291、
        # "Shared HOME Chrome install races"）: 複数ジョブが並列実行される
        # self-hosted では、共有 $HOME 配下の同一固定パスへ複数ジョブが同時に
        # download/unzip/install すると互いのツリーやバイナリを破損し得る。
        # 対策として CFT_VERSION をパスに含めた不変パス
        # （$HOME/.local/share/chrome-for-testing/<version>/）へインストールし、
        # $HOME と同一ファイルシステム上の一時ディレクトリでダウンロード・
        # チェックサム検証・展開を完了させたうえで、chrome-linux64 /
        # chromedriver-linux64 の各ディレクトリ丸ごとを `mv -T`（atomic
        # rename）で最終配置する。最終パスが既に存在すれば（＝バージョン
        # 一致で完全にインストール済み）ダウンロードをスキップする。
        # chrome/chromedriver 2 本の mv は互いに独立させ、かつ mv の終了
        # コードには依存しない（coreutils 9.2 以降は `mv -n` が宛先既存時に
        # 非ゼロ終了するため `-n` は使わず、失敗時は宛先の実体で成否を判定
        # する）。並列実行時に後勝ちの mv は宛先の実体確認により成功扱いと
        # なる（同一バージョンの内容は決定的に同一であるため安全。Cursor
        # Bugbot 指摘 High: 「chrome の mv 失敗で chromedriver が永久に
        # 未導入」/ Medium: 「並列後勝ちで mv 失敗しジョブが落ちる」、
        # コミット 64ecb28 対応）。
        run: |
          set -euo pipefail
          CFT_VERSION="151.0.7922.34"
          CHROME_SHA256="ae8736ac28bc69278551500f219fc749575648263c43ec5990749eff43b9fcf8"
          CHROMEDRIVER_SHA256="3c2b6780156f44f3a26db5bee4a3b193d608eda55644de5287e6edf4aef2f4ac"
          SHARE_DIR="${HOME}/.local/share/chrome-for-testing"
          INSTALL_ROOT="${SHARE_DIR}/${CFT_VERSION}"
          CHROME_DIR="${INSTALL_ROOT}/chrome-linux64"
          CHROMEDRIVER_DIR="${INSTALL_ROOT}/chromedriver-linux64"
          mkdir -p "${SHARE_DIR}" "${INSTALL_ROOT}"
          if [ ! -x "${CHROME_DIR}/chrome" ] || [ ! -x "${CHROMEDRIVER_DIR}/chromedriver" ]; then
            tmp_root="$(mktemp -d "${SHARE_DIR}/.tmp-XXXXXX")"
            trap 'rm -rf "${tmp_root}"' EXIT

            curl -sSfL -o "${tmp_root}/chrome-linux64.zip" "https://storage.googleapis.com/chrome-for-testing-public/${CFT_VERSION}/linux64/chrome-linux64.zip"
            echo "${CHROME_SHA256}  ${tmp_root}/chrome-linux64.zip" | sha256sum -c -
            unzip -q -o "${tmp_root}/chrome-linux64.zip" -d "${tmp_root}"

            curl -sSfL -o "${tmp_root}/chromedriver-linux64.zip" "https://storage.googleapis.com/chrome-for-testing-public/${CFT_VERSION}/linux64/chromedriver-linux64.zip"
            echo "${CHROMEDRIVER_SHA256}  ${tmp_root}/chromedriver-linux64.zip" | sha256sum -c -
            unzip -q -o "${tmp_root}/chromedriver-linux64.zip" -d "${tmp_root}"

            # chrome ツリー・chromedriver ツリーの配置は互いに独立させる
            # （どちらかが「宛先既存」で失敗しても、もう片方のインストールは
            # 必ず進む）。また mv の終了コードには依存しない（coreutils 9.2
            # 以降は `mv -n` が宛先既存時に非ゼロ終了するため、`-n` は使わず
            # 失敗時に宛先の実体で成否を判定する。Cursor Bugbot 指摘
            # High: 「chrome の mv 失敗で chromedriver が永久に未導入のまま
            # 壊れる」/ Medium: 「並列ジョブの後勝ち mv が宛先既存で失敗し
            # ジョブが落ちる」、コミット 64ecb28 対応）。
            if ! mv -T "${tmp_root}/chrome-linux64" "${CHROME_DIR}" 2>/dev/null; then
              [ -x "${CHROME_DIR}/chrome" ] || { echo "::error::failed to install Chrome for Testing to ${CHROME_DIR}" >&2; exit 1; }
            fi
            if ! mv -T "${tmp_root}/chromedriver-linux64" "${CHROMEDRIVER_DIR}" 2>/dev/null; then
              [ -x "${CHROMEDRIVER_DIR}/chromedriver" ] || { echo "::error::failed to install chromedriver to ${CHROMEDRIVER_DIR}" >&2; exit 1; }
            fi
          fi

          echo "${CHROME_DIR}" >> "$GITHUB_PATH"
          echo "chromedriver_path=${CHROMEDRIVER_DIR}/chromedriver" >> "$GITHUB_OUTPUT"

      - name: Verify headless Chrome launches (self-hosted shared-library check)
        run: |
          set -euo pipefail
          check_chrome() {
            chrome --headless --no-sandbox --disable-gpu --dump-dom about:blank >/tmp/chrome-smoke.log 2>&1
          }
          if ! check_chrome; then
            # PR #291 実 CI 実行で判明: 本 self-hosted runner イメージには
            # libnspr4/libnss3（libnssutil3・libsmime3 を含む）が不足しており
            # Chrome が起動できない（`chrome: error while loading shared
            # libraries: libnspr4.so: cannot open shared object file`）。
            # PR #305 実 CI 実行（イシュー #292）で追加判明: libnss3/libnspr4
            # のみの自動導入では不足で、libatk-1.0.so.0 等 Chromium 実行に
            # 必要な共有ライブラリ群（ATK / D-Bus / X11 / Cairo・Pango /
            # ALSA / GBM / AT-SPI 系）が広く不足していた。runner イメージの
            # ベースにはデスクトップ GUI 系パッケージが入っていない前提のため、
            # Chrome for Testing（Chromium 系）が要求する共有ライブラリを
            # 提供する Debian/Ubuntu パッケージ一式をまとめて自動導入する。
            # root 実行のため sudo なしで apt-get install できることを利用し、
            # 既知の不足パッケージを自動導入して 1 回だけ再試行する。
            echo "::notice::Chrome headless launch failed; attempting to install Chromium shared-library dependencies and retry once." >&2
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq
              # libasound2 は新しめの Ubuntu（本 runner 含む）では実体を持たない
              # 仮想パッケージ（提供元は libasound2t64）になっており、
              # そのまま指定すると `has no installation candidate` で
              # apt-get install が失敗する（イシュー #292 実 CI 実行で判明）。
              # apt-cache の候補有無で実体パッケージ名を解決してから渡す。
              asound_pkg=libasound2t64
              apt-cache show "${asound_pkg}" >/dev/null 2>&1 || asound_pkg=libasound2
              # libcups2 も libasound2 と同様、Noble 系 Ubuntu では実体を持たない
              # 仮想パッケージ（提供元は libcups2t64）に置き換わっており、
              # そのまま指定すると `has no installation candidate` で
              # apt-get install が失敗しうる（Bugbot 指摘 #305 review 4728367863）。
              # apt-cache の候補有無で実体パッケージ名を解決してから渡す。
              cups_pkg=libcups2t64
              apt-cache show "${cups_pkg}" >/dev/null 2>&1 || cups_pkg=libcups2
              apt-get install -y --no-install-recommends \
                libnss3 libnspr4 \
                libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
                "${cups_pkg}" libdbus-1-3 \
                libx11-6 libxext6 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxkbcommon0 \
                libcairo2 libpango-1.0-0 \
                libgbm1 "${asound_pkg}"
            fi
            if ! check_chrome; then
              echo "::error::Chrome for Testing failed to launch in headless mode even after installing the known Chromium shared-library dependencies. self-hosted runner image may be missing other shared libraries." >&2
              cat /tmp/chrome-smoke.log >&2
              echo "::error::ldd missing libraries (if any):" >&2
              ldd "$(command -v chrome)" 2>&1 | grep "not found" >&2 || echo "(ldd did not report missing libraries; failure cause is something else — see log above)" >&2
              exit 1
            fi
          fi

      - name: Run WASM XSS escape regression (headless Chrome)
        run: CHROMEDRIVER="${{ steps.install_chrome.outputs.chromedriver_path }}" wasm-pack test --headless --chrome crates/wasm-full --test xss_escape_wasm

  # イシュー #297（TASK-10.2 残課題、出典 PR #220 §10 スコープ外節）:
  # docs/design/wasm-build-integration.md §6.4 が文書化していた nodejs ターゲット
  # 開発フロー（`web-sys` 非依存な fandhe-frontend-wasm-thin のロジック高速確認経路）を
  # `cargo xtask wasm-node-smoke` として CI ゲート化する。上記 `test` ジョブと
  # 同一の wasm32 target 追加・wasm-bindgen-cli 導入パターンを踏襲する
  # （同一バージョン固定値。ドリフト検出は crates/xtask/tests/wasm_bindgen_version_sync.rs
  # が行ベース抽出で拾う対象に本ジョブの宣言も自動的に含まれる）。
  #
  # 正式なブラウザ実証（上記 browser-test/xss-wasm-test ジョブ）の代替ではなく、
  # 開発者手元での高速確認経路を CI でも回帰検証する位置づけ（§6.4 不変条件）。
  # 緩和用 input・continue-on-error は設けない（既存ジョブの迂回経路禁止原則）。
  wasm-node-smoke:
    name: "nodejs target smoke test (fandhe-frontend-wasm-thin, issue #297)"
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        # 他ジョブと同一 SHA 固定。docs/spec サブモジュールは本ジョブに不要。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml / test ジョブと同一の理由・同一 SHA 固定。
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # wasm-bindgen-cli の導入パターンは `test` ジョブと同一（バージョン固定 +
      # SHA256 チェックサム検証 + atomic install）。`xtask wasm-node-smoke` 自身が
      # 実行時に Cargo.lock 解決済みバージョンとの完全一致を再検証するため
      # （`wasm_node_smoke::verify_wasm_bindgen_version`）、二重の fail-closed
      # ゲートになる。
      - name: Install wasm-bindgen-cli (pinned + checksum-verified, atomic install)
        run: |
          set -euo pipefail
          WASM_BINDGEN_VERSION="0.2.126"
          WASM_BINDGEN_SHA256="064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d"
          SHARE_DIR="${HOME}/.local/share/wasm-bindgen"
          INSTALL_DIR="${SHARE_DIR}/${WASM_BINDGEN_VERSION}"
          mkdir -p "${SHARE_DIR}"
          if [ ! -x "${INSTALL_DIR}/wasm-bindgen" ] || [ ! -x "${INSTALL_DIR}/wasm-bindgen-test-runner" ]; then
            tmp_root="$(mktemp -d "${SHARE_DIR}/.tmp-XXXXXX")"
            trap 'rm -rf "${tmp_root}"' EXIT
            ARCHIVE="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            URL="https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${ARCHIVE}"
            curl -sSfL -o "${tmp_root}/${ARCHIVE}" "${URL}"
            echo "${WASM_BINDGEN_SHA256}  ${tmp_root}/${ARCHIVE}" | sha256sum -c -
            tar xzf "${tmp_root}/${ARCHIVE}" -C "${tmp_root}"
            if ! mv -T "${tmp_root}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl" "${INSTALL_DIR}" 2>/dev/null; then
              if [ ! -x "${INSTALL_DIR}/wasm-bindgen" ] || [ ! -x "${INSTALL_DIR}/wasm-bindgen-test-runner" ]; then
                echo "::error::failed to install wasm-bindgen-cli to ${INSTALL_DIR}" >&2
                exit 1
              fi
            fi
          fi
          echo "${INSTALL_DIR}" >> "$GITHUB_PATH"

      - name: Setup Node.js
        # npm-asset-build ジョブと同一 SHA 固定。self-hosted runner に node の
        # 常設は保証されないため明示セットアップする（.claude/rules/ci.md
        # 「ツール前提の明示」）。
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'

      - name: Run xtask wasm-node-smoke
        # xtask の終了コードをそのまま CI の成否に伝播させる（fail-closed）。
        # --locked はこの外側の cargo run が Cargo.lock を書き換えないことを保証する。
        run: |
          set -o pipefail
          cargo run --locked -p xtask -- wasm-node-smoke | tee wasm-node-smoke.log

      - name: Publish wasm-node-smoke summary
        if: always()
        # wasm_node_smoke::format_report の 1 行サマリ契約
        # 「wasm-node-smoke: package=<pkg> target=nodejs mode=<mode> result=<PASS|FAIL>」を
        # Step Summary に転記する。契約は crates/xtask/tests/cli_wasm_node_smoke.rs で固定。
        run: |
          {
            echo '## wasm-node-smoke (issue #297)'
            echo '```'
            grep '^wasm-node-smoke:' wasm-node-smoke.log || echo 'wasm-node-smoke: no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # イシュー #411: `fw new --template app` が生成する CSR wasm ビルド込み
  # 完全実体（vendor/fandhe-frontend-wasm-client + wasm/ 独立ワークスペース +
  # tools/wasm/build.sh）が実際にビルド可能であることを CI で回帰検証する。
  # wasm-bindgen-cli の導入パターンは `wasm-node-smoke` ジョブと同一
  # （バージョン固定 + SHA256 チェックサム検証）。ドリフト検出は
  # `crates/cli/tests/template_vendor_drift.rs::wasm_lockfile_wasm_bindgen_version_matches_repo_root_lockfile`
  # が `templates/app/wasm/Cargo.lock` とリポジトリ本体 `Cargo.lock` の
  # バージョン一致を機械的に検証する（`test` ジョブの `cargo test` で実行済み）。
  template-app-wasm-smoke:
    name: "fw new --template app: wasm ビルド込み CSR 完全実体の e2e 検証（issue #411）"
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # `wasm-node-smoke` ジョブと同一パターン（バージョン固定 + SHA256
      # チェックサム検証 + atomic install）。バージョン・SHA256 の pin 値は
      # 同ジョブと同一（リポジトリ本体 Cargo.lock 解決値、wasm-bindgen 0.2.126）。
      - name: Install wasm-bindgen-cli (pinned + checksum-verified, atomic install)
        run: |
          set -euo pipefail
          WASM_BINDGEN_VERSION="0.2.126"
          WASM_BINDGEN_SHA256="064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d"
          SHARE_DIR="${HOME}/.local/share/wasm-bindgen"
          INSTALL_DIR="${SHARE_DIR}/${WASM_BINDGEN_VERSION}"
          mkdir -p "${SHARE_DIR}"
          if [ ! -x "${INSTALL_DIR}/wasm-bindgen" ]; then
            tmp_root="$(mktemp -d "${SHARE_DIR}/.tmp-XXXXXX")"
            trap 'rm -rf "${tmp_root}"' EXIT
            ARCHIVE="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            URL="https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${ARCHIVE}"
            curl -sSfL -o "${tmp_root}/${ARCHIVE}" "${URL}"
            echo "${WASM_BINDGEN_SHA256}  ${tmp_root}/${ARCHIVE}" | sha256sum -c -
            tar xzf "${tmp_root}/${ARCHIVE}" -C "${tmp_root}"
            if ! mv -T "${tmp_root}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl" "${INSTALL_DIR}" 2>/dev/null; then
              if [ ! -x "${INSTALL_DIR}/wasm-bindgen" ]; then
                echo "::error::failed to install wasm-bindgen-cli to ${INSTALL_DIR}" >&2
                exit 1
              fi
            fi
          fi
          echo "${INSTALL_DIR}" >> "$GITHUB_PATH"

      - name: fw new --template app（フィクスチャ専用 CARGO_TARGET_DIR）
        # 共有 CARGO_TARGET_DIR との衝突回避は `.claude/rules/ci.md`
        # 「Self-hosted 環境の前提」に従う。
        env:
          CARGO_TARGET_DIR: /tmp/fandhe-frontend-template-app-wasm-smoke-target
        run: |
          set -euo pipefail
          rm -rf /tmp/fandhe-frontend-template-app-wasm-smoke
          cargo run --locked -p fandhe-frontend-cli --bin fw -- new template-app-wasm-smoke \
            --template app --dir /tmp/fandhe-frontend-template-app-wasm-smoke

      - name: tools/wasm/build.sh の実行
        # 直前ステップと同じくフィクスチャ専用 CARGO_TARGET_DIR を明示指定する
        # （`.claude/rules/ci.md` 「Self-hosted 環境の前提」）。未指定だと
        # self-hosted runner の共有 CARGO_TARGET_DIR=/cargo-target が使われ、
        # build.sh が期待する `wasm/target/...` とパスが一致しなくなる
        # （イシュー #411 CI 失敗の原因）。
        env:
          CARGO_TARGET_DIR: /tmp/fandhe-frontend-template-app-wasm-smoke-target/wasm-build
        run: |
          set -euo pipefail
          cd /tmp/fandhe-frontend-template-app-wasm-smoke/template-app-wasm-smoke
          ./tools/wasm/build.sh

      - name: 生成物の存在・mount_csr/hydrate エクスポートの検証
        run: |
          set -euo pipefail
          project="/tmp/fandhe-frontend-template-app-wasm-smoke/template-app-wasm-smoke"
          js="${project}/static/wasm/fandhe_frontend_wasm_client.js"
          wasm="${project}/static/wasm/fandhe_frontend_wasm_client_bg.wasm"
          if [ ! -f "${js}" ]; then
            echo "::error::missing ${js}" >&2
            exit 1
          fi
          if [ ! -f "${wasm}" ]; then
            echo "::error::missing ${wasm}" >&2
            exit 1
          fi
          if ! grep -q "export function mount_csr" "${js}"; then
            echo "::error::mount_csr export not found in ${js}" >&2
            exit 1
          fi
          if ! grep -q "export function hydrate" "${js}"; then
            echo "::error::hydrate export not found in ${js}" >&2
            exit 1
          fi
          echo "template-app-wasm-smoke: mount_csr/hydrate exports verified"

  # TASK-12.2c（#124、REQ-12 受け入れ基準 2）: install.sh の --ignore-scripts
  # 強制（前段、TASK-12.1a・#38・マージ済み）と check_static_only.py の
  # 静的アセット判定（後段ゲート、TASK-12.2b・#123・マージ済み）の多層防御を
  # CI で回帰確認する。本ジョブは緩和用 input・環境変数・continue-on-error を
  # 一切設けない（loc-check ジョブと同一の迂回経路禁止原則）。
  #
  # test_install.sh（TASK-12.1a の成果物）・check_static_only.py（TASK-12.2b
  # の成果物）はいずれも必須成果物であり、無条件（fail-closed）に実行する。
  # 存在ガード（未作成時に該当ステップをスキップする措置）は TASK-12.2b
  # マージ完了に伴い撤去済み（TASK-12.2・#121）。ファイル不在・失敗はいずれも
  # 即 CI 失敗として扱う。
  npm-asset-build:
    name: NPM static asset gate (REQ-12)
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout v4.2.2（他ジョブと同一 SHA 固定）。
        # docs/spec サブモジュールは本ジョブに不要のため取得しない。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Node.js
        # update-external.yml と同一 SHA 固定。ubuntu-latest には node/npm が
        # プリインストールされているが、self-hosted runner には保証がないため
        # 明示的にセットアップする（下段の test_pipeline_e2e.sh は node/npm 不在
        # 時に自己スキップする作りだが、self-hosted 移行後も実 npm でのパイプライン
        # 検証を維持するために導入する）。
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'

      # 前提（self-hosted 移行、ユーザー指示 2026-07-18）: 本ジョブは python3 の
      # 常設を前提とする。ubuntu-latest にはプリインストールされているが、
      # self-hosted runner には保証がないため、未検出時は fail-closed で
      # 明示エラーとする（他ジョブと異なりインストールは行わない。python3 は
      # OS 標準構成の一部として runner 側で常設されることを期待するため）。
      - name: Check python3 availability
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::error::python3 not found. self-hosted runner requires python3 pre-installed." >&2
            exit 1
          fi

      - name: install.sh offline regression tests (fail-closed)
        run: bash tools/npm-asset-build/tests/test_install.sh

      - name: check_static_only.py fixture regression tests (fail-closed)
        # check_static_only.py（TASK-12.2b・#123 でマージ済み）本体を対象とした
        # fixture 回帰テスト。スクリプト・テストファイルいずれかの不在や
        # 失敗はここで即座にジョブ失敗となる（存在ガードによる skip は
        # TASK-12.2b マージ完了に伴い撤去済み、TASK-12.2・#121）。
        run: python3 tools/npm-asset-build/tests/test_check_static_only.py -v

      - name: install.sh + check_static_only.py pipeline e2e tests (fail-closed)
        # TASK-12.1b（イシュー #39）: install.sh → check_static_only.py の
        # パイプライン全体を実 npm で end-to-end 検証する。ubuntu-latest には
        # node/npm がプリインストールされているため、CI 上では常に実行される
        # （緩和用 input・continue-on-error は設けない。既存ジョブの迂回経路
        # 禁止原則を踏襲）。ケース G（イシュー #316）が apply_exempt.py の
        # 半自動追記往復も併せて検証する。
        run: bash tools/npm-asset-build/tests/test_pipeline_e2e.sh

      - name: apply_exempt.py fixture regression tests (fail-closed)
        # イシュー #316: allowlist 半自動追記コマンド apply_exempt.py 本体の
        # ユニット/フィクスチャ回帰（検証・エスケープ・アトミック書き込み・
        # 終了コード契約）。check_static_only.py と同じく存在ガードなし
        # （不在・失敗は即座にジョブ失敗）。
        run: python3 tools/npm-asset-build/tests/test_apply_exempt.py -v

      - name: templates/default npm-asset-build sync check (fail-closed)
        # イシュー #316: templates/default/tools/npm-asset-build/ へ同梱した
        # コピーが正本（tools/npm-asset-build/）とドリフトしていないことを
        # 機械的に検証する。テンプレート側だけが改変・弱体化される事態を防ぐ。
        run: bash tools/npm-asset-build/tests/test_template_sync.sh

  # TASK-10.4a（イシュー #119、REQ-10）: 本番ビルドのアセット変更反映
  # （差分ビルド）が 5 秒以内であることを継続計測するジョブ。
  # `crates/dist-server/benches/rebuild_latency.rs`（judge/format_summary_line は
  # `crates/dist-server/src/bench_support.rs` に分離しユニットテストで書式契約を
  # 固定）を実行し、PoC-4 実測（0.571〜0.597 秒）を基準とした回帰を検知する。
  #
  # `test` ジョブと同じ環境構築パターン（wasm32 target・wasm-bindgen-cli
  # バージョン固定 + SHA256 チェックサム検証）を踏襲する。本ベンチが起動する
  # ネスト `cargo build -p fandhe-frontend-dist-server` は `crates/dist-server/build.rs` の
  # WASM ビルドステージ（既定有効）を経由するため、本ジョブは
  # オプトアウトせず統合ビルドをそのまま計測に含める。
  #
  # しきい値運用の原則は deps-check/loc-check ジョブと同一: しきい値の正は
  # `crates/dist-server/src/bench_support.rs` の LIMIT_SECONDS（5.0）定数のみ。
  # 緩和用の input・環境変数・continue-on-error は設けない。
  #
  # イシュー #294: 共有 self-hosted runner（6 並列）上の CPU 競合による
  # 間欠フレーク対策として、判定は N=3 サンプルの中央値（median-of-N）で
  # 行う（`bench_support::judge`）。少数派（N=3 なら 1 サンプル）のみの
  # ノイズは吸収しつつ、過半数のサンプルが超過する恒常的なリグレッションは
  # 引き続き検出する。min-of-N（1 サンプルでも以内なら PASS）は間欠的な
  # 多数決リグレッションを見逃すため不採用（詳細は `bench_support`
  # モジュールドキュメント参照）。サマリには全サンプル値・min_s・max_s も
  # 出力し、分布を目視追跡できるようにする。
  rebuild-latency:
    name: REQ-10 rebuild latency (5s limit)
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v4.2.2（test ジョブと同一 SHA 固定）。
        # docs/spec サブモジュールは本ジョブの計測に不要のため取得しない。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定（self-hosted runner プールに
        # cargo 未導入インスタンスが混在し得るための保険。導入済みなら何もしない）。
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # wasm-bindgen-cli はバージョン固定 + SHA256 チェックサム検証付きで
      # 導入する（`test` ジョブと同一バージョン・同一チェックサム。
      # `crates/dist-server/build.rs` の expected_wasm_bindgen_version が Cargo.lock
      # 解決済みバージョンとの完全一致を要求するため、更新時は両方を
      # 合わせて更新すること）。self-hosted 移行に伴い、インストール先を
      # /usr/local/bin から $HOME/.local/share/wasm-bindgen/<version>/ へ
      # 変更する（test ジョブと同一の理由）。
      - name: Install wasm-bindgen-cli (pinned + checksum-verified)
        # atomic install（Cursor Bugbot 指摘 BUGBOT_BUG_ID: 1c88c06e、PR #291）:
        # 詳細は test ジョブの同名ステップのコメント参照。
        run: |
          set -euo pipefail
          WASM_BINDGEN_VERSION="0.2.126"
          WASM_BINDGEN_SHA256="064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d"
          SHARE_DIR="${HOME}/.local/share/wasm-bindgen"
          INSTALL_DIR="${SHARE_DIR}/${WASM_BINDGEN_VERSION}"
          mkdir -p "${SHARE_DIR}"
          if [ ! -x "${INSTALL_DIR}/wasm-bindgen" ] || [ ! -x "${INSTALL_DIR}/wasm-bindgen-test-runner" ]; then
            tmp_root="$(mktemp -d "${SHARE_DIR}/.tmp-XXXXXX")"
            trap 'rm -rf "${tmp_root}"' EXIT
            ARCHIVE="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            URL="https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${ARCHIVE}"
            curl -sSfL -o "${tmp_root}/${ARCHIVE}" "${URL}"
            echo "${WASM_BINDGEN_SHA256}  ${tmp_root}/${ARCHIVE}" | sha256sum -c -
            tar xzf "${tmp_root}/${ARCHIVE}" -C "${tmp_root}"
            # mv の終了コードには依存しない（coreutils 9.2 以降は `mv -n` が
            # 宛先既存時に非ゼロ終了するため。Cursor Bugbot 指摘 High/Medium、
            # コミット 64ecb28 対応。詳細は cargo-deny インストールステップの
            # コメント参照）。
            if ! mv -T "${tmp_root}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl" "${INSTALL_DIR}" 2>/dev/null; then
              if [ ! -x "${INSTALL_DIR}/wasm-bindgen" ] || [ ! -x "${INSTALL_DIR}/wasm-bindgen-test-runner" ]; then
                echo "::error::failed to install wasm-bindgen-cli to ${INSTALL_DIR}" >&2
                exit 1
              fi
            fi
          fi
          echo "${INSTALL_DIR}" >> "$GITHUB_PATH"

      - name: Run rebuild_latency bench
        # xtask 系ジョブと同一の理由（子プロセス終了コード伝播・Cargo.lock
        # drift 防止）で pipefail・tee・--locked を用いる。
        run: |
          set -o pipefail
          cargo bench --locked -p fandhe-frontend-dist-server --bench rebuild_latency | tee rebuild-latency.log

      - name: Publish rebuild-latency summary
        if: always()
        # format_summary_line（crates/dist-server/src/bench_support.rs）の 1 行
        # サマリ契約「rebuild-latency: samples=<n> s1=<x> ... median_s=<x>
        # min_s=<x> max_s=<x> limit_s=<x> result=<PASS|FAIL>」を Step Summary
        # に転記する（deps-check/loc-check ジョブと同一パターン。median_s は
        # イシュー #294 で判定基準に採用、min_s・max_s は観測性のため
        # 引き続き出力）。
        run: |
          {
            echo '## rebuild-latency (REQ-10, issue #119)'
            echo '```'
            grep '^rebuild-latency:' rebuild-latency.log || echo 'rebuild-latency: no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # TASK-11.6（イシュー #89、REQ-11 受け入れ基準 1）: 最小インタラクティブ
  # コンポーネント（fandhe-frontend-wasm-full）の WASM バンドルサイズ（gzip 後）が
  # 200KB 以内であることを継続計測するジョブ。
  #
  # `crates/wasm-full/tests/bundle_size.rs` が `crates/dist-server/build.rs` と同一の
  # コマンド列（cargo build --target wasm32-unknown-unknown --release →
  # wasm-bindgen --target web --no-typescript）を自己完結で再現するため、
  # `test`/`rebuild-latency` ジョブと同じ wasm ツールチェーン導入パターン
  # （wasm32 target・wasm-bindgen-cli バージョン固定 + SHA256 チェックサム
  # 検証）を踏襲する。
  #
  # しきい値運用の原則は deps-check/loc-check ジョブと同一: しきい値の正は
  # `crates/wasm-full/tests/bundle_size.rs` の REQ11_BUNDLE_SIZE_LIMIT_BYTES
  # （200_000）定数のみ。緩和用の input・環境変数・continue-on-error は
  # 設けない（迂回経路を作らない設計）。
  #
  # `test` ジョブの `cargo test --workspace` でも本テストは実行されるため、
  # 本ジョブは主に「REQ-11 の 1 行サマリを Step Summary へ可視化する」役割を
  # 兼ねる（二重防御）。
  bundle-size:
    name: REQ-11 fandhe-frontend-wasm-full bundle gzip size (200KB limit)
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v4.2.2（test/loc-check ジョブと同一 SHA 固定）。
        # docs/spec サブモジュールは本ジョブの計測に不要のため取得しない。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定（self-hosted runner プールに
        # cargo 未導入インスタンスが混在し得るための保険。導入済みなら何もしない）。
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # wasm-bindgen-cli はバージョン固定 + SHA256 チェックサム検証付きで
      # 導入する（`test`/`rebuild-latency` ジョブと同一バージョン・同一
      # チェックサム。バージョンアップ時は Cargo.lock 解決済み wasm-bindgen
      # と合わせて更新すること）。self-hosted 移行に伴い、インストール先を
      # /usr/local/bin から $HOME/.local/share/wasm-bindgen/<version>/ へ
      # 変更する（他ジョブと同一の理由）。
      - name: Install wasm-bindgen-cli (pinned + checksum-verified)
        # atomic install（Cursor Bugbot 指摘 BUGBOT_BUG_ID: 1c88c06e、PR #291）:
        # 詳細は test ジョブの同名ステップのコメント参照。
        run: |
          set -euo pipefail
          WASM_BINDGEN_VERSION="0.2.126"
          WASM_BINDGEN_SHA256="064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d"
          SHARE_DIR="${HOME}/.local/share/wasm-bindgen"
          INSTALL_DIR="${SHARE_DIR}/${WASM_BINDGEN_VERSION}"
          mkdir -p "${SHARE_DIR}"
          if [ ! -x "${INSTALL_DIR}/wasm-bindgen" ] || [ ! -x "${INSTALL_DIR}/wasm-bindgen-test-runner" ]; then
            tmp_root="$(mktemp -d "${SHARE_DIR}/.tmp-XXXXXX")"
            trap 'rm -rf "${tmp_root}"' EXIT
            ARCHIVE="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            URL="https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${ARCHIVE}"
            curl -sSfL -o "${tmp_root}/${ARCHIVE}" "${URL}"
            echo "${WASM_BINDGEN_SHA256}  ${tmp_root}/${ARCHIVE}" | sha256sum -c -
            tar xzf "${tmp_root}/${ARCHIVE}" -C "${tmp_root}"
            # mv の終了コードには依存しない（coreutils 9.2 以降は `mv -n` が
            # 宛先既存時に非ゼロ終了するため。Cursor Bugbot 指摘 High/Medium、
            # コミット 64ecb28 対応。詳細は cargo-deny インストールステップの
            # コメント参照）。
            if ! mv -T "${tmp_root}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl" "${INSTALL_DIR}" 2>/dev/null; then
              if [ ! -x "${INSTALL_DIR}/wasm-bindgen" ] || [ ! -x "${INSTALL_DIR}/wasm-bindgen-test-runner" ]; then
                echo "::error::failed to install wasm-bindgen-cli to ${INSTALL_DIR}" >&2
                exit 1
              fi
            fi
          fi
          echo "${INSTALL_DIR}" >> "$GITHUB_PATH"

      - name: Run bundle_size test
        # xtask 系ジョブと同一の理由（子プロセス終了コード伝播・Cargo.lock
        # drift 防止）で pipefail・tee・--locked を用いる。
        run: |
          set -o pipefail
          cargo test -p fandhe-frontend-wasm-full --test bundle_size --locked -- --nocapture | tee bundle-size.log

      - name: Publish bundle-size summary
        if: always()
        # format_report（crates/wasm-full/tests/bundle_size.rs）の 1 行サマリ契約
        # 「bundle-size: total_gzip_bytes=<n>/<limit> files=<k>
        # result=<PASS|FAIL>」を Step Summary に転記する（loc-check ジョブと
        # 同一パターン）。
        run: |
          {
            echo '## bundle-size (REQ-11, issue #89)'
            echo '```'
            grep '^bundle-size:' bundle-size.log || echo 'bundle-size: no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  loc-check:
    name: REQ-8/REQ-11 glue JS effective LOC limit (10 lines, issues #62/#156)
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v4.2.2（同一ファイル内の test ジョブと同一 SHA に固定）。
        # docs/spec submodule は本ジョブの計測に不要なため取得しない。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定（self-hosted runner プールに
        # cargo 未導入インスタンスが混在し得るための保険。導入済みなら何もしない）。
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Run xtask check-loc
        # xtask check-loc の終了コードをそのまま CI の成否に伝播させる（fail-closed）。
        # set -o pipefail を明示し、tee 経由でも cargo run の終了コードが失われないようにする。
        # --locked はこの外側の cargo run が Cargo.lock を書き換えないことを保証する
        # （deps-check ジョブと同一の理由）。
        run: |
          set -o pipefail
          cargo run --locked -p xtask -- check-loc | tee loc-check.log

      - name: Publish loc-check summary
        if: always()
        # format_loc_report（crates/xtask/src/check_loc.rs）の 1 行サマリ契約
        # 「loc-check: file=<path> effective_loc=<n>/<limit> result=<PASS|FAIL>」を
        # Step Summary に転記する。この契約はテストで固定される
        # （crates/xtask/tests/cli_check_loc.rs）。
        run: |
          {
            echo '## loc-check (REQ-8 issue #62 / REQ-11 issue #156)'
            echo '```'
            grep '^loc-check:' loc-check.log || echo 'loc-check: no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # TASK-4.4（イシュー #28、REQ-4 受け入れ基準 3）: 標準プロジェクトテンプレート
  # （templates/default）に対する「型的に不正な AI 生成コードが cargo check の
  # 段階で機械的に弾かれること」の回帰テストを実行するジョブ。
  # templates/default は root workspace の members に含まれない独立した
  # cargo プロジェクトのため、manifest-path を明示して単独実行する。
  template-negative-type-error:
    name: TASK-4.4 templates/default 型不正コード機械的検出の受け入れ基準検証
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout v4.2.2（test/loc-check ジョブと同一 SHA に固定）。
        # docs/spec サブモジュールは本ジョブの検証に不要なため取得しない。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定（self-hosted runner プールに
        # cargo 未導入インスタンスが混在し得るための保険。導入済みなら何もしない）。
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: templates/default 単体テスト（正例 + 負例 E0277/E0308）
        # --offline で子プロセス cargo check を実行するテスト（依存ゼロの
        # ため事前フェッチ不要）。--locked はコミット済み Cargo.lock からの
        # drift を検知する（deps-check 等の既存ジョブと同一の理由）。
        run: cargo test --manifest-path templates/default/Cargo.toml --locked

      - name: xtask 多層防御テスト（成果物の実在・必須要素の静的検証）
        # templates/default は root workspace 外のため、cargo test --workspace
        # だけでは成果物テストの削除・実行漏れを検知できない。xtask 側
        # （workspace メンバー）からの静的検証で安全網を張る
        # （TASK-4.1 の template_deny_config.rs と同一パターン）。
        run: cargo test -p xtask --test template_negative_type_error --locked

  # イシュー #157（#158/#159、REQ-1）: `raw_html()` 検出の主防御である
  # `clippy::disallowed_methods`（workspace ルート `clippy.toml` が宣言）を
  # CI でも強制するジョブ。イシュー #299 で `--all-targets` へ拡張し、
  # テストターゲット（`#[cfg(test)]` / `tests/` 配下）内の `raw_html()` 呼び
  # 出しも検出対象に含める。テストコード内の呼び出しにも呼び出し単位の
  # `#[expect(clippy::disallowed_methods, reason = "ESCAPE-REVIEWED: ...")]`
  # を必須とする（`docs/policy/raw-html-review-gate.md` 準拠）。`crates/cli/src/gate.rs` の
  # `lint` チェックもイシュー #315 で `--all-targets` 化済みのため、ローカル
  # ゲート・AI 自己保守フックと本 CI ジョブの検出範囲は一致する（旧記述
  # 「本 CI ジョブが superset」は解消済み）。本ジョブは `--workspace` による
  # 全クレート横断を担う最終防衛線として維持する。未レビューの `raw_html()`
  # 呼び出しが本体コード・テストコードいずれへ入っても本ジョブが
  # `-D warnings` により失敗し、マージをブロックする
  # （方式選定・脅威モデルは docs/design/raw-html-lint-design.md 参照）。
  clippy:
    name: REQ-1 raw_html() 検出（clippy disallowed_methods, issue #157）
    runs-on: self-hosted
    timeout-minutes: 20
    # forbid-unsafe ジョブと同じ理由で dist-server の WASM ネストビルドを
    # オプトアウトする: `cargo clippy --workspace` は crates/dist-server/build.rs 経由で
    # ネストした cargo build + wasm-bindgen 起動を伴うが、本ジョブの runner には
    # wasm32 ターゲット・wasm-bindgen-cli の常設保証がなく、build.rs 側の
    # panic（wasm-bindgen-cli 不在）で本ジョブ本来の目的（raw_html() 検出）と
    # 無関係に失敗する。統合ビルドの実証は別ジョブ（test 等）が担う。
    env:
      FANDHE_FRONTEND_WASM_BUILD: "0"
    steps:
      - name: Checkout
        # actions/checkout v4.2.2（test/loc-check ジョブと同一 SHA に固定）。
        # docs/spec サブモジュールは本ジョブの検証に不要なため取得しない。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # deps-check.yml と同一の理由・同一 SHA 固定（self-hosted runner プールに
        # cargo 未導入インスタンスが混在し得るための保険）。加えて本ジョブは
        # clippy component を必須とするため components: clippy を明示する
        # （既に導入済みのツールチェーンでは何もしない。未導入時の新規セット
        # アップでも clippy が確実に含まれるようにする安全策）。
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: clippy

      - name: Show toolchain
        run: rustup show && cargo --version

      - name: cargo clippy --workspace --all-targets -- -D warnings
        # workspace ルートの clippy.toml（disallowed-methods）が効き、
        # 未レビュー raw_html() 呼び出しがあれば本ステップが失敗する。
        # --all-targets によりテストターゲット（#[cfg(test)] / tests/ 配下）
        # もコンパイル・lint 対象に含む（イシュー #299）。
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # イシュー #400（親 #394、出典: PR #382 out-of-scope）: `fw gate --project .`
  # の自己適用（#372 で PASS 化、PR #382）を CI で常時実行し、自己適用 PASS の
  # リグレッション（自己参照誤検知の再発・deny.toml 弱体化・structure.toml と
  # 実構成のドリフト等）を検出する。`fw gate` 本体（crates/cli/src/gate.rs）は
  # type_check/lint/test/policy/default_escape_check の 5 チェックを直列実行し
  # リポジトリ直下 structure.toml の宣言クレートを対象とする。
  gate-self-apply:
    name: "fw gate --project . self-apply (issue #400)"
    runs-on: self-hosted
    # gate は check + clippy + test + deny を直列実行するため test ジョブより
    # 長めに確保する。
    timeout-minutes: 40
    # forbid-unsafe / clippy ジョブと同じ理由: gate の type_check / test は
    # -p fandhe-frontend-dist-server を含み、crates/dist-server/build.rs の WASM ネストビルド
    # （wasm32 target・wasm-bindgen-cli 起動）は本ジョブの runner に常設保証が
    # ないため明示オプトアウトする。統合 WASM ビルドの実証は test ジョブが
    # 専任する。
    env:
      FANDHE_FRONTEND_WASM_BUILD: "0"
    steps:
      - name: Checkout
        # actions/checkout v4.2.2（test/clippy ジョブと同一 SHA に固定）。
        # docs/spec サブモジュールは gate の検証対象外のため取得しない。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # 他ジョブと同一 SHA 固定。gate の lint チェックが clippy を要求する
        # ため components: clippy を明示する。
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: clippy

      - name: Install cargo-deny / clippy component (ensure-gate-tools.sh)
        # `fw gate` の policy チェック（cargo deny）・lint チェック（clippy
        # component）が要求するツールを、バージョン固定 + SHA256 検証済み
        # プリビルトバイナリで用意する（イシュー #292/#314、ci.md 規約）。
        run: tools/ci/ensure-gate-tools.sh

      - name: "fw gate --project . 自己適用（PASS 常時保証, issue #400）"
        run: |
          set -euo pipefail
          # gate は JSON レポートを stdout へ出力し、gate_result に応じた
          # 終了コード（PASS=0 / BLOCKED=1）を返す（fail-closed、緩和経路なし）。
          # BLOCKED 時は各 checks[].output 先頭の固定プレフィックス
          # "environment error: "（ENVIRONMENT_ERROR_PREFIX、gate-design.md
          # §2.3a）の有無で「runner 環境未整備」と「コード起因の FAIL」を
          # GitHub Actions アノテーションとして区別する（受け入れ条件 2）。
          # gate の JSON は compact 出力（キー間に空白なし）のため
          # `"environment error: ` を緩く grep する。
          if cargo run -p fandhe-frontend-cli --locked -- gate --project . | tee gate-report.json; then
            exit 0
          fi
          if grep -q '"environment error: ' gate-report.json; then
            echo "::error::fw gate BLOCKED: environment error (runner setup issue, not code). See 'environment error:' entries in the JSON report above; ensure tools/ci/ensure-gate-tools.sh ran successfully (see .claude/rules/ci.md)."
          else
            echo "::error::fw gate BLOCKED: code-caused check failure. See failing checks in the JSON report above."
          fi
          exit 1

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TASK-2.1 (REQ-2): コアクレートの unsafe 不使用を機械的に強制するジョブ。
  # 一次防御 = #![forbid(unsafe_code)] 属性（ビルド時 lint、削除は下記テストが検知）
  # 二次防御 = core/tests/unsafe_boundary.rs（属性の実在・unsafe トークン不在・core 外部依存ゼロ）
  # 三次防御 = 本ジョブの RUSTFLAGS='-F unsafe_code' による cargo check（属性とテストが
  # 同時に外された場合でも、コマンドラインからの forbid はソース側の allow で上書きできない）
  #
  # ファイル名は汎用の ci.yml とし、ジョブ名を目的特化の forbid-unsafe とする。
  # 後続の CI 系タスク（fmt/clippy・依存グラフ計測等）は同一ファイルへ
  # ジョブを追加していく前提の拡張可能な構成とする。
  forbid-unsafe:
    name: Forbid unsafe in core crates
    runs-on: self-hosted
    steps:
      - name: Checkout
        # actions/checkout v6.0.3（update-external.yml と同一 SHA に固定）
        # docs/spec サブモジュールはテストに不要のため取得しない（既定で submodules: false）
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Show toolchain
        run: rustup show && cargo --version

      - name: unsafe 境界の回帰テスト（forbid 属性・unsafe トークン・core 依存ゼロ）
        run: cargo test -p rws-core --test unsafe_boundary --locked

      # NOTE: -F (forbid) はソース側の #[allow(unsafe_code)] で上書きできないため、
      # 属性が誤って削除された場合の独立した防御線になる。
      # 現メンバー（core・app・xtask）はいずれも safe 域のため workspace 全体に適用可能。
      # wasm-client/wasm-full/wasm-thin 等の FFI 境界クレートが追加された場合は
      # `-p` 指定で safe 域クレートのみへ絞り込み、
      # core/tests/unsafe_boundary.rs の UNSAFE_ALLOWED_MEMBERS と同期して更新すること。
      - name: ビルド時 lint による強制（属性とテストの双方が同時に外された場合の三重防御）
        run: RUSTFLAGS='-F unsafe_code' cargo check --workspace --locked

      - name: workspace 全テスト（XSS 回帰・エスケープ仕様テストを含む）
        run: cargo test --workspace --locked

  # TASK-1.2b（#10）: XSS 回帰テスト（REQ-1）を含む Rust テスト CI。
  # forbid-unsafe ジョブ（self-hosted）とは別に ubuntu-latest 環境でも
  # workspace テストを実行し、クロスプラットフォームの回帰を検知する。
  test:
    name: Rust workspace tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2。docs/spec/ サブモジュールはテストに不要なため
        # submodules: false でチェックアウト面を最小化する（サプライチェーン対策）。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false

      - name: XSS regression tests (REQ-1)
        # REQ-1（既定エスケープ）の受け入れ基準を担保するゲート。
        # SSR/SSG/CSR 経路の XSS 回帰テストを独立ステップとして可視化する。
        run: cargo test -p rws-core --test xss_escape --locked

      - name: Workspace tests
        run: cargo test --workspace --locked

  # TASK-10.1a（#106）: rws-dist-server の開発 / 本番モード切り替え
  # （`dist-server/src/assets.rs` の `AssetMode`）を CI で両モードとも検証する。
  #
  # 上記 `test` ジョブの `cargo test --workspace` はデフォルトの debug ビルド
  # （= DevFilesystem モード、`static/` からのファイルシステム読み込み経路）
  # のみをカバーする。本ジョブは `--features force-embed` を付与し、debug
  # ビルドのまま Embedded モード（本番相当の埋め込みテーブル検索経路）を
  # 強制して検証する（PoC-4 検証方法 5 の CI 化。`Cargo.toml` の
  # `force-embed` フィーチャーコメント参照）。
  dist-server-embedded-mode:
    name: rws-dist-server embedded mode (force-embed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2（他ジョブと同一 SHA 固定）。
        # docs/spec サブモジュールはテストに不要のため取得しない。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false

      - name: rws-dist-server tests (force-embed, Embedded mode)
        run: cargo test -p rws-dist-server --features force-embed --locked

  # TASK-6.3a（#65）: 実ブラウザ（headless Chromium）でのハイドレーション検証環境。
  # docs/spec/05-tasks.md TASK-6.3 が指名する wasm-pack test --headless --chrome を
  # ubuntu-latest（Chrome/chromedriver プリインストール済み）で実行するジョブ。
  #
  # wasm-client/（rws-wasm-client）は TASK-6.2b（#48）でクレート新設予定だが本コミット時点
  # では未作成（#48/#49 は open）。本イシューはクレート新設をスコープに含めない
  # （docs/hydration-api.md 第 5 節の引き継ぎ表・#48 との責務混線回避のため）。
  # そのため各ステップは check-wasm-client の存在判定結果でガードし、
  # wasm-client/ が存在しない間は環境整備のみ・実行はスキップする。
  # #48/#49 マージ後、後続タスク（TASK-6.3b #66 の hydration_browser.rs 等）が
  # 追加された時点で本ジョブは自動的に有効化される。
  browser-test:
    name: Browser tests (wasm-pack --headless --chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v4.2.2（test ジョブと同一 SHA 固定）。
        # docs/spec サブモジュールはテストに不要のため取得しない。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false

      # wasm-client/ ディレクトリ存在ガード（TASK-6.2b #48 完了までの直列化措置）。
      # 未作成の間は後続ステップをすべてスキップし、ジョブは空実行で成功扱いとする。
      - name: Check wasm-client crate existence
        id: check
        run: |
          if [ -f "wasm-client/Cargo.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::wasm-client/ crate not found yet (blocked on TASK-6.2b #48). Skipping browser tests."
          fi

      - name: Add wasm32 target
        if: steps.check.outputs.exists == 'true'
        run: rustup target add wasm32-unknown-unknown

      # wasm-pack はバージョン固定 + SHA256 チェックサム検証付きで導入する
      # （実行時の chromedriver 自動ダウンロードと同様、未検証バイナリ取得を避けるサプライ
      # チェーン対策）。バージョンアップ時はチェックサムも合わせて更新すること。
      - name: Install wasm-pack (pinned + checksum-verified)
        if: steps.check.outputs.exists == 'true'
        run: |
          set -euo pipefail
          WASM_PACK_VERSION="0.13.1"
          WASM_PACK_SHA256="c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539"
          ARCHIVE="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          URL="https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${ARCHIVE}"
          curl -sSfL -o "${ARCHIVE}" "${URL}"
          echo "${WASM_PACK_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar xzf "${ARCHIVE}"
          install -m 755 "wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack

      # CHROMEWEBDRIVER はランナー内蔵の chromedriver へのパスを指す（GitHub ホスト
      # ランナーの環境変数）。wasm-pack による実行時の chromedriver 自動ダウンロードを
      # 防ぎ、ランナーに事前導入済みの検証済みバイナリのみを使用する。
      - name: Run browser tests (headless Chrome)
        if: steps.check.outputs.exists == 'true'
        run: CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver" wasm-pack test --headless --chrome wasm-client

  # TASK-8.2b（イシュー #62, REQ-8 受け入れ基準）: 同一文書内更新向け
  # ラッパー関数（`static/view-transitions.js` の `withViewTransition`、
  # TASK-8.2a／イシュー #61）の実効 LOC（コメント・空行を除く）が
  # 10 行以内であることを機械的に強制するジョブ。
  #
  # しきい値運用の原則は deps-check ジョブと同一: しきい値・対象ファイルの正は
  # xtask/src/check_loc.rs の MAX_EFFECTIVE_LOC（10）/ LOC_CHECK_TARGETS 定数のみ。
  # このジョブには緩和用の input・環境変数・continue-on-error を一切設けない
  # （迂回経路を作らない設計。しきい値変更はコード定数の変更 = レビュー必須の PR のみ）。
  #
  # fail-closed: 対象ファイル（static/view-transitions.js）の不在・読み取り失敗も
  # しきい値超過と同様に終了コード 1 として扱う（xtask/src/check_loc.rs 参照）。
  # そのため TASK-8.2a（イシュー #61）のマージ前にこのジョブが実行されると
  # 意図的に FAIL する。
  # TASK-11.5a（#86）: 実ブラウザ性能計測ハーネス（wasm-full/tests/perf_browser.rs）の
  # スモーク実行ジョブ。TASK-6.3a（#65）の browser-test ジョブと同じ環境構築
  # パターン（wasm32 target・wasm-pack バージョン固定＋チェックサム検証・ランナー
  # 内蔵 chromedriver 明示指定）を踏襲するが、対象クレート（wasm-client と
  # wasm-full）が異なり、browser-test ジョブは TASK-11.2d（#77）が担当する
  # wasm-full 存在ガード追加のスコープであるため、コンフリクトを避けて独立
  # ジョブとして追加する（`docs/perf-browser-harness.md` 引き継ぎ表参照）。
  #
  # 本ジョブの役割は「ハーネス自己検証テストの通過確認（スモーク実行）」のみ
  # であり、REQ-11 の性能予算（300ms/16ms）に対する正式判定は行わない
  # （しきい値アサーションの有効化は TASK-11.5b・#87 のスコープ）。
  perf-harness:
    name: Perf browser harness smoke (wasm-pack --headless --chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v4.2.2（他ジョブと同一 SHA 固定）。
        # docs/spec サブモジュールはテストに不要のため取得しない。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false

      # wasm-full/tests/perf_browser.rs 存在ガード（TASK-6.3a #65 のガード
      # パターン踏襲）。並列実行中の他イシューによる巻き戻り等、想定外の理由で
      # ファイルが存在しない場合でもジョブを失敗させず空実行で成功扱いとする。
      - name: Check perf_browser.rs harness existence
        id: check
        run: |
          if [ -f "wasm-full/tests/perf_browser.rs" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::wasm-full/tests/perf_browser.rs not found. Skipping perf harness smoke run."
          fi

      - name: Add wasm32 target
        if: steps.check.outputs.exists == 'true'
        run: rustup target add wasm32-unknown-unknown

      # wasm-pack はバージョン固定 + SHA256 チェックサム検証付きで導入する
      # （browser-test ジョブと同一バージョン・同一チェックサム。実行時の
      # chromedriver 自動ダウンロードと同様、未検証バイナリ取得を避ける
      # サプライチェーン対策）。
      - name: Install wasm-pack (pinned + checksum-verified)
        if: steps.check.outputs.exists == 'true'
        run: |
          set -euo pipefail
          WASM_PACK_VERSION="0.13.1"
          WASM_PACK_SHA256="c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539"
          ARCHIVE="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          URL="https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${ARCHIVE}"
          curl -sSfL -o "${ARCHIVE}" "${URL}"
          echo "${WASM_PACK_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar xzf "${ARCHIVE}"
          install -m 755 "wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack

      # CHROMEWEBDRIVER はランナー内蔵の chromedriver へのパスを指す（GitHub ホスト
      # ランナーの環境変数）。wasm-pack による実行時の chromedriver 自動ダウンロードを
      # 防ぎ、ランナーに事前導入済みの検証済みバイナリのみを使用する。
      # `-- --nocapture` を付与しないと、テストが成功した場合に libtest が
      # console 出力（`perf-browser:` サマリ行）を握りつぶすため、次ステップの
      # 転記が常に「no summary line found」になる（出力契約が成立しない）。
      - name: Run perf harness smoke (headless Chrome)
        if: steps.check.outputs.exists == 'true'
        run: |
          set -o pipefail
          CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver" wasm-pack test --headless --chrome wasm-full --test perf_browser -- --nocapture 2>&1 | tee perf-harness.log

      - name: Publish perf-harness summary
        if: always() && steps.check.outputs.exists == 'true'
        # perf_browser.rs の 1 行サマリ契約
        # 「perf-browser: metric=<name> samples=<n> mean_ms=<x> p95_ms=<x> max_ms=<x>」を
        # Step Summary に転記する（loc-check ジョブのパターン踏襲）。この契約は
        # perf_browser.rs 内の format_summary_line テストで固定される。
        run: |
          {
            echo '## perf-harness smoke (TASK-11.5a, issue #86)'
            echo '```'
            grep '^perf-browser:' perf-harness.log || echo 'perf-browser: no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # TASK-1.3b（#92、親 #90、REQ-1）: WASM 経路（イベント処理・DOM 更新）の
  # XSS 回帰テスト（wasm-full/tests/xss_escape_wasm.rs）を実ブラウザ
  # （headless Chromium）で実行するジョブ。browser-test/perf-harness ジョブと
  # 同じ環境構築パターン（wasm32 target・wasm-pack バージョン固定＋チェックサム
  # 検証・ランナー内蔵 chromedriver 明示指定）を踏襲するが、対象クレート
  # （wasm-full）・対象テスト（xss_escape_wasm）が異なるため独立ジョブとする。
  #
  # browser-test ジョブ（wasm-client 対象）への統合や wasm-full 存在ガードの
  # 追加は TASK-11.2d（#77）のスコープと明記されており、並列進行中の #77 との
  # コンフリクト・責務混線を避けるため本ジョブは独立させる（実装計画 §5）。
  #
  # ファイル自体が本 PR で新規追加されるため、他ジョブのような存在ガードは
  # 設けない（追加と同一コミットで即時有効化される）。
  xss-wasm-test:
    name: WASM XSS escape regression (wasm-pack --headless --chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout v4.2.2（他ジョブと同一 SHA 固定）。
        # docs/spec サブモジュールはテストに不要のため取得しない。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      # wasm-pack はバージョン固定 + SHA256 チェックサム検証付きで導入する
      # （browser-test/perf-harness ジョブと同一バージョン・同一チェックサム。
      # 実行時の chromedriver 自動ダウンロードと同様、未検証バイナリ取得を
      # 避けるサプライチェーン対策）。
      - name: Install wasm-pack (pinned + checksum-verified)
        run: |
          set -euo pipefail
          WASM_PACK_VERSION="0.13.1"
          WASM_PACK_SHA256="c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539"
          ARCHIVE="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          URL="https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${ARCHIVE}"
          curl -sSfL -o "${ARCHIVE}" "${URL}"
          echo "${WASM_PACK_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar xzf "${ARCHIVE}"
          install -m 755 "wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack

      # CHROMEWEBDRIVER はランナー内蔵の chromedriver へのパスを指す（GitHub
      # ホストランナーの環境変数）。wasm-pack による実行時の chromedriver
      # 自動ダウンロードを防ぎ、ランナーに事前導入済みの検証済みバイナリの
      # みを使用する。
      - name: Run WASM XSS escape regression (headless Chrome)
        run: CHROMEDRIVER="${CHROMEWEBDRIVER}/chromedriver" wasm-pack test --headless --chrome wasm-full --test xss_escape_wasm

  loc-check:
    name: REQ-8 view-transitions.js effective LOC limit (10 lines)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2（同一ファイル内の test ジョブと同一 SHA に固定）。
        # docs/spec submodule は本ジョブの計測に不要なため取得しない。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false

      - name: Run xtask check-loc
        # xtask check-loc の終了コードをそのまま CI の成否に伝播させる（fail-closed）。
        # set -o pipefail を明示し、tee 経由でも cargo run の終了コードが失われないようにする。
        # --locked はこの外側の cargo run が Cargo.lock を書き換えないことを保証する
        # （deps-check ジョブと同一の理由）。
        run: |
          set -o pipefail
          cargo run --locked -p xtask -- check-loc | tee loc-check.log

      - name: Publish loc-check summary
        if: always()
        # format_loc_report（xtask/src/check_loc.rs）の 1 行サマリ契約
        # 「loc-check: file=<path> effective_loc=<n>/<limit> result=<PASS|FAIL>」を
        # Step Summary に転記する。この契約はテストで固定される
        # （xtask/tests/cli_check_loc.rs）。
        run: |
          {
            echo '## loc-check (REQ-8, issue #62)'
            echo '```'
            grep '^loc-check:' loc-check.log || echo 'loc-check: no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

name: deps-check

# REQ-3（依存グラフ上限: 標準サーバー構成で依存パッケージ 60 件以内・深さ 6 以内、
# docs/spec/04-requirements.md）を CI で強制するワークフロー（TASK-3.1c）。
# 加えて TASK-3.2b で、同じ依存グラフ内の build.rs 保有クレート一覧
# （xtask list-build-scripts、TASK-3.2a）を監査ログとして Step Summary に出力する。
# こちらは security.md「依存追加時は build.rs の有無を確認する」の可視化が目的で
# あり、PASS/FAIL 判定を持たない（build.rs の存在自体は違反ではない。禁止クレートの
# ブロックは cargo-deny 系タスク（TASK-4.x）のスコープ）。
#
# さらにイシュー #154（REQ-3 受け入れ基準 1）で、`check-deps`（60/6 判定）とは独立に
# `check-core-deps` ゲートを追加する。`check-deps --package fandhe-frontend-core` は「60 件以内」を
# 見るのみで「ゼロであること」自体は強制しない。`check-core-deps` は
# `check_deps::ZERO_DEP_CRATES`（fandhe-frontend-core / fandhe-frontend-interactive）について
# Normal/Dev/Build すべての辺を対象に外部依存 0 件を専用ゲートとして強制する。
#
# しきい値運用の原則:
# - しきい値の正は crates/xtask/src/check_deps.rs の MAX_PACKAGES（60）/ MAX_DEPTH（6）/
#   ZERO_DEP_CRATES（外部依存ゼロ強制対象）定数のみ。
#   このワークフローには緩和用の input・環境変数・continue-on-error を一切設けない
#   （迂回経路を作らない設計。しきい値変更はコード定数の変更 = レビュー必須の PR のみ）。
# - 上限超過時の原則対応は依存削減。上限値自体の見直しは fandhe-frontend-spec
#   リポジトリでの仕様変更を経る。
# - 運用ドキュメント本体は TASK-3.3（docs/policy/dependency-graph-policy.md 相当）で整備予定。
#   本ワークフローはあくまで CI 組み込みの実体。
#
# 計測対象パッケージ:
# - 現時点の workspace members である fandhe-frontend-core（外部依存ゼロ契約。ディレクトリは
#   crates/core/ だがパッケージ名は Cargo.toml 上 fandhe-frontend-core）・xtask（外部依存ゼロ契約）・
#   fandhe-frontend-app（TASK-6.1b で追加。fandhe-frontend-core への path 依存のみ）を対象とする。
#   TASK-9.1b（イシュー #96）で fandhe-frontend-dist-server（crates/dist-server/、hyper 依存を持つ
#   標準サーバー構成の実体）を追加した。実測: packages=21/60 depth=5/6（PASS）。
#   axum・rust-embed はいずれも依存グラフ深さ上限（6）を構造的に超過するため
#   不採用とし、hyper + hyper-util + http-body-util + tokio の直接構成とした
#   （実測根拠は `crates/dist-server/Cargo.toml` のコメント参照）。
#   TASK-3.3b（イシュー #22/#24）で fandhe-frontend-server（router のみ・外部依存ゼロ、
#   crates/server/）を計測対象に追加した。実測: packages=0/60 depth=0/6（PASS）。
#   fandhe-frontend-wasm-full・fandhe-frontend-wasm-thin（CSR/ハイドレーション用クライアントクレート）は
#   REQ-3 が対象と明記する「標準サーバー構成」に該当しないため、本ゲートの対象に
#   含めない（docs/policy/dependency-graph-policy.md 第 4 節参照）。参考実測: wasm-full
#   20 packages/depth 9、wasm-thin 13 packages/depth 7（いずれも深さ上限 6 を
#   超過するが、これは対象外の結果であって理由ではない。対象外の理由は上記の
#   スコープ定義そのものであり、深さ超過を根拠に対象外化したわけではない）。
#   イシュー #553 で fandhe-frontend-headless-ui（crates/headless-ui/、
#   fandhe-frontend-core/-interactive への path 依存のみ）・fandhe-frontend-pre-styled-ui
#   （crates/pre-styled-ui/、fandhe-frontend-headless-ui への path 依存のみ）を計測対象に
#   追加した。UI コンポーネント層はサーバー構成に組み込まれ得るライブラリクレートで
#   あり REQ-3 の対象と判断する。実測: headless-ui packages=2/60 depth=2/6（PASS）、
#   pre-styled-ui packages=3/60 depth=3/6（PASS）。計測対象は 5 → 7 パッケージへ拡張
#   （詳細は docs/policy/dependency-graph-policy.md 第 4 節参照）。
# - `check-core-deps` は引数を取らず、`check_deps::ZERO_DEP_CRATES` と実 workspace
#   メンバーの積集合を xtask 内部で自動解決する（`fandhe-frontend-interactive` 追加時も
#   ワークフロー変更は不要）。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deps-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps-check:
    name: REQ-3 dependency graph limits (60 packages / depth 6, core zero-dep)
    # イシュー #1235（トラッキング #1220）で ubuntu-latest へ移行（in-place、
    # 並走期間なし）。設計判断の正は docs/ci/hosted-runner-migration.md。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（.github/workflows/update-external.yml と同一コミットに固定）。
        # docs/spec submodule は本ジョブの計測に不要なため取得しない（submodules 既定 false）。
        # persist-credentials: false（イシュー #1229 以降の踏襲パターン）: 本ジョブは
        # 読み取り専用の計測ジョブで push・PR 作成を一切行わないため、checkout が
        # 構成する認証情報をジョブ実行中に残置させる必要がない（認証情報残置面の縮小）。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        # ホステッドランナー（ubuntu-latest）はジョブごとにクリーンな使い捨て VM
        # であり、self-hosted プール時代のようなインスタンス間の cargo 導入有無の
        # 差異（PR #196 で判明した cargo 未導入インスタンス問題）は発生しない。
        # ホステッド環境では毎ジョブでのツール導入が主経路であり
        # （`.claude/rules/ci.md`・`docs/ci/hosted-runner-migration.md` §4.2）、
        # Fandhe-AI/actions/rust-toolchain-setup
        # （fed9c07d98367f77e5e2b63bca38843f46feee96 に固定。actions/checkout と
        # 同様フルコミット SHA 固定でサプライチェーンリスクを抑える。イシュー
        # #1273 で dtolnay/rust-toolchain から置換）を使う。ツールチェーンは
        # リポジトリ直下の rust-toolchain.toml（channel = "stable"）を単一
        # 真実源として rustup show で同期するため、toolchain input は持たない。
        uses: Fandhe-AI/actions/rust-toolchain-setup@749afc98a179a545bc1bdaab68cd07b6f6659970 # v1.1.0

      - name: Run xtask check-deps
        # xtask check-deps の終了コードをそのまま CI の成否に伝播させる（fail-closed）。
        # set -o pipefail を明示し、tee 経由でも cargo run の終了コードが失われないようにする。
        # `--locked` を付与し、この外側の cargo run が Cargo.lock を書き換えないことを保証する。
        # 内部の cargo metadata（crates/xtask/src/check_deps.rs）も --locked で計測しており、
        # ここで --locked を外すとビルド時に Cargo.toml / Cargo.lock の drift で
        # ロックファイルが書き換わり得て、計測対象と実際にビルドされたグラフが
        # 一致しなくなる（fail-closed の前提が崩れる）ため必須。
        run: |
          set -o pipefail
          cargo run --locked -p xtask -- check-deps --package fandhe-frontend-core --package xtask --package fandhe-frontend-app --package fandhe-frontend-dist-server --package fandhe-frontend-server --package fandhe-frontend-headless-ui --package fandhe-frontend-pre-styled-ui | tee deps-check.log

      - name: Publish deps-check summary
        if: always()
        # format_report（crates/xtask/src/check_deps.rs）の 1 行サマリ契約
        # 「deps-check: packages=<n>/<limit> depth=<n>/<limit> result=<PASS|FAIL>」を
        # Step Summary に転記する。この契約はテストで固定される
        # （crates/xtask/tests/cli_check_deps.rs）。
        run: |
          {
            echo '## deps-check (REQ-3)'
            echo '```'
            grep '^deps-check:' deps-check.log || echo 'deps-check: no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run xtask check-core-deps
        # イシュー #154（REQ-3 受け入れ基準 1）: core / interactive の外部依存ゼロを
        # 専用ゲートとして強制する。check-deps（60/6 判定）とは別の PASS/FAIL 判定を
        # 持つため独立したステップとして可視化する（Publish 用の summary も別ステップ）。
        # 引数は取らない契約（crates/xtask/src/main.rs `run_check_core_deps` 参照。判定対象を
        # ワークフロー側の引数変更で弱められない設計）。
        # pipefail・tee・--locked の理由は直前の "Run xtask check-deps" ステップと同一。
        # if: always()（Cursor Bugbot review 4718471860 指摘 1 対応）: 先行する
        # "Run xtask check-deps" が失敗（60/6 超過）しても、この zero-dep ゲートは
        # 独立した判定として必ず実行・報告する。if を付けないと直前ステップ失敗時に
        # このステップ自体が skip され、コメントで謳う「独立したゲート」が実質的に
        # 機能しなくなる（publish / list-build-scripts と同様の理由）。
        if: always()
        run: |
          set -o pipefail
          cargo run --locked -p xtask -- check-core-deps | tee core-deps-check.log

      - name: Publish check-core-deps summary
        if: always()
        # format_zero_report（crates/xtask/src/check_deps.rs）の 1 行サマリ契約
        # 「core-deps-check: package=<name> external=<n> result=<PASS|FAIL>」を
        # Step Summary に転記する。この契約はテストで固定される
        # （crates/xtask/tests/cli_check_core_deps.rs）。
        run: |
          {
            echo '## check-core-deps (REQ-3 acceptance criterion 1, issue #154)'
            echo '```'
            grep '^core-deps-check:' core-deps-check.log || echo 'core-deps-check: no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run xtask list-build-scripts
        # TASK-3.2b: build.rs 保有クレート列挙（TASK-3.2a, crates/xtask/src/list_build_scripts.rs）
        # の CI 出力統合。deps-check と同じ理由（子プロセスの終了コード伝播・
        # Cargo.lock drift 防止）で pipefail・tee・--locked を用いる。
        # ゲートではないため、この列挙自体が「count > 0」で CI を落とすことはない
        # （非 0 終了は cargo metadata 失敗・指定パッケージ未検出時のみ。fail-closed）。
        # if: always() は「直前の Run xtask check-deps / check-core-deps ステップが
        # 失敗（依存件数/深さ超過・外部依存ゼロ違反）してもこの監査ログ出力自体は
        # 必ず実行する」ため。この監査ログは
        # PASS/FAIL の概念を持たない常時可視化ログであり、依存超過で注目が集まる
        # PR ほど build.rs 監査が欠落する、という意図と実挙動の齟齬を避ける
        # （if: always() は本ステップの実行有無のみを制御し、cargo metadata 失敗時に
        # 非 0 終了でジョブ全体を失敗させる fail-closed の挙動やゲートの成否判定には
        # 影響しない）。
        if: always()
        run: |
          set -o pipefail
          cargo run --locked -p xtask -- list-build-scripts --package fandhe-frontend-core --package xtask --package fandhe-frontend-app --package fandhe-frontend-dist-server --package fandhe-frontend-server --package fandhe-frontend-headless-ui --package fandhe-frontend-pre-styled-ui | tee build-scripts.log

      - name: Publish build-scripts summary
        if: always()
        # format_inventory（crates/xtask/src/list_build_scripts.rs）の 1 行サマリ契約
        # （`build-scripts: target=<name> count=<n>`）を Step Summary に転記する。
        # この契約はテストで固定される（`crates/xtask/tests/cli_list_build_scripts.rs`）。
        # 監査ログであり PASS/FAIL の概念はない。
        run: |
          {
            echo '## build-scripts (REQ-3, audit log — not a gate)'
            echo '```'
            grep '^build-scripts:' build-scripts.log || echo 'build-scripts: no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

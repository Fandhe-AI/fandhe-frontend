name: deps-check

# REQ-3（依存グラフ上限: 標準サーバー構成で依存パッケージ 60 件以内・深さ 6 以内、
# docs/spec/04-requirements.md）を CI で強制するワークフロー（TASK-3.1c）。
# 加えて TASK-3.2b で、同じ依存グラフ内の build.rs 保有クレート一覧
# （xtask list-build-scripts、TASK-3.2a）を監査ログとして Step Summary に出力する。
# こちらは security.md「依存追加時は build.rs の有無を確認する」の可視化が目的で
# あり、PASS/FAIL 判定を持たない（build.rs の存在自体は違反ではない。禁止クレートの
# ブロックは cargo-deny 系タスク（TASK-4.x）のスコープ）。
#
# しきい値運用の原則:
# - しきい値の正は xtask/src/check_deps.rs の MAX_PACKAGES（60）/ MAX_DEPTH（6）定数のみ。
#   このワークフローには緩和用の input・環境変数・continue-on-error を一切設けない
#   （迂回経路を作らない設計。しきい値変更はコード定数の変更 = レビュー必須の PR のみ）。
# - 上限超過時の原則対応は依存削減。上限値自体の見直しは frontend-framework-spec
#   リポジトリでの仕様変更を経る。
# - 運用ドキュメント本体は TASK-3.3（docs/dependency-graph-policy.md 相当）で整備予定。
#   本ワークフローはあくまで CI 組み込みの実体。
#
# 計測対象パッケージ:
# - 現時点の workspace members である rws-core（外部依存ゼロ契約。ディレクトリは
#   core/ だがパッケージ名は Cargo.toml 上 rws-core）と xtask（外部依存ゼロ契約）
#   を対象とする。標準サーバー構成（rws-server）実装後は
#   REQ-3 の本来の計測対象として `--package server` を追加すること
#   （server クレート導入イシュー側の対応事項）。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deps-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps-check:
    name: REQ-3 dependency graph limits (60 packages / depth 6)
    runs-on: self-hosted
    steps:
      - name: Checkout
        # actions/checkout v6.0.3（.github/workflows/update-external.yml と同一コミットに固定）。
        # docs/spec submodule は本ジョブの計測に不要なため取得しない（submodules 既定 false）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Run xtask check-deps
        # xtask check-deps の終了コードをそのまま CI の成否に伝播させる（fail-closed）。
        # set -o pipefail を明示し、tee 経由でも cargo run の終了コードが失われないようにする。
        # `--locked` を付与し、この外側の cargo run が Cargo.lock を書き換えないことを保証する。
        # 内部の cargo metadata（xtask/src/check_deps.rs）も --locked で計測しており、
        # ここで --locked を外すとビルド時に Cargo.toml / Cargo.lock の drift で
        # ロックファイルが書き換わり得て、計測対象と実際にビルドされたグラフが
        # 一致しなくなる（fail-closed の前提が崩れる）ため必須。
        run: |
          set -o pipefail
          cargo run --locked -p xtask -- check-deps --package rws-core --package xtask | tee deps-check.log

      - name: Publish deps-check summary
        if: always()
        # format_report（xtask/src/check_deps.rs）の 1 行サマリ契約
        # 「deps-check: packages=<n>/<limit> depth=<n>/<limit> result=<PASS|FAIL>」を
        # Step Summary に転記する。この契約はテストで固定される
        # （xtask/tests/cli_check_deps.rs）。
        run: |
          {
            echo '## deps-check (REQ-3)'
            echo '```'
            grep '^deps-check:' deps-check.log || echo 'deps-check: no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run xtask list-build-scripts
        # TASK-3.2b: build.rs 保有クレート列挙（TASK-3.2a, xtask/src/list_build_scripts.rs）
        # の CI 出力統合。deps-check と同じ理由（子プロセスの終了コード伝播・
        # Cargo.lock drift 防止）で pipefail・tee・--locked を用いる。
        # ゲートではないため、この列挙自体が「count > 0」で CI を落とすことはない
        # （非 0 終了は cargo metadata 失敗・指定パッケージ未検出時のみ。fail-closed）。
        # if: always() は「直前の Run xtask check-deps ステップが失敗（依存件数/深さ
        # 超過）してもこの監査ログ出力自体は必ず実行する」ため。この監査ログは
        # PASS/FAIL の概念を持たない常時可視化ログであり、依存超過で注目が集まる
        # PR ほど build.rs 監査が欠落する、という意図と実挙動の齟齬を避ける
        # （if: always() は本ステップの実行有無のみを制御し、cargo metadata 失敗時に
        # 非 0 終了でジョブ全体を失敗させる fail-closed の挙動やゲートの成否判定には
        # 影響しない）。
        if: always()
        run: |
          set -o pipefail
          cargo run --locked -p xtask -- list-build-scripts --package rws-core --package xtask | tee build-scripts.log

      - name: Publish build-scripts summary
        if: always()
        # format_report（xtask/src/list_build_scripts.rs）の明細行・1 行サマリ契約
        # （`build-script: <crate-name>@<version>` / `build-scripts: package=<root> count=<n>`）
        # を Step Summary に転記する。この契約はテストで固定される
        # （xtask/tests/cli_list_build_scripts.rs）。監査ログであり PASS/FAIL の概念はない。
        run: |
          {
            echo '## build-scripts (REQ-3, audit log — not a gate)'
            echo '```'
            grep -E '^(build-scripts:|build-script:)' build-scripts.log || echo 'build-scripts: no summary line found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

# 目的: `musl-smoke.yml`（ジョブ `x86_64 musl startup smoke (REQ-9)`）と
# `image-size.yml`（ジョブ `Docker image size (REQ-9)`）はいずれも
# `pull_request.paths` フィルタを持つため、対象パスに変更のない PR では
# ワークフロー自体が起動せず、チェックが一切報告されない。GitHub の
# ruleset（`main-protection`）の required status checks は「未報告のチェック」
# を「失敗」ではなく「保留」として扱い続けるため、この 2 チェックをそのまま
# required に指定すると対象外 PR が永久にマージ不能になる
# （implement-issue-tree の autoMerge G0 ゲートが「client-only な変更なのに
# Docker 系チェックが不在」と判定し続けた事象が発端）。
#
# 対策として GitHub 公式に案内されている「paths-ignore を鏡像にした補完
# ワークフロー」パターンを採用する: 本ファイルは実ワークフロー側の
# `paths` を `paths-ignore` として反転し、実ワークフローが起動しない PR
# （＝対象パスに変更がない PR）でのみ起動し、同名ジョブを success 報告する。
# 実ワークフロー側が起動する PR ではこちらは起動しないため、二重報告や
# 判定の食い違いは起きない。
#
# 同期が必要な事項（変更時は必ず追随させる）:
# - `paths-ignore` は `musl-smoke.yml` と `image-size.yml` の `pull_request.paths`
#   の和集合（2026-08-30 時点で両者は同一内容: Dockerfile / Cargo.toml /
#   Cargo.lock / crates/** / static/** / .dockerignore + 各ワークフロー
#   自身のパス）と一致させる。片方だけ `paths` を変更した場合はここにも
#   反映すること。
# - `jobs.*.name` は実ワークフロー側のジョブ名（`x86_64 musl startup smoke
#   (REQ-9)` / `Docker image size (REQ-9)`）と完全一致させること（ruleset は
#   ジョブ名で required check を識別するため、1 文字でもずれると別チェック
#   として扱われ required 化が機能しない）。
# - ジョブ名を変更する場合は ruleset `main-protection`（required_status_checks）
#   側の設定も同時に更新すること（`.claude/rules/ci.md` 参照）。

on:
  pull_request:
    paths-ignore:
      - "Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "static/**"
      - ".dockerignore"
      - ".github/workflows/musl-smoke.yml"
      - ".github/workflows/image-size.yml"

permissions:
  contents: read

concurrency:
  group: required-check-skip-mirror-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  musl-smoke-skip:
    name: x86_64 musl startup smoke (REQ-9)
    runs-on: ubuntu-latest
    steps:
      - name: "skip: no path match"
        run: echo "対象パスに変更がないためスキップ（required check の success 報告のみ）"

  image-size-skip:
    name: Docker image size (REQ-9)
    runs-on: ubuntu-latest
    steps:
      - name: "skip: no path match"
        run: echo "対象パスに変更がないためスキップ（required check の success 報告のみ）"

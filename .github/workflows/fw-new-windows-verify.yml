name: fw new Windows verification

# イシュー #413: `fw new`（crates/cli/src/new.rs）の非 Unix（Windows）パーミッション挙動
# （`set_permissions` の `#[cfg(not(unix))]` no-op、docs/design/fw-new-design.md §6.1）は
# これまで self-hosted Linux runner でしか検証されておらず「設計上の想定」に留まっていた
# （PR #389 out-of-scope 節・fw-new-design.md §9 非目標）。本ワークフローはその実機検証
# ハーネスであり、以下の理由から CI（pull_request/push）には組み込まず workflow_dispatch
# 専用とする。
#
#   - 検証対象（Windows 固有の non-Unix 分岐）自体は Linux CI の `cargo test`
#     （`crates/cli/tests/new_e2e.rs` の `#[cfg(not(unix))]` 分岐）で論理検証済みであり、
#     毎 PR での Windows 実機実行を常設する必要はない（PR トリガー化の要否は
#     ホステッド移行スコープ外として据え置く）。
#   - フィクスチャ生成・`cargo build`/`cargo test` を含み実行時間が長いため、PR の
#     クリティカルパスへ組み込むと必須チェック合計時間を押し上げる。
#
# ホステッドランナー移行（トラッキング #1220、実装 #1236）: 旧方針
# （`runs-on: [self-hosted, Windows]`。Windows ラベルの self-hosted runner が
# 一度も調達されておらず本ワークフローは一度も実行されていなかった、
# docs/reports/fw-new-windows-verification-report.md §4.2）を廃止し、GitHub
# ホステッドの `windows-latest` へ移行した。public リポジトリのため標準ホステッド
# ランナーは無料・分数消費なし（`.claude/rules/ci.md` Runner 方針）。旧
# self-hosted 前提（Windows runner への rustup/MSVC Build Tools/git 常設、
# docs/ci/ci-runner-requirements.md 「Windows self-hosted runner の常設要件」節）は
# `windows-latest`（actions/runner-images）のプリインストール内容へ読み替える
# （詳細・実測は docs/ci/hosted-runner-migration.md §4.3・§5.6 参照）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify fw new on Windows (generation / determinism / non-Unix permission no-op)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    # フィクスチャ生成・cargo test を含むため長時間化を見込んでも打ち切る
    # （他ジョブを塞がないための保険、ci.md 方針に準拠）。ホステッド Windows は
    # self-hosted 実績比でキャッシュなしコールドビルドとなり遅くなるため
    # 30 分 → 45 分へ拡大した（#1236。実測後に §5.6 の値を見て再調整する）。
    timeout-minutes: 45
    steps:
      - name: Checkout
        # ci.yml と同一 SHA 固定（docs/spec サブモジュールは本検証に不要のため取得しない）
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: "preflight: verify cargo/git are present (fail-closed)"
        # windows-latest（actions/runner-images）は rustup（stable toolchain）+
        # MSVC Build Tools（VS2022、link.exe）+ git + pwsh をプリインストール済み。
        # 存在チェックなしに進めると失敗の原因が「イメージ仕様変更でツールが欠落した
        # 環境エラー」か「fw new のコード起因」か区別できなくなるため、プリインストール
        # 前提であっても fail-closed ガードとして維持する（ci.md「ツール前提の明示」運用）。
        run: |
          $ErrorActionPreference = "Stop"
          $missing = @()
          foreach ($cmd in @("cargo", "git")) {
            if (-not (Get-Command $cmd -ErrorAction SilentlyContinue)) {
              $missing += $cmd
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::environment error: missing required command(s): $($missing -join ', '). Windows runner に rustup（stable）+ MSVC Build Tools + git を常設してください（docs/ci/ci-runner-requirements.md 参照）"
            exit 1
          }
          cargo --version
          git --version

      - name: Setup Rust toolchain
        # ci.yml と同一 SHA 固定
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Show toolchain
        run: |
          rustup show
          cargo --version

      - name: Build fw (fandhe-frontend-cli)
        # ホステッド Windows はジョブごとにクリーン VM のため共有 CARGO_TARGET_DIR 汚染
        # （self-hosted 時代の懸念）自体はないが、後段の smoke ステップが
        # `$fw = "${env:CARGO_TARGET_DIR}\debug\fw.exe"` で固定パス参照する決定性のため
        # workspace ローカルの専用ディレクトリ指定を維持する（#1236）
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\target-win-verify
        run: cargo build -p fandhe-frontend-cli --locked

      - name: "test: fandhe-frontend-cli unit tests (new_template.rs 含む) on Windows"
        # fandhe-frontend-cli は crates/cli/Cargo.toml で [[bin]] name = "fw" のみを持ち lib ターゲットを
        # 持たない（外部依存ゼロ方針、main.rs 直下に #[cfg(test)] を配置する設計）ため
        # `--lib` は「no library targets found」で失敗する。単体テストは `--bin fw` で
        # 実行するのが正しい起動方法（実機確認済み: cargo test -p fandhe-frontend-cli --lib はここで失敗する）。
        # executable_file_sets_match_expected_fixed_lists（crates/cli/src/new_template.rs）が
        # プラットフォーム非依存にメタデータ記述のみを比較する設計であることを実機で確認する
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\target-win-verify
        run: cargo test -p fandhe-frontend-cli --bin fw --locked

      - name: "test: fw new e2e (new_e2e.rs) on Windows"
        # collect_tree（crates/cli/tests/new_e2e.rs）は #[cfg(not(unix))] で executable = false を
        # 返す設計（fw-new-design.md §6.1）。この分岐込みで
        # same_args_produce_byte_identical_output_across_two_runs 等の決定性テストが
        # Windows 上でも成立することを確認する。
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\target-win-verify
        run: cargo test -p fandhe-frontend-cli --test new_e2e --locked

      - name: "smoke: fw new generation / determinism / fail-closed on Windows (default template)"
        # cargo test 側でカバーされない「実バイナリを直接叩いたときの終端挙動
        # （exit code・JSON 出力）」を pwsh から明示的に確認する。
        # プロジェクト名はハードコード定数のみを使い、イベントコンテキスト由来の文字列は
        # 一切補間しない（OWASP A01/A03 対策）。
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}\target-win-verify
        run: |
          $ErrorActionPreference = "Stop"
          $fw = "${env:CARGO_TARGET_DIR}\debug\fw.exe"
          if (-not (Test-Path $fw)) {
            Write-Host "::error::environment error: fw.exe not found at $fw (build step must have failed silently)"
            exit 1
          }

          $work = Join-Path $env:RUNNER_TEMP "fw-new-win-verify"
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          function Test-Determinism([string]$template) {
            $dirA = Join-Path $work "run-a-$template"
            $dirB = Join-Path $work "run-b-$template"
            New-Item -ItemType Directory -Force -Path $dirA, $dirB | Out-Null

            $outA = & $fw new demo-app --template $template --dir $dirA 2>&1
            if ($LASTEXITCODE -ne 0) {
              # `$LASTEXITCODE:` は pwsh がスコープ付き変数参照と解釈し ParserError で
              # スクリプト全体が実行前に落ちるため `${LASTEXITCODE}` で区切る（run 31160062084 の失敗原因）
              Write-Host "::error::fw new (template=$template, run A) failed with exit ${LASTEXITCODE}: $outA"
              exit 1
            }
            if (-not ($outA -match '"template":"' + $template + '"')) {
              Write-Host "::error::fw new (template=$template) stdout missing expected template field: $outA"
              exit 1
            }

            $outB = & $fw new demo-app --template $template --dir $dirB 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::fw new (template=$template, run B) failed with exit ${LASTEXITCODE}: $outB"
              exit 1
            }

            $hashesA = Get-ChildItem -Path (Join-Path $dirA "demo-app") -Recurse -File |
              ForEach-Object {
                [PSCustomObject]@{
                  RelPath = $_.FullName.Substring((Join-Path $dirA "demo-app").Length + 1) -replace '\\', '/'
                  Hash    = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash
                }
              } | Sort-Object RelPath

            $hashesB = Get-ChildItem -Path (Join-Path $dirB "demo-app") -Recurse -File |
              ForEach-Object {
                [PSCustomObject]@{
                  RelPath = $_.FullName.Substring((Join-Path $dirB "demo-app").Length + 1) -replace '\\', '/'
                  Hash    = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash
                }
              } | Sort-Object RelPath

            $diff = Compare-Object -ReferenceObject $hashesA -DifferenceObject $hashesB -Property RelPath, Hash
            if ($diff) {
              Write-Host "::error::fw new (template=$template) is not byte-deterministic across two runs on Windows"
              $diff | Format-Table | Out-String | Write-Host
              exit 1
            }
            Write-Host "OK: template=$template byte-identical across two runs ($($hashesA.Count) files)"

            # fail-closed: 既存ターゲットへの再実行は --force なしで失敗すること
            & $fw new demo-app --template $template --dir $dirA | Out-Null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "::error::fw new (template=$template) re-run without --force unexpectedly succeeded (fail-closed contract broken)"
              exit 1
            }
            & $fw new demo-app --template $template --dir $dirA --force | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::fw new (template=$template) re-run with --force unexpectedly failed"
              exit 1
            }
            Write-Host "OK: template=$template fail-closed / --force contract holds"
          }

          Test-Determinism "default"
          Test-Determinism "app"
          # embed（イシュー #410, cargo パッケージなし・置換なし）も default/app と
          # 同一の決定性・fail-closed・--force 契約を持つことを確認する
          # （置換がないため生成物はテンプレート同梱ファイルとバイト一致する）
          Test-Determinism "embed"

          # 未知テンプレート名は使用法エラー（終了コード 2）
          & $fw new demo-app --template no-such-template --dir (Join-Path $work "unknown") 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 2) {
            Write-Host "::error::fw new with unknown template exited $LASTEXITCODE, expected 2"
            exit 1
          }
          Write-Host "OK: unknown template exits with usage error (2)"

          # tools/npm-asset-build/* (default/app テンプレートの executable: true 3 ファイル、
          # embed は executable ファイルなし) が non-Unix no-op（fw-new-design.md §6.1）でも
          # エラーにならず生成されることを確認する。
          # リストの正は crates/cli/src/new_template.rs の
          # executable_file_sets_match_expected_fixed_lists（expected_default / expected_app）。
          # 欠落は「executable フラグの記述とテンプレート同梱ファイルの乖離」を示すため
          # warning に倒さず fail-closed（exit 1）で検出する。
          $execFiles = @(
            "tools/npm-asset-build/apply_exempt.py",
            "tools/npm-asset-build/check_static_only.py",
            "tools/npm-asset-build/install.sh"
          )
          $genDir = Join-Path $work "run-a-default/demo-app"
          $missingExec = @()
          foreach ($rel in $execFiles) {
            $p = Join-Path $genDir $rel
            if (-not (Test-Path $p)) {
              $missingExec += $rel
            }
          }
          if ($missingExec.Count -gt 0) {
            Write-Host "::error::expected executable-flagged files not found in generated tree (list is stale vs crates/cli/src/new_template.rs, or fw new failed silently): $($missingExec -join ', ')"
            exit 1
          }
          Write-Host "OK: executable-flagged template files generated without error on Windows (no-op permission skip confirmed harmless)"

          # GitHub Actions の pwsh シェルはスクリプト末尾に `exit $LASTEXITCODE` 相当を自動付加する。
          # 本スクリプト最後の native 実行は「未知テンプレート → 意図的な exit 2」のネガティブテストで、
          # 以降は純 PowerShell 検査のみのため、全検証 OK でも $LASTEXITCODE=2 が残り step が
          # 失敗扱いになる（run 31160896292 の失敗原因）。失敗経路はすべて明示的な exit 1 を
          # 持つため、末尾到達＝全検証成功として明示的に exit 0 で確定する。
          exit 0

      - name: Write Step Summary
        if: always()
        run: |
          $os = (Get-CimInstance Win32_OperatingSystem).Caption
          $rustc = (rustc --version)
          @"
          ### fw new Windows verification (イシュー #413)

          | 項目 | 値 |
          |------|----|
          | RUNNER_NAME | $env:RUNNER_NAME |
          | OS | $os |
          | rustc | $rustc |
          | cargo test -p fandhe-frontend-cli --bin fw | $(if ($env:GITHUB_JOB) { 'see job status above' }) |

          検証項目（前段ステップ参照）: ビルド成功 / new_template 単体テスト /
          new_e2e 決定性テスト / default・app・embed 各テンプレートのバイト決定性 /
          fail-closed（--force 契約） / 未知テンプレート exit 2 /
          executable フラグ付きファイルの no-op 生成。
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

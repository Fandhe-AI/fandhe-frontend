name: Docker image size (REQ-9)

# TASK-9.3b（イシュー #103）: REQ-9（単一バイナリ配布と Docker イメージ最小化、
# docs/spec/04-requirements.md）の受け入れ基準「scratch / distroless ベースの
# Docker イメージサイズが 50MB 以内であること」を継続計測するワークフロー。
#
# ルート `Dockerfile`（TASK-9.3a／イシュー #102）をビルドし、
# `xtask check-image-size`（crates/xtask/src/check_image_size.rs）で非圧縮サイズを
# 計測・判定する。判定ロジックの正はコード定数（REQ9_IMAGE_SIZE_LIMIT_BYTES）の
# みであり、サイズ判定そのものに緩和用の input・continue-on-error は設けない
# （ci.yml の loc-check ジョブと同一の運用原則）。
#
# ルート Dockerfile（#102）・Dockerfile の COPY 列挙と workspace members の
# 整合（#101）はいずれもマージ済みであり、本ジョブは常時 fail-closed で
# 判定する（skip 機構は撤去済み。#101 で「job レベル env の hashFiles 使用に
# よる workflow 検証エラー（起動自体の失敗）」を解消した経緯を残す）。
#
# required check 化に伴う常時起動 + ステップ内 skip 方式（PR #1706 codex
# レビュー P0 指摘、コメント id 3889985391 対応）:
# 本ワークフローは required status check（ruleset `main-protection`）の
# 対象であり、かつては `pull_request.paths` フィルタで対象パスに変更が
# ない PR では起動自体をスキップしていた。GitHub の required status check
# は「未報告」を「保留」として扱い続けるため、`paths` フィルタと
# `paths-ignore` 鏡像ワークフローの組で補完する案を最初に採ったが、
# `paths-ignore` は `paths` の補集合にならない（例: Dockerfile と
# README.md を同時変更すると両方起動し同名 success が実チェック失敗を
# 隠し得る fail-open。片方のワークフローファイルだけ変更すると鏡像が
# 起動せずもう片方の required check が未報告のままになる）ため不採用と
# した。代わりに本ワークフロー自身を `pull_request` で常時起動させ、
# ジョブ冒頭の「Detect relevant changes」ステップで変更パスを判定し、
# 対象パスに変更があれば実処理、なければ明示 skip ステップのどちらか
# 一方だけを実行する単一経路にした。同名ジョブは常にこのワークフロー
# だけが報告するため二重報告・判定の食い違いは起きない。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-size-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-size:
    name: Docker image size (REQ-9)
    # ホステッドランナー移行（トラッキング #1220、実装 #1234）: public リポジトリの
    # 標準ホステッドランナーは無料・分数消費なしのため既定とする（.claude/rules/ci.md）。
    # 旧 self-hosted 方針（ユーザー指示 2026-07-18）は 2026-08-07 の方針転換で廃止済み。
    # ubuntu-latest は x86_64 Linux で確定のため、x86_64-unknown-linux-musl の
    # Dockerfile 分岐の計測結果が runner 割り当て次第で揺れる懸念（旧 self-hosted
    # プールの macOS 等混在リスク）は解消済み。
    #
    # DooD（Docker-outside-of-Docker）対応の撤去: PR #291 実 CI 実行で判明した
    # self-hosted（コンテナ型 runner）固有の DooD 対応（"Resolve own container ID"
    # の CID 解決による `--network container:<runner CID>` 分岐）は、ubuntu-latest
    # （コンテナではない使い捨て VM）では CID 解決が常に失敗するだけのデッドコードに
    # なるため撤去し、ホストポート公開（`-p 127.0.0.1:PORT:PORT`）の単一経路にした
    # （経緯の詳細は git 履歴・イシュー #1234 参照）。動的ポート算出（run_id/run_attempt
    # 由来、イシュー #294）はジョブ独立の VM でも rerun 等に対する安価な防御のため
    # 「Allocate app port」ステップとして存置する。
    runs-on: ubuntu-latest
    # クリーン VM でのコールド docker build（wasm32 再ビルド込み）+ xtask コールド
    # ビルドを織り込み拡大（実測後に調整、旧 30 分）。
    timeout-minutes: 45
    env:
      # self-hosted 時代の経緯: HTTP プロキシ env が localhost 宛通信までプロキシへ
      # 飛ばす事例への防御的設定だったが、ホステッドランナー（プロキシ env 通常なし）
      # でも無害な防御としてそのまま維持する。
      NO_PROXY: "localhost,127.0.0.1,::1"
      # イシュー #294（PR #306 CI 失敗）対応: 固定コンテナ名 "fandhe-frontend-ci" だと
      # 同一 runner 上での並行実行（rerun 等）でコンテナ名が衝突し得る。ホステッド
      # ランナー（ジョブごとにクリーン VM）では並行実行時の物理衝突は起きないが、
      # run_id/run_attempt による一意化は無害な防御として維持する。
      CONTAINER_NAME: "fandhe-frontend-ci-${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（ci.yml と同一 SHA に固定）。
        # docs/spec サブモジュールは本計測に不要のため取得しない。
        # required check 常時起動化に伴い、変更パス判定（次ステップ）で
        # `origin/${{ github.base_ref }}` との差分を取る必要があるため
        # fetch-depth: 0 を明示する（ci.yml の version-bump-guard ジョブと
        # 同一理由。fetch-depth: 0 は checkout 内部で全ブランチをフェッチ
        # するため別途 `git fetch origin <base>` は不要）。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
          fetch-depth: 0

      - name: Detect relevant changes
        # このジョブの実処理（Docker ビルド・サイズ計測）が必要な変更
        # （Dockerfile・依存構成・workspace members・静的アセット・本
        # ワークフロー自身）が含まれる PR かどうかを判定する。push・
        # workflow_dispatch では常に relevant=true（フィルタなしで実行）。
        # 判定失敗時（git diff 自体が失敗する等）は fail-closed で
        # relevant=true にし、実処理を走らせる（対象パス判定の不具合で
        # required check が静かにスキップされ続ける事態を避ける）。
        # base_ref はユーザー制御ではないが、他ジョブと同様 env 経由で
        # 受け渡し、シェルへの直接展開を避ける（script injection 対策の
        # 一貫性、security.md）。
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! diff_output=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>&1); then
            echo "::warning::failed to compute changed files against origin/${BASE_REF} (fail-closed, treating as relevant): ${diff_output}" >&2
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          relevant=false
          while IFS= read -r path; do
            [ -z "${path}" ] && continue
            case "${path}" in
              Dockerfile|Cargo.toml|Cargo.lock|.dockerignore|crates/*|static/*|.github/workflows/image-size.yml)
                relevant=true
                ;;
            esac
          done <<< "${diff_output}"
          echo "relevant=${relevant}" >> "$GITHUB_OUTPUT"

      - name: "skip: no relevant path changes"
        if: steps.changes.outputs.relevant != 'true'
        run: echo "対象パスに変更がないためスキップ（required check の success 報告のみ）"

      - name: Setup Rust toolchain
        if: steps.changes.outputs.relevant == 'true'
        # deps-check.yml と同一の理由・同一 SHA 固定（本ジョブ末尾の
        # `cargo run -p xtask -- check-image-size` に必要）。ホステッドランナーは
        # ジョブごとに初期化されたクリーン VM のため、毎回導入する。
        # Fandhe-AI/actions/rust-toolchain-setup（イシュー #1273 で
        # dtolnay/rust-toolchain から置換）。
        uses: Fandhe-AI/actions/rust-toolchain-setup@latest

      - name: Build docker image
        if: steps.changes.outputs.relevant == 'true'
        # push・レジストリログインは行わない。ジョブローカルのタグのみを使い、
        # 計測後は ubuntu-latest ランナーの破棄とともに揮発する。
        run: docker build -t fandhe-frontend-dist-server:ci .

      - name: Allocate app port
        if: steps.changes.outputs.relevant == 'true'
        id: app_port
        # 旧 DooD（Docker-outside-of-Docker）対応（self-hosted 固有の CID 解決 +
        # `--network container:<runner CID>` 分岐）はホステッドランナー移行
        # （イシュー #1234）で撤去済み（ジョブ冒頭コメント参照）。本ステップは
        # 動的ポート算出のみを担う。
        #
        # イシュー #294 Bugbot 指摘1（Shared port allows false CI passes）対応:
        # コンテナ名は run_id/run_attempt で一意化済みだが、リスニングポートが
        # 固定だと、cancel-in-progress 等でクリーンアップされずに残った過去試行
        # のコンテナが同じポートを握っていた場合、curl がその「別コンテナ」に
        # 誤ってヒットして false pass を返しうる（ホステッドランナーはジョブごと
        # クリーン VM のため実際の衝突リスクは低いが、rerun・将来の構成変更に
        # 対する安価な防御として維持する）。GitHub Actions の式構文には算術演算子
        # （+, %, *）が無いため、ここで run_id/run_attempt から bash の算術評価で
        # ポートを決定的に算出する（20000-31999 のレンジ、fandhe-frontend-dist-server の
        # `FANDHE_FRONTEND_BIND_ADDR` 環境変数で切り替え）。Linux の一時ポート
        # （エフェメラルポート）範囲は既定で 32768-60999 であり、そこと重なる値を
        # 割り当てると OS が偶然その番号を送信元ポートとして使用中で bind に失敗
        # する（EADDRINUSE）新たな flake 要因になり得るため、上限を 31999 に
        # 抑えてエフェメラル範囲を避ける。
        run: |
          set -euo pipefail
          app_port=$(( 20000 + ( (GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT * 104729) % 12000 ) ))
          echo "port=${app_port}" >> "$GITHUB_OUTPUT"
          echo "::notice::allocated dynamic app port ${app_port} (derived from run_id=${GITHUB_RUN_ID}, run_attempt=${GITHUB_RUN_ATTEMPT})"
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}

      - name: Verify WASM assets are served (TASK-10.3c, issue #117)
        if: steps.changes.outputs.relevant == 'true'
        # TASK-10.3b（#116）でコンテナ内 WASM 再ビルドが builder ステージへ
        # 統合され、`static/wasm/*` はホスト事前ビルドではなくコンテナ内
        # `crates/dist-server/build.rs`（#110）の実行結果として埋め込まれる。本
        # ステップはその実ビルド結果を実機（docker run）で検証する
        # （`crates/dist-server/tests/wasm_assets.rs` のコンテナ実機版）。
        # fail-closed: 起動待ちのリトライを使い切っても応答しない場合は
        # そのまま失敗させる（`docker logs` を出力してから終了コード非 0 で
        # 終わる）。
        #
        # ホストポート公開（`-p 127.0.0.1:PORT:PORT`）の単一経路。ubuntu-latest は
        # runner 自身がコンテナ化されていない使い捨て VM のため、DooD
        # （Docker-outside-of-Docker）対応は不要（撤去経緯はジョブ冒頭コメント参照）。
        #
        # APP_PORT（イシュー #294 Bugbot 指摘1対応）: fandhe-frontend-dist-server の
        # `FANDHE_FRONTEND_BIND_ADDR` 環境変数でリスニングポートを run 単位・rerun 単位の
        # 動的ポートに切り替える。固定ポートのままだと、cancel-in-progress 等で
        # 残置された過去試行のコンテナが同じ 127.0.0.1:PORT を握っていた場合に
        # curl がそちらへ誤ってヒットし、false pass を返しうる。
        env:
          APP_PORT: ${{ steps.app_port.outputs.port }}
        run: |
          set -euo pipefail
          # 念のための防御的 cleanup。CONTAINER_NAME は run_id/run_attempt で
          # 一意化済みのため通常は既存コンテナが残っていないはずだが、
          # 同名コンテナが万一残存していても衝突させず fail-closed に進める。
          docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          docker run -d --name "${CONTAINER_NAME}" \
            -p "127.0.0.1:${APP_PORT}:${APP_PORT}" \
            -e "FANDHE_FRONTEND_BIND_ADDR=0.0.0.0:${APP_PORT}" \
            fandhe-frontend-dist-server:ci
          base_url="http://127.0.0.1:${APP_PORT}"

          # curl の body 破棄先には `/dev/null` を使わない。GitHub Actions の
          # ubuntu-latest ランナーでは、curl 8.x が `-o /dev/null` に対して
          # 内部的な高速書き込みパス（sendfile 相当）を使おうとして
          # 「curl: (23) Failure writing output to destination」を返す事例が
          # 確認されている（HTTP レスポンスの内容とは無関係な、書き込み先が
          # `/dev/null` であること自体に起因する問題）。実ファイルの一時パスを
          # 破棄先にすることでこの書き込みエラーを回避する。
          discard="$(mktemp)"
          trap 'rm -f "$discard"' EXIT

          # `--max-time`（1 回の curl 呼び出し全体の上限）を明示する。前回の
          # 失敗（30 分タイムアウト）は、宛先が到達不能な場合に curl がデフォルト
          # の長い接続タイムアウトまでハングし得ることが一因だったため、readiness
          # ループ内の 1 回あたりの待ち時間を確実に短く制限する（30 回 x 2 秒
          # 上限 = 最大 60 秒程度で fail-closed に到達させる）。
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 -o "$discard" "${base_url}/static/wasm/fandhe_frontend_wasm_full.js"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::fandhe-frontend-dist-server:ci did not become ready within 30s" >&2
            docker logs "${CONTAINER_NAME}" || true
            docker rm -f "${CONTAINER_NAME}" || true
            exit 1
          fi

          # 破棄先を mktemp の実ファイルに変更した後も、GitHub Actions の
          # ubuntu-latest ランナー上では curl 8.x が稀に
          # `curl: (23) Failure writing output to destination` を返す事例が
          # 観測されている（一過性）。`set -euo pipefail` 環境下で
          # `x=$(curl ...)` の形のコマンド置換が非 0 終了すると、readiness
          # ループとは異なり if/|| で保護されていない限りスクリプト全体が
          # 即座に落ちてしまう。そのため以降の status/content-type/魔法バイト
          # 取得はすべて `curl_retry` 経由に統一し、最大 3 回の再試行後も
          # 失敗した場合のみ空文字列を返して（スクリプトは落とさず）後続の
          # 明示的な比較チェックに失敗を委ねる（fail-closed は維持される）。
          # --max-time 2: 前回の 30 分ハング（宛先到達不能時に curl の既定タイム
          # アウトまで無応答になった）の再発を防ぐため、1 呼び出しあたりの上限を
          # 明示する。
          curl_retry() {
            local out
            local attempt
            for attempt in 1 2 3; do
              if out=$(curl --max-time 2 "$@" 2>/dev/null); then
                printf '%s' "$out"
                return 0
              fi
              sleep 1
            done
            printf ''
            return 0
          }

          js_status=$(curl_retry -s -o "$discard" -w '%{http_code}' ${base_url}/static/wasm/fandhe_frontend_wasm_full.js)
          js_type=$(curl_retry -s -o "$discard" -w '%{content_type}' ${base_url}/static/wasm/fandhe_frontend_wasm_full.js)
          if [ "$js_status" != "200" ] || [ "${js_type#text/javascript}" = "$js_type" ]; then
            echo "::error::fandhe_frontend_wasm_full.js: expected 200 text/javascript, got status=${js_status} content_type=${js_type}" >&2
            docker rm -f "${CONTAINER_NAME}" || true
            exit 1
          fi

          wasm_status=$(curl_retry -s -o "$discard" -w '%{http_code}' ${base_url}/static/wasm/fandhe_frontend_wasm_full_bg.wasm)
          wasm_type=$(curl_retry -s -o "$discard" -w '%{content_type}' ${base_url}/static/wasm/fandhe_frontend_wasm_full_bg.wasm)
          if [ "$wasm_status" != "200" ] || [ "$wasm_type" != "application/wasm" ]; then
            echo "::error::fandhe_frontend_wasm_full_bg.wasm: expected 200 application/wasm, got status=${wasm_status} content_type=${wasm_type}" >&2
            docker rm -f "${CONTAINER_NAME}" || true
            exit 1
          fi
          # magic bytes 取得専用の一時ファイルを使う（$discard を使い回すと、
          # 全リトライ失敗時に直前のレスポンス内容を誤って読んでしまい
          # fail-closed が効かなくなるため）。
          magic_file="$(mktemp)"
          trap 'rm -f "$discard" "$magic_file"' EXIT
          magic_ok=0
          for _ in 1 2 3; do
            if curl -fsS --max-time 2 -o "$magic_file" ${base_url}/static/wasm/fandhe_frontend_wasm_full_bg.wasm; then
              magic_ok=1
              break
            fi
            sleep 1
          done
          if [ "$magic_ok" -eq 1 ]; then
            wasm_magic=$(od -An -tx1 -N 4 "$magic_file" | tr -d ' \n')
          else
            wasm_magic=""
          fi
          if [ "$wasm_magic" != "0061736d" ]; then
            echo "::error::fandhe_frontend_wasm_full_bg.wasm: unexpected magic bytes ${wasm_magic} (expected \\0asm = 0061736d)" >&2
            docker rm -f "${CONTAINER_NAME}" || true
            exit 1
          fi

          not_found_status=$(curl_retry -s -o "$discard" -w '%{http_code}' ${base_url}/static/wasm/does-not-exist.wasm)
          if [ "$not_found_status" != "404" ]; then
            echo "::error::unknown /static/wasm/ path expected 404, got ${not_found_status}" >&2
            docker rm -f "${CONTAINER_NAME}" || true
            exit 1
          fi

          docker rm -f "${CONTAINER_NAME}"

      - name: Verify PORT / SIGTERM handling (issue #3338)
        if: steps.changes.outputs.relevant == 'true'
        # Vercel Container Images 移行（親 #3334）に向けて、dist-server が
        # 実装済みの 2 挙動を CI で継続的に退行検知する。
        #   - PORT 経路（#3336）: `FANDHE_FRONTEND_BIND_ADDR` 未設定時に
        #     `PORT` 環境変数の値で listen する（`resolve_bind_addr`、
        #     crates/dist-server/src/main.rs）。Vercel Container Images は
        #     `PORT` でリスニングポートを渡すため、この経路が壊れると
        #     コンテナが到達不能になる。
        #   - graceful shutdown（#3337）: SIGTERM 受信後も処理中の接続を
        #     `DRAIN_TIMEOUT_SECS`（25s）以内で drain してから終了コード 0
        #     で終わる（`ShutdownSignals` / `GracefulShutdown` /
        #     `drain_within`）。Vercel はコンテナ差し替え時に SIGTERM を
        #     送るため、無視されると強制終了（SIGKILL）され接続が中断する。
        #
        # 検証範囲: (1) `FANDHE_FRONTEND_BIND_ADDR` を空文字で打ち消し
        # `PORT` のみを渡した状態で readiness が通ること（PORT 経路が実際
        # に使われたことの証拠）、(2) `docker stop`（SIGTERM 送信）を送る
        # 時点で処理中の接続（未完了リクエスト）を実際に維持し、その接続が
        # SIGTERM 後も切断されず完了すること（#3337 の drain 退行＝処理中
        # 接続の途中切断を検知できることの証拠。readiness 確認用の完結済み
        # curl だけでは、この経路が壊れて即座に接続を切断しても
        # `docker stop` の待ち時間内であれば区別できず見逃す）、
        # (3) `docker stop`（SIGTERM 送信）後のコンテナ終了コードが 0 で
        # あること（無視されて `docker stop` のタイムアウトで SIGKILL され
        # た場合は 137 になる）、(4) drain の開始・終了ログ（main.rs の
        # 固定英語リテラル文言との契約）が出力されていること。4 点のいず
        # れか欠落でも fail-closed でジョブを失敗させる。
        #
        # ポートは直前の「Allocate app port」ステップの出力を再利用する
        # （新たな割り当てステップは起こさない。直前の WASM 確認ステップが
        # 必ず `docker rm -f "${CONTAINER_NAME}"` で片付けているためポート・
        # コンテナ名とも競合しない）。ホスト側公開は既存ステップと同じく
        # ループバック限定（`-p 127.0.0.1:PORT:PORT`）で外部到達不能。
        env:
          APP_PORT: ${{ steps.app_port.outputs.port }}
        run: |
          set -euo pipefail
          # 念のための防御的 cleanup（直前ステップが必ず rm -f 済みのはずだが、
          # 想定外の残存があっても衝突させず fail-closed に進める）。
          docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true

          # FANDHE_FRONTEND_BIND_ADDR を空文字で渡し、Dockerfile 既定の
          # `0.0.0.0:3100` を打ち消す（non_empty() が空文字を「未設定」に
          # 正規化する契約、crates/dist-server/src/main.rs）。これにより
          # PORT 環境変数のみが有効なリスニングポート決定要因になる。
          #
          # `--sysctl net.ipv4.tcp_wmem`: コンテナのネットワーク名前空間限定
          # （docker が許可する net.* sysctl、ホストへは波及しない）でカーネル
          # 送信バッファを意図的に小さくする（最大 16KiB）。WASM 資産が
          # ループバック上のデフォルトバッファ容量に収まってしまうと、
          # hyper の応答書き込みがカーネルへ即座に受理されて「送信完了」
          # 扱いになり、クライアント側の `--limit-rate` による低速化が
          # サーバー側の実際の書き込み滞留（drain 検証の前提）を再現しない
          # おそれがある。送信バッファを縮小することで、後段の in-flight
          # 接続確立チェック（Send-Q 実測）が確実に非 0 を観測できる状態を
          # 作る。
          docker run -d --name "${CONTAINER_NAME}" \
            -p "127.0.0.1:${APP_PORT}:${APP_PORT}" \
            -e "FANDHE_FRONTEND_BIND_ADDR=" \
            -e "PORT=${APP_PORT}" \
            --sysctl net.ipv4.tcp_wmem="4096 16384 16384" \
            fandhe-frontend-dist-server:ci
          base_url="http://127.0.0.1:${APP_PORT}"

          discard="$(mktemp)"
          trap 'rm -f "$discard"' EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 -o "$discard" "${base_url}/"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::PORT env var did not bring up a reachable listener within 30s" >&2
            docker logs "${CONTAINER_NAME}" || true
            docker rm -f "${CONTAINER_NAME}" || true
            exit 1
          fi

          # `docker stop` を送る時点で処理中の接続（未完了リクエスト）を
          # 実際に維持する。readiness 確認の完結済み curl だけでは
          # `docker stop` 送信時に in-flight な接続が存在しないため、
          # drain が正しく機能しているか（#3337 の退行＝接続の途中切断）
          # を区別できず見逃す。既存の WASM 資産（サイズが確保でき転送に
          # 数秒かかる）を `--limit-rate` で意図的に低速化しながら
          # バックグラウンドでダウンロードし、その転送が確立してから
          # `docker stop` を送ることで、SIGTERM 後も接続が生き延びて
          # 完走することを検証する。
          # curl の body 破棄先は `/dev/null` を使わない（本ワークフロー冒頭の
          # 「WASM 確認」ステップと同じ理由: ubuntu-latest の curl 8.x が
          # `-o /dev/null` に対して間欠的に書き込みエラー (23) を返す既知事象
          # があり、`set -e` 下では即座にジョブが失敗し得る）。readiness 確認
          # 用に確保済みの `$discard`（実ファイル）を再利用する。
          asset_path="/static/wasm/fandhe_frontend_wasm_full_bg.wasm"
          content_length=$(curl -fsS --max-time 5 -o "$discard" -w '%{size_download}' "${base_url}${asset_path}")
          if [ -z "$content_length" ] || [ "$content_length" -le 0 ]; then
            echo "::error::failed to determine size of ${asset_path} for in-flight connection test" >&2
            docker rm -f "${CONTAINER_NAME}" || true
            exit 1
          fi

          # 転送に概ね 10 秒かかる速度まで意図的に絞る（`DRAIN_TIMEOUT_SECS`
          # (25s) 未満・`docker stop -t 30` の猶予未満に収まるよう安全側の
          # 下限を設ける）。ファイルが小さい場合でも過度に遅くしすぎない。
          limit_rate=$((content_length / 10))
          if [ "$limit_rate" -lt 1024 ]; then
            limit_rate=1024
          fi

          inflight_out="$(mktemp)"
          trap 'rm -f "$discard" "$inflight_out"' EXIT
          curl -fsS --max-time 25 --limit-rate "${limit_rate}" -o "$inflight_out" \
            "${base_url}${asset_path}" &
          inflight_pid=$!

          # 接続が実際に確立し in-flight であることを、クライアント側の
          # プロセス生存（`kill -0`）ではなく、コンテナ側のカーネル送信
          # バッファに未送出バイトが滞留していること（Send-Q > 0）で確認
          # してから `docker stop` を送る。`kill -0`（curl プロセスの生存）
          # だけでは「dist-server がまだ書き込み中」の証拠にならない:
          # 応答本体がコンテナのカーネル送信バッファへ即座に収まってしまえ
          # ば、hyper の書き込みは完了しクライアント側の受信ペースとは無
          # 関係に「送信済み」になり得る（curl 側の `--limit-rate` は読み
          # 出し側の速度制限に過ぎない）。この場合 SIGTERM 送信時点で
          # サーバー側に drain 対象の未完了応答が存在しないまま、たまたま
          # クライアントの受信が遅いだけの状態でテストが緑になり、#3337 の
          # 退行（処理中接続の途中切断）を見逃す。
          #
          # Send-Q（コンテナのネットワーク名前空間内、dist-server が listen
          # するポートの ESTABLISHED ソケット）は、OS のカーネルバッファに
          # 未送出のバイト列が滞留していることの直接証拠であり、
          # dist-server（またはカーネル）が実際に書き込みをブロックされて
          # いることを示す。`docker run` 側で当該コンテナの送信バッファを
          # 意図的に縮小（`net.ipv4.tcp_wmem` 上限 16KiB）しているため、
          # WASM 資産サイズがバッファ容量を上回っていれば Send-Q は確実に
          # 非 0 になる。
          #
          # 要: ubuntu-latest ランナーに `nsenter`（util-linux）・`ss`
          # （iproute2）・パスワードなし `sudo` が導入済みであることを前提
          # とする（GitHub ホステッドランナーの標準イメージに常設）。
          # `docker exec` を使わない理由: 最終イメージは `FROM scratch`
          # （TASK-10.3c）でシェル・コアユーティリティを一切含まないため、
          # コンテナ内部からの観測はできない。ホスト側から
          # `nsenter -t <pid> -n` でコンテナのネットワーク名前空間へ入る
          # ことで、コンテナ内にツールがなくても外部から観測できる。
          if ! command -v nsenter >/dev/null 2>&1 || ! command -v ss >/dev/null 2>&1; then
            echo "::error::nsenter (util-linux) or ss (iproute2) not found on runner; cannot verify server-side in-flight state" >&2
            kill "$inflight_pid" 2>/dev/null || true
            wait "$inflight_pid" 2>/dev/null || true
            docker rm -f "${CONTAINER_NAME}" || true
            exit 1
          fi

          container_pid=$(docker inspect -f '{{.State.Pid}}' "${CONTAINER_NAME}")
          if [ -z "$container_pid" ] || [ "$container_pid" -le 0 ]; then
            echo "::error::failed to resolve container PID for network namespace inspection" >&2
            kill "$inflight_pid" 2>/dev/null || true
            wait "$inflight_pid" 2>/dev/null || true
            docker rm -f "${CONTAINER_NAME}" || true
            exit 1
          fi

          inflight_established=0
          received_before_stop=0
          for i in $(seq 1 40); do
            send_q=$(sudo nsenter -t "$container_pid" -n ss -Htn state established "( sport = :${APP_PORT} )" 2>/dev/null | awk '{print $2; exit}')
            if [ -n "$send_q" ] && [ "$send_q" -gt 0 ] 2>/dev/null; then
              inflight_established=1
              received_before_stop=$(wc -c < "$inflight_out" | tr -d ' ')
              break
            fi
            if ! kill -0 "$inflight_pid" 2>/dev/null; then
              # 転送が完了してプロセスが正常終了していれば、送信済みバイト
              # は既にコンテナのバッファを離れているため in-flight ではない
              # （証拠にならない）。
              break
            fi
            sleep 0.25
          done
          if [ "$inflight_established" -ne 1 ]; then
            echo "::error::could not observe a genuine server-side in-flight write (Send-Q > 0) before sending SIGTERM" >&2
            kill "$inflight_pid" 2>/dev/null || true
            wait "$inflight_pid" 2>/dev/null || true
            docker logs "${CONTAINER_NAME}" || true
            docker rm -f "${CONTAINER_NAME}" || true
            exit 1
          fi
          # 副次的な証拠として、SIGTERM 送信直前時点でクライアントの受信量が
          # 応答全体に満たないことも確認する（Send-Q 実測が本証拠、これは
          # 補強）。
          if [ "$received_before_stop" -ge "$content_length" ]; then
            echo "::error::download already completed before SIGTERM despite non-zero Send-Q observation; test setup invalid" >&2
            kill "$inflight_pid" 2>/dev/null || true
            wait "$inflight_pid" 2>/dev/null || true
            docker logs "${CONTAINER_NAME}" || true
            docker rm -f "${CONTAINER_NAME}" || true
            exit 1
          fi

          # `docker stop -t 30`: SIGTERM を送り、DRAIN_TIMEOUT_SECS(25s) より
          # 長い猶予（Vercel の 30 秒猶予に合わせた値）を明示指定する。
          # `docker stop` の既定 10 秒には依存しない。ルート Dockerfile の
          # `ENTRYPOINT ["/dist-server"]` は exec 形式のため dist-server が
          # PID 1 として SIGTERM を直接受け取る。処理中の接続（上記
          # `inflight_pid`）がまだ完了していない状態でこれを送ることが
          # drain 検証の核心である。
          docker stop -t 30 "${CONTAINER_NAME}"

          # SIGTERM 送信時点で処理中だった接続が、drain により正常完了する
          # ことを確認する（#3337 の退行＝途中切断の検知）。切断されていれ
          # ば curl は非 0 で終了するか、受信バイト数が content-length に
          # 満たない。
          inflight_exit=0
          wait "$inflight_pid" || inflight_exit=$?
          inflight_size=$(wc -c < "$inflight_out" | tr -d ' ')
          if [ "$inflight_exit" -ne 0 ] || [ "$inflight_size" != "$content_length" ]; then
            echo "::error::in-flight connection was not drained cleanly after SIGTERM (curl_exit=${inflight_exit}, received=${inflight_size}, expected=${content_length})" >&2
            docker logs "${CONTAINER_NAME}" || true
            docker rm -f "${CONTAINER_NAME}" || true
            exit 1
          fi

          exit_code=$(docker inspect -f '{{.State.ExitCode}}' "${CONTAINER_NAME}")
          logs=$(docker logs "${CONTAINER_NAME}" 2>&1)

          if [ "$exit_code" != "0" ]; then
            echo "::error::dist-server did not exit cleanly after SIGTERM (exit_code=${exit_code}; 137 means it was force-killed, i.e. SIGTERM was ignored)" >&2
            echo "$logs" >&2
            docker rm -f "${CONTAINER_NAME}" || true
            exit 1
          fi

          if ! echo "$logs" | grep -qF "draining in-flight connections (up to 25s)"; then
            echo "::error::graceful shutdown drain-start log line not found" >&2
            echo "$logs" >&2
            docker rm -f "${CONTAINER_NAME}" || true
            exit 1
          fi

          if ! echo "$logs" | grep -qF "graceful shutdown complete"; then
            echo "::error::graceful shutdown drain-complete log line not found" >&2
            echo "$logs" >&2
            docker rm -f "${CONTAINER_NAME}" || true
            exit 1
          fi

          docker rm -f "${CONTAINER_NAME}"

      - name: Verify final image does not leak the build toolchain (TASK-10.3c, issue #117)
        if: steps.changes.outputs.relevant == 'true'
        # TASK-10.3b で builder ステージへ追加した curl・wasm32 ターゲット・
        # wasm-bindgen-cli 等がマルチステージビルドの境界を越えて最終イメージ
        # （FROM scratch 以降）へ漏れていないことを機械的に固定する
        # （docs/design/docker-wasm-build-stage.md §6-3、A05 セキュリティ設定ミス対策）。
        # 最終イメージの中身は `/dist-server` バイナリ 1 つ（+ tar メタ情報）の
        # みであるべきで、それ以外のファイルが1つでも見つかれば fail-closed。
        run: |
          set -euo pipefail
          cid=$(docker create fandhe-frontend-dist-server:ci)
          contents=$(docker export "$cid" | tar -t)
          docker rm "$cid" >/dev/null

          unexpected=$(echo "$contents" | grep -v -E '^(\.dockerenv|dev/|dev/console|dev/pts/|dev/shm/|dist-server|etc/|etc/hostname|etc/hosts|etc/mtab|etc/resolv\.conf|proc/|sys/)$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::final image contains unexpected entries (possible builder-stage leakage):" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Run xtask check-image-size
        if: steps.changes.outputs.relevant == 'true'
        # xtask check-image-size の終了コードをそのまま CI の成否に伝播させる
        # （fail-closed）。set -o pipefail を明示し、tee 経由でも cargo run の
        # 終了コードが失われないようにする（loc-check ジョブと同一パターン）。
        # --locked はこの外側の cargo run が Cargo.lock を書き換えないことを保証する。
        run: |
          set -o pipefail
          cargo run --locked -p xtask -- check-image-size --image fandhe-frontend-dist-server:ci | tee image-size.log

      - name: Publish image-size summary
        if: always() && steps.changes.outputs.relevant == 'true'
        # format_report（crates/xtask/src/check_image_size.rs）の 1 行サマリ契約
        # 「image-size: image=<tag> size_bytes=<n>/<limit> size_mb=<x.xx> result=<PASS|FAIL>」を
        # Step Summary に転記する。この契約は crates/xtask/tests/cli_check_image_size.rs と
        # crates/xtask/src/check_image_size.rs の単体テストで固定される。
        #
        # image-size.log が存在しない場合は、前段（Build docker image /
        # Run xtask check-image-size）が失敗またはステップ自体が実行されな
        # かったことを意味する。ログ欠落を隠さず fail 扱いにする
        # （fail-closed の原則を summary ステップでも維持する）。
        run: |
          {
            echo '## Docker image size (REQ-9, issue #103)'
            echo '```'
            if [ -f image-size.log ]; then
              grep '^image-size:' image-size.log || echo 'image-size: no summary line found'
            else
              echo 'image-size: FAIL (image-size.log is missing; build or check step failed or did not run — see earlier job steps)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if measurement missing
        if: always() && steps.changes.outputs.relevant == 'true'
        # 上の summary ステップで「image-size.log が欠落」と判定したケースを、
        # 実際に job 失敗として伝播させる（summary への記載のみでは CI が
        # green のままになってしまうため）。
        run: |
          if [ ! -f image-size.log ]; then
            echo "::error::image-size.log is missing; the build or check-image-size step failed or did not run." >&2
            exit 1
          fi

      - name: Cleanup fandhe-frontend-ci container (always)
        if: always() && steps.changes.outputs.relevant == 'true'
        # イシュー #294 Bugbot 指摘2（Missing cleanup leaks containers）対応:
        # "Verify WASM assets are served" ステップ内の `docker rm -f` は
        # 同ステップの成功パス・エラーパス（各 `exit 1` の直前）でのみ実行
        # されており、`cancel-in-progress`（本ワークフロー冒頭の
        # concurrency 設定）によるジョブキャンセルでステップ自体が中断
        # された場合はどちらの経路も通らず、コンテナが self-hosted runner
        # 上に残置されたままになる（"fandhe-frontend-ci-*" の蓄積）。
        # job レベルの最終ステップに `if: always()` を付けて確実にコンテナ
        # を削除する（GitHub Actions のキャンセル猶予時間内に限り実行される
        # ベストエフォートの安全網。前段の各ステップ内の即時 rm -f は
        # 通常経路での早期解放のため引き続き残す）。
        run: docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true

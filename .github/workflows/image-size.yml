name: Docker image size (REQ-9)

# TASK-9.3b（イシュー #103）: REQ-9（単一バイナリ配布と Docker イメージ最小化、
# docs/spec/04-requirements.md）の受け入れ基準「scratch / distroless ベースの
# Docker イメージサイズが 50MB 以内であること」を継続計測するワークフロー。
#
# ルート `Dockerfile`（TASK-9.3a／イシュー #102）をビルドし、
# `xtask check-image-size`（xtask/src/check_image_size.rs）で非圧縮サイズを
# 計測・判定する。判定ロジックの正はコード定数（REQ9_IMAGE_SIZE_LIMIT_BYTES）の
# みであり、サイズ判定そのものに緩和用の input・continue-on-error は設けない
# （ci.yml の loc-check ジョブと同一の運用原則）。
#
# ルート Dockerfile は #102 が別イシュー・別 PR として進行中で本ワークフローの
# スコープ外のため（out-of-scope-tracking.md）、Dockerfile 不在時はビルド・
# サイズ判定ステップ自体を `hashFiles('Dockerfile') != ''` でスキップし、
# その旨をサマリに明記する（fail ではなく skip）。#102 マージ後は Dockerfile が
# 存在するようになり、本ジョブは自動的に通常の fail-closed 判定へ切り替わる
# （判定ロジックを緩めるわけではなく、前提条件が整うまで判定自体を保留する）。

on:
  push:
    branches: [main]
  pull_request:
    # イメージサイズに影響し得る変更のみをトリガー対象にする。
    # dist-server クレート（#96）・Dockerfile（#102）が増やすパスは
    # マージ時に追随して更新すること。
    paths:
      - "Dockerfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "core/**"
      - "app/**"
      - "server/**"
      - "dist-server/**"
      - "static/**"
      - "xtask/**"
      - ".github/workflows/image-size.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-size-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-size:
    name: Docker image size (REQ-9)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4.2.2（ci.yml と同一 SHA に固定）。
        # docs/spec サブモジュールは本計測に不要のため取得しない。
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false

      - name: Build docker image
        # ルート Dockerfile は #102（別イシュー・別スコープ）が導入するまで存在しない。
        # 存在しない間はビルド自体を skip する（fail ではない。#102 マージ後は
        # hashFiles が非空になり、この工程から通常どおり実行される）。
        # push・レジストリログインは行わない。ジョブローカルのタグのみを使い、
        # 計測後は ubuntu-latest ランナーの破棄とともに揮発する。
        if: hashFiles('Dockerfile') != ''
        run: docker build -t rws-dist-server:ci .

      - name: Run xtask check-image-size
        # xtask check-image-size の終了コードをそのまま CI の成否に伝播させる
        # （fail-closed）。set -o pipefail を明示し、tee 経由でも cargo run の
        # 終了コードが失われないようにする（loc-check ジョブと同一パターン）。
        # --locked はこの外側の cargo run が Cargo.lock を書き換えないことを保証する。
        # Dockerfile 不在時は前段の Build docker image と同じ条件で skip する
        # （測定対象イメージが存在しないため）。
        if: hashFiles('Dockerfile') != ''
        run: |
          set -o pipefail
          cargo run --locked -p xtask -- check-image-size --image rws-dist-server:ci | tee image-size.log

      - name: Publish image-size summary
        if: always()
        # format_report（xtask/src/check_image_size.rs）の 1 行サマリ契約
        # 「image-size: image=<tag> size_bytes=<n>/<limit> size_mb=<x.xx> result=<PASS|FAIL>」を
        # Step Summary に転記する。この契約は xtask/tests/cli_check_image_size.rs と
        # xtask/src/check_image_size.rs の単体テストで固定される。
        # Dockerfile 不在で前段が skip された場合は image-size.log 自体が存在しないため、
        # その旨（#102 待ち）を明記して job を green-with-explanation にする。
        run: |
          {
            echo '## Docker image size (REQ-9, issue #103)'
            echo '```'
            if [ -f image-size.log ]; then
              grep '^image-size:' image-size.log || echo 'image-size: no summary line found'
            else
              echo 'image-size: skipped (Dockerfile not present yet; pending #102)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

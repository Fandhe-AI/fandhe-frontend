name: docs-site

# イシュー #474（親 #461 Phase 5-1）。docs サイト（crates/docs-site による
# 自前 SSG ドッグフーディング、イシュー #465/#470）を main push 時にビルドし
# GitHub Pages へ公開する。
#
# 前提（手動操作）: リポジトリ Settings → Pages → Source を
# "GitHub Actions" に設定済みであること。未設定の場合 build ジョブは成功し
# deploy ジョブのみが失敗する（Pages 有効化・初回デプロイ確認はイシュー #475
# のスコープ）。CLI で有効化する場合のコマンド:
#   gh api -X POST repos/Fandhe-AI/fandhe-frontend/pages -f build_type=workflow
#
# 既知の制約: レンダラ側クレート（crates/server / crates/app / crates/core）の
# 変更は below の paths に含めないため自動再デプロイの対象外（イシュー本文の
# トリガー仕様どおり）。反映が必要な場合は workflow_dispatch で手動再デプロイする。
#
# pre-styled-ui / headless-ui / interactive を paths に含める理由（イシュー
# #905/#899 の 3 カラム刷新で根拠が変わった。イシュー #913 で是正）:
# サイト骨格 CSS（assets/site.css）自体が crates/docs-site/src/site_theme.rs +
# fandhe_frontend_pre_styled_ui::theme::Theme::to_css のビルド生成物になった
# ため（#905 以降、site/assets/site.css の静的単一ファイルは廃止済み）、
# これら 3 クレートは showcase ページ限定の例外ではなく全ページに影響する
# load-bearing な依存である。UI コンポーネントショーケースページ
# （crates/docs-site/src/showcase.rs）が pre-styled-ui / headless-ui /
# interactive の実レンダリング結果・分離 CSS を直接掲載する点（#679/#609 系）
# も引き続き対象に含む。

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**" # #905 で site/assets/ は廃止済み。現在は Markdown 原稿・nav.toml のみ（骨格 CSS は静的コピーではなくビルド生成、下記 verify ステップ参照）。#943 で追加した site/themes/*.md（#1017 で site/components/*.md から移行）も本 glob が包含するため個別エントリは不要（イシュー #944 で検証）
      - "crates/docs-site/**"
      - "crates/pre-styled-ui/**" # 骨格 CSS（assets/site.css）の生成元（Theme::to_css、イシュー #905） + showcase ページの styled 部品掲載
      - "crates/headless-ui/**" # showcase の Tabs/Accordion マークアップ（pre-styled-ui が再エクスポート）
      - "crates/interactive/**" # headless-ui の状態機械が依存（推移的にマークアップへ影響）
      - "crates/wireframe-ui/**" # Wireframes セクション（wireframes.css・Demo の生成元、イシュー #2607）
      - "examples/*/README.md" # site/nav.toml が Examples セクションの source として参照（イシュー #504）
      - ".github/workflows/docs-site.yml" # image-size.yml と同じ自己参照パターン
  workflow_dispatch:

permissions:
  contents: read # workflow レベルは read のみ（最小権限、A01/A05 対策）

concurrency:
  group: docs-site-pages
  cancel-in-progress: false # Pages デプロイ中断による中途半端な公開状態を避ける
  # （他ワークフローの cancel-in-progress: true とは意図的に異なる設定）

jobs:
  # イシュー #1232（トラッキング #1220）で ubuntu-latest へ移行（in-place。
  # self-hosted との並走期間は残さない）。設計判断・キャッシュキー方針の正は
  # docs/ci/hosted-runner-migration.md（§3 キャッシュ戦略・§4 ツール導入方針）
  # であり、ci.yml clippy ジョブ（イシュー #1227）の先例パターンを踏襲する。
  build:
    name: "build: docs site (SSG + linkcheck)"
    runs-on: ubuntu-latest
    # クリーンな使い捨て VM でのフルコールドビルド（cache miss 時）を考慮。
    # docs-site の依存閉包は内部クレートのみ・外部依存ゼロで ci.yml test
    # ジョブより軽量なため、値 30 は self-hosted 時代から据え置く
    # （docs/ci/hosted-runner-migration.md §5）。
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（ci.yml / deps-check.yml と同一 SHA 固定）。
        # site/nav.toml が参照するのは docs/guides・docs/api・examples/*/README.md
        # のみのため docs/spec サブモジュールは不要（submodules 既定 false）。
        # persist-credentials: false は他ジョブ（ci.yml 各所、イシュー #1229）と
        # 同一の認証情報残置面縮小パターン（A05/A06 整合）。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        # Fandhe-AI/actions/rust-toolchain-setup（deps-check.yml と同一 SHA
        # 固定。イシュー #1273 で dtolnay/rust-toolchain から置換）。
        # クリーンな使い捨て VM では毎ジョブ導入が主経路（.claude/rules/ci.md・
        # docs/ci/hosted-runner-migration.md §4.2）。ツールチェーンはリポジトリ
        # 直下の rust-toolchain.toml（channel = "stable"）を単一真実源として
        # rustup show で同期する。
        uses: Fandhe-AI/actions/rust-toolchain-setup@latest

      - name: Compute toolchain cache key
        # dtolnay/rust-toolchain の outputs.cachekey の代替（イシュー #1273。
        # 置換先の action は cachekey 相当の output を持たないため、rustc の
        # コミットハッシュ先頭 12 桁を toolchain 世代キーとして自前算出する。
        # 空値はキャッシュキーの世代分離を失わせるため fail-closed で停止する）。
        # 下記 actions/cache のキャッシュキー（steps.toolchain.outputs.cachekey）
        # が参照する。
        id: toolchain
        run: |
          set -euo pipefail
          cachekey="$(rustc -vV | sed -n 's/^commit-hash: \(.\{12\}\).*/\1/p')"
          if [ -z "${cachekey}" ]; then
            echo "::error::rustc commit-hash を取得できませんでした"
            exit 1
          fi
          echo "cachekey=${cachekey}" >> "${GITHUB_OUTPUT}"

      - name: "cache: cargo registry + target（イシュー #1232、docs/ci/hosted-runner-migration.md §3.3/§3.4）"
        # actions/cache v6.1.0（GitHub 公式・フル SHA ピン、ci.yml clippy
        # ジョブと同一 SHA・同一パターン）。job family prefix `docs-site-`
        # で release.yml の検証ビルド（専用 CARGO_TARGET_DIR 隔離・cache
        # 不使用）や他ジョブ系統のキャッシュと分離し、イシュー #1192 型の
        # rlib 汚染がキャッシュ経由で流入する経路を作らない。miss 時は
        # フルビルドへ自然にフォールバックする fail-open 設計であり、
        # 正当性の前提にしない（restore/save いずれの失敗もジョブを
        # 失敗させない）。
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: docs-site-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            docs-site-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      - name: "build: generate site into dist"
        # linkcheck は build_site() 内蔵（crates/docs-site/src/linkcheck.rs）。
        # リンク切れ検出時は書き出しを一切行わず非 0 終了する（fail-closed）。
        run: cargo run --locked -p fandhe-frontend-docs-site -- --out "${RUNNER_TEMP}/docs-site-dist"

      # 出力先を RUNNER_TEMP 配下にする理由: ホステッドランナーでも
      # RUNNER_TEMP 配置原則（イシュー #659）は不変であり、ジョブ終了時に
      # runner が自動清掃するためリポジトリ直下への出力による stale 生成物の
      # 混入を避けられる（docs/ci/hosted-runner-migration.md §2.1 (c)）。
      - name: "verify: dist sanity check"
        # 空サイト・アセット欠落を黙って公開しないための決定的チェック（fail-closed）。
        # assets/site.css は #905 以降 site/assets/ からの静的コピーではなく
        # crates/docs-site/src/site_theme.rs によるビルド生成物（Theme::to_css +
        # 骨格 CSS）である。生成に失敗すれば build_site() 自体が非 0 終了するため、
        # 本 test -f はあくまで「生成物が out_dir へ実際に書き出されたか」の
        # 最終確認であり、CSS の内容自体（トークン網羅性等）は
        # crates/docs-site/tests/site_typography_contract.rs 等の契約テストが担う。
        # assets/site.js（イシュー #951、crates/docs-site/src/script.rs による
        # ビルド生成物）も同型の最終確認を行う。assets/search-index.json
        # （イシュー #957、crates/docs-site/src/search_index.rs による
        # ビルド生成物）も同型。決定性・エスケープ・サイズ上限等の内容検証は
        # crates/docs-site/tests/search_index.rs が担い、ここでは二重管理しない。
        #
        # イシュー #944: #943 でサイトの大半が
        # /components/<kebab>/ の部品ページになったため、索引ページだけの
        # 検証では「部品ページが 1 枚も出ていない」退行を素通ししてしまう。
        # 代表 1 ページと部品ページ専用 CSS（showcase::STYLESHEET_REL_PATH）の
        # 存在も fail-closed で確認する。ページ総数の期待値は
        # crates/docs-site/tests/site_build.rs が保持し、ここでは二重管理しない。
        #
        # イシュー #1017: 部品ページは `/components/<kebab>/` から
        # `/themes/<kebab>/` へ移行済み。代表 1 ページの確認先を
        # themes/button/index.html へ切り替える（切り替えないと、旧パスに
        # 残るリダイレクトページで PASS してしまい #944 が意図した「部品
        # ページが 1 枚も出ていない退行」の検知能力が静かに失われるため）。
        #
        # イシュー #1016/#1017: 旧 URL 互換のリダイレクトページ
        # （`site/redirects.toml`、crates/docs-site/src/redirect.rs による
        # ビルド生成物）の代表 2 件（components/index.html、`/components/` →
        # `/themes/`。components/button/index.html、
        # `/components/button/` → `/themes/button/`、#1017 が追記した 107 件
        # の代表）も同型の最終確認を行う。生成内容（4 要素の網羅・base_path
        # 反映等）の検証は crates/docs-site/tests/redirects.rs /
        # no_js_contract.rs が担い、ここでは二重管理しない。
        #
        # イシュー #1018: 索引ページ本体を `/components/pre-styled-ui/` から
        # `/themes/` へ移設し、旧 URL には `/themes/` への互換リダイレクトを
        # 追加した。代表確認先を themes/index.html（新索引の本体）へ切り替え、
        # components/pre-styled-ui/index.html（旧索引 URL のリダイレクト
        # 生成物）の存在も追加で固定する。
        #
        # イシュー #1021: Primitives（fandhe-frontend-headless-ui）セクションが
        # 新設され、索引ページ（primitives/index.html）と代表部品ページ
        # （primitives/accordion/index.html）が加わった。
        #
        # イシュー #1022: `crate::primitive_showcase` が Primitives 63 部品の
        # Demo を供給するようになり、専用 CSS
        # （`assets/primitives-showcase.css`、Themes 側の `pre-styled-ui.css`
        # とは独立）が実際に書き出されるようになった。#1021 が「本イシュー
        # 完了時点では CSS を持たない」として先送りしていた test -f をここで
        # 追加する。ページ総数の期待値は crates/docs-site/tests/site_build.rs /
        # primitives_nav.rs が、CSS の内容（`[data-scope=`/`[data-part=` 不在
        # 等）は crates/docs-site/tests/site_css_contract.rs が保持し、
        # ここでは二重管理しない。
        #
        # イシュー #1562: Image 節 demo の `src` が `data:` URI（core の
        # `is_safe_url` が拒否）で属性ごと欠落していた不具合を、ビルド時
        # 生成 SVG（`crate::showcase::image_demo_svg`）を相対パスで参照する
        # 形へ是正した。生成先 `assets/image-demo.svg` の存在も fail-closed
        # で確認する。
        #
        # イシュー #2088: Blocks セクション（`/blocks/`、shadcn/ui Blocks
        # 相当の既存部品合成例）が新設され、索引ページ（blocks/index.html）・
        # 雛形実例（blocks/login-01/index.html）・専用 CSS
        # （assets/blocks.css、`crate::blocks::stylesheet`）が実際に書き出される
        # ようになった。`site/blocks/*.md`/`site/blocks.md` は既存 `site/**`
        # glob に包含されるため paths への個別エントリ追加は不要（ci.md 参照）。
        # ページ総数・レジストリ突合の期待値は crates/docs-site/tests/
        # site_build.rs / blocks_nav.rs が、生成内容（節順序・`<form>` 不在・
        # CSS 配線）の検証は crates/docs-site/tests/blocks_contract.rs が
        # 保持し、ここでは二重管理しない。
        #
        # イシュー #2547: 親トラッキング #2530「Phase 7: Motion+ 部品化」
        # 配下として pricing-tiers-morph・pricing-usage-slider の 2 件が
        # 追加された（#2088〜#2095 の 7 件とは別系統の純追加、
        # docs/design/docs-site-blocks-section.md §3 参照）。イシュー
        # #2549 で同系統から bento-staggered（scroll-driven stagger）・
        # feature-expand（hover-expand）の 2 件がさらに追加された。
        run: |
          test -f "${RUNNER_TEMP}/docs-site-dist/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/assets/site.css"
          test -f "${RUNNER_TEMP}/docs-site-dist/assets/site.js"
          test -f "${RUNNER_TEMP}/docs-site-dist/assets/search-index.json"
          test -f "${RUNNER_TEMP}/docs-site-dist/themes/button/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/themes/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/assets/pre-styled-ui.css"
          test -f "${RUNNER_TEMP}/docs-site-dist/components/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/components/button/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/components/pre-styled-ui/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/primitives/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/primitives/accordion/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/assets/primitives-showcase.css"
          test -f "${RUNNER_TEMP}/docs-site-dist/assets/image-demo.svg"
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/index.html"
          # 以下はカテゴリ単位のグループ化（イシュー #2734）。カテゴリの見出し
          # コメントは 66 件全カテゴリを列挙し、block を持たないカテゴリは見出しの
          # みで test -f 行を持たない。新規 block 追加時は該当カテゴリの見出し
          # 直後へ 1 行追記する。
          # Marketing / Hero
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/hero-editorial-stagger/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/hero-parallax-layers/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/hero-terminal/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/text-split-reveal/index.html"
          # Marketing / Feature
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/feature-expand/index.html"
          # Marketing / Cta
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/cta-banner-magnetic/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/cta-signup-celebrate/index.html"
          # Marketing / Pricing
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/pricing-tiers-morph/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/pricing-usage-slider/index.html"
          # Marketing / Testimonial
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/testimonials-stack/index.html"
          # Marketing / Logo Cloud
          # Marketing / Stats
          # Marketing / Team
          # Marketing / Faq
          # Marketing / Contact
          # Marketing / Newsletter
          # Marketing / Blog
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/blog-featured-article/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/blog-featured-with-list/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/blog-list-image/index.html"
          # Marketing / Content
          # Marketing / Header
          # Marketing / Footer
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/footer-sticky-reveal/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/footer-newsletter/index.html"
          # Marketing / Banner
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/banner-cookie-consent/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/banner-email-signup/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/banner-floating-card/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/banner-full-width-bar/index.html"
          # Marketing / Bento
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/bento-asymmetric-rows/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/bento-staggered/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/bento-three-column-tall/index.html"
          # Marketing / Comparison
          # Marketing / Careers
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/careers-split-accordion/index.html"
          # Marketing / Changelog
          # Marketing / Error Page
          # Marketing / Gallery
          # Marketing / Section Heading
          # Application / App Shell
          # Application / Sidebar
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/sidebar-07/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/sidebar-03/index.html"
          # Application / Navbar
          # Application / Page Heading
          # Application / Card Heading
          # Application / List
          # Application / Table
          # Application / Grid List
          # Application / Description List
          # Application / Calendar
          # Application / Feed
          # Application / Form Layout
          # Application / Auth
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/login-01/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/login-04/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/signup-01/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/signup-05/index.html"
          # Application / Settings
          # Application / Action Panel
          # Application / Empty State
          # Application / Notification
          # Application / Dialog
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/game-ui-modal/index.html"
          # Application / Drawer
          # Application / Command Palette
          # Application / Onboarding
          # Application / Card
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/cursor-hover-cards/index.html"
          # Application / Profile
          # Application / Chart
          # Application / Dashboard
          test -f "${RUNNER_TEMP}/docs-site-dist/blocks/dashboard-01/index.html"
          # Application / AI Chat
          # Application / Help Center
          # Ecommerce / Product Overview
          # Ecommerce / Product List
          # Ecommerce / Quickview
          # Ecommerce / Category
          # Ecommerce / Filter
          # Ecommerce / Cart
          # Ecommerce / Checkout
          # Ecommerce / Order
          # Ecommerce / Reviews
          # Ecommerce / Store Nav
          # Ecommerce / Incentives
          # Ecommerce / Promo
          # Docs / Docs Layout
          # Docs / Code Block
          # Docs / Example Preview
          # Docs / Api Reference
          test -f "${RUNNER_TEMP}/docs-site-dist/assets/blocks.css"
          # イシュー #2737: Blocks 共通のデモ用ダミー素材ヘルパ（画像 5 種）。
          # `has_blocks_page` と同条件で無条件に書き出される
          # （`crate::blocks::dummy_assets::IMAGE_ASSETS`、`crate::build::build_site` 参照）。
          test -f "${RUNNER_TEMP}/docs-site-dist/assets/blocks-demo-product.svg"
          test -f "${RUNNER_TEMP}/docs-site-dist/assets/blocks-demo-avatar.svg"
          test -f "${RUNNER_TEMP}/docs-site-dist/assets/blocks-demo-logo.svg"
          test -f "${RUNNER_TEMP}/docs-site-dist/assets/blocks-demo-screenshot.svg"
          test -f "${RUNNER_TEMP}/docs-site-dist/assets/blocks-demo-background.svg"
          # イシュー #2607: Wireframes セクションの索引ページ。
          # イシュー #2617: 最初の部品ページ（Annotation）の登録により
          # `crate::wireframes::WIREFRAMES` が空でなくなり、
          # `assets/wireframes.css`（`crate::build::build_site` の
          # 「使われているページだけ」書き出し）が初めて書き出される。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/annotation/index.html"
          # イシュー #2611: Phase 1「レイアウト骨格」の Grid 部品ページ。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/grid/index.html"
          # イシュー #2612: Divider 部品ページ（props::Orientation の最初の消費者）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/divider/index.html"
          # イシュー #2610: 同 Phase の Stack 部品ページ。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/stack/index.html"
          # イシュー #2618: Link 部品ページ（Option<Node> アイコンスロット規約
          # §11.4 の実例、a[href] 非出力）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/link/index.html"
          # イシュー #2616: Phase 2「テキスト・注釈」の Rich text 部品ページ。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/rich-text/index.html"
          # イシュー #2615: Phase 2「テキスト・注釈」の Paragraph 部品ページ。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/paragraph/index.html"
          # イシュー #2621: Phase 3「Forms A」の Button 部品ページ
          # （props::Disabled の最初の実消費者）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/button/index.html"
          # イシュー #2624: 同 Phase の Select 部品ページ。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/select/index.html"
          # イシュー #2626: 同 Phase の Radio 部品ページ（選択状態は
          # props::Active を再利用、新規の Selected/Checked 型は新設しない）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/radio/index.html"
          # イシュー #2627: 同 Phase の Switch 部品ページ。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/switch/index.html"
          # イシュー #2625: Phase 3「Forms A」の Checkbox 部品ページ
          # （props::Active を「チェック済み」状態として消費）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/checkbox/index.html"
          # イシュー #2623: 同 Phase の Textarea 部品ページ。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/textarea/index.html"
          # イシュー #2628: 同 Phase の Slider 部品ページ（Progress を 5 刻み
          # 固定 class へ量子化、Orientation 併用）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/slider/index.html"
          # イシュー #2609: Phase 1「レイアウト骨格」の Frame 部品ページ。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/frame/index.html"
          # イシュー #2619: Phase 2「テキスト・注釈」の Tag 部品ページ。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/tag/index.html"
          # イシュー #2622: 同 Phase の Input 部品ページ（<input> 非出力）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/input/index.html"
          # イシュー #2630: Phase 4「Forms B」の最初の部品、Question 部品ページ。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/question/index.html"
          # イシュー #2631: 同 Phase の Ratings 部品ページ（icon::star 再利用）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/ratings/index.html"
          # イシュー #2632: 同 Phase の Calendar 部品ページ（選択日は
          # props::Active 再利用・MAX_WEEKS 6 週飽和）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/calendar/index.html"
          # イシュー #2633: 同 Phase の File drop 部品ページ。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/file-drop/index.html"
          # イシュー #2614: Phase 2「テキスト・注釈」の Text 部品ページ。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/text/index.html"
          # イシュー #2638: Phase 5「Navigation」の最初の部品、Tabs 部品ページ
          # （選択状態は props::Active ではなく active: Option<usize> で表す）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/tabs/index.html"
          # イシュー #2634: Phase 4「Forms B」の Stepper 部品ページ（blocks.pm
          # 対応部品を持たない独自追加部品）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/stepper/index.html"
          # イシュー #2636: Phase 5「Navigation」の 2 番目の部品、Nav item 部品
          # ページ。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/nav-item/index.html"
          # イシュー #2641: Phase 5「Navigation」の 3 番目の部品、Accordion 部品
          # ページ（blocks.pm に対応部品がない独自追加部品）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/accordion/index.html"
          # イシュー #2640: Phase 5「Navigation」の 4 番目の部品、Pagination
          # 部品ページ（選択状態は props::Active を再利用、先頭/前/次/末尾
          # コントロールは prev_next/first_last の 2 bool へ畳む）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/pagination/index.html"
          # イシュー #2642: Phase 5「Navigation」の 5 番目の部品、Cursor 部品
          # ページ（代わりに使える既存アイコンがないため icon::cursor_arrow/
          # icon::cursor_hand を新規追加して消費する）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/cursor/index.html"
          # イシュー #2637: Phase 5「Navigation」の 6 番目の部品、Menu 部品
          # ページ（検索欄は Option<&str> + 固定パートの icon::search で表し
          # <input> は出力しない）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/menu/index.html"
          # イシュー #2639: Phase 5「Navigation」の 7 番目の部品、Breadcrumbs
          # 部品ページ（現在階層は items の最後の項目へ常に自動付与）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/breadcrumbs/index.html"
          # イシュー #2644: Phase 6「Overlay・Feedback」の最初の部品、Tooltip
          # 部品ページ。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/tooltip/index.html"
          # イシュー #2647: Phase 6「Overlay・Feedback」の 2 番目の部品、Toast
          # 部品ページ（閉じるグリフは icon::x 固定で instance swap にせず
          # dismissible: bool の 1 引数だけで有無を切り替える）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/toast/index.html"
          # イシュー #2646: Phase 6「Overlay・Feedback」の 3 番目の部品、Alert
          # 部品ページ（重要度は部品ローカルの Severity による修飾 class で表す）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/alert/index.html"
          # イシュー #2648: Phase 6「Overlay・Feedback」の 4 番目の部品、
          # Progress 部品ページ。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/progress/index.html"
          # イシュー #2649: Phase 6「Overlay・Feedback」の 5 番目の部品、
          # Spinner 部品ページ（円弧だけを描く静的表示、@keyframes/animation
          # は持たない）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/spinner/index.html"
          # イシュー #2645: Phase 6「Overlay・Feedback」の 6 番目の部品、Modal
          # 部品ページ（blocks.pm に対応部品がない独自追加部品。中央配置は
          # position: fixed ではなく in-flow の背景領域で表現する）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/modal/index.html"
          # イシュー #2651: Phase 7「Data display」の最初の部品、Avatar 部品
          # ページ（content: Option<Node> が None のとき icon::user へ
          # フォールバックする §11.4 からの意図的な逸脱）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/avatar/index.html"
          # イシュー #2655: Phase 7「Data display」の 2 番目の部品、Counter
          # 部品ページ（件数は u32 ではなく &str で受け、強調配色は共通型
          # props::Primary を再利用する）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/counter/index.html"
          # イシュー #2654: Phase 7「Data display」の 3 番目の部品、Emoji
          # 部品ページ（絵文字は Option<Node> アイコンスロットではなく
          # glyph: &str の 1 引数へ畳み込む §11.4 からの意図的な逸脱）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/emoji/index.html"
          # イシュー #2656: Phase 7「Data display」の 4 番目の部品、Stat 部品
          # ページ（増減インジケータは Option<&str> ではなく StatDelta で
          # 表す）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/stat/index.html"
          # イシュー #2658: Phase 7「Data display」の 5 番目の部品、Card basic
          # 部品ページ（先頭・末尾スロットは §11.4 の Option<Node> 規約へ統一し
          # avatar を内蔵しない独自設計）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/card-basic/index.html"
          # イシュー #2657: Phase 7「Data display」の 6 番目の部品、List
          # 部品ページ（items: Vec<Node> と ordered: bool の 2 引数のみ。
          # マーカー・番号は CSS 擬似要素/カウンタのみで描く）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/list/index.html"
          # イシュー #2663: Phase 8「Media・データ表示」の最初の部品、Chart
          # 部品ページ（棒グラフの配置イメージ。values は &[u8]、
          # props::Orientation を再利用する）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/chart/index.html"
          # イシュー #2660: Phase 8 の 2 番目の部品、Image 部品
          # ページ（content: Option<Node> が None のときバツ印プレース
          # ホルダーを描く §11.4 準拠のスロット規約）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/image/index.html"
          # イシュー #2664: Phase 8「Media・データ表示」の 3 番目の
          # 部品、Map 部品ページ（地図タイルの配置イメージ。zoom は部品
          # ローカル列挙型 MapZoom 3 段、marker は Option<Node> アイコン
          # スロット）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/map/index.html"
          # イシュー #2661: Phase 8「Media・データ表示」の 4 番目の部品、
          # Media 部品ページ（blocks.pm 上の表示名は Placeholder。
          # content: Option<Node> が None のとき icon::play へフォール
          # バックする §11.4 からの意図的な逸脱。枠は 16:9 固定で
          # <video>/<iframe> は出力しない）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/media/index.html"
          # イシュー #2662: Phase 8「Media・データ表示」の 5 番目の部品、
          # Table 部品ページ（<table> は使わず div/span + CSS grid で
          # 表現する、calendar と同型の判断）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/table/index.html"
          # イシュー #2652: Phase 7「Data display」の 7 番目の部品、Icon
          # 部品ページ（glyph は Node ではなく fn(Size) -> Node で受け取り、
          # サイズ指定を 1 か所に固定する。role/aria-label は付けない）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/icon/index.html"
          # イシュー #2653: Phase 7「Data display」の 8 番目の部品、Brand
          # 部品ページ（これで Phase 7 が全部品出揃った。content: Option<Node>
          # が None のとき既定の汎用抽象ブランドマーク icon::brand へ
          # フォールバックする §11.4 からの意図的な逸脱。実在ブランドの
          # ロゴ・商標を模した SVG は持ち込まない）。
          test -f "${RUNNER_TEMP}/docs-site-dist/wireframes/brand/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/assets/wireframes.css"

      - name: Upload dist artifact
        # 汎用 artifact として dist を渡し、Pages 専用形式への変換以降は
        # Fandhe-AI/actions/pages-deploy（reusable workflow）が担う（イシュー #1288）。
        # rust-toolchain-setup（#1273）・wasm-tool-install（#1274）・codex-review
        # （#1275）と同じ方向の org 共通化であり、Pages 固有 action の SHA
        # 追随義務を呼び出し側から共通側へ集約する。
        # actions/upload-artifact v7.0.1（commit SHA 固定。
        # Fandhe-AI/actions/pages-deploy/README.md セットアップ例と同一 SHA）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pages-dist
          path: ${{ runner.temp }}/docs-site-dist
          if-no-files-found: error # 空 dist を黙って渡さない（fail-closed）
          # .nojekyll 等の dotfile を配信する場合に必須（既定 false では
          # upload 段階で脱落する。Pages 専用形式への変換は共通側が担う）
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Pages デプロイに必要な最小権限のみ（reusable 側ジョブも同一の最小定義。
    # reusable workflow は呼び出し側が付与した以上の権限を持てないため、
    # 呼び出し側 wrapper のこのジョブにも同じ 2 権限が必要）
    permissions:
      pages: write
      id-token: write
    # Fandhe-AI/actions のコミット SHA に固定する（wasm-tool-install と同一 SHA）。
    # rust-toolchain-setup は v1.1.0（749afc9）へ、codex-review は 4c93891 へ
    # 個別に追随済みのため、action ごとに SHA が異なる点に注意。
    uses: Fandhe-AI/actions/.github/workflows/pages-deploy.yml@latest
    with:
      dist-dir: "."
      # reusable 側の既定値は self-hosted（fandhe 系リポジトリの旧前提）。
      # 本リポジトリは public のためホステッドランナー既定方針
      # （.claude/rules/ci.md）に従い明示上書きする。省略すると
      # self-hosted runner 非登録により deploy が永久 pending になる。
      runner-label: ubuntu-latest

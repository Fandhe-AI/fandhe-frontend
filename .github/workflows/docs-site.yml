name: docs-site

# イシュー #474（親 #461 Phase 5-1）。docs サイト（crates/docs-site による
# 自前 SSG ドッグフーディング、イシュー #465/#470）を main push 時にビルドし
# GitHub Pages へ公開する。
#
# 前提（手動操作）: リポジトリ Settings → Pages → Source を
# "GitHub Actions" に設定済みであること。未設定の場合 build ジョブは成功し
# deploy ジョブのみが失敗する（Pages 有効化・初回デプロイ確認はイシュー #475
# のスコープ）。CLI で有効化する場合のコマンド:
#   gh api -X POST repos/Fandhe-AI/fandhe-frontend/pages -f build_type=workflow
#
# 既知の制約: レンダラ側クレート（crates/server / crates/app / crates/core）の
# 変更は below の paths に含めないため自動再デプロイの対象外（イシュー本文の
# トリガー仕様どおり）。反映が必要な場合は workflow_dispatch で手動再デプロイする。
#
# pre-styled-ui / headless-ui / interactive を paths に含める理由（イシュー
# #905/#899 の 3 カラム刷新で根拠が変わった。イシュー #913 で是正）:
# サイト骨格 CSS（assets/site.css）自体が crates/docs-site/src/site_theme.rs +
# fandhe_frontend_pre_styled_ui::theme::Theme::to_css のビルド生成物になった
# ため（#905 以降、site/assets/site.css の静的単一ファイルは廃止済み）、
# これら 3 クレートは showcase ページ限定の例外ではなく全ページに影響する
# load-bearing な依存である。UI コンポーネントショーケースページ
# （crates/docs-site/src/showcase.rs）が pre-styled-ui / headless-ui /
# interactive の実レンダリング結果・分離 CSS を直接掲載する点（#679/#609 系）
# も引き続き対象に含む。

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**" # #905 で site/assets/ は廃止済み。現在は Markdown 原稿・nav.toml のみ（骨格 CSS は静的コピーではなくビルド生成、下記 verify ステップ参照）
      - "crates/docs-site/**"
      - "crates/pre-styled-ui/**" # 骨格 CSS（assets/site.css）の生成元（Theme::to_css、イシュー #905） + showcase ページの styled 部品掲載
      - "crates/headless-ui/**" # showcase の Tabs/Accordion マークアップ（pre-styled-ui が再エクスポート）
      - "crates/interactive/**" # headless-ui の状態機械が依存（推移的にマークアップへ影響）
      - "examples/*/README.md" # site/nav.toml が Examples セクションの source として参照（イシュー #504）
      - ".github/workflows/docs-site.yml" # image-size.yml と同じ自己参照パターン
  workflow_dispatch:

permissions:
  contents: read # workflow レベルは read のみ（最小権限、A01/A05 対策）

concurrency:
  group: docs-site-pages
  cancel-in-progress: false # Pages デプロイ中断による中途半端な公開状態を避ける
  # （他ワークフローの cancel-in-progress: true とは意図的に異なる設定）

jobs:
  build:
    name: "build: docs site (SSG + linkcheck)"
    runs-on: self-hosted
    timeout-minutes: 30 # 共有 CARGO_TARGET_DIR キャッシュ未命中時のコールドビルドを考慮
    steps:
      - name: Checkout
        # actions/checkout v6.0.3（ci.yml / deps-check.yml と同一 SHA 固定）。
        # site/nav.toml が参照するのは docs/guides・docs/api・examples/*/README.md
        # のみのため docs/spec サブモジュールは不要（submodules 既定 false）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain（deps-check.yml と同一 SHA 固定）。
        # cargo 未導入の self-hosted インスタンス（PR #196 で判明）への安全網。
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: "build: generate site into dist"
        # linkcheck は build_site() 内蔵（crates/docs-site/src/linkcheck.rs）。
        # リンク切れ検出時は書き出しを一切行わず非 0 終了する（fail-closed）。
        run: cargo run --locked -p fandhe-frontend-docs-site -- --out "${RUNNER_TEMP}/docs-site-dist"

      # 出力先を RUNNER_TEMP 配下にする理由: self-hosted の作業ディレクトリは
      # ジョブ間で永続するため、リポジトリ直下への出力による stale 生成物の
      # 混入を避ける。
      - name: "verify: dist sanity check"
        # 空サイト・アセット欠落を黙って公開しないための決定的チェック（fail-closed）。
        # assets/site.css は #905 以降 site/assets/ からの静的コピーではなく
        # crates/docs-site/src/site_theme.rs によるビルド生成物（Theme::to_css +
        # 骨格 CSS）である。生成に失敗すれば build_site() 自体が非 0 終了するため、
        # 本 test -f はあくまで「生成物が out_dir へ実際に書き出されたか」の
        # 最終確認であり、CSS の内容自体（トークン網羅性等）は
        # crates/docs-site/tests/site_typography_contract.rs 等の契約テストが担う。
        # assets/site.js（イシュー #951、crates/docs-site/src/script.rs による
        # ビルド生成物）も同型の最終確認を行う。
        run: |
          test -f "${RUNNER_TEMP}/docs-site-dist/index.html"
          test -f "${RUNNER_TEMP}/docs-site-dist/assets/site.css"
          test -f "${RUNNER_TEMP}/docs-site-dist/assets/site.js"

      - name: Upload Pages artifact
        # 要: runner に tar がインストール済み（upload-pages-artifact が内部で使用。
        #     Linux self-hosted プールでは通常常設だが、ci.md 規約に従い前提を明示）
        # actions/upload-pages-artifact v5.0.0（commit SHA 固定）
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/docs-site-dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      pages: write # Pages デプロイ作成に必要（デプロイジョブのみに限定、A01/A05 対策）
      id-token: write # OIDC によるデプロイ元検証に必要（同上）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        # actions/deploy-pages v5.0.0（commit SHA 固定）
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

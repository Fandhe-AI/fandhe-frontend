name: release

# イシュー #514（親: #513）: crates.io 公開用 release ワークフローの新設。
# 本ワークフローは workflow_dispatch 起点で単一クレートの crates.io 公開を
# 実行する。実際の v0.1.1 公開実行は兄弟イシュー #515 のスコープであり、
# ここでは「dry-run で安全に検証し、明示指示時のみ publish する」土台を作る。
#
# タグ push（例: cli-v0.1.1）起点は今回不採用。理由:
# (a) 9 クレート同居 monorepo でタグ命名規約が未確定
# (b) workflow_dispatch の明示入力（crate/version/mode）によるバージョン整合
#     ガードの方が、タグ文字列パースより誤公開に対して fail-closed
# (c) 将来タグ push を採用する場合は `on.push.tags` を追加し、タグ文字列から
#     crate/version を抽出して本ワークフローと同じガード群（バージョン形式・
#     Cargo.toml 一致・既公開チェック）に通す拡張点とする
#
# 公開対象クレート一覧は `publish = false`（xtask / fandhe-frontend-docs-site）
# を除く 11 クレート（イシュー #608 で headless-ui / pre-styled-ui を追加）。
# crate 入力を choice 型に固定することで、任意文字列のシェル注入・存在しない
# パッケージ指定を構造的に排除する（fail-closed）。
#
# crates.io 到達性の前提: 本ワークフローの各ステップ（既公開バージョン検証・
# cargo package/publish 系コマンド）は crates.io（https://index.crates.io ・
# https://static.crates.io）への到達性を前提とする。runner が到達不可の場合は
# ステップが失敗するが、これは環境エラーであり本ワークフローの設計不備では
# ない（.claude/rules/ci.md「ツール前提の明示」参照）。
#
# fandhe-frontend-dist-server を公開する場合の注意: 同クレートの build.rs は
# WASM ビルドステージ（wasm32 target・wasm-bindgen-cli）を要求する。現時点の
# 主対象は fandhe-frontend-cli のためこの前提整備は本イシューのスコープ外とし、
# 対応しない。dist-server を選択した場合に runner 側で前提が欠けていれば
# cargo publish 系ステップがビルドエラーとして環境不備を顕在化させる
# （継続緩和用の input は設けない = fail-closed）。
#
# fandhe-frontend-pre-styled-ui を公開する場合の依存順の注意（イシュー #608）:
# 同クレートは fandhe-frontend-headless-ui への version 依存（0.1.0）を持つ。
# headless-ui の 0.1.0 が crates.io の sparse index へ反映される前に
# pre-styled-ui の dry-run/publish を実行すると、検証ビルドの依存解決が
# 失敗する。運用上、必ず headless-ui の publish 実行 → sparse index への
# 反映確認（`https://index.crates.io/<index-path>` に "vers":"0.1.0" が
# 現れること）を経てから pre-styled-ui を実行する（本ワークフロー自身は
# クレート横断の順序保証を持たないため、実行者が手順として担保する）。
#
# GitHub Environments `crates-io-release` による承認ゲート（fandhe-backend の
# release.yml と同型）: publish ジョブのみ job レベルで
# `environment: crates-io-release` を参照する。verify ジョブ（ガード群 +
# dry-run、トークン不要）は承認なしで実行され、実公開（mode: publish）だけが
# environment の保護ルールを通る。注意: 本リポジトリは private のため、現在の
# billing plan では required reviewers 保護ルールを environment に設定できない
# （backend は public のため設定済み）。plan 変更または public 化の際に
# backend と同じ required reviewers（prevent_self_review: false）を追加する。
# mode の既定 dry-run-only・トークンのステップ限定注入という既存の安全設計は
# environment 導入後も不変とする。

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "公開対象クレート（publish = false の xtask / fandhe-frontend-docs-site は選択肢に含めない）"
        type: choice
        required: true
        default: fandhe-frontend-cli
        options:
          - fandhe-frontend-core
          - fandhe-frontend-interactive
          - fandhe-frontend-app
          - fandhe-frontend-server
          - fandhe-frontend-wasm-client
          - fandhe-frontend-wasm-full
          - fandhe-frontend-wasm-thin
          - fandhe-frontend-dist-server
          - fandhe-frontend-cli
          - fandhe-frontend-headless-ui
          - fandhe-frontend-pre-styled-ui
      version:
        description: "公開しようとするバージョン（例: 0.1.1）。crate の Cargo.toml の version と完全一致する必要がある"
        type: string
        required: true
      mode:
        description: "dry-run-only: 検証のみ（既定・安全側）。publish: 実際に cargo publish を実行する"
        type: choice
        required: true
        default: dry-run-only
        options:
          - dry-run-only
          - publish

permissions:
  contents: read

concurrency:
  # 同一クレートへの公開処理が並行して二重実行されないよう直列化する。
  # 公開処理の途中キャンセルは crates.io 側の中途半端な状態を招き得るため
  # cancel-in-progress は行わない。
  group: release-${{ inputs.crate }}
  cancel-in-progress: false

jobs:
  verify:
    name: "verify: guards + cargo publish --dry-run (${{ inputs.crate }})"
    # イシュー #1233（トラッキング #1220）で ubuntu-latest へ移行（in-place、
    # 並走期間なし）。設計判断の正は docs/ci/hosted-runner-migration.md。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # workflow_dispatch 入力を ${{ }} で run 本文へ直接展開しない
      # （式インジェクション対策）。すべての run ステップはこの env 経由で
      # 入力を受け取り、シェル変数として扱う。
      RELEASE_CRATE: ${{ inputs.crate }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_MODE: ${{ inputs.mode }}
      # イシュー #1192 の CARGO_TARGET_DIR 隔離は cargo を実行する各ステップの
      # env（ステップレベル）で個別指定する。理由（イシュー #1192 復旧、PR
      # 参照）: `runner` コンテキストはジョブレベル env の式評価では未対応
      # （`Unrecognized named-value: 'runner'` で workflow_dispatch 自体が
      # HTTP 422 でパース不能になる）。ステップレベル env でのみ `runner.temp`
      # を参照できるため、cargo 実行ステップ側へ移動している。
      #
      # 以下、隔離理由の詳細（各ステップの env コメントと共通）:
      # `cargo publish --dry-run` はパッケージ検証ビルドを packaged コピー
      # （path 依存が剥がされ crates.io registry 版の依存に解決される）で
      # 実行する。cdylib+rlib クレート（wasm-thin/wasm-full/wasm-client）の
      # rlib はメタデータハッシュサフィックスなしの固定ファイル名
      # （libfandhe_frontend_wasm_thin.rlib 等、cdylib の動的ライブラリ名を
      # 安定させる cargo の仕様）で出力されるため、この隔離を怠ると通常の
      # ワークスペースビルド（path 依存で解決）が生成した無ハッシュ rlib を
      # registry 依存の内容で上書きしてしまう。後続の `cargo test --workspace`
      # 等が fingerprint fresh 判定でこの汚染済み rlib を再ビルドせずリンクすると、
      # 「there are multiple different versions of crate `fandhe_frontend_interactive`
      # in the dependency graph」（E0277/E0599）の flaky を引き起こす
      # （実際に PR #1164/#1180/#1186/#1187 で観測、根本原因はイシュー #1192
      # コメントで再現手順とともに記録）。ubuntu-latest（イシュー #1233）は
      # ジョブごとのクリーンな使い捨て VM のため「共有ディスク汚染」という
      # 当初動機は消えるが、packaged コピー検証ビルドとワークスペースビルドの
      # 分離自体は runner 種別非依存で正しく、将来 `actions/cache` を導入した
      # 際に汚染済み rlib をキャッシュへ保存しない保証としても機能するため、
      # イシュー #1226 の再設計で「維持」と確定済み（この判断は
      # `crates/xtask/tests/workflow_shared_target_contract.rs` の
      # `release_workflow_must_not_cache_target_dir` が target 系パスの
      # `actions/cache` 導入を禁止する契約として固定している）。専用
      # CARGO_TARGET_DIR を RUNNER_TEMP 配下（イシュー #659 の配置原則）に
      # 隔離することで汚染源を断つ（ジョブ終了時に runner が自動清掃するため
      # 残置しない）。
    steps:
      - name: Checkout
        # actions/checkout（deps-check.yml / update-external.yml と同一コミットに固定）。
        # docs/spec submodule は公開処理に不要なため取得しない。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # ubuntu-latest はジョブごとに初期化される使い捨て VM のため cargo の
        # 毎ジョブ導入が主経路になる（イシュー #1233、deps-check.yml と同様の
        # 読み替え）。Fandhe-AI/actions/rust-toolchain-setup（同一フルコミット
        # SHA 固定。イシュー #1273 で dtolnay/rust-toolchain から置換）で
        # バージョン決定性とサプライチェーンリスク抑制を維持する。ツール
        # チェーンはリポジトリ直下の rust-toolchain.toml（channel = "stable"）
        # を単一真実源として rustup show で同期する。
        uses: Fandhe-AI/actions/rust-toolchain-setup@fed9c07d98367f77e5e2b63bca38843f46feee96

      - name: "guard: 入力バージョン形式の検証"
        # semver（プレリリース・ビルドメタデータ許容）に一致しない入力は
        # 後続ステップ（正規表現前提の抽出処理）へ渡さず即座に停止する。
        run: |
          set -euo pipefail
          if ! echo "${RELEASE_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::invalid version format: '${RELEASE_VERSION}' (expected semver, e.g. 0.1.1)"
            exit 1
          fi

      - name: "guard: Cargo.toml バージョン一致の検証"
        # cargo pkgid の出力（例: path+file:///.../fandhe-frontend-cli#0.1.1）から
        # バージョンを抽出し、入力 version と完全一致しなければ公開を止める。
        # Cargo.toml のバージョンと乖離した状態での公開誤操作を防ぐ fail-closed ガード。
        env:
          # イシュー #1192: 共有 CARGO_TARGET_DIR 汚染対策（詳細はジョブ env の
          # コメント参照）。`runner` コンテキストはステップレベル env でのみ
          # 参照可能なため、cargo を呼ぶ本ステップで個別指定する。
          CARGO_TARGET_DIR: ${{ runner.temp }}/fandhe-frontend-release-target
        run: |
          set -euo pipefail
          PKGID="$(cargo pkgid -p "${RELEASE_CRATE}" --locked)"
          CARGO_VERSION="${PKGID##*#}"
          CARGO_VERSION="${CARGO_VERSION##*@}"
          if [ "${CARGO_VERSION}" != "${RELEASE_VERSION}" ]; then
            echo "::error::version mismatch: Cargo.toml has '${CARGO_VERSION}' but input version is '${RELEASE_VERSION}'. Update Cargo.toml's version or correct the workflow input."
            exit 1
          fi

      - name: "guard: crates.io 既公開バージョンの検証"
        # sparse index を直接取得し、入力バージョンが既に公開済みでないか確認する。
        # 誤って同一バージョンを再実行しても crates.io へ到達する前に止まる
        # （publish 自体は非冪等なため、CI 側で冪等性を保証する）。
        run: |
          set -euo pipefail
          if ! command -v curl >/dev/null 2>&1; then
            echo "::error::environment error: curl is not available on this runner. Install curl or use a runner image with curl preinstalled."
            exit 1
          fi
          CRATE="${RELEASE_CRATE}"
          LEN=${#CRATE}
          if [ "${LEN}" -le 2 ]; then
            INDEX_PATH="${LEN}/${CRATE}"
          elif [ "${LEN}" -eq 3 ]; then
            # crates.io sparse index の規約: 3 文字名は '3/<先頭1文字>/<name>'
            # という 1 段追加サブディレクトリ構成を取る（1〜2 文字名の
            # '<len>/<name>' や 4 文字以上の '<先頭2文字>/<次2文字>/<name>' とは
            # 異なるシャーディング規則）。現行の choice 入力はすべて 20 文字
            # 以上のため到達しないが、正しい規約に合わせておく。
            INDEX_PATH="3/${CRATE:0:1}/${CRATE}"
          else
            INDEX_PATH="${CRATE:0:2}/${CRATE:2:2}/${CRATE}"
          fi
          URL="https://index.crates.io/${INDEX_PATH}"
          # 固定パスの一時ファイルは、ubuntu-latest のジョブごとに独立した
          # 使い捨て VM では別クレートの release 実行と衝突する経路は消えるが
          # （イシュー #1233）、mktemp + trap による都度生成・清掃は無害かつ
          # 多層防御として維持する（concurrency group は
          # 'release-${{ inputs.crate }}' でクレート単位のみ直列化するため、
          # 異クレート間の並行実行時に将来 runner 構成が変わっても安全側に働く）。
          # ジョブ・実行ごとに一意な一時ファイルを都度生成する
          # （ci.yml の共有 CARGO_TARGET_DIR 対策と同様の考え方、mktemp 採用）。
          INDEX_BODY_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/release-index-body.XXXXXX.json")"
          trap 'rm -f "${INDEX_BODY_FILE}"' EXIT
          # -f を付けずに実行する: -f 付きだと 404 が curl 自体の非 0 終了
          # （exit 22）として扱われ、-w の '%{http_code}' が正しく '404' 単体で
          # 得られない（curl exit code と HTTP status を取り違えるバグを避ける）。
          # 実ネットワーク障害（DNS 不達等）は curl 自体の非 0 終了で検出し、
          # HTTP レベルのステータスコード判定とは別に扱う。
          set +e
          HTTP_STATUS="$(curl -sS -o "${INDEX_BODY_FILE}" -w '%{http_code}' "${URL}")"
          CURL_EXIT=$?
          set -e
          if [ "${CURL_EXIT}" -ne 0 ]; then
            echo "::error::failed to reach crates.io sparse index (${URL}, curl exit=${CURL_EXIT}). Check network reachability to crates.io."
            exit 1
          fi
          if [ "${HTTP_STATUS}" = "404" ]; then
            echo "crate '${RELEASE_CRATE}' is not yet published on crates.io; continuing."
          elif [ "${HTTP_STATUS}" -ge 200 ] 2>/dev/null && [ "${HTTP_STATUS}" -lt 300 ] 2>/dev/null; then
            if grep -q "\"vers\":\"${RELEASE_VERSION}\"" "${INDEX_BODY_FILE}"; then
              echo "::error::version already published: ${RELEASE_CRATE} ${RELEASE_VERSION} already exists on crates.io."
              exit 1
            fi
            echo "crate '${RELEASE_CRATE}' has published versions, but '${RELEASE_VERSION}' is not among them; continuing."
          else
            echo "::error::unexpected HTTP status from crates.io sparse index (${URL}, status=${HTTP_STATUS})."
            exit 1
          fi

      - name: "verify: cargo package --list"
        # 公開に含まれるファイル一覧を Step Summary に記録し、監査ログとして残す
        # （#513 の embedded-examples/ 同梱ファイル確認に相当する可視化）。
        env:
          # イシュー #1192: 共有 CARGO_TARGET_DIR 汚染対策（詳細はジョブ env の
          # コメント参照）。ステップレベル env でのみ `runner.temp` を参照できる。
          CARGO_TARGET_DIR: ${{ runner.temp }}/fandhe-frontend-release-target
        run: |
          set -euo pipefail
          {
            echo "## cargo package --list: ${RELEASE_CRATE} ${RELEASE_VERSION}"
            echo '```'
            cargo package --list -p "${RELEASE_CRATE}" --locked
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: "verify: cargo publish --dry-run"
        # トークン不要。パッケージ検証ビルドまでを実施し、実公開前に
        # ビルド可能性・パッケージング可能性を確認する。
        env:
          # イシュー #1192: 共有 CARGO_TARGET_DIR 汚染対策（詳細はジョブ env の
          # コメント参照）。ステップレベル env でのみ `runner.temp` を参照できる。
          CARGO_TARGET_DIR: ${{ runner.temp }}/fandhe-frontend-release-target
        run: |
          set -euo pipefail
          cargo publish --dry-run -p "${RELEASE_CRATE}" --locked

  publish:
    name: "publish: cargo publish (${{ inputs.crate }})（要 環境承認）"
    needs: verify
    # publish モードのみ実行。dry-run-only（既定・安全側）では本ジョブ自体が
    # スキップされ、environment の保護ルールにも到達しない。
    if: ${{ inputs.mode == 'publish' }}
    # イシュー #1233（トラッキング #1220）で ubuntu-latest へ移行（in-place、
    # 並走期間なし）。設計判断の正は docs/ci/hosted-runner-migration.md。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub Environments による承認ゲート（fandhe-backend release.yml と同型の
    # job レベル name 指定）。environment の保護ルールが通るまで publish は
    # 実行されない。
    environment: crates-io-release
    env:
      RELEASE_CRATE: ${{ inputs.crate }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_MODE: ${{ inputs.mode }}
      # イシュー #1192: verify ジョブと同じ理由で `cargo publish`（実公開時も
      # ローカルの検証ビルドを実行する）を専用 CARGO_TARGET_DIR で隔離する。
      # 詳細は verify ジョブの env コメント参照。`runner` コンテキストは
      # ジョブレベル env では未対応のため、cargo を実行する
      # 「publish: cargo publish」ステップ側の env（ステップレベル）で
      # 個別指定する。
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # verify ジョブが検証したのと同一コミットへピン留めする（TOCTOU 防止）。
          # environment 承認待ちの間に対象ブランチが進んでも、verify が確認した
          # tree と異なる内容が publish されることはない。
          ref: ${{ github.sha }}
          submodules: false
          persist-credentials: false

      - name: Setup Rust toolchain
        # verify ジョブと同じ理由（イシュー #1233、使い捨て VM での毎ジョブ
        # 導入）で Fandhe-AI/actions/rust-toolchain-setup（同一フルコミット
        # SHA 固定。イシュー #1273 で dtolnay/rust-toolchain から置換）を使う。
        uses: Fandhe-AI/actions/rust-toolchain-setup@fed9c07d98367f77e5e2b63bca38843f46feee96

      - name: "guard: CARGO_REGISTRY_TOKEN の存在確認"
        # トークン値は一切出力しない（存在有無のみ判定）。
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::environment error: repository secret CARGO_REGISTRY_TOKEN is not set. Add it under repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: "publish: cargo publish"
        # トークンはこのステップの env にのみ限定して注入し、
        # ジョブ全体（他ステップ）へは広げない。
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # イシュー #1192: 共有 CARGO_TARGET_DIR 汚染対策（詳細はジョブ env の
          # コメント参照）。ステップレベル env でのみ `runner.temp` を参照できる。
          CARGO_TARGET_DIR: ${{ runner.temp }}/fandhe-frontend-release-target
        run: |
          set -euo pipefail
          cargo publish -p "${RELEASE_CRATE}" --locked

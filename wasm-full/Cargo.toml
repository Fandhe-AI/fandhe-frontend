[package]
name = "rws-wasm-full"
version = "0.1.0"
edition = "2021"
description = "rws-wasm-full: WASM 完全方式のクライアントランタイム（イベント処理・DOM 更新を safe Rust に閉じ込める）。"
license = "MIT OR Apache-2.0"
publish = false

# TASK-11.2b（#75）でイベント処理（events モジュール）・wasm-bindgen/web-sys
# 依存を追加。TASK-11.2c（#76）は #75 マージ後の rebase により、DOM 非依存の
# 純粋関数 `render_component_html`（dom モジュール、rws-core::render 呼び出し）を
# 追加する。dom モジュールは lib.rs（本クレートの公開面）から呼ばれるため
# rws-core は通常の [dependencies] とする（rws-interactive 経由で既に依存グラフに
# 含まれており、REQ-3 依存上限には影響しない）。TASK-11.2d（#77）で
# `Runtime<C>`（lib.rs）・`dom::paint`・`entry` モジュールを追加したが、新規
# クレート追加は行っていない（既存 wasm-bindgen/web-sys のみで完結、
# `cargo metadata` 実測結果は PR 本文に記録する）。
#
# `docs/policy/unsafe-boundary.md` 第 2 節のポリシー: 自作コードは safe Rust のみとし、
# `unsafe` は wasm-bindgen / web-sys の FFI 境界（依存クレート内部・自動生成コード）
# に限定して許容する。
#
# 依存追加は事前承認必須（.claude/rules/coding-rust.md, security.md）。
# 本追加は Issue #73/#75 の計画（PoC-5 `wasm-full/Cargo.toml` と同一依存構成）を
# もって承認済みとし、影響確認結果を PR 本文に記録する。
#
# TASK-11.4b（#83）で `Attr`/`NamedNodeMap` を追加。`hydration::read_hydration_attrs`
# が `web_sys::Element::attributes()`（`NamedNodeMap`）を index 走査して各属性
# （`web_sys::Attr`）の名前・値を読み取るために必要（`docs/api/hydration-state-format.md`
# 第 5 節）。新規クレート追加ではなく既存 `web-sys` の feature 追加のみであり、
# `cargo metadata` 実測（パッケージ数・依存グラフ深さ）に変化がないことを確認済み
# （PR 本文に記録）。
# TASK-CSR-loader（#349）: `csr` モジュール（CSR 経路の loader 解決）が
# `rws_app::Loader` / `assemble_list_page` / `assemble_detail_page` を
# 型接続に使うため `rws-app` を追加。`rws-app` は外部依存ゼロの
# workspace path 依存（`core/Cargo.toml` と同じく `rws_core` のみに依存する
# コンポーネントロジック層）であり、新規クレート追加ではないため
# `cargo metadata` 実測（パッケージ数・依存グラフ深さ）に変化がないことを
# PR 本文に記録する（`.claude/rules/coding-rust.md` の事前承認要件は
# `docs/design/loader-trait-design.md` §3.1 が「CSR（wasm-full）が Loader を
# 参照する」ことを想定し `rws-app` 配置を選んでいる時点で承認整理済み）。
# イシュー #345（set_inner_html 全置換を束縛点更新 + keyed list へ置換）:
# `rws-wasm-client`（`BindingTable`/`keyed_diff`/`keyed_dom`、#343/#344）を
# rlib 経由で消費するため追加する。`wasm-client/src/binding_dom.rs` 冒頭 doc
# が「#345 が rlib 経由で消費できる公開 API として設計」と明記済みであり、
# 承認整理済みの方向（`docs/design/dom-binding-update-design.md` §3.2a）。
# workspace 内 path 依存であり新規外部パッケージの追加はゼロ
# （`cargo metadata` 実測結果を PR 本文に記録する）。
# イシュー #374（クライアント側ルーティング）: 新規外部クレート追加ゼロ。
# `[dependencies.web-sys]` の features 拡張のみ（History/Location/PopStateEvent
# 連携用の `History`/`Location`/`MouseEvent` を追加）。`cargo metadata` 実測
# （パッケージ数・依存グラフ深さ）に変化がないことを PR 本文に記録する。
[dependencies]
rws-app = { path = "../app" }
rws-core = { path = "../core" }
rws-interactive = { path = "../interactive" }
# `default-features = false`: 本クレート独自の `wasm_bindgen` エクスポート
# （`entry.rs` の `hydrate`/`mount`）と `rws-wasm-client` の REQ-6 デモ用
# エクスポート（`hydrate`/`mount_csr`）とのシンボル重複（wasm-bindgen の
# "describe" シンボルはクレート非依存の関数名ベース）を避けるため、
# `wasm-client` 側の `wasm-bindgen-exports` feature を無効化する
# （`wasm-client/Cargo.toml`・`wasm-client/src/lib.rs` の `wiring` doc 参照）。
rws-wasm-client = { path = "../wasm-client", default-features = false }
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
  "Attr",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "History",
  "HtmlInputElement",
  "Location",
  "MouseEvent",
  "NamedNodeMap",
  "Window",
  "console",
]

[lib]
crate-type = ["cdylib", "rlib"]

# TASK-11.5b（#87）: `wasm-full/tests/perf_browser.rs` のしきい値アサーション
# （`INITIAL_LOAD_BUDGET_MS`/`FRAME_BUDGET_MS`）を有効化するための feature。
# 依存クレートの追加は行わない（既定 off、コード分岐のみ）。CI の
# `perf-harness` ジョブは feature なしのまま実行し（スモークのみ・性能判定
# しない方針を維持）、正式計測は統制されたローカル環境で
# `--features perf-assert` を付けて実行する
# （`docs/ci/perf-browser-harness.md` 第 5 節）。
[features]
perf-assert = []

# TASK-11.5a（#86）: 実ブラウザ性能計測ハーネス（wasm-full/tests/perf_browser.rs）の
# 実行に必要な dev 依存。dev-dependency のため製品バイナリ・標準サーバー構成
# （REQ-3 の 60 件/深さ 6 の対象）には影響しない。
#
# 依存追加の承認整理（.claude/rules/coding-rust.md・security.md の事前承認要件）:
# `wasm-bindgen-test` は docs/spec/05-tasks.md TASK-11.5 が成果物として明示する
# `wasm-pack test --headless` の実行に必須であり、docs/guides/browser-testing.md 第 7 節が
# 実ブラウザテストの dev 依存として計画済み（#65 と同一の運用）。追加による影響
# （パッケージ数・依存グラフ深さ・build.rs 有無）は PR 本文に実測値を記録する。
#
# イシュー #404（View Transitions 連携）: `wasm-full/tests/nav_browser.rs` の
# 遷移テストが `document.startViewTransition` をスタブ（同期 shadow）・
# 非同期実行（マイクロタスク/rAF 相当）で検証するため `wasm-bindgen-futures`
# （`JsFuture` による Promise 待ち）・`js-sys`（`Reflect::set`/
# `Reflect::delete_property` によるスタブ設置・削除、`Function`/`Promise`
# 組み立て）を追加する。両クレートとも既に Cargo.lock に存在
# （`wasm-bindgen-test`/`web-sys` が既に依存グラフへ引き込んでいる）ため、
# **新規外部パッケージの追加はゼロ**（`cargo metadata` 実測: パッケージ数・
# 依存グラフ深さ不変。実測結果は PR 本文に記録する）。製品依存
# （`[dependencies]`）には一切追加しない（REQ-3 不変）。
[dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# Performance API（性能計測ハーネス専用）。製品面の [dependencies.web-sys] の
# features には触れず、テスト専用の feature 拡張に閉じる。
#
# TASK-1.3b（#92）: `EventInit` を追加。`wasm-full/tests/xss_escape_wasm.rs` が
# `wire_events`（events.rs）の委譲リスナーを合成 click イベントで発火させる際、
# `bubbles: true` を指定した `web_sys::Event` を組み立てるために必要
# （リスナーは root 要素へ登録されるため、子要素上の click がバブリングで
# root まで届く前提。events.rs 冒頭コメント参照）。新規クレート追加ではなく
# 既存 web-sys の feature 追加のみで、`cargo metadata` 実測（パッケージ数・
# 依存グラフ深さ）に変化がないことを確認済み（PR 本文に記録）。
# イシュー #345: `runtime_browser.rs` の keyed list ノード同一性テストが
# `Element::children()`（`HtmlCollection`）・`query_selector_all`
# （`NodeList`）を使うため追加。テスト専用の feature 拡張。
# イシュー #374: `wasm-full/tests/nav_browser.rs` が合成 `MouseEvent`
# （クリック遷移テスト）・合成 `PopStateEvent`（戻る/進む契約テスト）を
# 組み立てるために `MouseEventInit`/`PopStateEventInit` を追加する
# （テスト専用の feature 拡張。既存の `EventInit` 追加時の判断・PR #92
# と同じ承認整理）。
[dev-dependencies.web-sys]
version = "0.3"
features = [
  "Performance",
  "NamedNodeMap",
  "Attr",
  "EventInit",
  "HtmlCollection",
  "NodeList",
  "MouseEventInit",
  "PopStateEvent",
  "PopStateEventInit",
]

[package]
name = "rws-wasm-full"
version = "0.1.0"
edition = "2021"
description = "rws-wasm-full: WASM 完全方式のクライアントランタイム（イベント処理・DOM 更新を safe Rust に閉じ込める）。"
license = "MIT OR Apache-2.0"
publish = false

# TASK-11.2b（#75）でイベント処理（events モジュール）・wasm-bindgen/web-sys
# 依存を追加。TASK-11.2c（#76）は #75 マージ後の rebase により、DOM 非依存の
# 純粋関数 `render_component_html`（dom モジュール、rws-core::render 呼び出し）を
# 追加する。dom モジュールは lib.rs（本クレートの公開面）から呼ばれるため
# rws-core は通常の [dependencies] とする（rws-interactive 経由で既に依存グラフに
# 含まれており、REQ-3 依存上限には影響しない）。
#
# `docs/unsafe-boundary.md` 第 2 節のポリシー: 自作コードは safe Rust のみとし、
# `unsafe` は wasm-bindgen / web-sys の FFI 境界（依存クレート内部・自動生成コード）
# に限定して許容する。
#
# 依存追加は事前承認必須（.claude/rules/coding-rust.md, security.md）。
# 本追加は Issue #73/#75 の計画（PoC-5 `wasm-full/Cargo.toml` と同一依存構成）を
# もって承認済みとし、影響確認結果を PR 本文に記録する。
#
# TASK-11.4b（#83）で `Attr`/`NamedNodeMap` を追加。`hydration::read_hydration_attrs`
# が `web_sys::Element::attributes()`（`NamedNodeMap`）を index 走査して各属性
# （`web_sys::Attr`）の名前・値を読み取るために必要（`docs/hydration-state-format.md`
# 第 5 節）。新規クレート追加ではなく既存 `web-sys` の feature 追加のみであり、
# `cargo metadata` 実測（パッケージ数・依存グラフ深さ）に変化がないことを確認済み
# （PR 本文に記録）。
[dependencies]
rws-core = { path = "../core" }
rws-interactive = { path = "../interactive" }
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
  "Attr",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "HtmlInputElement",
  "NamedNodeMap",
  "Window",
  "console",
]

[lib]
crate-type = ["cdylib", "rlib"]

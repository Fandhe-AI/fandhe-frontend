[package]
name = "fandhe-frontend-example-headless-pre-styled-ui"
version = "0.1.0"
edition = "2021"
description = "fandhe-frontend-headless-ui / fandhe-frontend-pre-styled-ui（ark-ui / chakra-ui 参考の 2 層 UI コンポーネント構成）のショーケース正本サンプル（イシュー #552）。"
license = "MIT OR Apache-2.0"
publish = false

# examples/ は「crates.io 公開済みクレートを実際に使う正本サンプル」であり、
# templates/（`fw new` が展開する雛形）とは異なりバージョン依存で完結する
# （examples 規約、イシュー #499）。`fandhe-frontend-headless-ui` は当初
# crates.io 未公開のため path 依存の意図的な例外だった（イシュー #552）が、
# 前提クレート公開（イシュー #608）を受けてイシュー #609 でバージョン依存へ
# 切り替え済み。`fandhe-frontend-pre-styled-ui`（chakra-ui 相当の上層、
# #520/#546）は v0.3.1 で公開 API（styled 部品・headless ラッパー・
# StyleSheet/Theme）が揃ったため、#552 当時の「手書き CSS による暫定代替」を
# 置き換える形で依存に追加した（2 層構成のショーケースとして統合）。
# Switch / RadioGroup / Avatar の styled ラッパーが v0.4.0（#682/#683/#684、
# 公開 #686）で出揃い全部品 styled 提供となったため、`fandhe-frontend-headless-ui`
# への直接依存は撤去した（イシュー #689）。headless 層 API が必要な呼び出し側は
# `fandhe_frontend_pre_styled_ui` の `pub use fandhe_frontend_headless_ui`
# 再エクスポート経由で参照できる。
# v0.5.0（PR #719、公開・追随はイシュー #728）で Switch::root / RadioGroup::root
# が Avatar と同じ「styled root（size/palette variant 付与）」形へ変更された
# ため追随した（`src/main.rs` の switch_section/radio_group_section 参照）。
# イシュー #1159 で core 0.2.0・pre-styled-ui 0.39.0 系（イシュー #1141 公開）へ
# 追随。0.6.0 相当の #782「size variant を tabs/accordion/dialog/menu/select へ
# 展開」により root 系関数へ Size（tabs は Size + ColorPalette）引数が増えて
# いるため、`src/main.rs` の該当呼び出しを追随させた。
# イシュー #1183 で pre-styled-ui 0.40.0 / headless-ui 0.28.0（イシュー #1171
# 公開、#1173）へ追随。0.40.0 の破壊的変更（navigation_menu::trigger の value
# 引数追加・menubar::trigger の index 引数追加）は本サンプル未使用のため
# `src/main.rs` の変更は不要。
[dependencies]
fandhe-frontend-core = "0.2.0"
fandhe-frontend-pre-styled-ui = "0.40.0"

[dev-dependencies]

# root workspace（リポジトリ直下 Cargo.toml の `members = ["crates/*"]`）から
# 意図的に切り離す。他の examples/* と同じ方針（`ci.md` 参照）。
[workspace]
members = ["."]

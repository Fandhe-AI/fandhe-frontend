# 機械可読なプロジェクト構造マニフェスト（TASK-13.1a, REQ-13）。
#
# 本リポジトリ自身の構成を宣言する参照マニフェストであり、`crates/cli/src/structure.rs`
# のスキーマ v1 の正例を兼ねる（TASK-13.1d, #131 のテストフィクスチャとしても
# 利用予定）。スキーマの詳細・各フィールドの制約・PoC-7 からの差分理由は
# `docs/design/structure-manifest.md` を参照。
#
# 本ファイルはワークスペース Cargo.toml の members と対応するが、cargo
# メタデータとの機械的な突き合わせ（依存の実体検証）は TASK-13.1c（#130）の
# スコープであり、本ファイル単体としては TASK-13.1a の `validate()`
# （マニフェスト内部の宣言整合性のみ）の対象。
#
# 全クレートディレクトリは crates/ 配下に配置する（イシュー #436）。各
# エントリの `path` キー（ワークスペースルート相対の実配置パス）がこれを
# 表す。`path` は実体解決専用のキーであり、`depends_on`/`allowed_dependents`/
# `[routing] definition_dir` が参照する論理名（`<name>`）は本移設で変更しない
# （`docs/design/structure-manifest.md` §2.2.0a 参照）。`static`（静的アセット、
# 対応クレートなし）はクレートではないため移設対象外でフラット配置のまま。
#
# 本マニフェストの `[directories.<name>]` の宣言単位は cargo パッケージ
# （クレート）であり、そのパッケージが持つターゲット（bin/lib）ではない
# （イシュー #1115/#1134/#1162、詳細は docs/design/structure-manifest.md
# §2.2.3）。したがって、既に宣言済みのクレート（例: `crates/cli`）へ
# `src/lib.rs` を追加して bin + lib 構成へ拡張しても、本ファイルの更新は
# 不要である。`fw gate`（`crates/cli/src/gate.rs::run_gate`）は宣言済み
# ディレクトリの `crate`（パッケージ名）へ `-p <crate>` 指定で
# cargo check/clippy/test を実行するため、lib ターゲットも自動的に検証
# 対象へ含まれて PASS する。本ファイルの更新が必要になるのは、`crates/`
# 配下へ新規**パッケージ**（新クレート）を追加する場合のみである。

[manifest]
version = 1

[directories.core]
role = "core"
crate = "fandhe-frontend-core"
description = "外部依存ゼロのレンダリングコア（ノード木 API・render・既定エスケープ）"
allowed_dependents = ["interactive", "app", "server", "wasm-full", "wasm-thin", "wasm-client", "dist-server", "docs-site", "headless-ui", "xtask"]
path = "crates/core"

[directories.interactive]
role = "state"
crate = "fandhe-frontend-interactive"
description = "状態管理コア（forbid(unsafe_code) 域）"
depends_on = ["core"]
allowed_dependents = ["wasm-full", "wasm-thin", "wasm-client", "headless-ui", "xtask"]
path = "crates/interactive"

[directories.app]
role = "component"
crate = "fandhe-frontend-app"
description = "モード非依存の共通コンポーネント（SSR/CSR/SSG から共通利用）。パスマッチングルーティング（router.rs）+ server/client 単一ルート定義（routes.rs、イシュー #407）も本クレートに集約する"
depends_on = ["core"]
allowed_dependents = ["server", "dist-server", "wasm-full", "wasm-client", "docs-site"]
path = "crates/app"

[directories.server]
role = "server-entrypoint"
crate = "fandhe-frontend-server"
description = "SSR/SSG エントリ（ssr.rs/ssg.rs、TASK-6.1c）。ルーティングは fandhe-frontend-app::router / fandhe-frontend-app::routes（イシュー #407）を再エクスポート・参照する。fandhe-frontend-core/fandhe-frontend-app への依存は通常依存（path 依存のみ、外部クレート追加なし）"
depends_on = ["core", "app"]
allowed_dependents = ["dist-server", "docs-site"]
path = "crates/server"

[directories.wasm-client]
role = "client-entrypoint"
crate = "fandhe-frontend-wasm-client"
description = "束縛点更新（BindingTable）・keyed list DOM 適用（keyed_diff/keyed_dom）・最小ハイドレーション方式のクライアントランタイム基盤。イシュー #345 で fandhe-frontend-wasm-full が rlib として消費する"
depends_on = ["core", "interactive", "app"]
allowed_dependents = ["wasm-full"]
path = "crates/wasm-client"

[directories.wasm-full]
role = "client-entrypoint"
crate = "fandhe-frontend-wasm-full"
description = "CSR/ハイドレーション フルセット構成（wasm32 ターゲット）"
depends_on = ["core", "interactive", "app", "wasm-client", "headless-ui"]
path = "crates/wasm-full"

[directories.wasm-thin]
role = "client-entrypoint"
crate = "fandhe-frontend-wasm-thin"
description = "CSR/ハイドレーション 最小構成（wasm32 ターゲット）"
depends_on = ["core", "interactive"]
path = "crates/wasm-thin"

[directories.dist-server]
role = "distribution"
crate = "fandhe-frontend-dist-server"
description = "単一実行ファイル配布サーバー（core/app/server を束ねる）"
depends_on = ["core", "app", "server"]
path = "crates/dist-server"

[directories.docs-site]
role = "tooling"
crate = "fandhe-frontend-docs-site"
description = "docs サイトジェネレータ（外部依存ゼロ・配布物に含めない開発者/CI 用ツール。イシュー #465/#458）。UI コンポーネントショーケースページ（src/showcase.rs）のために pre-styled-ui にも依存する"
depends_on = ["core", "app", "server", "pre-styled-ui"]
path = "crates/docs-site"

[directories.headless-ui]
role = "component"
crate = "fandhe-frontend-headless-ui"
description = "headless UI コンポーネント層（anatomy・data-* 属性・WAI-ARIA、イシュー #520/#522）。styled 層（pre-styled-ui）の下層。開閉状態機械（Disclosure/SingleSelect）は interactive の Component/Hydrate 抽象に乗り、DirtyTracked（束縛点差分更新）も実装済み（イシュー #592）"
depends_on = ["core", "interactive"]
allowed_dependents = ["pre-styled-ui", "wasm-full", "xtask"]
path = "crates/headless-ui"

[directories.pre-styled-ui]
role = "component"
crate = "fandhe-frontend-pre-styled-ui"
description = "pre-styled UI コンポーネント層（headless-ui 上層のスタイル済み部品、イシュー #520/#546）。テーマトークン・ダークモード基盤（イシュー #547）・variant API（SlotRecipe/VariantValue）と静的 CSS 生成（イシュー #548）・headless 5 コンポーネント（Dialog/Tabs/Accordion/Menu/Select）ラッパー第 1 弾（イシュー #551）を実装済み。styled 部品（Button 等）実装はイシュー #550 で追加する"
depends_on = ["headless-ui"]
allowed_dependents = ["docs-site"]
path = "crates/pre-styled-ui"

[directories.static]
role = "asset"
description = "静的アセット（HTML/CSS/JS グルー、対応クレートなし）"

[directories.xtask]
role = "tooling"
crate = "xtask"
description = "CI 計測用の開発者ツール（依存グラフ件数・深さ計測・上限判定・全再描画 vs 束縛点差分更新の計測、イシュー #592）。配布物には含めない"
depends_on = ["core", "interactive", "headless-ui"]
path = "crates/xtask"

[directories.cli]
role = "tooling"
crate = "fandhe-frontend-cli"
description = "AI 自己保守フック向け fw コマンド（structure.toml のスキーマ・パース・生成、REQ-13）"
path = "crates/cli"

[routing]
# イシュー #407: server / client 単一定義からのルート生成（共有機構）採用に伴い、
# ルート表の正本を server から app（fandhe-frontend-app::routes）へ移設した。抽出器
# （`fandhe-frontend-router-v1`、`crates/cli/src/routes.rs`）は文字列走査のみで AST 非依存のため、
# `definition_dir` の変更のみで無改修のまま追随できる
# （`docs/design/route-definition-sharing.md` §4・採用判断基準 2）。
definition_dir = "app"
extractor = "fandhe-frontend-router-v1"

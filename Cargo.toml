[workspace]
resolver = "2"
# 全メンバークレートは crates/ 配下に配置する（イシュー #436）。
members = ["crates/*"]

# REQ-11（gzip 200KB 上限）対応: wasm ターゲットへリンクされる各クレートの
# codegen-units を 1 に固定し、クレート内インライン化・デッドコード除去を
# 強化してバンドルサイズを削減する（イシュー #1647 の action-bar 追加分で
# 200KB 上限を超過した是正、`docs/ci/wasm-opt-adoption-evaluation.md` 追記
# 参照）。`codegen-units = 1` は最適化度を上げるのみで意味論を変えず、
# native（server/cli/dist-server）ビルドの実行時性能を損なわない（コンパイル
# 時間が伸びるのみ）。opt-level のような速度とのトレードオフを伴う調整は
# `.cargo/config.toml` の `[target.wasm32-unknown-unknown]` 側（wasm ターゲット
# のみへ限定）に置き、native ビルドへ波及させない（同評価文書が明記する
# 「native SSR 性能を損なわない」制約を維持する設計）。
[profile.release.package.fandhe-frontend-core]
codegen-units = 1
[profile.release.package.fandhe-frontend-interactive]
codegen-units = 1
[profile.release.package.fandhe-frontend-headless-ui]
codegen-units = 1
[profile.release.package.fandhe-frontend-app]
codegen-units = 1
[profile.release.package.fandhe-frontend-wasm-client]
codegen-units = 1
[profile.release.package.fandhe-frontend-wasm-full]
codegen-units = 1

# イシュー #2299（CI 所要時間短縮）/ #2307・#2308（browser-test 回帰是正）:
# docs-site とその描画チェーン（core / interactive / app / server / headless-ui /
# pre-styled-ui）を dev プロファイルで opt-level 1 にする。
# - 目的: docs-site の統合テストは実サイト 227 ページのフルビルドを行うため、
#   opt-level 0 では 1 回あたり約 100 秒（CI 実測）かかる。opt-level 1 で
#   実行時間が 1/2〜1/2.5（opt-level 3 との差はほぼなし）。
# - dev に置く理由: test プロファイルは dev を継承する（package 上書きも
#   継承される、docs/ci/browser-test-duration-regression-analysis.md §2.6）ので
#   `cargo test` の短縮効果は dev 側の宣言だけで得られる。逆に test 側にだけ
#   置くと dev/test のユニットハッシュが乖離し、`wasm-pack test` の
#   `cargo build --tests`（dev）→ `cargo test`（test）の 2 段呼び出しが
#   cdylib+rlib クレート（wasm-client / wasm-full / wasm-thin、固定名生成物）
#   を毎回二重コンパイルする（同 §2.7）。**`[profile.test.*]` 節は置かない**
#   （`crates/xtask/tests/profile_dev_test_parity.rs` が fail-closed に強制）。
# - 波及範囲: `cargo build` / `cargo run`（dev）で当該 7 クレートのコンパイル
#   時間が若干伸びる代わりに docs-site 生成等の実行は速くなる。release /
#   bench（REQ-10 `rebuild_latency` は `cargo build --release` を計測）には
#   波及しない。wasm32 ターゲットにも適用されるが、`.cargo/config.toml` の
#   `-C opt-level=s` が後勝ちでコード生成は不変（REQ-11 不変）。
[profile.dev.package.fandhe-frontend-docs-site]
opt-level = 1
[profile.dev.package.fandhe-frontend-core]
opt-level = 1
[profile.dev.package.fandhe-frontend-interactive]
opt-level = 1
[profile.dev.package.fandhe-frontend-app]
opt-level = 1
[profile.dev.package.fandhe-frontend-server]
opt-level = 1
[profile.dev.package.fandhe-frontend-headless-ui]
opt-level = 1
[profile.dev.package.fandhe-frontend-pre-styled-ui]
opt-level = 1

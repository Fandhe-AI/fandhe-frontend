# allowlist.toml
#
# 役割: check_static_only.py（TASK-12.2b）が参照する免除表の雛形。
# docs/npm-static-asset-rules.md §4.3（未マージ時は PR #223 の契約）に定義される
# 「1 パッケージ・1 ルール単位のみ・ワイルドカード不可・reason 必須」という
# fail-closed な免除機構に従う。
#
# ここには実運用の免除エントリを置かない（本タスクの完了条件は雛形提供まで）。
# 実際に例外が必要になった場合は、以下の形式で [[exempt]] を追記する。
#
# [[exempt]]
# package = "example-css-pkg"   # 完全一致のみ（ワイルドカード不可）
# rule = "R1-scripts"           # 1 ルール単位のみ（ルール全体の無効化は不可）
# reason = "..."                # 必須・空文字不可。免除の根拠を具体的に書く
#
# 不正なエントリ（reason 欠落・空、未知の rule ID、ワイルドカード的指定）は
# check_static_only.py の起動時に exit 2（fail-closed）として拒否される。
